
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Tipster Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07060d;--s1:#0c0a1a;--s2:#15122a;--bd:rgba(184,159,255,0.1);--bd2:rgba(184,159,255,0.18);--ac:#b89fff;--acg:rgba(184,159,255,0.08);--tx:#f0edff;--mu:#6a6690;--mu2:#9590b8;--gr:#34d399;--rd:#f87171;--gold:#fbbf24;--cyan:#38bdf8;--orange:#fb923c}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:1;opacity:.4}
.bg-glow{position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:900px;height:600px;background:radial-gradient(ellipse,rgba(124,95,230,0.05),transparent 70%);pointer-events:none;z-index:0}
nav{position:sticky;top:0;z-index:50;background:rgba(7,6,13,0.88);backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);padding:0 32px;height:62px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:6px;color:var(--tx);text-decoration:none}
.logo span{color:var(--ac)}
.nav-links{display:flex;gap:4px}
.nav-link{color:var(--mu2);font-size:12px;font-weight:500;text-decoration:none;padding:8px 12px;border-radius:6px;transition:all .2s}
.nav-link:hover{color:var(--tx);background:rgba(255,255,255,0.04)}
.nav-btn{background:var(--ac);color:#07060d;border:none;padding:9px 20px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;transition:all .2s}
.nav-btn:hover{background:#cdb8ff;transform:translateY(-1px)}
.main{max-width:1100px;margin:0 auto;padding:40px 24px;position:relative;z-index:2}

/* COVER */
.cover-banner{height:160px;background:linear-gradient(135deg,#0c0a1a,#15122a,#1a1040);border-radius:20px 20px 0 0;position:relative;overflow:hidden}
.cover-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(124,95,230,0.15),rgba(184,159,255,0.08),rgba(52,211,153,0.05))}
.cover-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(184,159,255,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(184,159,255,0.06) 1px,transparent 1px);background-size:40px 40px}

/* HERO */
.profile-hero{background:var(--s1);border:1px solid var(--bd);border-radius:0 0 20px 20px;padding:0 36px 28px;margin-bottom:24px}
.profile-top{display:flex;align-items:flex-end;gap:20px;margin-bottom:16px;flex-wrap:wrap}
.avatar-wrap{position:relative;margin-top:-48px;flex-shrink:0}
.avatar-big{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:36px;border:4px solid var(--bg);background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;position:relative;z-index:1}
.avatar-ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(184,159,255,0.2);z-index:0}
.profile-main{flex:1;min-width:200px;padding-top:14px}
.profile-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.verified-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.25);color:var(--cyan);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;padding:4px 12px;border-radius:20px;font-weight:700}
.vdot{width:5px;height:5px;background:var(--gr);border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.streak-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(251,146,60,0.1);border:1px solid rgba(251,146,60,0.25);color:var(--orange);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;padding:4px 12px;border-radius:20px;font-weight:700}
.rank-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);color:var(--gold);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;padding:4px 12px;border-radius:20px;font-weight:700}
.profile-username{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:3px;line-height:1;margin-bottom:4px;color:var(--tx)}
.profile-actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
.follow-btn{padding:11px 26px;border:1px solid var(--bd2);color:var(--ac);background:var(--acg);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif}
.follow-btn:hover,.follow-btn.following{background:var(--ac);color:#07060d;border-color:var(--ac)}
.share-btn{padding:11px 18px;border:1px solid var(--bd);color:var(--mu2);background:transparent;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif}
.share-btn:hover{border-color:var(--bd2);color:var(--tx)}
.sub-btn{padding:11px 26px;background:var(--ac);color:#07060d;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;transition:all .2s}
.sub-btn:hover{background:#cdb8ff;transform:translateY(-1px)}

/* BADGES */
.badges-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.badge-pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;transition:all .2s;cursor:default}
.badge-pill:hover{transform:translateY(-2px)}
.badge-pill.fire{background:rgba(251,146,60,0.12);border:1px solid rgba(251,146,60,0.3);color:var(--orange)}
.badge-pill.diamond{background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.25);color:var(--cyan)}
.badge-pill.sharp{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.25);color:var(--gr)}
.badge-pill.rising{background:rgba(184,159,255,0.1);border:1px solid rgba(184,159,255,0.25);color:var(--ac)}
.badge-pill.value{background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.25);color:var(--gold)}
.badge-pill.veteran{background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.35);color:var(--gold)}
.badge-pill-name{font-family:'DM Mono',monospace;font-size:11px}

/* RELIABILITY */
.reliability-box{display:inline-flex;align-items:center;gap:16px;background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:14px 20px;margin-bottom:0}
.rel-score{font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:1;letter-spacing:1px}
.rel-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.rel-bar{width:120px;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;margin-bottom:6px;overflow:hidden}
.rel-fill{height:100%;border-radius:3px;transition:width 1s ease}
.rel-desc{font-size:11px;color:var(--mu2);font-family:'DM Mono',monospace}
.rel-needs{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace;font-style:italic}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:28px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:18px;text-align:center;transition:all .2s}
.stat:hover{border-color:var(--bd2);transform:translateY(-2px)}
.stat::before{content:'';display:block;width:32px;height:2px;background:var(--ac);margin:0 auto 12px;opacity:.4;border-radius:1px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;line-height:1;margin-bottom:4px}
.stat-val.pos{color:var(--gr)}.stat-val.neg{color:var(--rd)}.stat-val.neu{color:var(--tx)}
.stat-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:2px;text-transform:uppercase}

/* CONTENT */
.content-grid{display:grid;grid-template-columns:1fr 320px;gap:20px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:24px}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;color:var(--ac);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.panel-title::after{content:'';flex:1;height:1px;background:var(--bd)}

/* PICK FILTER */
.pick-filter{display:flex;gap:6px;margin-bottom:14px}
.pf-btn{flex:1;padding:6px;border:1px solid var(--bd);border-radius:7px;font-size:11px;cursor:pointer;transition:all .2s;color:var(--mu2);text-align:center;font-family:'DM Mono',monospace;font-weight:600}
.pf-btn:hover{border-color:var(--bd2)}
.pf-btn.active{border-color:var(--bd2);color:var(--ac);background:var(--acg)}
.pf-btn.win.active{border-color:rgba(52,211,153,.4);color:var(--gr);background:rgba(52,211,153,.08)}
.pf-btn.loss.active{border-color:rgba(248,113,113,.4);color:var(--rd);background:rgba(248,113,113,.08)}
.pf-btn.pending.active{border-color:rgba(245,158,11,.4);color:#f59e0b;background:rgba(245,158,11,.08)}

/* PICKS */
.pick-card{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:8px;transition:all .2s;position:relative}
.pick-card:hover{border-color:var(--bd2);transform:translateX(2px)}
.pick-card.win-border{border-left:3px solid var(--gr)}
.pick-card.loss-border{border-left:3px solid var(--rd)}
.pick-card.pending-border{border-left:3px solid #f59e0b}
.pick-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pick-sport-icon{font-size:16px}
.pick-event-text{font-weight:700;font-size:13px;color:var(--tx)}
.pick-market-text{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace;margin-top:1px}
.pick-body{display:flex;justify-content:space-between;align-items:center}
.pick-odds{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--ac);line-height:1}
.pick-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-family:'DM Mono',monospace}
.badge-win{background:rgba(52,211,153,.12);color:var(--gr);border:1px solid rgba(52,211,153,.2)}
.badge-loss{background:rgba(248,113,113,.12);color:var(--rd);border:1px solid rgba(248,113,113,.2)}
.badge-pending{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.badge-sport{background:var(--acg);color:var(--ac);border:1px solid var(--bd)}
.pick-pnl{font-family:'DM Mono',monospace;font-size:11px;font-weight:700}
.pick-pnl.pos{color:var(--gr)}.pick-pnl.neg{color:var(--rd)}.pick-pnl.zero{color:var(--mu)}
.pick-time{font-size:10px;color:var(--mu);font-family:'DM Mono',monospace;margin-left:auto}
.conf-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-family:'DM Mono',monospace}
.conf-badge.low{background:rgba(248,113,113,.1);color:var(--rd)}
.conf-badge.medium{background:rgba(251,191,36,.1);color:var(--gold)}
.conf-badge.high{background:rgba(52,211,153,.1);color:var(--gr)}
.conf-badge.max{background:var(--acg);color:var(--ac)}
.pick-reasoning{font-size:11px;color:var(--mu2);font-style:italic;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);line-height:1.5}

/* PERFORMANCE */
.perf-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);font-size:13px;align-items:center}
.perf-row:last-child{border:none}
.perf-key{color:var(--mu);font-family:'DM Mono',monospace;font-size:11px}
.perf-val{font-weight:600;color:var(--tx)}
.perf-val.pos{color:var(--gr)}.perf-val.neg{color:var(--rd)}
.sport-bar{margin-bottom:10px}
.sport-bar-label{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px}
.sport-bar-label span:first-child{color:var(--mu2)}
.sport-bar-label span:last-child{color:var(--ac);font-family:'DM Mono',monospace;font-size:11px}
.sbar{height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden}
.sbar-fill{height:100%;background:linear-gradient(90deg,var(--ac),rgba(184,159,255,0.6));border-radius:3px}
.pnl-chart{width:100%;margin:12px 0 0}

.empty{text-align:center;padding:36px;color:var(--mu);font-family:'DM Mono',monospace;font-size:12px}
.not-found{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center}
.not-found h2{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:3px;color:var(--rd);margin-bottom:12px}
.not-found p{color:var(--mu2);margin-bottom:24px}
.back-btn{color:var(--ac);text-decoration:none;font-family:'DM Mono',monospace;font-size:13px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ac);color:#07060d;padding:12px 24px;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;z-index:1000;transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.toast.show{transform:translateY(0);opacity:1}

@media(max-width:900px){.content-grid{grid-template-columns:1fr}.stats-row{grid-template-columns:repeat(3,1fr)}.profile-hero{padding:0 20px 24px}nav{padding:0 16px}.nav-link{display:none}.cover-banner{height:100px}}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}.profile-top{gap:16px}}

.mobile-menu-btn{display:none;background:none;border:none;color:var(--tx);font-size:20px;cursor:pointer;padding:4px 8px;line-height:1}
.slide-nav{position:fixed;top:0;right:-100%;width:280px;height:100vh;background:var(--s1);border-left:1px solid var(--bd);z-index:200;transition:right .3s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.slide-nav.open{right:0}
.slide-nav-overlay{position:fixed;inset:0;background:rgba(7,6,13,0.7);z-index:199;display:none;backdrop-filter:blur(4px)}
.slide-nav-overlay.open{display:block}
.slide-nav-header{padding:20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.slide-nav-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:5px;color:var(--tx)}
.slide-nav-logo span{color:var(--ac)}
.slide-nav-close{background:none;border:none;color:var(--mu);font-size:18px;cursor:pointer;padding:4px}
.snl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;text-decoration:none;transition:background .2s;margin-bottom:2px}
.snl:hover{background:var(--acg)}
.snl-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.snl-text{font-size:13px;font-weight:600;color:var(--tx)}
.slide-nav-links{padding:12px 8px}
.slide-nav-post{padding:0 16px 12px}
.snp-post-btn{display:block;width:100%;background:var(--ac);color:#07060d;border:none;border-radius:10px;padding:13px;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;text-align:center;text-decoration:none;cursor:pointer;transition:background .2s}
.snp-post-btn:hover{background:#cdb8ff}
.slide-nav-logout{padding:0 16px 16px}
.snl-logout{width:100%;background:transparent;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:11px;font-size:12px;cursor:pointer;font-family:'Syne',sans-serif;transition:all .2s}
.snl-logout:hover{border-color:var(--rd);color:var(--rd)}
@media(max-width:600px){.mobile-menu-btn{display:block}.nav-links{display:none}.nav-btn{display:none}}

.dna-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dna-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:11px;font-family:'DM Mono',monospace;font-weight:700}
.dna-tag.sharp{background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);color:var(--gr)}
.dna-tag.safe{background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.2);color:#38bdf8}
.dna-tag.aggressive{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);color:var(--rd)}
.dna-tag.value{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);color:var(--gold)}
.dna-tag.grinder{background:var(--acg);border:1px solid var(--bd2);color:var(--ac)}
.dna-tag.highvol{background:rgba(251,146,60,0.08);border:1px solid rgba(251,146,60,0.2);color:#fb923c}

.division-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-family:'DM Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;margin-top:8px}
.div-bronze{background:rgba(180,120,80,0.12);border:1px solid rgba(180,120,80,0.3);color:#b47850}
.div-silver{background:rgba(148,163,184,0.1);border:1px solid rgba(148,163,184,0.25);color:#94a3b8}
.div-gold{background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.25);color:var(--gold)}
.div-platinum{background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.25);color:#38bdf8}
.div-diamond{background:rgba(184,159,255,0.12);border:1px solid rgba(184,159,255,0.3);color:var(--ac)}
.div-elite{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);color:var(--rd)}
.div-legend{background:linear-gradient(135deg,rgba(251,191,36,0.15),rgba(184,159,255,0.1));border:1px solid rgba(251,191,36,0.4);color:var(--gold)}

.elo-box{display:inline-flex;align-items:center;gap:12px;background:rgba(184,159,255,0.06);border:1px solid rgba(184,159,255,0.15);border-radius:10px;padding:10px 16px;margin-top:10px}
.elo-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--ac);line-height:1}
.elo-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.elo-desc{font-size:11px;color:var(--mu2);font-family:'DM Mono',monospace}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="toast" id="toast"></div>
<nav>
  <a href="/home" class="logo">LEDG<span>R</span></a>
  <div class="nav-links">
    <a href="/home" class="nav-link">Home</a>
    <a href="/leaderboard" class="nav-link">Leaderboard</a>
    <a href="/compare" class="nav-link">Compare</a>
    <a href="/simulator" class="nav-link">Simulator</a>
    <a href="/badges" class="nav-link">🏅 Badges</a>
  </div>
  <button class="mobile-menu-btn" onclick="openSlideNav()">☰</button><button class="nav-btn" onclick="window.location.href='/dashboard'">Post a Pick</button>
</nav>
<div class="slide-nav-overlay" id="slideOverlay" onclick="closeSlideNav()"></div>
<div class="slide-nav" id="slideNav">
  <div class="slide-nav-header">
    <div class="slide-nav-logo">LEDG<span>R</span></div>
    <button class="slide-nav-close" onclick="closeSlideNav()">✕</button>
  </div>
  <div class="slide-nav-links">
    <a href="/home" class="snl"><span class="snl-icon">🏠</span><div class="snl-text">Home</div></a>
    <a href="/leaderboard" class="snl"><span class="snl-icon">🏆</span><div class="snl-text">Leaderboard</div></a>
    <a href="/compare" class="snl"><span class="snl-icon">⚖️</span><div class="snl-text">Compare</div></a>
    <a href="/simulator" class="snl"><span class="snl-icon">📈</span><div class="snl-text">Simulator</div></a>
    <a href="/badges" class="snl"><span class="snl-icon">🏅</span><div class="snl-text">Badges</div></a>
  </div>
  <div class="slide-nav-post">
    <a href="/dashboard" class="snp-post-btn">＋ POST A PICK</a>
  </div>
  <div class="slide-nav-logout">
    <button class="snl-logout" onclick="window.location.href='/'">Log Out</button>
  </div>
</div>

<div class="main" id="mainContent">
  <div style="text-align:center;padding:80px;color:var(--mu);font-family:'DM Mono',monospace">Loading profile...</div>
</div>
<script>
const API='https://ledgr-backend-production-c132.up.railway.app';
const username=new URLSearchParams(window.location.search).get('u')||'';
const sportIcon={'Soccer':'⚽','Basketball':'🏀','Tennis':'🎾','Football':'🏈','Baseball':'⚾','MMA/Boxing':'🥊'};
const confLabels={low:'🔴 Low',medium:'🟡 Medium',high:'🟢 High',max:'⚡ Max'};
let allPicks=[];
let currentFilter='all';

function getScore(picks){
  if(picks.length<3)return{score:0,desc:'Need more picks',color:'var(--mu)',needs:true,needsN:Math.max(0,3-picks.length)};
  const wins=picks.filter(p=>p.result==='win').length;
  const losses=picks.filter(p=>p.result==='loss').length;
  const stake=picks.reduce((s,p)=>s+p.stake,0);
  const pnl=picks.reduce((s,p)=>s+p.pnl,0);
  const roi=stake>0?(pnl/stake)*100:0;
  const wr=(wins+losses)>0?(wins/(wins+losses))*100:0;
  const score=Math.round(Math.min(40,Math.max(0,(roi/20)*40))+Math.min(30,Math.max(0,(wr/70)*30))+Math.min(20,Math.max(0,(picks.length/100)*20))+Math.min(10,picks.length));
  const color=score>=70?'var(--gr)':score>=40?'var(--gold)':'var(--rd)';
  const desc=score>=70?'Highly reliable':score>=50?'Moderately reliable':score>=30?'Building track record':'Early stage';
  return{score,desc,color,needs:false};
}

function getBadges(picks){
  const badges=[];
  const wins=picks.filter(p=>p.result==='win').length;
  const losses=picks.filter(p=>p.result==='loss').length;
  const stake=picks.reduce((s,p)=>s+p.stake,0);
  const pnl=picks.reduce((s,p)=>s+p.pnl,0);
  const roi=stake>0?(pnl/stake)*100:0;
  const wr=(wins+losses)>0?(wins/(wins+losses))*100:0;
  const avgOdds=picks.length>0?picks.reduce((s,p)=>s+p.odds,0)/picks.length:0;
  const sorted=[...picks].filter(p=>p.result!=='pending').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  let streak=0;for(const p of sorted){if(p.result==='win')streak++;else break;}
  if(streak>=5)badges.push({icon:'🔥',name:'Hot Streak',cls:'fire'});
  if(roi>=20&&picks.length>=50)badges.push({icon:'💎',name:'Diamond',cls:'diamond'});
  if(wr>=60&&(wins+losses)>=30)badges.push({icon:'🎯',name:'Sharp',cls:'sharp'});
  if(roi>=15&&picks.length>=10&&picks.length<50)badges.push({icon:'🚀',name:'Rising Star',cls:'rising'});
  if(avgOdds>=2.5&&roi>0&&picks.length>=20)badges.push({icon:'⚡',name:'Value Hunter',cls:'value'});
  if(picks.length>=100)badges.push({icon:'👑',name:'Veteran',cls:'veteran'});
  return{badges,streak};
}

function drawPnLChart(picks,containerId){
  const el=document.getElementById(containerId);
  if(!el||picks.length<2)return;
  const sorted=[...picks].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  let cum=0;const points=[0,...sorted.map(p=>{cum+=p.pnl;return cum;})];
  const min=Math.min(...points),max=Math.max(...points),range=max-min||1;
  const W=280,H=72;
  const pts=points.map((v,i)=>{const x=(i/(points.length-1||1))*W;const y=H-((v-min)/range)*(H-8)-4;return`${x},${y}`;}).join(' ');
  const isPos=points[points.length-1]>=0;
  const color=isPos?'#34d399':'#f87171';
  el.innerHTML=`<svg width="100%" height="72" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${H} ${pts} ${W},${H}" fill="url(#pg)"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function renderPicks(){
  const filtered=currentFilter==='all'?allPicks:allPicks.filter(p=>p.result===currentFilter);
  const c=document.getElementById('picksList');
  if(!c)return;
  if(!filtered.length){c.innerHTML=`<div class="empty">${currentFilter==='all'?'No picks yet.':'No '+currentFilter+' picks.'}</div>`;return;}
  c.innerHTML=filtered.map(p=>{
    const rb=p.result==='win'?'<span class="badge badge-win">WIN</span>':p.result==='loss'?'<span class="badge badge-loss">LOSS</span>':'<span class="badge badge-pending">PENDING</span>';
    const ps=p.pnl>0?`<span class="pick-pnl pos">+€${p.pnl.toFixed(2)}</span>`:p.pnl<0?`<span class="pick-pnl neg">-€${Math.abs(p.pnl).toFixed(2)}</span>`:'<span class="pick-pnl zero">€0</span>';
    const borderCls=p.result==='win'?'win-border':p.result==='loss'?'loss-border':'pending-border';
    const confHtml=p.confidence?`<span class="conf-badge ${p.confidence}">${confLabels[p.confidence]||p.confidence}</span>`:'';
    const icon=sportIcon[p.sport]||'🎯';
    return`<div class="pick-card ${borderCls}">
      <div class="pick-header">
        <span class="pick-sport-icon">${icon}</span>
        <div><div class="pick-event-text">${p.event}</div><div class="pick-market-text">${p.market}</div></div>
      </div>
      <div class="pick-body">
        <div class="pick-meta">
          <span class="badge badge-sport">${p.sport}</span>
          <span style="font-size:11px;color:var(--mu)">${p.stake}u</span>
          ${confHtml}${rb}${ps}
        </div>
        <div style="text-align:right">
          <div class="pick-odds">${p.odds}</div>
          <div class="pick-time">${new Date(p.createdAt).toLocaleDateString('en-GB')}</div>
        </div>
      </div>
      ${p.reasoning?`<div class="pick-reasoning">💭 "${p.reasoning}"</div>`:''}
    </div>`;
  }).join('');
}

function filterPicks(filter,el){
  currentFilter=filter;
  document.querySelectorAll('.pf-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderPicks();
}



function getELOFromPicks(picks){
  // Calculate ELO from pick history
  const BASE=1000;const K=32;
  let elo=BASE;
  const settled=picks.filter(p=>p.result==='win'||p.result==='loss').sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  let streak=0;
  for(const p of settled){
    const impliedProb=Math.min(0.95,Math.max(0.05,(1/p.odds)*0.9));
    const actual=p.result==='win'?1:0;
    const streakBonus=p.result==='win'&&streak>=3?Math.min(streak-2,5)*2:0;
    const change=Math.round(K*(actual-impliedProb)+streakBonus);
    elo=Math.max(100,elo+change);
    if(p.result==='win')streak++;else streak=0;
  }
  return Math.round(elo);
}

function getELOLabel(elo){
  if(elo>=1400)return{label:'Grandmaster',color:'var(--gold)'};
  if(elo>=1200)return{label:'Expert',color:'var(--ac)'};
  if(elo>=1100)return{label:'Advanced',color:'#38bdf8'};
  if(elo>=1000)return{label:'Intermediate',color:'var(--gr)'};
  if(elo>=900)return{label:'Developing',color:'var(--mu2)'};
  return{label:'Beginner',color:'var(--mu)'};
}
function getDivision(picks){
  const wins=picks.filter(p=>p.result==='win').length;
  const losses=picks.filter(p=>p.result==='loss').length;
  const stake=picks.reduce((s,p)=>s+p.stake,0);
  const pnl=picks.reduce((s,p)=>s+p.pnl,0);
  const roi=stake>0?(pnl/stake)*100:0;
  const wr=(wins+losses)>0?(wins/(wins+losses))*100:0;
  const score=Math.round(Math.min(40,Math.max(0,(roi/20)*40))+Math.min(30,Math.max(0,(wr/70)*30))+Math.min(20,Math.max(0,(picks.length/100)*20))+Math.min(10,picks.length));
  if(score>=90)return{name:'LEGEND',cls:'div-legend',icon:'🐐'};
  if(score>=75)return{name:'ELITE',cls:'div-elite',icon:'🔱'};
  if(score>=60)return{name:'DIAMOND',cls:'div-diamond',icon:'💎'};
  if(score>=45)return{name:'PLATINUM',cls:'div-platinum',icon:'⚡'};
  if(score>=30)return{name:'GOLD',cls:'div-gold',icon:'🏆'};
  if(score>=15)return{name:'SILVER',cls:'div-silver',icon:'🥈'};
  return{name:'BRONZE',cls:'div-bronze',icon:'🥉'};
}
function getDNATags(picks){
  const tags=[];
  const wins=picks.filter(p=>p.result==='win').length;
  const losses=picks.filter(p=>p.result==='loss').length;
  const stake=picks.reduce((s,p)=>s+p.stake,0);
  const pnl=picks.reduce((s,p)=>s+p.pnl,0);
  const roi=stake>0?(pnl/stake)*100:0;
  const wr=(wins+losses)>0?(wins/(wins+losses))*100:0;
  const avgOdds=picks.length>0?picks.reduce((s,p)=>s+p.odds,0)/picks.length:0;
  if(wr>=65&&picks.length>=20)tags.push({icon:'🎯',label:'Sharp',cls:'sharp'});
  if(avgOdds<=1.8&&roi>0)tags.push({icon:'🛡️',label:'Safe Bettor',cls:'safe'});
  if(avgOdds>=2.8&&picks.length>=10)tags.push({icon:'⚡',label:'Value Hunter',cls:'value'});
  if(picks.length>=50&&roi>0)tags.push({icon:'⚙️',label:'Grinder',cls:'grinder'});
  if(avgOdds>=3.0&&picks.length>=10)tags.push({icon:'🎲',label:'Aggressive',cls:'aggressive'});
  return tags.slice(0,3);
}
async function loadProfile(){
  if(!username){showNotFound();return;}
  try{
    const r=await fetch(API+'/picks',{cache:'no-store'});
    const all=await r.json();
    allPicks=all.filter(p=>p.user&&p.user.username===username).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

    const wins=allPicks.filter(p=>p.result==='win').length;
    const losses=allPicks.filter(p=>p.result==='loss').length;
    const pending=allPicks.filter(p=>p.result==='pending').length;
    const stake=allPicks.reduce((s,p)=>s+p.stake,0);
    const pnl=allPicks.reduce((s,p)=>s+p.pnl,0);
    const roi=stake>0?((pnl/stake)*100).toFixed(1):0;
    const wr=(wins+losses)>0?((wins/(wins+losses))*100).toFixed(0):0;
    const avg=allPicks.length>0?(allPicks.reduce((s,p)=>s+p.odds,0)/allPicks.length).toFixed(2):0;
    const best=wins>0?Math.max(...allPicks.filter(p=>p.result==='win').map(p=>p.pnl)):0;
    const rPos=parseFloat(roi)>=0,pPos=pnl>=0;
    const {score,desc,color,needs,needsN}=getScore(allPicks);
    const {badges,streak}=getBadges(allPicks);

    // global rank
    const tipsterMap={};
    all.forEach(p=>{if(!p.user)return;const u=p.user.username;if(!tipsterMap[u])tipsterMap[u]={pnl:0,stake:0};tipsterMap[u].pnl+=p.pnl;tipsterMap[u].stake+=p.stake;});
    const sorted=Object.entries(tipsterMap).sort((a,b)=>{const ra=a[1].stake>0?(a[1].pnl/a[1].stake)*100:0;const rb=b[1].stake>0?(b[1].pnl/b[1].stake)*100:0;return rb-ra;});
    const rank=sorted.findIndex(([u])=>u===username)+1;

    const sports={};allPicks.forEach(p=>{if(!sports[p.sport])sports[p.sport]=0;sports[p.sport]++;});
    const sportList=Object.entries(sports).sort((a,b)=>b[1]-a[1]);

    document.title='LEDGR — @'+username;

    const badgesHtml=badges.length>0
      ?badges.map(b=>`<div class="badge-pill ${b.cls}">${b.icon} <span class="badge-pill-name">${b.name}</span></div>`).join('')
      :`<div style="font-size:11px;color:var(--mu);font-family:'DM Mono',monospace">No badges yet — keep posting picks!</div>`;

    const reliabilityHtml=needs
      ?`<div class="reliability-box"><div class="rel-score" style="color:var(--mu)">—</div><div><div class="rel-label">Reliability Score</div><div class="rel-needs">Need ${needsN} more picks to unlock</div></div></div>`
      :`<div class="reliability-box"><div class="rel-score" style="color:${color}">${score}</div><div><div class="rel-label">Reliability Score</div><div class="rel-bar"><div class="rel-fill" style="width:${score}%;background:${color}"></div></div><div class="rel-desc">${desc}</div></div></div>`;

    document.getElementById('mainContent').innerHTML=`
      <div class="cover-banner"><div class="cover-grid"></div></div>
      <div class="profile-hero">
        <div class="profile-top">
          <div class="avatar-wrap"><div class="avatar-ring"></div><div class="avatar-big">${username.substring(0,2).toUpperCase()}</div></div>
          <div class="profile-main">
            <div class="profile-tags">
              <div class="verified-tag"><div class="vdot"></div> VERIFIED</div>
              ${rank>0?`<div class="rank-tag">🏆 RANK #${rank}</div>`:''}
              <div class="division-badge ${getDivision(allPicks).cls}">${getDivision(allPicks).icon} ${getDivision(allPicks).name}</div>
              ${streak>=3?`<div class="streak-tag">🔥 ${streak} WIN STREAK</div>`:''}
            </div>
            <div class="profile-username">@${username}</div>
          </div>
          <div class="profile-actions">
            <button class="share-btn" onclick="shareProfile()">📤 Share</button>
            <button class="follow-btn" id="followBtn" onclick="toggleFollow()">Follow</button>
            <button class="sub-btn" onclick="showToast('Subscriptions coming soon! 🚀')">Subscribe €10/mo</button>
          </div>
        </div>
        <div class="badges-row">${badgesHtml}</div>
        <div class="dna-tags">${getDNATags(allPicks).map(t=>`<span class="dna-tag ${t.cls}">${t.icon} ${t.label}</span>`).join('')}</div>
        ${reliabilityHtml}
        ${(()=>{const elo=getELOFromPicks(allPicks);const{label,color}=getELOLabel(elo);return`<div class="elo-box"><div class="elo-val" style="color:${color}">${elo}</div><div><div class="elo-lbl">ELO Rating</div><div class="elo-desc">${label}</div></div></div>`;})()}
      </div>

      <div class="stats-row">
        <div class="stat"><div class="stat-val neu">${allPicks.length}</div><div class="stat-lbl">Total Picks</div></div>
        <div class="stat"><div class="stat-val ${rPos?'pos':'neg'}">${rPos?'+':''}${roi}%</div><div class="stat-lbl">ROI</div></div>
        <div class="stat"><div class="stat-val neu">${wr}%</div><div class="stat-lbl">Win Rate</div></div>
        <div class="stat"><div class="stat-val ${pPos?'pos':'neg'}">${pPos?'+€':'-€'}${Math.abs(pnl).toFixed(2)}</div><div class="stat-lbl">Total P&L</div></div>
        <div class="stat"><div class="stat-val neu">${avg}</div><div class="stat-lbl">Avg Odds</div></div>
      </div>

      <div class="content-grid">
        <div class="panel">
          <div class="panel-title">ALL PICKS</div>
          <div class="pick-filter">
            <div class="pf-btn active" onclick="filterPicks('all',this)">All</div>
            <div class="pf-btn win" onclick="filterPicks('win',this)">✅ Won</div>
            <div class="pf-btn loss" onclick="filterPicks('loss',this)">❌ Lost</div>
            <div class="pf-btn pending" onclick="filterPicks('pending',this)">⏳ Pending</div>
          </div>
          <div id="picksList"></div>
        </div>
        <div>
          <div class="panel" style="margin-bottom:16px">
            <div class="panel-title">PERFORMANCE</div>
            <div class="perf-row"><span class="perf-key">Record</span><span class="perf-val">${wins}W — ${losses}L — ${pending}P</span></div>
            <div class="perf-row"><span class="perf-key">ROI</span><span class="perf-val ${rPos?'pos':'neg'}">${rPos?'+':''}${roi}%</span></div>
            <div class="perf-row"><span class="perf-key">Win Rate</span><span class="perf-val">${wr}%</span></div>
            <div class="perf-row"><span class="perf-key">P&L</span><span class="perf-val ${pPos?'pos':'neg'}">${pPos?'+€':'-€'}${Math.abs(pnl).toFixed(2)}</span></div>
            <div class="perf-row"><span class="perf-key">Avg Odds</span><span class="perf-val">${avg}</span></div>
            <div class="perf-row"><span class="perf-key">Best Win</span><span class="perf-val pos">+€${best.toFixed(2)}</span></div>
            <div class="perf-row"><span class="perf-key">Win Streak</span><span class="perf-val" style="color:${streak>=3?'var(--orange)':'var(--tx)'}">${streak>=3?'🔥 ':''} W${streak}</span></div>
            <div class="perf-row"><span class="perf-key">Reliability</span><span class="perf-val" style="color:${color}">${score>0?score+'/100':'—'}</span></div>
            <div class="perf-row"><span class="perf-key">Global Rank</span><span class="perf-val" style="color:var(--gold)">${rank>0?'#'+rank:'—'}</span></div>
            <div class="perf-row"><span class="perf-key">ELO Rating</span><span class="perf-val" style="color:var(--ac)">${getELOFromPicks(allPicks)}</span></div>
            <div class="pnl-chart" id="pnlChart"></div>
          </div>
          ${sportList.length>0?`<div class="panel"><div class="panel-title">BY SPORT</div>${sportList.map(([s,c])=>`<div class="sport-bar"><div class="sport-bar-label"><span>${sportIcon[s]||'🎯'} ${s}</span><span>${c} picks</span></div><div class="sbar"><div class="sbar-fill" style="width:${(c/allPicks.length*100).toFixed(0)}%"></div></div></div>`).join('')}</div>`:''}
        </div>
      </div>`;

    setTimeout(()=>{drawPnLChart(allPicks,'pnlChart');renderPicks();},80);

  }catch(e){
    document.getElementById('mainContent').innerHTML='<div class="not-found"><h2>ERROR</h2><p style="color:var(--mu2)">Could not load profile.</p><a href="/leaderboard" class="back-btn">← Back to Leaderboard</a></div>';
  }
}

function toggleFollow(){
  const btn=document.getElementById('followBtn');
  if(!btn)return;
  const f=btn.classList.contains('following');
  btn.classList.toggle('following',!f);
  btn.textContent=f?'Follow':'Following ✓';
}
function showNotFound(){document.getElementById('mainContent').innerHTML='<div class="not-found"><h2>404</h2><p style="color:var(--mu2)">Tipster not found.</p><a href="/leaderboard" class="back-btn">← Back to Leaderboard</a></div>';}
function shareProfile(){
  const url=window.location.href;
  navigator.clipboard.writeText(url).then(()=>showToast('LINK COPIED! 📋')).catch(()=>{
    const d=document.createElement('input');d.value=url;document.body.appendChild(d);d.select();document.execCommand('copy');document.body.removeChild(d);showToast('LINK COPIED! 📋');
  });
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
loadProfile();

function openSlideNav(){document.getElementById('slideNav').classList.add('open');document.getElementById('slideOverlay').classList.add('open');document.body.style.overflow='hidden';}
function closeSlideNav(){document.getElementById('slideNav').classList.remove('open');document.getElementById('slideOverlay').classList.remove('open');document.body.style.overflow='';}
</script>
