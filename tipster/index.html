<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Tipster Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05050a;--s1:#0b0b14;--s2:#111120;--bd:#18182e;--ac:#e8ff00;--tx:#f2f2fa;--mu:#5a5a7a;--mu2:#8888aa;--gr:#00e5a0;--rd:#ff3355}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(232,255,0,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,255,0,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
nav{position:sticky;top:0;z-index:50;background:rgba(5,5,10,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:5px;color:var(--ac);text-decoration:none}
.nav-links{display:flex;gap:8px}
.nav-link{color:var(--mu2);font-size:13px;text-decoration:none;padding:8px 14px;border-radius:8px;transition:all .2s}
.nav-link:hover{color:var(--tx);background:var(--s2)}
.nav-btn{background:var(--ac);color:#05050a;border:none;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif}
.main{max-width:1100px;margin:0 auto;padding:40px 24px;position:relative;z-index:1}
.profile-hero{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:36px;margin-bottom:24px;display:flex;align-items:flex-start;gap:28px;flex-wrap:wrap}
.avatar-big{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:34px;flex-shrink:0;border:3px solid var(--ac);background:linear-gradient(135deg,#7c3aed,#a855f7)}
.profile-info{flex:1;min-width:200px}
.profile-verified{display:inline-flex;align-items:center;gap:6px;background:rgba(232,255,0,0.08);border:1px solid rgba(232,255,0,0.2);color:var(--ac);padding:4px 14px;border-radius:20px;font-size:11px;font-family:'DM Mono',monospace;letter-spacing:1px;margin-bottom:10px}
.vdot{width:6px;height:6px;background:var(--gr);border-radius:50%}
.profile-username{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:3px;line-height:1;margin-bottom:8px}
.profile-bio{color:var(--mu2);font-size:14px;line-height:1.7;max-width:500px;margin-bottom:14px}
.score-box{display:inline-flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:12px 18px;margin-bottom:14px}
.score-num{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1}
.score-info{}
.score-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.score-bar{width:100px;height:4px;background:var(--bd);border-radius:2px;margin-bottom:4px}
.score-fill{height:100%;border-radius:2px}
.score-desc{font-size:11px;color:var(--mu2);font-family:'DM Mono',monospace}
.badges-row{display:flex;gap:8px;flex-wrap:wrap}
.badge-pill{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;font-size:12px}
.badge-pill-name{font-family:'DM Mono',monospace;color:var(--mu2);font-size:11px}
.profile-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;padding-top:8px}
.follow-btn{padding:12px 28px;border:1px solid var(--ac);color:var(--ac);background:rgba(232,255,0,0.08);border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif}
.follow-btn:hover{background:var(--ac);color:#05050a}
.share-btn{padding:12px 20px;border:1px solid var(--bd);color:var(--mu2);background:transparent;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif}
.share-btn:hover{border-color:var(--mu2);color:var(--tx)}
.sub-btn{padding:12px 28px;background:var(--ac);color:#05050a;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif}
.sub-btn:hover{background:#f5ff33}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:28px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:18px;text-align:center}
.stat::before{content:'';display:block;width:40px;height:2px;background:var(--ac);margin:0 auto 12px;opacity:.5}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;line-height:1;margin-bottom:4px}
.stat-val.pos{color:var(--gr)}.stat-val.neg{color:var(--rd)}.stat-val.neu{color:var(--tx)}
.stat-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:2px;text-transform:uppercase}
.content-grid{display:grid;grid-template-columns:1fr 320px;gap:20px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:24px}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--ac);margin-bottom:20px;display:flex;align-items:center;gap:10px}
.panel-title::after{content:'';flex:1;height:1px;background:var(--bd)}
.pick-card{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:10px}
.pick-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.pick-event{font-weight:700;font-size:14px;margin-bottom:2px}
.pick-market{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace}
.pick-odds{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--ac);line-height:1}
.pick-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:10px;font-family:'DM Mono',monospace}
.badge-win{background:rgba(0,229,160,.12);color:var(--gr)}
.badge-loss{background:rgba(255,51,85,.12);color:var(--rd)}
.badge-pending{background:rgba(245,158,11,.12);color:#f59e0b}
.badge-sport{background:rgba(232,255,0,.08);color:var(--ac)}
.pick-time{font-size:10px;color:var(--mu);font-family:'DM Mono',monospace;margin-left:auto}
.pick-pnl{font-family:'DM Mono',monospace;font-size:12px;font-weight:600}
.pick-pnl.pos{color:var(--gr)}.pick-pnl.neg{color:var(--rd)}.pick-pnl.zero{color:var(--mu)}
.perf-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);font-size:13px}
.perf-row:last-child{border:none}
.perf-key{color:var(--mu);font-family:'DM Mono',monospace;font-size:11px}
.perf-val{font-weight:600}
.perf-val.pos{color:var(--gr)}.perf-val.neg{color:var(--rd)}
.sport-bar{margin-bottom:12px}
.sport-bar-label{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px}
.sport-bar-label span:first-child{color:var(--mu2)}
.sport-bar-label span:last-child{color:var(--ac);font-family:'DM Mono',monospace;font-size:11px}
.sbar{height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
.sbar-fill{height:100%;background:var(--ac);border-radius:2px}
.empty{text-align:center;padding:40px;color:var(--mu)}
.not-found{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center}
.not-found h2{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:3px;color:var(--rd);margin-bottom:12px}
.not-found p{color:var(--mu2);margin-bottom:24px}
.back-btn{color:var(--ac);text-decoration:none;font-family:'DM Mono',monospace;font-size:13px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ac);color:#05050a;padding:12px 24px;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;z-index:1000;transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.toast.show{transform:translateY(0);opacity:1}
@media(max-width:900px){.content-grid{grid-template-columns:1fr}.stats-row{grid-template-columns:repeat(3,1fr)}.profile-hero{flex-direction:column}}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<nav>
  <a href="/" class="logo">LEDGR</a>
  <div class="nav-links">
    <a href="/home" class="nav-link">Home</a>
    <a href="/leaderboard" class="nav-link">Leaderboard</a>
    <a href="/compare" class="nav-link">Compare</a>
    <a href="/simulator" class="nav-link">Simulator</a>
    <a href="/dashboard" class="nav-link">Dashboard</a>
  </div>
  <button class="nav-btn" onclick="window.location.href='/dashboard'">My Dashboard</button>
</nav>
<div class="main" id="mainContent">
  <div style="text-align:center;padding:60px;color:var(--mu)">
    <p style="font-size:24px;margin-bottom:12px">⟳</p>
    <p>Loading profile...</p>
  </div>
</div>
<script>
const API='https://ledgr-backend-production-c132.up.railway.app';
const params=new URLSearchParams(window.location.search);
const username=params.get('u')||'';

function getScore(picks){
  if(picks.length<5)return 0;
  const wins=picks.filter(p=>p.result==='win').length;
  const losses=picks.filter(p=>p.result==='loss').length;
  const pending=picks.filter(p=>p.result==='pending').length;
  const stake=picks.reduce((s,p)=>s+p.stake,0);
  const pnl=picks.reduce((s,p)=>s+p.pnl,0);
  const roi=stake>0?(pnl/stake)*100:0;
  const wr=(wins+losses)>0?(wins/(wins+losses))*100:0;
  const r=Math.min(40,Math.max(0,(roi/20)*40));
  const w=Math.min(30,Math.max(0,(wr/70)*30));
  const v=Math.min(20,Math.max(0,(picks.length/100)*20));
  const c=Math.max(0,10-Math.floor((pending/picks.length)*10));
  return Math.round(r+w+v+c);
}

function getBadges(picks){
  const badges=[];
  const wins=picks.filter(p=>p.result==='win').length;
  const losses=picks.filter(p=>p.result==='loss').length;
  const stake=picks.reduce((s,p)=>s+p.stake,0);
  const pnl=picks.reduce((s,p)=>s+p.pnl,0);
  const roi=stake>0?(pnl/stake)*100:0;
  const wr=(wins+losses)>0?(wins/(wins+losses))*100:0;
  const avgOdds=picks.length>0?picks.reduce((s,p)=>s+p.odds,0)/picks.length:0;
  const sorted=[...picks].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  let streak=0;
  for(const p of sorted){if(p.result==='win')streak++;else if(p.result==='loss')break;}
  if(streak>=5)badges.push({icon:'🔥',name:'Hot Streak'});
  if(roi>=20&&picks.length>=50)badges.push({icon:'💎',name:'Diamond'});
  if(wr>=60&&(wins+losses)>=30)badges.push({icon:'🎯',name:'Sharp'});
  if(roi>=15&&picks.length>=10&&picks.length<50)badges.push({icon:'🚀',name:'Rising Star'});
  if(avgOdds>=2.5&&roi>0&&picks.length>=20)badges.push({icon:'⚡',name:'Value Hunter'});
  if(picks.length>=100)badges.push({icon:'👑',name:'Veteran'});
  return badges;
}

async function subscribeTo(){
  try{
    const r=await fetch(API+'/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipsterUsername:username,priceAmount:10,userId:'guest'})});
    const d=await r.json();
    if(d.url)window.location.href=d.url;
    else showToast('Error starting checkout');
  }catch(e){showToast('Connection error');}
}

async function loadProfile(){
  try{
    const r=await fetch(API+'/picks');
    const all=await r.json();
    const picks=all.filter(p=>p.user&&p.user.username===username);
    if(!username){showNotFound();return;}
    const wins=picks.filter(p=>p.result==='win').length;
    const losses=picks.filter(p=>p.result==='loss').length;
    const pending=picks.filter(p=>p.result==='pending').length;
    const stake=picks.reduce((s,p)=>s+p.stake,0);
    const pnl=picks.reduce((s,p)=>s+p.pnl,0);
    const roi=stake>0?((pnl/stake)*100).toFixed(1):0;
    const wr=(wins+losses)>0?((wins/(wins+losses))*100).toFixed(0):0;
    const avg=picks.length>0?(picks.reduce((s,p)=>s+p.odds,0)/picks.length).toFixed(2):0;
    const best=picks.filter(p=>p.result==='win').length>0?Math.max(...picks.filter(p=>p.result==='win').map(p=>p.pnl)):0;
    const rPos=parseFloat(roi)>=0;
    const pPos=pnl>=0;
    const init=username.substring(0,2).toUpperCase();
    const score=getScore(picks);
    const sc=score>=70?'#00e5a0':score>=40?'#f59e0b':'#ff3355';
    const sd=score>=70?'Highly reliable':score>=40?'Moderately reliable':'Building track record';
    const badges=getBadges(picks);
    const sports={};
    picks.forEach(p=>{if(!sports[p.sport])sports[p.sport]=0;sports[p.sport]++;});
    const sportList=Object.entries(sports).sort((a,b)=>b[1]-a[1]);
    document.title='LEDGR — @'+username;
    document.getElementById('mainContent').innerHTML=`
      <div class="profile-hero">
        <div class="avatar-big">${init}</div>
        <div class="profile-info">
          <div class="profile-verified"><div class="vdot"></div> VERIFIED TIPSTER</div>
          <div class="profile-username">@${username}</div>
          <div class="profile-bio">${picks.length} verified picks on LEDGR. All results tracked automatically.</div>
          ${score>0?`<div class="score-box">
            <div class="score-num" style="color:${sc}">${score}</div>
            <div class="score-info">
              <div class="score-label">Reliability Score</div>
              <div class="score-bar"><div class="score-fill" style="width:${score}%;background:${sc}"></div></div>
              <div class="score-desc">${sd}</div>
            </div>
          </div>`:''}
          ${badges.length>0?`<div class="badges-row">${badges.map(b=>`<div class="badge-pill">${b.icon} <span class="badge-pill-name">${b.name}</span></div>`).join('')}</div>`:''}
        </div>
        <div class="profile-actions">
          <button class="share-btn" onclick="shareProfile()">Share</button>
          <button class="follow-btn" onclick="this.textContent=this.textContent==='Follow'?'Following':'Follow'">Follow</button>
          <button class="sub-btn" onclick="subscribeTo()">Subscribe €10/mo</button>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat"><div class="stat-val neu">${picks.length}</div><div class="stat-lbl">Total Picks</div></div>
        <div class="stat"><div class="stat-val ${rPos?'pos':'neg'}">${rPos?'+':''}${roi}%</div><div class="stat-lbl">ROI</div></div>
        <div class="stat"><div class="stat-val neu">${wr}%</div><div class="stat-lbl">Win Rate</div></div>
        <div class="stat"><div class="stat-val ${pPos?'pos':'neg'}">${pPos?'+€':'-€'}${Math.abs(pnl).toFixed(2)}</div><div class="stat-lbl">Total P&L</div></div>
        <div class="stat"><div class="stat-val neu">${avg}</div><div class="stat-lbl">Avg Odds</div></div>
      </div>
      <div class="content-grid">
        <div class="panel">
          <div class="panel-title">ALL PICKS</div>
          ${picks.length===0?'<div class="empty"><p style="font-size:36px;margin-bottom:10px">📊</p><p>No picks yet.</p></div>':
          picks.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(p=>{
            const rb=p.result==='win'?'<span class="badge badge-win">WIN</span>':p.result==='loss'?'<span class="badge badge-loss">LOSS</span>':'<span class="badge badge-pending">PENDING</span>';
            const ps=p.pnl>0?`<span class="pick-pnl pos">+€${p.pnl.toFixed(2)}</span>`:p.pnl<0?`<span class="pick-pnl neg">-€${Math.abs(p.pnl).toFixed(2)}</span>`:`<span class="pick-pnl zero">€0.00</span>`;
            return`<div class="pick-card"><div class="pick-top"><div><div class="pick-event">${p.event}</div><div class="pick-market">${p.market}</div></div><div class="pick-odds">${p.odds}</div></div><div class="pick-meta"><span class="badge badge-sport">${p.sport}</span><span style="font-size:11px;color:var(--mu)">${p.stake}u</span>${rb}${ps}<span class="pick-time">${new Date(p.createdAt).toLocaleDateString()}</span></div></div>`;
          }).join('')}
        </div>
        <div>
          <div class="panel" style="margin-bottom:16px">
            <div class="panel-title">PERFORMANCE</div>
            <div class="perf-row"><span class="perf-key">Record</span><span class="perf-val">${wins}W - ${losses}L - ${pending}P</span></div>
            <div class="perf-row"><span class="perf-key">ROI</span><span class="perf-val ${rPos?'pos':'neg'}">${rPos?'+':''}${roi}%</span></div>
            <div class="perf-row"><span class="perf-key">Win Rate</span><span class="perf-val">${wr}%</span></div>
            <div class="perf-row"><span class="perf-key">Total P&L</span><span class="perf-val ${pPos?'pos':'neg'}">${pPos?'+€':'-€'}${Math.abs(pnl).toFixed(2)}</span></div>
            <div class="perf-row"><span class="perf-key">Avg Odds</span><span class="perf-val">${avg}</span></div>
            <div class="perf-row"><span class="perf-key">Best Win</span><span class="perf-val pos">+€${best.toFixed(2)}</span></div>
            <div class="perf-row"><span class="perf-key">Reliability</span><span class="perf-val" style="color:${sc}">${score}/100</span></div>
          </div>
          ${sportList.length>0?`<div class="panel"><div class="panel-title">BY SPORT</div>${sportList.map(([s,c])=>`<div class="sport-bar"><div class="sport-bar-label"><span>${s}</span><span>${c} picks</span></div><div class="sbar"><div class="sbar-fill" style="width:${(c/picks.length*100).toFixed(0)}%"></div></div></div>`).join('')}</div>`:''}
        </div>
      </div>`;
  }catch(e){
    document.getElementById('mainContent').innerHTML='<div class="not-found"><h2>ERROR</h2><p>Could not load profile.</p><a href="/leaderboard" class="back-btn">← Back to Leaderboard</a></div>';
  }
}

function showNotFound(){document.getElementById('mainContent').innerHTML='<div class="not-found"><h2>404</h2><p>Tipster not found.</p><a href="/leaderboard" class="back-btn">← Back to Leaderboard</a></div>';}
function shareProfile(){navigator.clipboard.writeText(window.location.href).then(()=>showToast('LINK COPIED!'));}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

loadProfile();
</script>
</body>
</html>
