*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--font-body);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:1;opacity:.3}
.bg-glow{position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:900px;height:600px;background:radial-gradient(ellipse,rgba(123,44,255,0.04),transparent 70%);pointer-events:none;z-index:0}
.main{max-width:1120px;margin:0 auto;padding:0 0 80px;position:relative;z-index:2}

/* ── CINEMATIC BANNER ── */
@keyframes legendShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes conicSpin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sharpPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,160,0)}50%{box-shadow:0 0 8px 2px rgba(0,229,160,0.18)}}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(123,44,255,0)}50%{box-shadow:0 0 0 10px rgba(123,44,255,0.12)}}
@keyframes diamondCrackle{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,0),0 0 8px rgba(56,189,248,0.2);border-color:rgba(56,189,248,0.6)}50%{box-shadow:0 0 0 8px rgba(56,189,248,0.08),0 0 20px rgba(56,189,248,0.4);border-color:rgba(56,189,248,1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pendingPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

.profile-banner{height:220px;width:100%;position:relative;overflow:hidden}
.banner-bronze{background:linear-gradient(135deg,#1a0e08,#2d1a0a,#1a100c)}
.banner-silver{background:linear-gradient(135deg,#0e1018,#161b24,#0a0d14)}
.banner-gold{background:linear-gradient(135deg,#0d0900,#1f1500,#0a0800)}
.banner-gold::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(75deg,rgba(251,191,36,0.04) 0px,transparent 80px,rgba(251,191,36,0.02) 160px);pointer-events:none}
.banner-platinum{background:linear-gradient(135deg,#00111a,#001f2e,#000d1a)}
.banner-platinum::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 100% at 50% 100%,rgba(56,189,248,0.08),transparent)}
.banner-diamond{background:linear-gradient(135deg,#080520,#10073a,#040918)}
.banner-diamond::before{content:'';position:absolute;inset:0;background:radial-gradient(1px 1px at 20% 30%,rgba(56,189,248,0.6),transparent),radial-gradient(1px 1px at 70% 20%,rgba(184,159,255,0.5),transparent),radial-gradient(1px 1px at 40% 60%,rgba(56,189,248,0.4),transparent),radial-gradient(2px 2px at 80% 50%,rgba(184,159,255,0.6),transparent),radial-gradient(2px 2px at 10% 70%,rgba(56,189,248,0.3),transparent)}
.banner-elite{background:linear-gradient(135deg,#0a0420,#1a0840,#080318)}
.banner-elite::after{content:'';position:absolute;width:600px;height:600px;top:50%;left:50%;margin:-300px;background:conic-gradient(from 0deg,rgba(123,44,255,0.12),transparent 30%,rgba(184,159,255,0.08),transparent 70%,rgba(123,44,255,0.12));animation:conicSpin 12s linear infinite;pointer-events:none}
.banner-legendary{background:linear-gradient(135deg,#100500,#1a0030,#00100a)}
.banner-legendary::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(251,191,36,0.06),rgba(184,159,255,0.06),rgba(52,211,153,0.04),rgba(56,189,248,0.05),rgba(251,191,36,0.06));background-size:300% 300%;animation:legendShimmer 8s ease infinite;pointer-events:none}
.banner-noise{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:1}
.banner-overlay{position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(to top,var(--bg) 0%,transparent 100%);z-index:2}

/* ── BANNER PACK CLASSES (bp-*) — !important overrides inline style from JS template ── */
.bp-midnight{background:#050508!important}
.bp-carbon{background:linear-gradient(135deg,#0a0a0a,#181818)!important}
.bp-frost{background:linear-gradient(135deg,#030d1a,#051929,#081e35)!important}
.bp-purple-fade{background:linear-gradient(135deg,#050508,#1a0a3a)!important}
.bp-electric-storm{background:linear-gradient(135deg,#050515,#0c0a28,#150c35)!important;position:relative;overflow:hidden}
.bp-electric-storm::after{content:'';position:absolute;top:0;left:20%;width:2px;height:100%;background:linear-gradient(180deg,transparent,rgba(120,80,255,0.9),transparent);animation:bpBolt 3s steps(1) infinite;opacity:0}
@keyframes bpBolt{0%,80%,100%{opacity:0}81%,83%{opacity:1}82%,84%{opacity:0}85%,87%{opacity:.7}86%,88%{opacity:0}}
.bp-cosmic-rift{background:radial-gradient(ellipse at 30% 50%,#1a0535,#050510,#000)!important}
.bp-frost-core{background:linear-gradient(135deg,#030e1e,#061a30,#0a2040)!important}
.bp-neon-pulse{background:linear-gradient(135deg,#0a0520,#0d0838,#14063d)!important}
.bp-dragon-soul{background:radial-gradient(ellipse at 50% 120%,#3a0008,#0f0000,#040000)!important}
.bp-crown-energy{background:radial-gradient(ellipse at 50% -30%,#1f1600,#0a0800,#040400)!important}
.bp-eternal-flame{background:linear-gradient(180deg,#020100,#0f0500,#1a0800)!important}
.bp-void-emperor{background:#000!important}
.bp-singularity{background:radial-gradient(circle at 50% 50%,#050010,#000)!important}
.bp-time-collapse{background:conic-gradient(from 0deg,#000,#050015,#000,#050010,#000)!important}
.bp-unknown-signal{background:#000!important}
.bp-galaxy-motion{background:#000510!important}

/* ── AVATAR BORDER CLASSES (ab-*) for tipster profile ── */
.ab-clean{border:2px solid rgba(184,159,255,0.22)!important}
.ab-bronze-frame{border:2px solid #cd7f32!important;box-shadow:0 0 8px rgba(205,127,50,0.3)}
.ab-crystal-orbit{border:2px solid rgba(79,195,247,0.4)!important}
.ab-pulse-ring{border:2px solid rgba(150,100,255,0.6)!important;animation:abHeartbeat 1.4s ease-in-out infinite}
@keyframes abHeartbeat{0%{box-shadow:0 0 0 0 rgba(150,100,255,0.4)}40%{box-shadow:0 0 0 6px rgba(150,100,255,0)}100%{box-shadow:0 0 0 0 rgba(150,100,255,0)}}
.ab-frost-edge{border:2px solid rgba(147,210,255,0.8)!important;box-shadow:0 0 12px rgba(147,210,255,0.3);animation:abFrost 3s ease-in-out infinite}
@keyframes abFrost{0%,100%{border-color:rgba(147,210,255,0.4)}50%{border-color:rgba(220,245,255,1);box-shadow:0 0 20px rgba(147,210,255,0.5)}}
.ab-electric-surge{border:2px solid transparent!important;background:linear-gradient(#1a1a2a,#1a1a2a) padding-box,conic-gradient(#7B2CFF,#fff 45deg,#7B2CFF 90deg,#4FC3F7 180deg,#fff 225deg,#7B2CFF) border-box;animation:abElecRun .5s linear infinite;box-shadow:0 0 10px rgba(123,44,255,0.5)}
@keyframes abElecRun{from{background:linear-gradient(#1a1a2a,#1a1a2a) padding-box,conic-gradient(from 0deg,#7B2CFF,#fff 45deg,#7B2CFF 90deg,#4FC3F7 180deg,#fff 225deg,#7B2CFF) border-box}to{background:linear-gradient(#1a1a2a,#1a1a2a) padding-box,conic-gradient(from 360deg,#7B2CFF,#fff 45deg,#7B2CFF 90deg,#4FC3F7 180deg,#fff 225deg,#7B2CFF) border-box}}
.ab-inferno-core{border:2px solid #FF6B35!important;box-shadow:0 0 12px rgba(255,107,53,0.5);animation:abInferno 1.5s ease-in-out infinite}
@keyframes abInferno{0%,100%{border-color:#FF6B35}50%{border-color:#FFD700;box-shadow:0 0 24px rgba(255,107,53,0.8)}}
.ab-cosmic-rift{border:3px solid transparent!important;background:linear-gradient(#0a0a1a,#0a0a1a) padding-box,conic-gradient(#7B2CFF,#4FC3F7,#00E5A0,#FFD700,#FF6BFF,#7B2CFF) border-box;animation:abCosmicHue 3s linear infinite;box-shadow:0 0 12px rgba(123,44,255,0.4)}
@keyframes abCosmicHue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
.ab-dragon-soul{border:3px solid #FF3355!important;animation:abDragonFire 2s ease-in-out infinite;box-shadow:0 0 16px rgba(255,51,85,0.5);position:relative;overflow:visible}
.ab-dragon-soul::before,.ab-dragon-soul::after{content:'🔥';position:absolute;font-size:11px;top:50%;left:50%;animation:abFireOrbit 2.5s linear infinite;pointer-events:none}
.ab-dragon-soul::after{content:'🐉';font-size:10px;animation:abFireOrbit 2.5s linear infinite reverse;animation-delay:-1.25s}
@keyframes abFireOrbit{from{transform:rotate(0deg) translateX(56px) rotate(0deg)}to{transform:rotate(360deg) translateX(56px) rotate(-360deg)}}
@keyframes abDragonFire{0%,100%{border-color:#FF3355}50%{border-color:#FFD700;box-shadow:0 0 28px rgba(255,215,0,0.6)}}
.ab-crown-halo{border:3px solid transparent!important;background:linear-gradient(#1a1400,#1a1400) padding-box,conic-gradient(#FFD700,#FFA500,rgba(255,255,255,0.5),#FFD700,#FFA500,rgba(255,255,255,0.5),#FFD700) border-box;box-shadow:0 0 20px rgba(255,215,0,0.4);animation:abCrownPulse 2s ease-in-out infinite;position:relative;overflow:visible}
.ab-crown-halo::before{content:'⭐';font-size:9px;position:absolute;top:50%;left:50%;animation:abStarOrbit 3s linear infinite}
.ab-crown-halo::after{content:'👑';font-size:9px;position:absolute;top:-18px;left:50%;transform:translateX(-50%);animation:abCrownBob 1.5s ease-in-out infinite}
@keyframes abStarOrbit{from{transform:rotate(0deg) translateX(54px)}to{transform:rotate(360deg) translateX(54px)}}
@keyframes abCrownBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
@keyframes abCrownPulse{0%,100%{box-shadow:0 0 16px rgba(255,215,0,0.3)}50%{box-shadow:0 0 32px rgba(255,215,0,0.7)}}
.ab-void-king{border:3px solid rgba(80,0,160,0.9)!important;box-shadow:0 0 20px rgba(80,0,160,0.5);animation:abVoid 3s ease-in-out infinite}
@keyframes abVoid{0%,100%{border-color:rgba(80,0,160,0.9)}50%{border-color:rgba(150,0,255,1);box-shadow:0 0 36px rgba(120,0,220,0.8)}}
.ab-celestial-orbit{border:2px solid rgba(170,120,255,0.4)!important;animation:abCelestial 4s ease-in-out infinite;position:relative;overflow:visible}
.ab-celestial-orbit::before{content:'🌍';font-size:8px;position:absolute;top:50%;left:50%;animation:abPlanet1 3s linear infinite}
.ab-celestial-orbit::after{content:'🌙';font-size:6px;position:absolute;top:50%;left:50%;animation:abPlanet2 5s linear infinite reverse}
@keyframes abPlanet1{from{transform:rotate(0deg) translateX(56px) rotate(0deg)}to{transform:rotate(360deg) translateX(56px) rotate(-360deg)}}
@keyframes abPlanet2{from{transform:rotate(120deg) translateX(62px) rotate(-120deg)}to{transform:rotate(480deg) translateX(62px) rotate(-480deg)}}
@keyframes abCelestial{0%,100%{border-color:rgba(170,120,255,0.3)}50%{border-color:rgba(170,120,255,0.8);box-shadow:0 0 24px rgba(170,120,255,0.4)}}
.ab-time-collapse{border:2px solid rgba(255,107,255,0.7)!important;animation:abTimeGlitch 1.5s steps(4) infinite}
@keyframes abTimeGlitch{0%{border-color:rgba(255,107,255,0.7);transform:translate(0)}25%{border-color:rgba(79,195,247,0.9);transform:translate(-2px,1px) skewX(-2deg)}50%{border-color:rgba(255,51,85,0.8);transform:translate(2px,-1px) skewX(2deg)}75%{border-color:rgba(255,215,0,0.7);transform:translate(-1px,2px)}100%{border-color:rgba(255,107,255,0.7);transform:translate(0)}}
.ab-singularity{border:3px solid transparent!important;background:radial-gradient(circle at 50%,#000005,#050010) padding-box,conic-gradient(#FF6BFF 0deg,#000 60deg,#7B2CFF 120deg,#000 180deg,#4FC3F7 240deg,#000 300deg,#FF6BFF 360deg) border-box;box-shadow:0 0 28px rgba(255,107,255,0.4);animation:abSingSpin 1.2s linear infinite;position:relative;overflow:visible}
@keyframes abSingSpin{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
.ab-unknown-signal{border:2px solid rgba(0,255,80,0.4)!important;animation:abSignal .8s steps(3) infinite}
@keyframes abSignal{0%{border-color:rgba(0,255,80,0.4);transform:translate(0)}33%{border-color:rgba(0,200,255,0.6);transform:translate(-1px,0)}66%{border-color:rgba(255,0,100,0.5);transform:translate(1px,0)}}
.ab-redacted{animation:abRedacted 4s linear infinite}
@keyframes abRedacted{0%{border:3px solid #FF6BFF!important}20%{border:3px solid #7B2CFF!important}40%{border:3px solid #FF3355!important;transform:skewX(-1deg)}60%{border:3px solid #00E5A0!important}80%{border:3px solid #FFD700!important;transform:skewX(1deg)}100%{border:3px solid #FF6BFF!important}}
.ab-halloween{border:2px solid rgba(255,120,0,0.7)!important;animation:abHalloween .4s steps(2) infinite}
@keyframes abHalloween{0%{box-shadow:0 0 8px rgba(255,120,0,0.5)}50%{box-shadow:0 0 14px rgba(255,120,0,0.8)}}
.ab-winter-elite{border:2px solid rgba(147,210,255,0.7)!important;animation:abWinter 4s ease-in-out infinite}
@keyframes abWinter{0%,100%{border-color:rgba(147,210,255,0.4)}50%{border-color:rgba(220,245,255,0.9);box-shadow:0 0 20px rgba(147,210,255,0.5)}}
.ab-summer-champion{border:3px solid transparent!important;background:linear-gradient(#1a1200,#1a1200) padding-box,conic-gradient(#FFD700,#FF6B35,#FFD700,#FFA500,#FFD700) border-box;animation:abSummerGlow 2s ease-in-out infinite;box-shadow:0 0 12px rgba(255,215,0,0.3)}
@keyframes abSummerGlow{0%,100%{box-shadow:0 0 10px rgba(255,215,0,0.3)}50%{box-shadow:0 0 24px rgba(255,215,0,0.6)}}

/* ── PROFILE BODY ── */
.profile-body{background:var(--bg);padding:0 40px 28px;position:relative}
.profile-top{display:flex;align-items:flex-start;gap:24px;padding-top:0;margin-bottom:20px;flex-wrap:wrap}
.avatar-wrap{position:relative;margin-top:-52px;flex-shrink:0;z-index:10}
.avatar-big{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:32px;font-weight:700;border:4px solid var(--bg);background:linear-gradient(135deg,#7B2CFF,#B14CFF);color:#fff;position:relative;z-index:1}
.avatar-ring{position:absolute;inset:-6px;border-radius:50%;z-index:0}
.ring-bronze{border:2px solid rgba(180,120,80,0.5);box-shadow:0 0 12px rgba(180,120,80,0.15)}
.ring-silver{border:2px solid rgba(148,163,184,0.4);box-shadow:0 0 12px rgba(148,163,184,0.1)}
.ring-gold{border:2px solid rgba(251,191,36,0.7);box-shadow:0 0 16px rgba(251,191,36,0.2),0 0 32px rgba(251,191,36,0.06)}
.ring-platinum{border:2px solid rgba(56,189,248,0.5);animation:ringPulse 2.5s ease-in-out infinite}
.ring-diamond{border:2px solid rgba(56,189,248,0.8);animation:diamondCrackle 2s ease-in-out infinite}
.ring-elite::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,var(--ac-vivid),var(--ac-light),var(--rd),var(--ac-vivid));animation:conicSpin 3s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px))}
.ring-legendary::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),var(--ac),var(--gr),var(--cyan),var(--rd),var(--gold));animation:conicSpin 4s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px))}
/* settings border overrides */
.ring-pulse{border:2px solid rgba(184,159,255,0.45)!important;animation:ringPulse 2s ease-in-out infinite}
.ring-fire::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,#ff6b00,#ff3500,#ffaa00,#ff6b00);animation:conicSpin 3s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px))}
.ring-legend::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),var(--ac),var(--gr),var(--cyan),var(--rd),var(--gold));animation:conicSpin 4s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px))}

/* ── IDENTITY ── */
.identity-block{flex:1;min-width:200px;padding-top:20px}
.rank-block{padding-top:20px;flex-shrink:0;text-align:right}
.rank-lbl{font-family:var(--font-body);font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
.rank-num{font-family:var(--font-mono);font-size:40px;font-weight:700;line-height:1;color:var(--gold)}
.profile-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.verified-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(0,229,160,0.07);border:1px solid rgba(0,229,160,0.2);color:var(--gr);font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;padding:4px 12px;border-radius:20px;font-weight:700}
.vdot{width:5px;height:5px;background:var(--gr);border-radius:50%;animation:blink 2s infinite}
.streak-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(251,146,60,0.1);border:1px solid rgba(251,146,60,0.25);color:var(--orange);font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;padding:4px 12px;border-radius:20px;font-weight:700}
.rank-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);color:var(--gold);font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;padding:4px 12px;border-radius:20px;font-weight:700}
.archetype-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:1.5px;border:1px solid}
.profile-username{font-family:var(--font-display);font-size:36px;font-weight:700;letter-spacing:1px;line-height:1;margin-bottom:6px;color:var(--tx)}
.profile-bio{font-size:14px;color:var(--mu);line-height:1.65;margin-bottom:8px;max-width:480px;font-family:var(--font-body)}
.profile-social{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.social-link{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-family:var(--font-mono);font-size:10px;font-weight:600;text-decoration:none;transition:all .18s;border:1px solid var(--bd)}
.social-link:hover{border-color:rgba(123,44,255,0.3);transform:translateY(-1px)}
.social-link-x{color:#94a3b8;background:rgba(148,163,184,.07)}

const API='https://ledgr-backend-production-c132.up.railway.app';
const username=new URLSearchParams(window.location.search).get('u')||'';
const sportIcon={'Soccer':'⚽','Basketball':'🏀','Tennis':'🎾','Football':'🏈','Baseball':'⚾','MMA/Boxing':'🥊'};
const confLabels={low:'🔴 Low',medium:'🟡 Medium',high:'🟢 High',max:'⚡ Max'};
let allPicks=[];
let currentFilter='all';

// ── COSMETICS ─────────────────────────────────────────────────────────────────
window.profileCustomization={avatarId:null,bannerId:null,borderId:null,themeId:null,effects:[],badges:[]};
(function(){
  try{var s=JSON.parse(localStorage.getItem('ledgr_profile_customization')||'{}');Object.assign(window.profileCustomization,s);}catch(e){}
})();

window.applyUserCosmetics=function(){
  var pc=window.profileCustomization;
  var bannerId=pc.bannerId||'midnight';
  var borderId=pc.borderId||'none';
  var themeId=pc.themeId||'#7B2CFF';

  document.documentElement.style.setProperty('--ac',themeId);
  document.documentElement.style.setProperty('--profile-accent',themeId);

  var hero=document.querySelector('.profile-banner');
  var av=document.querySelector('.div-av-wrap')||document.querySelector('.avatar-big')||document.querySelector('.div-av-inner');

  console.log('BANNER TARGET:',hero);
  console.log('BORDER TARGET:',av);
  if(hero&&av)console.log('BEFORE:',hero.className,av.className);

  if(hero){
    hero.style.background='';
    hero.className=hero.className.replace(/bp-\S+/g,'').trim();
    hero.classList.add('bp-'+bannerId);
  }

  if(av&&borderId!=='none'){
    av.className=av.className.replace(/ab-\S+/g,'').trim();
    av.classList.add('ab-'+borderId);
    av.style.overflow='visible';
  }

  void(hero&&hero.offsetWidth);
  void(av&&av.offsetWidth);

  if(hero&&av)console.log('AFTER:',hero.className,av.className);
  console.log('COSMETICS APPLIED:',window.profileCustomization);
};

window.renderProfileHero=function(){
  var hero=document.querySelector('.profile-banner');
  if(!hero)return;
  hero.classList.remove('profile-mounted');
  requestAnimationFrame(function(){hero.classList.add('profile-mounted');});
};

window.addEventListener('profileCustomizationUpdated',function(e){
  if(e.detail)Object.assign(window.profileCustomization,e.detail);
  window.applyUserCosmetics();
  window.renderProfileHero();
});

// Result state → display mapping. Add new states here when backend adds them.
const RESULT_UI={
  win:    {badge:'WIN',    badgeCls:'badge-win',    cardCls:'win-border',    tabCls:'win',     tabLabel:'✅ Won'},
  loss:   {badge:'LOSS',   badgeCls:'badge-loss',   cardCls:'loss-border',   tabCls:'loss',    tabLabel:'❌ Lost'},
  push:   {badge:'PUSH',   badgeCls:'badge-push',   cardCls:'push-border',   tabCls:'push',    tabLabel:'〰️ Push'},
  void:   {badge:'VOID',   badgeCls:'badge-void',   cardCls:'void-border',   tabCls:'void',    tabLabel:'🚫 Void'},
  pending:{badge:'PENDING',badgeCls:'badge-pending',cardCls:'pending-border',tabCls:'pending', tabLabel:'⏳ Pending'},

function getScore(picks){
  if(picks.length<3)return{score:0,desc:'Need more picks',color:'var(--mu)',needs:true,needsN:Math.max(0,3-picks.length)};
  const wins=picks.filter(p=>p.result==='win').length;
  const losses=picks.filter(p=>p.result==='loss').length;
  const stake=picks.reduce((s,p)=>s+p.stake,0);
  const pnl=picks.reduce((s,p)=>s+p.pnl,0);
  const roi=stake>0?(pnl/stake)*100:0;
  const wr=(wins+losses)>0?(wins/(wins+losses))*100:0;
  const score=Math.round(Math.min(40,Math.max(0,(roi/20)*40))+Math.min(30,Math.max(0,(wr/70)*30))+Math.min(20,Math.max(0,(picks.length/100)*20))+Math.min(10,picks.length));
  const color=score>=70?'var(--gr)':score>=40?'var(--gold)':'var(--rd)';
  const desc=score>=70?'Highly reliable':score>=50?'Moderately reliable':score>=30?'Building track record':'Early stage';
  return{score,desc,color,needs:false};
}

function getBadges(picks){
  const badges=[];
  const wins=picks.filter(p=>p.result==='win').length;
  const losses=picks.filter(p=>p.result==='loss').length;
  const stake=picks.reduce((s,p)=>s+p.stake,0);
  const pnl=picks.reduce((s,p)=>s+p.pnl,0);
  const roi=stake>0?(pnl/stake)*100:0;
  const wr=(wins+losses)>0?(wins/(wins+losses))*100:0;
  const avgOdds=picks.length>0?picks.reduce((s,p)=>s+p.odds,0)/picks.length:0;
  const sorted=[...picks].filter(p=>p.result==='win'||p.result==='loss').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  let streak=0;for(const p of sorted){if(p.result==='win')streak++;else break;}
  if(streak>=5)badges.push({icon:'🔥',name:'Hot Streak',cls:'fire'});
  if(roi>=20&&picks.length>=50)badges.push({icon:'💎',name:'Diamond',cls:'diamond'});

function getStreakStatus(picks){
  const settled=picks.filter(p=>p.result==='win'||p.result==='loss').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  let streak=0;const dir=settled[0].result;

}
function countUp(el,target,prefix='',suffix=''){
  if(!el||isNaN(parseFloat(target)))return;
  const num=parseFloat(target);const dur=800;const start=Date.now();
  const tick=()=>{const p=Math.min((Date.now()-start)/dur,1);const e=1-Math.pow(1-p,3);const val=num*e;el.textContent=prefix+(Number.isInteger(num)?Math.round(val):val.toFixed(1))+suffix;if(p<1)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}
function drawPnLChart(picks,containerId){
  const el=document.getElementById(containerId);
  if(!el||picks.length<2)return;
  const sorted=[...picks].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  let cum=0;const points=[0,...sorted.map(p=>{cum+=p.pnl;return cum;})];
  const min=Math.min(...points),max=Math.max(...points),range=max-min||1;
  const W=280,H=72;
  const pts=points.map((v,i)=>{const x=(i/(points.length-1||1))*W;const y=H-((v-min)/range)*(H-8)-4;return`${x},${y}`;}).join(' ');
  const isPos=points[points.length-1]>=0;
  const color=isPos?'#34d399':'#f87171';
  el.innerHTML=`<svg width="100%" height="72" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${H} ${pts} ${W},${H}" fill="url(#pg)"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function getELOFromPicks(picks){
  // Calculate ELO from pick history
  const BASE=0;const K=32;
  let elo=BASE;
  const settled=picks.filter(p=>p.result==='win'||p.result==='loss').sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  let streak=0;
  for(const p of settled){
    const impliedProb=Math.min(0.95,Math.max(0.05,(1/p.odds)*0.9));
    const actual=p.result==='win'?1:0;
    const streakBonus=p.result==='win'&&streak>=3?Math.min(streak-2,5)*2:0;
    const change=Math.round(K*(actual-impliedProb)+streakBonus);
    elo=Math.max(100,elo+change);
    if(p.result==='win')streak++;else streak=0;
  }
  return Math.round(elo);
}

  if(elo>=400)return{label:'Grandmaster',color:'var(--gold)'};

}

async function initSubscriptionUI(tipsterUserId){
  const loggedIn=JSON.parse(localStorage.getItem('ledgr_user')||localStorage.getItem('user')||'null');
  const token=localStorage.getItem('ledgr_token')||localStorage.getItem('token');
  const btn=document.getElementById('subBtn');
  const cntEl=document.getElementById('subscriberCount');

  // Load subscriber count (public)
  try{
    const r=await fetch(API+'/subscribers/'+tipsterUserId);
    const d=await r.json();
    if(cntEl&&d.count>0){
      cntEl.textContent='· '+d.count+(d.count===1?' subscriber':' subscribers');
      cntEl.style.display='block';
    }
    const ccSub=document.getElementById('ccSubscribers');
    if(ccSub&&d.count>0)countUp(ccSub,d.count);
  }catch(_){}

  // Hide subscribe button on own profile or if not logged in
  if(!loggedIn||!btn)return;
  if(loggedIn.id===tipsterUserId){btn.style.display='none';return;}

  // Check if already subscribed
  if(!token)return;
  try{
    const r=await fetch(API+'/subscriptions/'+loggedIn.id,{headers:{Authorization:'Bearer '+token}});
    const subs=await r.json();
    const active=Array.isArray(subs)&&subs.find(s=>s.tipsterId===tipsterUserId&&s.status==='active');
    if(active){
      btn.textContent='Subscribed ✓';
      btn.classList.add('subscribed');
      btn.dataset.subId=active.id;
    }
  }catch(_){}
}

function computeDNA(picks){
  if(!picks.length)return{discipline:50,risk:50,consistency:50,clutch:50,aggression:50};
  const settled=picks.filter(p=>p.result==='win'||p.result==='loss');
  const wins=settled.filter(p=>p.result==='win').length;
  const pnls=settled.map(p=>parseFloat(p.pnl)||0);
  const avgPnl=pnls.length?pnls.reduce((a,b)=>a+b,0)/pnls.length:0;
  const variance=pnls.length>1?pnls.reduce((s,v)=>s+Math.pow(v-avgPnl,2),0)/pnls.length:1;
  const avgOdds=picks.reduce((s,p)=>s+(parseFloat(p.odds)||1.5),0)/picks.length;
  const avgStake=picks.reduce((s,p)=>s+(parseFloat(p.stake)||1),0)/picks.length;
  const wr=settled.length>0?wins/settled.length:0;
  const expectedWR=picks.reduce((s,p)=>s+(1/Math.max(parseFloat(p.odds)||2,1.01)),0)/picks.length;
  const discipline=Math.min(100,Math.max(0,100-Math.min(100,(Math.sqrt(variance)/Math.max(avgStake,.1))*28)));
  const risk=Math.min(100,Math.max(0,((avgOdds-1.2)/4)*100));
  const consistency=Math.min(100,Math.max(0,50+(wr-expectedWR)*180));
  const highOdds=settled.filter(p=>parseFloat(p.odds)>=2.0);
  const clutch=highOdds.length>0?Math.min(100,Math.max(0,(highOdds.filter(p=>p.result==='win').length/highOdds.length)*130)):40;
  const stakes=picks.map(p=>parseFloat(p.stake)||1);
  const maxStake=Math.max(...stakes);
  const aggression=Math.min(100,Math.max(0,((maxStake/Math.max(avgStake,.1))-1)/3*100));
  return{discipline:Math.round(discipline),risk:Math.round(risk),consistency:Math.round(consistency),clutch:Math.round(clutch),aggression:Math.round(aggression)};
}

function getDNASummary(dna,arch){
  if(!dna)return'';
  if(dna.discipline>70&&dna.consistency>62)return arch?`Calculates like ${arch.name} — controlled and precise`:'Controlled. Consistent. Clinical.';
  if(dna.aggression>72)return'High conviction style — built for the big swing';
  if(dna.risk>70&&dna.clutch>55)return'Value hunter — thrives on underpriced markets';
  if(dna.consistency>70)return'Calibrated edge — every pick has a reason';
  if(dna.clutch>70)return'Performs when pressure is highest — clutch by nature';
  return arch?`Identity forming — building toward ${arch.name}`:'Building a verified edge, pick by pick';
}

function getSecondaryArchetype(picks,currentArch){
  if(!picks.length)return null;
  const settled=picks.filter(p=>p.result==='win'||p.result==='loss');
  const stake=picks.reduce((s,p)=>s+(p.stake||0),0);
  const pnl=picks.reduce((s,p)=>s+(p.pnl||0),0);
  const roi=stake>0?(pnl/stake)*100:0;
  const avgOdds=picks.length?picks.reduce((s,p)=>s+(p.odds||1.5),0)/picks.length:1.5;
  const ss=window.getSharpScore?window.getSharpScore(picks):0;
  const ck=currentArch?currentArch.key:'';
  const candidates=[
    {key:'sharp',score:Math.min(100,(ss/70)*60+(roi>10?30:roi>0?15:0)),icon:'📐',name:'The Sharp',color:'var(--cyan)'},
    {key:'grinder',score:Math.min(100,(picks.length/100)*50+(roi>0?30:0)),icon:'⚙️',name:'The Grinder',color:'var(--ac)'},
    {key:'value',score:Math.min(100,(avgOdds>=2.5&&avgOdds<=3.5?50:0)+(roi>0?30:0)),icon:'💎',name:'The Value Hunter',color:'var(--ac)'},
    {key:'underdog',score:Math.min(100,(avgOdds>3?50:0)+(roi>5?30:0)),icon:'🦁',name:'The Underdog Hunter',color:'var(--gold)'},
    {key:'sniper',score:Math.min(100,(picks.length<30?30:0)+(roi>20?50:roi>10?25:0)),icon:'🎯',name:'The Sniper',color:'var(--gr)'},
  ].filter(c=>c.key!==ck).sort((a,b)=>b.score-a.score);
  return candidates[0]&&candidates[0].score>15?candidates[0]:null;
}

function getArchetypeProgress(picks,arch){
  if(!picks||!picks.length||!arch)return{pct:0,label:'Post picks to begin'};
  const stake=picks.reduce((s,p)=>s+(p.stake||0),0);
  const pnl=picks.reduce((s,p)=>s+(p.pnl||0),0);
  const roi=stake>0?(pnl/stake)*100:0;
  const t={sniper:{picks:30,roi:20},sharp:{picks:50,roi:15},grinder:{picks:100,roi:5},value:{picks:40,roi:10},underdog:{picks:30,roi:8},demon:{picks:15,roi:15}}[arch.key]||{picks:50,roi:10};
  const pp=Math.min(1,picks.length/t.picks);
  const rp=t.roi>0?Math.min(1,Math.max(0,roi/t.roi)):0.8;
  const pct=Math.min(99,Math.round((pp*.6+rp*.4)*100));
  return{pct,label:pct>=90?'Identity fully solidified':pct>=65?'Solidifying identity':'Building toward evolution'};
}

      countUp(document.getElementById('svROI'),Math.abs(parseFloat(roi)),parseFloat(roi)>=0?'+':'−','%');

      const _pnlAbs=Math.abs(rankingMeta&&rankingMeta.totalPnl!=null?rankingMeta.totalPnl:pnl);
      countUp(document.getElementById('svPnL'),_pnlAbs,pnl>=0?'+':'−','u');

      // Trophy wall — add unlock date title attributes
      document.querySelectorAll('.trophy-item:not(.locked)').forEach(function(el){
        if(!el.title){el.title='Achievement earned';}
      });
    },80);

  }catch(e){
    clearTimeout(_xt);
    document.getElementById('mainContent').innerHTML='<div class="not-found"><h2>ERROR</h2><p style="color:var(--mu2)">Could not load profile.</p><a href="/leaderboard" class="back-btn">← Back to Leaderboard</a></div>';
  }
}

function showNotFound(){document.getElementById('mainContent').innerHTML='<div class="not-found"><h2>404</h2><p style="color:var(--mu2)">Tipster not found.</p><a href="/leaderboard" class="back-btn">← Back to Leaderboard</a></div>';}
function shareProfile(){
  const url=window.location.href;
  navigator.clipboard.writeText(url).then(()=>showToast('LINK COPIED! 📋')).catch(()=>{
    const d=document.createElement('input');d.value=url;document.body.appendChild(d);d.select();document.execCommand('copy');document.body.removeChild(d);showToast('LINK COPIED! 📋');
  });
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ── PICK INTERACTIONS ─────────────────────────────────────────
function _getUid(){try{const u=localStorage.getItem('ledgr_user')||localStorage.getItem('user');return u?JSON.parse(u).id:null;}catch(e){return null;}}
function _updateReactUI(pid,reactions,tails){
  const map={fire:'rf',rocket:'rr',diamond:'rd',clap:'rc'};
  Object.entries(map).forEach(([emoji,prefix])=>{
    const btn=document.getElementById(prefix+'_'+pid);if(!btn)return;
    const count=reactions[emoji]||0;
    const reacted=!!(reactions.userReactions&&reactions.userReactions.includes(emoji));
    btn.querySelector('.react-count').textContent=count||'';
    btn.classList.toggle('reacted',reacted);
    btn.style.display=(count>0||reacted)?'':'none';
  });
  const tb=document.getElementById('tf_'+pid);
  if(tb){tb.querySelector('.tail-count-react').textContent=tails.count?tails.count+'':'';tb.classList.toggle('tailed',!!tails.tailed);}
}
async function tipsterLoadInteractions(){
  const pids=[...new Set([...document.querySelectorAll('[data-pick]')].map(el=>el.dataset.pick))];
  if(!pids.length)return;
  const uid=_getUid();const uq=uid?'?userId='+uid:'';
  pids.slice(0,25).forEach(async pid=>{
    try{
      const[rr,tr]=await Promise.all([
        fetch(API+'/picks/'+pid+'/reactions'+uq).then(r=>r.json()).catch(()=>null),
        fetch(API+'/picks/'+pid+'/tails'+uq).then(r=>r.json()).catch(()=>null),
      ]);
      _updateReactUI(pid,rr,tr);
    }catch(e){}
  });
}
async function tipsterReact(pickId,emoji,btn,ev){
  if(ev)ev.stopPropagation();
  const uid=_getUid();if(!uid){showToast('Log in to react');return;}
  btn.disabled=true;
  try{
    const d=await fetch(API+'/picks/'+pickId+'/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,emoji})}).then(r=>r.json());
    const map={fire:'rf',rocket:'rr',diamond:'rd',clap:'rc'};
    ['fire','rocket','diamond','clap'].forEach(e=>{
      const b=document.getElementById(map[e]+'_'+pickId);if(!b)return;
      b.querySelector('.react-count').textContent=d[e]||'';
      b.classList.toggle('reacted',!!(d.userReactions&&d.userReactions.includes(e)));
    });
  }catch(e){showToast('Could not react');}
  btn.disabled=false;
}
async function tipsterTail(pickId,btn,ev){
  if(ev)ev.stopPropagation();
  const uid=_getUid();if(!uid){showToast('Log in to tail this pick');return;}
  btn.disabled=true;
  try{
    const d=await fetch(API+'/picks/'+pickId+'/tail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid})}).then(r=>r.json());
    btn.querySelector('.tail-count-react').textContent=d.count?d.count+'':'';
    btn.classList.toggle('tailed',d.tailed);
    if(d.tailed)showToast('Tailing this pick ✈️');
  }catch(e){showToast('Could not tail pick');}
  btn.disabled=false;
}

loadProfile();

function logout(){['ledgr_token','ledgr_user','token','user','username'].forEach(k=>localStorage.removeItem(k));window.location.href='/';}
function initTipTriggers(){
  let popup=document.getElementById('globalTipPopup');
  if(!popup){
    popup=document.createElement('div');
    popup.id='globalTipPopup';
    popup.className='tip-popup';
    document.body.appendChild(popup);
    // keep popup alive when mouse enters it
    popup.addEventListener('mouseenter',function(){clearTimeout(popup._hideTimer);});
    popup.addEventListener('mouseleave',function(){popup.style.display='none';});
  }
  document.querySelectorAll('.tip-trigger').forEach(function(el){
    if(el._tipInited)return;
    el._tipInited=true;
    el.addEventListener('mouseenter',function(e){
      clearTimeout(popup._hideTimer);
      popup.textContent=el.getAttribute('data-tip')||'';
      popup.style.display='block';
      var r=el.getBoundingClientRect();
      var pw=260,ph=popup.offsetHeight||80;
      var left=r.left+r.width/2-pw/2;
      left=Math.max(8,Math.min(left,window.innerWidth-pw-8));
      var top=r.top-ph-10;
      if(top<8)top=r.bottom+10;
      popup.style.left=left+'px';
      popup.style.top=top+'px';
    });
    el.addEventListener('mouseleave',function(){
      popup._hideTimer=setTimeout(function(){popup.style.display='none';},150);
    });
    el.addEventListener('click',function(e){
      e.stopPropagation();
      if(popup.style.display==='block'){popup.style.display='none';}
      else{el.dispatchEvent(new MouseEvent('mouseenter'));}
    });
  });
  document.addEventListener('click',function(){popup.style.display='none';},{passive:true});
}
