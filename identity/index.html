<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/logo/ledgr-icon.png">
<title>LEDGR — Identity Forge</title>
<meta name="description" content="Choose your skin. Define your identity.">
<meta property="og:title" content="LEDGR — Identity Forge">
<meta property="og:image" content="https://getledgr.bet/assets/logo/ledgr-logo.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>
:root{--ac:#7B2CFF;--tx:#E6E6E6;--mu:#6B6B6B;--skin-color:#7B2CFF}
html{scroll-behavior:smooth}
body{background:#0A0A0A;color:#E6E6E6;font-family:'Syne',sans-serif;margin:0;padding:0;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#7B2CFF04 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0}

.if-dev-ind{
  position:fixed;top:68px;right:12px;z-index:99;
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;
  color:#FFD700;opacity:0.55;pointer-events:none;
}

.if-layout{
  display:flex;gap:24px;
  max-width:1200px;margin:0 auto;
  padding:0 24px 60px;
  min-height:calc(100vh - 120px);
  position:relative;z-index:1;
}

/* ══ LEFT STAGE ══ */
.if-stage{
  width:45%;flex-shrink:0;
  position:sticky;top:80px;
  height:calc(100vh - 100px);max-height:640px;
  border-radius:20px;
  background:linear-gradient(180deg,#06060f,#030308);
  border:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  padding:16px;overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,0.8);
}

.if-level-strip{
  width:100%;display:flex;align-items:center;
  gap:10px;margin-bottom:8px;flex-shrink:0;
}

.if-char-area{
  position:relative;flex:1;width:100%;
  display:flex;align-items:center;justify-content:center;
  min-height:0;
}
.if-char-bg{
  position:absolute;inset:0;border-radius:12px;
  transition:background 0.6s ease;
}
.if-char-aura{
  position:absolute;inset:0;border-radius:12px;
  pointer-events:none;z-index:1;
  opacity:0;transition:opacity 0.5s ease;
  overflow:hidden;
}

.if-char-display{
  position:relative;z-index:3;
  width:200px;height:280px;
  display:flex;align-items:center;justify-content:center;
  animation:charFloat 5s ease-in-out infinite;
  filter:drop-shadow(0 0 30px var(--skin-color,#7B2CFF));
  cursor:default;
  transition:filter 0.4s,opacity 0.2s ease,transform 0.2s ease;
  user-select:none;
}
@keyframes charFloat{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-12px) scale(1.02);}
}
.if-char-floor{
  position:absolute;bottom:20px;left:50%;
  transform:translateX(-50%);
  width:100px;height:12px;border-radius:50%;
  background:var(--skin-color,rgba(123,44,255,0.3));
  filter:blur(8px);opacity:0.4;
  animation:floorPulse 5s ease-in-out infinite;
  pointer-events:none;z-index:2;
  transition:background 0.5s ease;
}
@keyframes floorPulse{
  0%,100%{width:100px;opacity:0.3;}
  50%{width:70px;opacity:0.15;}
}
.if-char-particles{
  position:absolute;inset:0;pointer-events:none;z-index:4;
}
.if-acc-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:5;
}
@keyframes particleFloat{
  0%{opacity:0;transform:translateY(0) scale(0.5);}
  20%{opacity:0.7;}
  70%{opacity:0.3;}
  100%{opacity:0;transform:translateY(-50px) scale(0.2);}
}

.if-nameplate{
  width:100%;text-align:center;
  padding:12px;flex-shrink:0;
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.05);
  border-radius:10px;margin-top:8px;
}
.if-np-name{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--tx);letter-spacing:0.08em;}
.if-np-skin{font-family:'DM Mono',monospace;font-size:10px;color:var(--skin-color,var(--ac));letter-spacing:0.15em;margin-top:2px;transition:color 0.4s;}
.if-np-rarity{font-size:9px;letter-spacing:0.12em;color:var(--mu);font-family:'DM Mono',monospace;margin-top:3px;}

/* ══ RIGHT OPTIONS ══ */
.if-options{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0;}
.if-header{padding-top:4px;}
.if-header-eyebrow{font-size:9px;letter-spacing:0.25em;color:var(--ac);font-family:'DM Mono',monospace;margin-bottom:4px;}
.if-header-title{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--tx);letter-spacing:0.03em;line-height:1;}

.if-tabs{display:flex;gap:4px;background:rgba(255,255,255,0.03);border-radius:10px;padding:4px;flex-shrink:0;}
.if-tab{
  flex:1;padding:10px;border:none;
  background:transparent;color:var(--mu);
  font-family:'Bebas Neue',sans-serif;font-size:14px;
  letter-spacing:0.1em;border-radius:8px;
  cursor:pointer;transition:all 0.15s;
}
.if-tab.active{background:rgba(123,44,255,0.2);color:var(--ac);border:1px solid rgba(123,44,255,0.3);}
.if-tab-content{
  flex:1;min-height:0;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(184,159,255,0.15) transparent;
}
.if-tab-content::-webkit-scrollbar{width:3px}
.if-tab-content::-webkit-scrollbar-thumb{background:rgba(184,159,255,0.15);border-radius:2px}
.if-tab-content.hidden{display:none}

/* SKIN GRID */
.if-skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}

.skin-card{
  position:relative;overflow:hidden;
  border-radius:14px;cursor:pointer;
  aspect-ratio:3/4;
  border:1px solid rgba(255,255,255,0.06);
  transition:transform 0.2s ease,box-shadow 0.2s ease,border-color 0.2s ease;
  user-select:none;
}
.skin-card:hover{
  transform:translateY(-5px) scale(1.02);
  box-shadow:0 16px 40px rgba(0,0,0,0.55),0 0 22px color-mix(in srgb,var(--skin-c,var(--ac)) 28%,transparent);
}
.skin-card.selected{
  border-color:var(--skin-c,var(--ac)) !important;
  box-shadow:0 0 26px color-mix(in srgb,var(--skin-c,var(--ac)) 35%,transparent),
             0 0 6px color-mix(in srgb,var(--skin-c,var(--ac)) 50%,transparent) !important;
}
.skin-card-bg{position:absolute;inset:0;transition:opacity 0.3s;}
.skin-card-art{
  position:absolute;bottom:54px;left:50%;
  transform:translateX(-50%);
  z-index:3;pointer-events:none;
  animation:skinIdle 4.5s ease-in-out infinite;
}
.skin-card-footer{
  position:absolute;bottom:0;left:0;right:0;
  padding:10px 8px 10px;z-index:4;
  background:linear-gradient(to top,rgba(0,0,0,0.96) 0%,rgba(0,0,0,0.72) 55%,transparent 100%);
}
.skin-card-name{
  font-family:'Bebas Neue',sans-serif;font-size:13px;
  color:var(--tx);letter-spacing:0.05em;margin-bottom:2px;
}
.skin-card-desc{
  font-size:8px;color:rgba(255,255,255,0.28);
  font-family:'Syne',sans-serif;line-height:1.3;
}
.skin-card-tier{
  position:absolute;top:8px;left:8px;z-index:5;
  font-size:7px;letter-spacing:0.15em;
  font-family:'DM Mono',monospace;
  border:1px solid;border-radius:20px;padding:2px 6px;
}
.skin-card-check{
  position:absolute;top:8px;right:8px;z-index:5;
  font-size:13px;font-weight:bold;
}
/* Tier border treatments */
.skin-card.sk-legendary{border-color:rgba(255,215,0,0.28) !important;}
.skin-card.sk-legendary.selected{
  box-shadow:0 0 30px rgba(255,215,0,0.38),0 0 8px rgba(255,215,0,0.55) !important;
}
.skin-card.sk-mythic{border-color:rgba(255,107,255,0.28) !important;}
.skin-card.sk-mythic.selected{
  box-shadow:0 0 30px rgba(255,107,255,0.38),0 0 8px rgba(255,107,255,0.55) !important;
}
/* Shimmer sweep on legendary + mythic */
.skin-card.sk-legendary::after,.skin-card.sk-mythic::after{
  content:'';position:absolute;inset:0;z-index:6;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,0.07) 50%,transparent 65%);
  background-size:200% 100%;
  animation:skinShimmer 4s linear infinite;
}
.skin-card.sk-mythic::after{animation-duration:2.5s;}
@keyframes skinShimmer{
  from{background-position:200% 0;}
  to{background-position:-200% 0;}
}
@keyframes skinIdle{
  0%,100%{transform:translateX(-50%) translateY(0) scale(1);}
  50%{transform:translateX(-50%) translateY(-6px) scale(1.04);}
}

/* AURA GRID */
.if-aura-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.aura-card{
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:14px;padding:16px 12px;
  text-align:center;cursor:pointer;
  transition:all 0.2s ease;position:relative;
}
.aura-card:hover{transform:translateY(-3px);}
.aura-card.selected{
  border-color:var(--skin-c,var(--ac)) !important;
  background:color-mix(in srgb,var(--skin-c,var(--ac)) 8%,transparent);
}
@keyframes auraOrbSpin{
  from{filter:hue-rotate(0deg);}
  to{filter:hue-rotate(360deg);}
}

/* ACCESSORIES */
.acc-section{margin-bottom:16px;}
.acc-section-title{
  font-size:9px;letter-spacing:0.2em;
  color:var(--mu);font-family:'DM Mono',monospace;
  margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.acc-section-title::after{
  content:'';flex:1;height:1px;
  background:rgba(255,255,255,0.06);
}
.acc-grid{display:flex;flex-wrap:wrap;gap:8px;}
.acc-card{
  display:flex;flex-direction:column;
  align-items:center;gap:4px;
  padding:10px 8px;
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;cursor:pointer;
  min-width:72px;transition:all 0.15s;
}
.acc-card:hover{border-color:var(--ac);transform:translateY(-2px);}
.acc-card.selected{border-color:var(--ac);background:rgba(123,44,255,0.1);}
.acc-icon{display:flex;align-items:center;justify-content:center;width:48px;height:48px;}
.acc-name{font-size:9px;color:var(--mu);font-family:'DM Mono',monospace;text-align:center;}
.acc-tier{font-size:7px;letter-spacing:0.1em;font-family:'DM Mono',monospace;}

/* SAVE BAR */
.if-save-bar{padding-top:16px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.if-save-btn{
  width:100%;padding:16px;
  background:var(--ac);color:#0A0A0A;
  border:none;border-radius:12px;
  font-family:'Bebas Neue',sans-serif;font-size:20px;
  letter-spacing:0.1em;cursor:pointer;
  transition:all 0.2s;
}
.if-save-btn:hover{filter:brightness(1.15);box-shadow:0 0 24px rgba(123,44,255,0.4);transform:translateY(-1px);}

/* RESPONSIVE */
@media(max-width:900px){
  .if-skin-grid,.if-aura-grid{grid-template-columns:repeat(2,1fr);}
  .if-layout{flex-direction:column;padding:0 16px 60px;}
  .if-stage{width:100%;position:relative;top:auto;height:400px;max-height:400px;}
  .if-char-display{width:140px;height:196px;}
}
@media(max-width:480px){
  .if-skin-grid,.if-aura-grid{grid-template-columns:repeat(2,1fr);}
  .if-header-title{font-size:28px;}
}
</style>
</head>

      <div class="if-char-floor" id="ifCharFloor"></div>
      <div class="if-char-particles" id="ifCharParticles"></div>
      <div class="if-acc-overlay" id="ifAccOverlay"></div>
    </div>

    <div class="if-nameplate">
      <div class="if-np-name" id="ifNpName"></div>

  </div>

  <div class="if-options">

    <div class="if-header">

      <div class="if-header-title">IDENTITY FORGE</div>
    </div>

    <div class="if-tabs">
      <button class="if-tab active" data-tab="skins">✦ SKINS</button>
      <button class="if-tab" data-tab="aura">◎ AURA</button>
      <button class="if-tab" data-tab="accessories">💎 ACCESSORIES</button>

    <div class="if-tab-content" id="tab-skins">
      <div class="if-skin-grid" id="skinGrid"></div>
    </div>

    <div class="if-tab-content hidden" id="tab-aura">
      <div class="if-aura-grid" id="auraGrid"></div>

    <div class="if-tab-content hidden" id="tab-accessories">

        <div class="acc-section-title">JEWELRY</div>
        <div class="acc-grid" id="accJewelGrid"></div>

      <div class="acc-section">
        <div class="acc-section-title">BACK / WINGS</div>
        <div class="acc-grid" id="accBackGrid"></div>
      </div>
    </div>

    <div class="if-save-bar">
      <button class="if-save-btn" id="ifSaveBtn" onclick="saveIdentity()">SAVE IDENTITY →</button>
    </div>

  </div>
</div>

<div id="identityToast"></div>
</div>

function getTierColor(tier){
  return {COMMON:'#6B6B6B',RARE:'#4FC3F7',EPIC:'#7B2CFF',LEGENDARY:'#FFD700',MYTHIC:'#FF6BFF'}[tier]||'#6B6B6B';
}

// ══════════════════════════════════════════════════════════════
// LEVEL STRIP
// ══════════════════════════════════════════════════════════════

function renderLevelStrip(){
  var ud={};try{ud=JSON.parse(localStorage.getItem('ledgr_user')||'{}');}catch(e){}
  var picks=parseInt(ud.picks||0);
  var level=Math.max(1,Math.floor(picks/3)+1);
  var xp=Math.round(((picks%3)/3)*100);
  var el=document.getElementById('ifLevelStrip');
  if(!el)return;
  el.innerHTML=
    '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:22px;color:var(--ac);min-width:44px;line-height:1.1;text-align:center;">LVL<br>'+level+'</div>'+
    '<div style="flex:1;">'+
      '<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--mu);font-family:\'DM Mono\',monospace;margin-bottom:4px;">'+
        '<span>IDENTITY XP</span><span>'+xp+'%</span>'+
      '</div>'+
      '<div style="height:3px;background:#111;border-radius:2px;overflow:hidden;">'+
        '<div id="ifXpFill" style="height:100%;width:0%;background:linear-gradient(90deg,var(--ac),#00E5A0);border-radius:2px;transition:width 1s ease;"></div>'+
      '</div>'+
    '</div>';
  setTimeout(function(){var f=document.getElementById('ifXpFill');if(f)f.style.width=xp+'%';},150);
}

// ══════════════════════════════════════════════════════════════
// PARTICLES
// ══════════════════════════════════════════════════════════════

function startParticles(type,color){
  var container=document.getElementById('ifCharParticles');
  if(!container)return;
  container.innerHTML='';
  var palettes={
    sparks:   [color,'#C090FF','#ffffff'],
    skulls:   ['#FF3355','#FF6688','#AA0022'],
    embers:   ['#FF8C00','#FF5500','#FFD700'],
    stars:    ['#FFD700','#FFFFFF','#FFE066'],
    snow:     ['#A0E8FF','#E8FFFF','#4FC3F7'],
    fire:     ['#FF3355','#FF8C00','#FFD700'],
    glitch:   ['#FF6BFF','#00E5FF','#7B2CFF'],
    void:     ['#8B00FF','#7B2CFF','#C090FF'],
    crystals: ['#00E5FF','#A0F0FF','#FFFFFF'],
    crosshair:['#00E5A0','#4FC3F7','#FFFFFF'],
  };
  var shapes={
    sparks:'circle',skulls:'diamond',embers:'circle',
    stars:'diamond',snow:'ring',fire:'circle',
    glitch:'square',void:'ring',crystals:'diamond',crosshair:'ring'
  };
  var colors=palettes[type]||[color,'#ffffff'];
  var shape=shapes[type]||'circle';
  for(var i=0;i<9;i++){
    (function(idx){
      var c=colors[idx%colors.length];
      var sz=parseFloat((3+Math.random()*5).toFixed(0));
      var dur=(3+Math.random()*4).toFixed(1);
      var delay=(Math.random()*4).toFixed(1);
      var left=Math.round(8+Math.random()*82);
      var top=Math.round(10+Math.random()*68);
      var shapeCSS='';
      if(shape==='circle') shapeCSS='border-radius:50%;background:'+c+';';
      else if(shape==='ring') shapeCSS='border-radius:50%;border:1.5px solid '+c+';background:transparent;';
      else if(shape==='diamond') shapeCSS='background:'+c+';transform:rotate(45deg);';
      else shapeCSS='background:'+c+';border-radius:2px;';
      var p=document.createElement('div');
      p.style.cssText=
        'position:absolute;width:'+sz+'px;height:'+sz+'px;'+
        shapeCSS+
        'left:'+left+'%;top:'+top+'%;'+
        'opacity:0;pointer-events:none;'+
        'box-shadow:0 0 7px '+c+';'+
        'animation:particleFloat '+dur+'s ease-in-out '+delay+'s infinite;';
      container.appendChild(p);
    })(i);
  }
}

// SKIN RENDERING
// ══════════════════════════════════════════════════════════════

function renderSkinCard(skin,isSelected){
  var tc=getTierColor(skin.tier);
  var delay=(Math.random()*2.5).toFixed(1)+'s';
  return '<div class="skin-card sk-'+skin.tier.toLowerCase()+
    (isSelected?' selected':'')+'" '+
    'data-skin="'+skin.id+'" '+
    'style="--skin-c:'+skin.color+';" '+
    'onclick="selectSkin(\''+skin.id+'\')">' +

    '<div class="skin-card-bg" style="background:'+skin.bg+'"></div>'+

    '<div class="skin-card-tier" style="color:'+tc+';border-color:'+tc+'44;background:'+tc+'11;">'+skin.tier+'</div>'+

    '<div class="skin-card-art" style="filter:drop-shadow(0 0 14px '+skin.color+');animation-delay:'+delay+';">'+
    getSkinSVG(skin.id,'small')+'</div>'+

    '<div class="skin-card-footer">'+
      '<div class="skin-card-name">'+skin.name+'</div>'+
      '<div class="skin-card-desc">'+skin.desc+'</div>'+
    '</div>'+

    (isSelected?'<div class="skin-card-check" style="color:'+skin.color+';">✓</div>':'')+

  '</div>';
}

function renderSkins(){
  var g=document.getElementById('skinGrid');
  if(!g)return;
  var saved=localStorage.getItem('ledgr_identity_skin')||'reaper';
  g.innerHTML=SKINS.map(function(skin){
    return renderSkinCard(skin,saved===skin.id);
  }).join('');
}

function renderAuras(){
  var g=document.getElementById('auraGrid');
  if(!g)return;
  var saved=localStorage.getItem('ledgr_identity_aura')||'void-energy';
  g.innerHTML=AURAS.map(function(a){
    var isSelected=saved===a.id;
    var mini=AURA_MINI[a.id]||'';
    var previewStyle=a.css==='none'
      ? 'border:1px dashed rgba(255,255,255,0.12);background:transparent;'
      : 'background:radial-gradient(circle,'+a.color+'22 0%,transparent 70%);'+
        'box-shadow:0 0 16px '+a.css+';';
    return '<div class="aura-card'+(isSelected?' selected':'')+'" '+
      'data-aura="'+a.id+'" '+
      'style="--skin-c:'+a.color+';" '+
      'onclick="selectAura(\''+a.id+'\')">' +
      '<div style="width:64px;height:64px;border-radius:10px;margin:0 auto 10px;overflow:hidden;position:relative;'+previewStyle+'">'+mini+'</div>'+
      '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:13px;color:var(--tx);letter-spacing:0.05em;margin-bottom:3px;">'+a.name+'</div>'+
      '<div data-aura-lbl style="font-size:9px;color:'+(isSelected?a.color:'rgba(255,255,255,0.15)')+';font-family:\'DM Mono\',monospace;">'+(isSelected?'ACTIVE':'UNLOCKED')+'</div>'+
    '</div>';
  }).join('');
}

// ══════════════════════════════════════════════════════════════
// ACCESSORIES RENDERING
// ══════════════════════════════════════════════════════════════

function renderAccessories(){
  ['head','jewelry','back'].forEach(function(cat){
    var gridId='acc'+(cat.charAt(0).toUpperCase()+cat.slice(1))+'Grid';
    var g=document.getElementById(gridId);
    if(!g)return;
    var saved=localStorage.getItem('ledgr_acc_'+cat)||'none';
    g.innerHTML=ACCESSORIES[cat].map(function(a){
      var isSelected=saved===a.id;
      var tc=getTierColor(a.tier);
      return '<div class="acc-card'+(isSelected?' selected':'')+'" '+
        'data-acc-cat="'+cat+'" data-acc="'+a.id+'" '+
        'style="--acc-c:'+a.color+';" '+
        'onclick="selectAccessory(\''+cat+'\',\''+a.id+'\')" '+
        'title="'+a.name+'">' +
        '<div class="acc-icon" style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;">'+a.svg+'</div>'+
        '<div class="acc-name">'+a.name+'</div>'+
        '<div class="acc-tier" style="color:'+tc+'">'+a.tier+'</div>'+
      '</div>';
    }).join('');
  });
}

// ══════════════════════════════════════════════════════════════
// SELECTION LOGIC
// ══════════════════════════════════════════════════════════════

function selectSkin(skinId){
  var skin=SKINS.find(function(s){return s.id===skinId;});
  if(!skin)return;
  currentSkin=skin;

  document.querySelectorAll('.skin-card').forEach(function(c){
    c.classList.toggle('selected',c.getAttribute('data-skin')===skinId);
    var check=c.querySelector('[data-chk]');
    if(check)check.remove();
    if(c.getAttribute('data-skin')===skinId){
      var chk=document.createElement('div');
      chk.setAttribute('data-chk','1');
      chk.style.cssText='position:absolute;top:8px;right:8px;font-size:12px;color:'+skin.color+';';
      chk.textContent='✓';
      c.appendChild(chk);
    }
  });

  var stage=document.getElementById('ifStage');
  if(stage){
    var flash=document.createElement('div');
    flash.style.cssText='position:absolute;inset:0;z-index:20;background:'+skin.color+';opacity:0;border-radius:inherit;pointer-events:none;transition:opacity 0.1s;';
    stage.appendChild(flash);
    requestAnimationFrame(function(){
      flash.style.opacity='0.18';
      setTimeout(function(){flash.style.opacity='0';setTimeout(function(){flash.remove();},200);},80);
    });
  }

  var charEl=document.getElementById('ifCharDisplay');
  if(charEl){
    charEl.style.opacity='0';
    charEl.style.transform='translateY(10px) scale(0.85)';
    setTimeout(function(){
      charEl.innerHTML=getSkinSVG(skin.id,'large');
      charEl.style.opacity='1';
      charEl.style.transform='';
    },200);
  }

  var bgEl=document.getElementById('ifCharBg');
  if(bgEl)bgEl.style.background=skin.bg;

  var floor=document.getElementById('ifCharFloor');
  if(floor)floor.style.background=skin.color;

  document.documentElement.style.setProperty('--skin-color',skin.color);

  var npSkin=document.getElementById('ifNpSkin');
  var npRarity=document.getElementById('ifNpRarity');
  if(npSkin){npSkin.textContent=skin.name.toUpperCase();npSkin.style.color=skin.color;}
  if(npRarity)npRarity.textContent=skin.tier+' · '+skin.desc;

  startParticles(skin.particles,skin.color);
  localStorage.setItem('ledgr_identity_skin',skinId);
}

function renderAccOverlay(){
  var overlay=document.getElementById('ifAccOverlay');
  if(!overlay)return;
  function findAcc(cat,id){
    var found=null;
    (ACCESSORIES[cat]||[]).forEach(function(a){if(a.id===id)found=a;});
    return found;
  }
  var headId=localStorage.getItem('ledgr_acc_head')||'none';
  var jewelId=localStorage.getItem('ledgr_acc_jewelry')||'none';
  var backId=localStorage.getItem('ledgr_acc_back')||'none';
  var headAcc=findAcc('head',headId);
  var jewelAcc=findAcc('jewelry',jewelId);
  var backAcc=findAcc('back',backId);
  var html='';
  if(backAcc&&backAcc.id!=='none'&&backAcc.stage){
    html+=backAcc.stage;
  }
  if(headAcc&&headAcc.id!=='none'&&headAcc.stage){
    html+=headAcc.stage;
  }
  if(jewelAcc&&jewelAcc.id!=='none'&&jewelAcc.stage){
    html+=jewelAcc.stage;
  }
  overlay.innerHTML=html;
}

function selectAura(auraId){
  localStorage.setItem('ledgr_identity_aura',auraId);
  document.querySelectorAll('.aura-card').forEach(function(c){
    var isActive=c.getAttribute('data-aura')===auraId;
    c.classList.toggle('selected',isActive);
    var lbl=c.querySelector('[data-aura-lbl]');
    if(lbl){
      var aura=AURAS.find(function(a){return a.id===c.getAttribute('data-aura');});
      lbl.style.color=isActive?(aura?aura.color:'#7B2CFF'):'rgba(255,255,255,0.15)';
      lbl.textContent=isActive?'ACTIVE':'UNLOCKED';
    }
  });
  var auraEl=document.getElementById('ifCharAura');
  if(!auraEl)return;
  if(auraId==='none'){
    auraEl.innerHTML='';
    auraEl.style.opacity='0';
    return;
  }
  var render=AURA_SVG[auraId];
  auraEl.innerHTML=render?render():'';
  auraEl.style.opacity='1';
  showToast('✓ '+auraId.replace(/-/g,' ').toUpperCase()+' AURA');
}

function selectAccessory(cat,id){
  localStorage.setItem('ledgr_acc_'+cat,id);
  document.querySelectorAll('[data-acc-cat="'+cat+'"]').forEach(function(c){
    c.classList.toggle('selected',c.getAttribute('data-acc')===id);
  });
  var found=null;
  ACCESSORIES[cat].forEach(function(a){if(a.id===id)found=a;});
  if(found&&found.id!=='none')showToast('✓ Equipped: '+found.name);
  renderAccOverlay();
}

// ══════════════════════════════════════════════════════════════
// SAVE
// ══════════════════════════════════════════════════════════════

function saveIdentity(){
  var config={
    skin:  localStorage.getItem('ledgr_identity_skin')  ||'reaper',
    aura:  localStorage.getItem('ledgr_identity_aura')  ||'void-energy',
    accessories:{
      head:    localStorage.getItem('ledgr_acc_head')   ||'none',
      jewelry: localStorage.getItem('ledgr_acc_jewelry')||'none',
      back:    localStorage.getItem('ledgr_acc_back')   ||'none'
    }
  };
  localStorage.setItem('ledgr_identity',JSON.stringify(config));

  var token=localStorage.getItem('ledgr_token');
  if(token){
    fetch(API+'/profile',{
      method:'PATCH',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({identityConfig:config})
    }).then(function(r){showToast(r.ok?'✓ Identity saved':'✓ Saved locally');})
      .catch(function(){showToast('✓ Saved locally');});
  } else {
    showToast('✓ Saved locally');
  }

  var btn=document.getElementById('ifSaveBtn');
  if(btn){
    btn.textContent='✓ IDENTITY SAVED';
    btn.style.background='#00E5A0';
    btn.style.color='#0A0A0A';
    setTimeout(function(){
      btn.textContent='SAVE IDENTITY →';
      btn.style.background='';
      btn.style.color='';
    },2000);
  }
}

// ══════════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════════

function showToast(msg){
  var t=document.getElementById('identityToast');
  if(!t)return;
  t.textContent=msg;
  t.style.cssText=
    'position:fixed;bottom:24px;left:50%;'+
    'transform:translateX(-50%) translateY(0);'+
    'background:#1E1E1E;border:1px solid var(--ac);'+
    'border-radius:8px;padding:10px 20px;'+
    'font-family:\'Syne\',sans-serif;font-size:13px;'+
    'color:var(--ac);z-index:9999;'+
    'transition:opacity 0.3s ease,transform 0.3s ease;pointer-events:none;opacity:1;';
  clearTimeout(t._t);
  t._t=setTimeout(function(){
    t.style.opacity='0';
    t.style.transform='translateX(-50%) translateY(20px)';
  },2200);
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════

window.onload=function(){
  var ud=localStorage.getItem('ledgr_user')||localStorage.getItem('user');
  var tk=localStorage.getItem('ledgr_token')||localStorage.getItem('token');
  if(!ud||!tk){window.location.replace('/login');return;}
  var user;
  try{user=JSON.parse(ud);}catch(e){window.location.replace('/login');return;}
  if(!user||!user.username){window.location.replace('/login');return;}

  document.getElementById('app').style.display='block';

  var npName=document.getElementById('ifNpName');
  if(npName)npName.textContent='@'+user.username;

  renderLevelStrip();
  renderSkins();
  renderAuras();
  renderAccessories();

  var savedSkin=localStorage.getItem('ledgr_identity_skin')||'reaper';
  var savedAura=localStorage.getItem('ledgr_identity_aura')||'void-energy';

  selectSkin(savedSkin);
  if(!currentSkin)selectSkin('reaper');
  selectAura(savedAura);
  renderAccOverlay();

  document.querySelectorAll('.if-tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      var target=this.getAttribute('data-tab');
      document.querySelectorAll('.if-tab').forEach(function(t){t.classList.toggle('active',t===tab);});
      document.querySelectorAll('.if-tab-content').forEach(function(c){c.classList.toggle('hidden',c.id!=='tab-'+target);});
    });
  });

  fetch(API+'/profile/'+user.username,{headers:{Authorization:'Bearer '+tk}})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(data){
      if(!data)return;
      if(data.picks!==undefined){
        try{var u=JSON.parse(localStorage.getItem('ledgr_user')||'{}');u.picks=data.picks;localStorage.setItem('ledgr_user',JSON.stringify(u));renderLevelStrip();}catch(e){}
      }
      if(data.identityConfig){
        var cfg=data.identityConfig;
        if(cfg.skin){localStorage.setItem('ledgr_identity_skin',cfg.skin);selectSkin(cfg.skin);renderSkins();}
        if(cfg.aura){localStorage.setItem('ledgr_identity_aura',cfg.aura);selectAura(cfg.aura);renderAuras();}
        if(cfg.accessories){
          ['head','jewelry','back'].forEach(function(cat){
            if(cfg.accessories[cat]){
              localStorage.setItem('ledgr_acc_'+cat,cfg.accessories[cat]);
            }
          });
          renderAccessories();
          renderAccOverlay();
        }
      }
    }).catch(function(){});
};
