<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/logo/ledgr-icon.png">
<meta property="og:image" content="https://getledgr.bet/assets/logo/ledgr-logo.png">
<title>LEDGR — Sports Intel</title>
<meta name="description" content="Live sports news, injury tracker, lineup reports and trending topics for sharp bettors.">
<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>
body{display:flex;flex-direction:column;min-height:100vh}
.cs-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center}
.cs-eye{font-family:var(--font-mono);font-size:9px;letter-spacing:4px;color:var(--mu);text-transform:uppercase;margin-bottom:24px}
.cs-title{font-family:var(--font-display);font-size:clamp(28px,4vw,48px);letter-spacing:4px;line-height:.9;margin-bottom:20px}
.cs-sub{font-family:var(--font-mono);font-size:11px;color:var(--mu);letter-spacing:1px;line-height:1.7;max-width:320px;margin:0 auto 32px}
.cs-back{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:var(--ac);text-decoration:none;border:1px solid rgba(184,159,255,.2);border-radius:8px;padding:10px 18px;transition:border-color .2s}
.cs-back:hover{border-color:var(--ac)}
</style>
</head>
<body>
<script src="/app-nav.js"></script>
<script>AppNav.init({ active: 'news' });</script>

<div class="cs-wrap">
  <div class="cs-eye">LEDGR · SPORTS INTEL</div>
  <div class="cs-title">COMING<br>SOON</div>
  <div class="cs-sub">Live news, injury updates, and market intelligence are in development. Check back soon.</div>
  <a href="/feed" class="cs-back">← Back to Feed</a>
</div>
</body>
</html>
