<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Sports Intel</title>
<meta name="description" content="Live sports news, injury tracker, lineup reports and trending topics for sharp bettors.">

<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>
:root{--c-soccer:#34d399;--c-basketball:#f87171;--c-football:#38bdf8;--c-tennis:#fbbf24;--c-mma:#fb923c;--c-general:#b89fff}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");pointer-events:none;z-index:1;opacity:.35}

/* ── MAIN ── */
.main{max-width:1160px;margin:0 auto;padding:32px 24px 80px;position:relative;z-index:2}

/* ── HERO ── */
.intel-hero{padding:40px 0 32px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--bd);margin-bottom:24px}
.ih-left{}
.ih-eyebrow{font-family:var(--font-mono);font-size:9px;color:var(--mu);letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ih-live-dot{width:6px;height:6px;border-radius:50%;background:var(--gr);animation:live-pulse 1.6s ease-in-out infinite}
@keyframes live-pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,.4)}50%{opacity:.7;box-shadow:0 0 0 5px rgba(52,211,153,0)}}
.ih-title{font-family:var(--font-display);font-size:clamp(26px,3vw,34px);letter-spacing:4px;line-height:.9;
  background:linear-gradient(180deg,#f0edff 0%,var(--gr) 130%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ih-sub{font-family:var(--font-mono);font-size:10px;color:var(--mu);letter-spacing:3px;text-transform:uppercase;margin-top:10px}
.ih-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ih-updated{font-family:var(--font-mono);font-size:10px;color:var(--mu);letter-spacing:1px}
.ih-refresh-btn{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);border-radius:8px;padding:8px 14px;font-family:var(--font-mono);font-size:10px;color:var(--gr);cursor:pointer;transition:all .2s;letter-spacing:1px}
.ih-refresh-btn:hover{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.4)}
.ih-countdown{font-family:var(--font-mono);font-size:9px;color:var(--mu);background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:5px 10px}

/* ── SPORT TABS ── */
.sport-tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.sport-tabs::-webkit-scrollbar{display:none}
.st-tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--mu2);font-family:var(--font-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:10px 18px;cursor:pointer;transition:all .2s;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.st-tab:hover{color:var(--tx)}
.st-tab.active[data-sport="all"]{color:var(--ac);border-bottom-color:var(--ac)}
.st-tab.active[data-sport="soccer"]{color:var(--c-soccer);border-bottom-color:var(--c-soccer)}
.st-tab.active[data-sport="basketball"]{color:var(--c-basketball);border-bottom-color:var(--c-basketball)}
.st-tab.active[data-sport="football"]{color:var(--c-football);border-bottom-color:var(--c-football)}
.st-tab.active[data-sport="tennis"]{color:var(--c-tennis);border-bottom-color:var(--c-tennis)}
.st-tab.active[data-sport="mma"]{color:var(--c-mma);border-bottom-color:var(--c-mma)}
.st-count{font-size:8px;background:rgba(255,255,255,.08);border-radius:10px;padding:1px 5px;min-width:18px;text-align:center}

/* ── CATEGORY FILTERS ── */
.cat-bar{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.cat-btn{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:6px 14px;font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu2);cursor:pointer;transition:all .18s;white-space:nowrap}
.cat-btn:hover{color:var(--tx);border-color:rgba(255,255,255,.15)}
.cat-btn.active{background:rgba(184,159,255,.12);border-color:var(--ac);color:var(--ac)}
.cat-btn.active[data-cat="injury"]{background:rgba(248,113,113,.1);border-color:var(--rd);color:var(--rd)}
.cat-btn.active[data-cat="transfer"]{background:rgba(56,189,248,.1);border-color:var(--cyan);color:var(--cyan)}
.cat-btn.active[data-cat="lineup"]{background:rgba(52,211,153,.1);border-color:var(--gr);color:var(--gr)}
.cat-btn.active[data-cat="preview"]{background:rgba(251,191,36,.1);border-color:var(--gold);color:var(--gold)}

/* ── MAIN GRID ── */
.news-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}

/* ── NEWS FEED ── */
.feed-section{}
.feed-title{font-family:var(--font-mono);font-size:9px;color:var(--mu);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.feed-title::after{content:'';flex:1;height:1px;background:var(--bd)}
.news-cards{display:flex;flex-direction:column;gap:10px}

/* News card */
.nc{background:var(--s1);border:1px solid rgba(255,255,255,.06);border-left:3px solid var(--nc-color, var(--ac));border-radius:12px;display:flex;gap:14px;cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;position:relative;overflow:hidden;padding:16px}
.nc:hover{border-color:var(--nc-color, var(--ac));transform:translateX(3px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.nc-img{width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--s2)}
.nc-img-placeholder{width:80px;height:80px;border-radius:8px;background:var(--s2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;opacity:.4}
.nc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.nc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nc-source{font-family:var(--font-mono);font-size:8px;color:var(--mu);letter-spacing:1px;text-transform:uppercase}
.nc-dot{width:3px;height:3px;border-radius:50%;background:var(--mu);flex-shrink:0}
.nc-time{font-family:var(--font-mono);font-size:8px;color:var(--mu)}
.nc-sport-tag{font-family:var(--font-mono);font-size:7px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:4px;font-weight:700}
.nc-cat-tag{font-family:var(--font-mono);font-size:7px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:4px;font-weight:700;border:1px solid currentColor;opacity:.8}
.nc-headline{font-size:13px;font-weight:700;line-height:1.45;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc-desc{font-size:11px;color:var(--mu2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.nc-read{font-family:var(--font-mono);font-size:9px;color:var(--nc-color,var(--ac));letter-spacing:1px;opacity:.8}
.nc:hover .nc-read{opacity:1}
.nc-byline{font-family:var(--font-mono);font-size:8px;color:var(--mu);font-style:italic}

/* Injury category label colors */
.tag-soccer{background:rgba(52,211,153,.12);color:var(--c-soccer);border-color:rgba(52,211,153,.3)}
.tag-basketball{background:rgba(248,113,113,.1);color:var(--c-basketball);border-color:rgba(248,113,113,.25)}
.tag-football{background:rgba(56,189,248,.1);color:var(--c-football);border-color:rgba(56,189,248,.25)}
.tag-tennis{background:rgba(251,191,36,.1);color:var(--c-tennis);border-color:rgba(251,191,36,.25)}
.tag-mma{background:rgba(251,146,60,.1);color:var(--c-mma);border-color:rgba(251,146,60,.25)}
.tag-general{background:rgba(184,159,255,.1);color:var(--c-general);border-color:rgba(184,159,255,.25)}
.cat-injury{color:var(--rd);border-color:rgba(248,113,113,.4)}
.cat-transfer{color:var(--cyan);border-color:rgba(56,189,248,.4)}
.cat-lineup{color:var(--gr);border-color:rgba(52,211,153,.4)}
.cat-preview{color:var(--gold);border-color:rgba(251,191,36,.4)}

/* Empty / Error */
.feed-empty{text-align:center;padding:48px 20px;color:var(--mu)}
.feed-empty .icon{font-size:36px;display:block;margin-bottom:12px;opacity:.5}
.feed-empty h3{font-family:var(--font-display);font-size:22px;letter-spacing:2px;color:var(--mu2);margin-bottom:6px}
.feed-empty p{font-size:11px;font-family:var(--font-mono);line-height:1.7;max-width:300px;margin:0 auto}

/* ── SIDEBAR ── */
.news-sidebar{display:flex;flex-direction:column;gap:16px}
.sidebar-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.sc-head{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.sc-title{font-family:var(--font-display);font-size:16px;letter-spacing:2px}
.sc-count{font-family:var(--font-mono);font-size:9px;color:var(--mu);background:rgba(255,255,255,.05);border-radius:10px;padding:2px 7px}
.sc-body{padding:12px}

/* ── INJURY TRACKER ── */
.inj-card{padding:12px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);margin-bottom:8px;transition:border-color .2s;cursor:pointer;text-decoration:none;display:block;color:inherit}
.inj-card:hover{border-color:rgba(255,255,255,.1)}
.inj-card:last-child{margin-bottom:0}
.inj-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.inj-headline{font-size:11.5px;font-weight:600;line-height:1.4;color:var(--tx);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.inj-status{font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:1px;padding:3px 7px;border-radius:4px;flex-shrink:0;white-space:nowrap}
.status-out{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.35);color:var(--rd)}
.status-doubtful{background:rgba(251,146,60,.15);border:1px solid rgba(251,146,60,.35);color:var(--orange)}
.status-questionable{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:var(--gold)}
.status-day-to-day{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.25);color:var(--cyan)}
.status-injured{background:rgba(184,159,255,.1);border:1px solid rgba(184,159,255,.25);color:var(--ac)}
.inj-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.inj-impact{font-family:var(--font-mono);font-size:7px;font-weight:700;letter-spacing:1.5px;padding:2px 6px;border-radius:3px}
.impact-high{background:rgba(248,113,113,.12);color:var(--rd)}
.impact-medium{background:rgba(251,146,60,.1);color:var(--orange)}
.impact-low{background:rgba(52,211,153,.1);color:var(--gr)}
.inj-return{font-family:var(--font-mono);font-size:8px;color:var(--mu)}
.inj-sport-tag{font-family:var(--font-mono);font-size:7px;letter-spacing:1px;padding:1px 5px;border-radius:3px}
.inj-bet-note{font-size:9px;color:var(--mu2);font-family:var(--font-mono);margin-top:4px;padding-top:5px;border-top:1px solid rgba(255,255,255,.05)}

/* ── LINEUP NEWS ── */
.lineup-card{padding:12px;border-radius:10px;background:rgba(52,211,153,.03);border:1px solid rgba(52,211,153,.12);margin-bottom:8px;cursor:pointer;text-decoration:none;display:block;color:inherit;transition:border-color .2s}
.lineup-card:hover{border-color:rgba(52,211,153,.28)}
.lineup-card:last-child{margin-bottom:0}
.lc-headline{font-size:11.5px;font-weight:600;line-height:1.4;color:var(--tx);margin-bottom:4px}
.lc-meta{display:flex;gap:8px;align-items:center}
.lc-time{font-family:var(--font-mono);font-size:8px;color:var(--mu)}
.lc-new{font-family:var(--font-mono);font-size:7px;background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.3);color:var(--gr);padding:1px 5px;border-radius:3px;letter-spacing:1px}

/* ── TRENDING TOPICS ── */
.trending-section .sc-title{color:var(--gold)}
.topic-cloud{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.topic-tag{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:5px 12px;font-family:var(--font-mono);font-size:9px;color:var(--mu2);cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:5px}
.topic-tag:hover{color:var(--tx);border-color:rgba(255,255,255,.18)}
.topic-count{font-size:8px;opacity:.6;font-weight:700}

/* ── SKELETON ── */
.skel{border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:800px 100%;animation:shimmer 1.6s linear infinite;display:block}
.skel-nc{height:110px;border-radius:12px;margin-bottom:10px}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .news-grid{grid-template-columns:1fr}
  .news-sidebar{display:grid;grid-template-columns:1fr 1fr;gap:14px}
}
@media(max-width:640px){
  .news-sidebar{grid-template-columns:1fr}
  .nc-img,.nc-img-placeholder{width:60px;height:60px}
}
</style>

<script>
const API = 'https://ledgr-backend-production-c132.up.railway.app';
const CACHE_TTL = 5 * 60 * 1000;

let allArticles = [], currentSport = 'all', currentCat = 'all';
let countdownInterval = null, refreshInterval = null;

// ── Helpers ────────────────────────────────────────────────────

function timeAgo(dateStr) {
  if (!dateStr) return '—';
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

// ── Article classification ─────────────────────────────────────
const INJURY_KW  = ['injur', 'ruled out', 'doubt', 'sideline', 'out for', 'misses', 'missing', 'recovering', 'torn', 'fracture', 'suspend', 'hamstring', 'knee', 'ankle', 'shoulder', 'concussion', 'day-to-day', 'placed on ir'];
const TRANSFER_KW = ['transfer', 'signs', 'signs with', 'deal', 'contract', 'move', 'loan', 'trade', 'bid', 'acquisition', 'release'];
const LINEUP_KW  = ['lineup', 'starting', 'squad', 'team news', 'xi', 'first team', 'bench', 'roster', 'depth chart', 'probable'];
const PREVIEW_KW = ['preview', 'matchup', 'picks against', 'prediction', 'preview:', 'bet', 'odds', 'spread', 'look ahead', 'keys to', 'keys for'];

function categorize(article) {
  const txt = ((article.headline || '') + ' ' + (article.description || '')).toLowerCase();
  if (INJURY_KW.some(k => txt.includes(k))) return 'injury';
  if (LINEUP_KW.some(k => txt.includes(k))) return 'lineup';
  if (TRANSFER_KW.some(k => txt.includes(k))) return 'transfer';
  if (PREVIEW_KW.some(k => txt.includes(k))) return 'preview';
  return 'news';
}

function injuryStatus(txt) {
  if (/ruled out|will miss|out for|out vs/.test(txt)) return { label: 'OUT', cls: 'status-out' };
  if (/doubtful/.test(txt)) return { label: 'DOUBTFUL', cls: 'status-doubtful' };
  if (/questionable/.test(txt)) return { label: 'QUESTIONABLE', cls: 'status-questionable' };
  if (/day-to-day/.test(txt)) return { label: 'DAY-TO-DAY', cls: 'status-day-to-day' };
  return { label: 'INJURED', cls: 'status-injured' };
}

function injuryImpact(txt) {
  if (/season-ending|out for season|out for the year|month/.test(txt)) return { label: 'HIGH', cls: 'impact-high' };
  if (/week|ruled out|doubtful/.test(txt)) return { label: 'MEDIUM', cls: 'impact-medium' };
  return { label: 'LOW', cls: 'impact-low' };
}

function injuryReturn(txt) {
  const m = txt.match(/(\d+)[- ](?:to[- ])?(\d+)\s*weeks?/) || txt.match(/(\d+)\s*weeks?/);
  if (m) return 'Est. ' + m[0];
  if (/day-to-day/.test(txt)) return 'Day-to-day';
  if (/season-ending/.test(txt)) return 'Season-ending';
  if (/this week|next week/.test(txt)) return 'This week';
  return '';
}

function betImpact(impact) {
  if (impact.label === 'HIGH') return '⚡ Expect significant line movement';
  if (impact.label === 'MEDIUM') return '📊 Monitor for line changes';
  return '• Minor impact on lines';
}

function sportColor(sport) {
  const map = { soccer: '#34d399', basketball: '#f87171', football: '#38bdf8', tennis: '#fbbf24', mma: '#fb923c' };
  return map[sport] || '#b89fff';
}

function sportLabel(sport) {
  const map = { soccer: '⚽ Soccer', basketball: '🏀 NBA', football: '🏈 NFL', tennis: '🎾 Tennis', mma: '🥊 MMA' };
  return map[sport] || '🏆 Sports';
}

function sportTagCls(sport) {
  const map = { soccer: 'tag-soccer', basketball: 'tag-basketball', football: 'tag-football', tennis: 'tag-tennis', mma: 'tag-mma' };
  return map[sport] || 'tag-general';
}

// ── Trending topics ────────────────────────────────────────────
const STOP = new Set(['the','a','an','in','on','at','to','for','of','and','or','but','is','was','are','were','will','be','has','have','had','not','with','as','by','from','it','he','she','his','her','their','team','game','season','match','player','players','after','back','first','last','new','more','over','could','would','up','out','get','say','says','said','after','before','during','against','without','news','report','update','per','his','via','who','that','this','they','what','how','when','where','why','into']);

function extractTrending(articles) {
  const wc = {};
  articles.forEach(a => {
    (a.headline || '').split(/\W+/).forEach(w => {
      const lw = w.toLowerCase();
      if (lw.length < 4 || STOP.has(lw) || /^\d+$/.test(lw)) return;
      wc[lw] = (wc[lw] || 0) + 1;
    });
  });
  return Object.entries(wc).filter(([, c]) => c >= 2).sort((a, b) => b[1] - a[1]).slice(0, 12);
}

// ── Render ─────────────────────────────────────────────────────
function renderFeed(articles) {
  const feed = document.getElementById('newsFeed');
  let filtered = articles;
  if (currentCat !== 'all') filtered = articles.filter(a => a._cat === currentCat);

  if (!filtered.length) {
    feed.innerHTML = `<div class="feed-empty"><span class="icon">📭</span><h3>NO ARTICLES</h3><p>No ${currentCat === 'all' ? '' : currentCat + ' '}news found for this sport right now.</p></div>`;
    return;
  }

  feed.innerHTML = filtered.map(a => {
    const col  = sportColor(a._sport);
    const link = a.links?.web?.href || '#';
    const img  = a.images?.[0]?.url;
    const catTag = a._cat !== 'news' ? `<span class="nc-cat-tag cat-${a._cat}">${{ injury: '🤕 Injury', transfer: '🔄 Transfer', lineup: '📋 Lineup', preview: '🔮 Preview' }[a._cat]}</span>` : '';

    return `<a class="nc" href="${link}" target="_blank" rel="noopener" style="--nc-color:${col}">
      ${img
        ? `<img class="nc-img" src="${img}" alt="" loading="lazy" onerror="this.style.display='none'">`
        : `<div class="nc-img-placeholder">${{ soccer: '⚽', basketball: '🏀', football: '🏈', tennis: '🎾', mma: '🥊' }[a._sport] || '🏆'}</div>`}
      <div class="nc-body">
        <div class="nc-meta">
          <span class="nc-source">${a.byline || 'ESPN'}</span>
          <span class="nc-dot"></span>
          <span class="nc-time">${timeAgo(a.published)}</span>
          <span class="nc-sport-tag ${sportTagCls(a._sport)}">${sportLabel(a._sport)}</span>
          ${catTag}
        </div>
        <div class="nc-headline">${a.headline || ''}</div>
        ${a.description ? `<div class="nc-desc">${a.description}</div>` : ''}
        <div class="nc-footer">
          <span class="nc-byline">${a.byline ? 'By ' + a.byline : 'ESPN'}</span>
          <span class="nc-read">Read full article →</span>
        </div>
      </div>
    </a>`;
  }).join('');
}

function renderInjuries(articles) {
  const injuries = articles.filter(a => a._cat === 'injury').slice(0, 8);
  document.getElementById('injuryCount').textContent = injuries.length;
  const feed = document.getElementById('injuryFeed');
  if (!injuries.length) {
    feed.innerHTML = '<div style="color:var(--mu);font-family:\'DM Mono\',monospace;font-size:10px;padding:8px;text-align:center">No injury news found</div>';
    return;
  }
  feed.innerHTML = injuries.map(a => {
    const txt = ((a.headline || '') + ' ' + (a.description || '')).toLowerCase();
    const status = injuryStatus(txt);
    const impact = injuryImpact(txt);
    const ret    = injuryReturn(txt);
    const link   = a.links?.web?.href || '#';
    return `<a class="inj-card" href="${link}" target="_blank" rel="noopener">
      <div class="inj-top">
        <div class="inj-headline">${a.headline || ''}</div>
        <div class="inj-status ${status.cls}">${status.label}</div>
      </div>
      <div class="inj-meta">
        <span class="inj-impact ${impact.cls}">${impact.label} IMPACT</span>
        <span class="inj-sport-tag ${sportTagCls(a._sport)}">${sportLabel(a._sport)}</span>
        ${ret ? `<span class="inj-return">${ret}</span>` : ''}
      </div>
      <div class="inj-bet-note">${betImpact(impact)}</div>
    </a>`;
  }).join('');
}

function renderLineups(articles) {
  const lineups = articles.filter(a => a._cat === 'lineup').slice(0, 5);
  document.getElementById('lineupCount').textContent = lineups.length;
  const feed = document.getElementById('lineupFeed');
  if (!lineups.length) {
    feed.innerHTML = '<div style="color:var(--mu);font-family:\'DM Mono\',monospace;font-size:10px;padding:8px;text-align:center">No lineup news yet</div>';
    return;
  }
  feed.innerHTML = lineups.map(a => {
    const link = a.links?.web?.href || '#';
    const isRecent = a.published && (Date.now() - new Date(a.published)) < 3 * 3600 * 1000;
    return `<a class="lineup-card" href="${link}" target="_blank" rel="noopener">
      <div class="lc-headline">${a.headline || ''}</div>
      <div class="lc-meta">
        <span class="lc-time">${timeAgo(a.published)}</span>
        ${isRecent ? '<span class="lc-new">NEW</span>' : ''}
        <span class="inj-sport-tag ${sportTagCls(a._sport)}">${sportLabel(a._sport)}</span>
      </div>
    </a>`;
  }).join('');
}

function renderTrending(articles) {
  const topics = extractTrending(articles);
  document.getElementById('trendCount').textContent = topics.length;
  const cloud = document.getElementById('trendingCloud');
  if (!topics.length) { cloud.innerHTML = '<div style="color:var(--mu);font-size:10px;font-family:\'DM Mono\',monospace">No trending topics yet</div>'; return; }
  const maxCount = topics[0]?.[1] || 1;
  cloud.innerHTML = topics.map(([word, count]) => {
    const size = Math.max(9, Math.round(9 + (count / maxCount) * 5));
    return `<div class="topic-tag" style="font-size:${size}px" onclick="searchTopic('${word}')">
      ${word.charAt(0).toUpperCase() + word.slice(1)}
      <span class="topic-count">${count}</span>
    </div>`;
  }).join('');
}

function searchTopic(word) {
  window.open(`https://www.google.com/search?q=${encodeURIComponent(word + ' sports')}`, '_blank');
}

function updateCounts(articles) {
  const sports = ['soccer', 'basketball', 'football', 'tennis', 'mma'];
  document.getElementById('cnt-all').textContent = articles.length;
  sports.forEach(s => {
    const el = document.getElementById('cnt-' + s);
    if (el) el.textContent = articles.filter(a => a._sport === s).length;
  });
}

// ── Data fetching ──────────────────────────────────────────────
function getCached(key) {
  try {
    const c = JSON.parse(localStorage.getItem('ledgr_news_' + key) || 'null');
    if (c && Date.now() - c.ts < CACHE_TTL) return c.data;
  } catch (e) {}
  return null;
}

function setCache(key, data) {
  try { localStorage.setItem('ledgr_news_' + key, JSON.stringify({ ts: Date.now(), data })); } catch (e) {}
}

async function loadNews(force = false) {
  const cacheKey = currentSport;
  if (!force) {
    const cached = getCached(cacheKey);
    if (cached) { processArticles(cached); startCountdown(); return; }
  }

  // Show skeletons
  document.getElementById('newsFeed').innerHTML = Array(5).fill('<div class="skel skel-nc"></div>').join('');

  try {
    const r = await fetch(`${API}/news?sport=${currentSport}`);
    if (!r.ok) throw new Error('API ' + r.status);
    const data = await r.json();
    if (!Array.isArray(data) || !data.length) throw new Error('empty');
    setCache(cacheKey, data);
    processArticles(data);
  } catch (err) {
    console.warn('News fetch failed:', err.message);
    // Show error with retry
    document.getElementById('newsFeed').innerHTML = `<div class="feed-empty">
      <span class="icon">📡</span>
      <h3>FEED UNAVAILABLE</h3>
      <p>Could not load sports news right now.<br>
      <button onclick="loadNews(true)" style="margin-top:12px;background:rgba(184,159,255,.1);border:1px solid var(--bd2);color:var(--ac);padding:8px 16px;border-radius:8px;font-family:var(--font-mono);font-size:10px;cursor:pointer;letter-spacing:1px">↻ TRY AGAIN</button></p>
    </div>`;
    document.getElementById('injuryFeed').innerHTML = '<div style="color:var(--mu);font-family:\'DM Mono\',monospace;font-size:10px;padding:8px;text-align:center">—</div>';
    document.getElementById('lineupFeed').innerHTML = '<div style="color:var(--mu);font-family:\'DM Mono\',monospace;font-size:10px;padding:8px;text-align:center">—</div>';
    document.getElementById('trendingCloud').innerHTML = '<div style="color:var(--mu);font-size:10px;font-family:\'DM Mono\',monospace">—</div>';
  }

  startCountdown();
  document.getElementById('updatedEl').textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function processArticles(raw) {
  allArticles = raw.map(a => ({ ...a, _cat: categorize(a) }));
  renderFeed(allArticles);
  renderInjuries(allArticles);
  renderLineups(allArticles);
  renderTrending(allArticles);
  updateCounts(allArticles);
}

// ── Countdown ─────────────────────────────────────────────────
function startCountdown() {
  if (countdownInterval) clearInterval(countdownInterval);
  let secs = 300;
  const el = document.getElementById('countdownEl');
  function tick() {
    const m = Math.floor(secs / 60), s = secs % 60;
    el.textContent = `Refreshes in ${m}:${String(s).padStart(2,'0')}`;
    secs--;
    if (secs < 0) { clearInterval(countdownInterval); loadNews(true); }
  }
  tick();
  countdownInterval = setInterval(tick, 1000);
}

// ── Tab / filter controls ─────────────────────────────────────
function setSport(sport, el) {
  currentSport = sport;
  document.querySelectorAll('.st-tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  currentCat = 'all';
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.cat-btn[data-cat="all"]').classList.add('active');
  loadNews(false);
}

function setCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderFeed(allArticles);
}

// ── Boot ──────────────────────────────────────────────────────
loadNews(false);
</script>
