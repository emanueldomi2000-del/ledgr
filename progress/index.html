<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — My Progress</title>
<link rel="icon" href="/assets/logo/ledgr-icon.png">
<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>
body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:0; opacity:0.3; }

/* Skeleton */
.skel { display:inline-block; border-radius:6px; background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 75%); background-size:800px 100%; animation:shimmer 1.6s infinite linear; }
@keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }

/* Layout */
.main { max-width:1120px; margin:0 auto; padding:32px 24px 80px; position:relative; z-index:2; }
.two-col { display:grid; grid-template-columns:3fr 2fr; gap:20px; margin-bottom:8px; }

/* Section title */
.sec-title {
  font-family:var(--font-display); font-size:18px; font-weight:700;
  letter-spacing:0.08em; color:var(--tx);
  border-left:2px solid var(--ac); padding-left:10px;
  margin-bottom:20px; display:flex; align-items:center; gap:10px;
}
.sec-title::after { content:''; flex:1; height:1px; background:var(--bd); }

/* Logo divider */
.logo-divider { display:flex; align-items:center; gap:12px; margin:32px 0; }
.logo-divider::before,.logo-divider::after { content:''; flex:1; height:1px; background:var(--bd); }
.logo-divider img { width:16px; height:16px; opacity:0.3; }

/* ── Hero Card ── */
.hero-card { position:relative; border-radius:16px; overflow:hidden; margin-bottom:8px; padding:32px; }
.hero-banner-bronze { background:linear-gradient(135deg,#1a0e08,#2d1a0a,#1a100c); }
.hero-banner-silver { background:linear-gradient(135deg,#0e1018,#161b24,#0a0d14); }
.hero-banner-gold { background:linear-gradient(135deg,#0d0900,#1f1500,#0a0800); }
.hero-banner-gold::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(75deg,rgba(251,191,36,0.04) 0px,transparent 80px,rgba(251,191,36,0.02) 160px); pointer-events:none; }
.hero-banner-platinum { background:linear-gradient(135deg,#00111a,#001f2e,#000d1a); }
.hero-banner-diamond { background:linear-gradient(135deg,#080520,#10073a,#040918); }
.hero-banner-elite { background:linear-gradient(135deg,#0a0420,#1a0840,#080318); }
.hero-banner-legendary { background:linear-gradient(135deg,#100500,#1a0030,#00100a); }
@keyframes legendShimmer { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
.hero-banner-legendary::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(251,191,36,0.06),rgba(184,159,255,0.06),rgba(52,211,153,0.04)); background-size:300% 300%; animation:legendShimmer 8s ease infinite; pointer-events:none; }
.hero-overlay { position:absolute; inset:0; background:linear-gradient(to right,rgba(10,10,10,0.3),transparent 60%); pointer-events:none; }
.hero-noise { position:absolute; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:1; }
.hero-watermark { position:absolute; right:24px; top:50%; transform:translateY(-50%); height:120px; opacity:0.04; pointer-events:none; z-index:1; }
.hero-inner { position:relative; z-index:2; display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
.hero-av { width:80px; height:80px; border-radius:var(--r-lg,14px); border:3px solid var(--bg); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:28px; font-weight:700; color:#fff; flex-shrink:0; position:relative; }
.hero-av-ring { position:absolute; inset:-5px; border-radius:var(--r-lg,14px); }
.hring-bronze { border:2px solid rgba(180,120,80,0.5); box-shadow:0 0 12px rgba(180,120,80,0.2); }
.hring-silver { border:2px solid rgba(148,163,184,0.4); box-shadow:0 0 12px rgba(148,163,184,0.15); }
.hring-gold { border:2px solid rgba(251,191,36,0.7); box-shadow:0 0 16px rgba(251,191,36,0.3); }
.hring-platinum { border:2px solid rgba(56,189,248,0.5); animation:ringPulse 2.5s ease-in-out infinite; }
.hring-diamond { border:2px solid rgba(56,189,248,0.8); animation:diamondCrackle 2s ease-in-out infinite; }
.hring-elite::before { content:''; position:absolute; inset:-3px; border-radius:50%; background:conic-gradient(from 0deg,var(--ac-vivid),var(--ac-light),var(--rd),var(--ac-vivid)); animation:conicSpin 3s linear infinite; -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px)); mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px)); }
.hring-legendary::before { content:''; position:absolute; inset:-3px; border-radius:50%; background:conic-gradient(from 0deg,var(--gold),var(--ac),var(--gr),var(--cyan),var(--rd),var(--gold)); animation:conicSpin 4s linear infinite; -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px)); mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 2px)); }
@keyframes ringPulse { 0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,0)} 50%{box-shadow:0 0 0 8px rgba(56,189,248,0.1)} }
@keyframes diamondCrackle { 0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,0),0 0 8px rgba(56,189,248,0.2)} 50%{box-shadow:0 0 0 6px rgba(56,189,248,0.08),0 0 20px rgba(56,189,248,0.4)} }
@keyframes conicSpin { to{transform:rotate(360deg)} }

.hero-center { flex:1; min-width:220px; }
.hero-div-name { font-family:var(--font-display); font-size:32px; font-weight:700; letter-spacing:2px; line-height:1; margin-bottom:4px; }
.hero-elo-nums { font-family:var(--font-mono); font-size:13px; color:var(--mu2); margin-bottom:8px; letter-spacing:1px; font-variant-numeric:tabular-nums; }
.hero-bar-track { height:10px; background:rgba(255,255,255,0.06); border-radius:8px; overflow:hidden; margin-bottom:6px; position:relative; }
.hero-bar-fill { height:100%; border-radius:8px; transition:width 0.8s cubic-bezier(0.34,1.15,0.64,1); position:relative; overflow:hidden; }
.hero-bar-fill::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent); animation:barShimmer 2s linear infinite; }
@keyframes barShimmer { from{transform:translateX(-100%)} to{transform:translateX(100%)} }
.hero-bar-sub { font-family:var(--font-mono); font-size:11px; color:var(--mu); margin-bottom:4px; }
.hero-bar-week { font-family:var(--font-mono); font-size:10px; color:var(--gr); }

.hero-pills { display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.hero-pill { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:20px; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:1px; white-space:nowrap; }
.pill-streak { background:rgba(251,146,60,0.1); border:1px solid rgba(251,146,60,0.25); color:var(--orange); }
.pill-rank { background:rgba(251,191,36,0.08); border:1px solid rgba(251,191,36,0.2); color:var(--gold); }
.pill-sharp-green { background:rgba(0,229,160,0.08); border:1px solid rgba(0,229,160,0.25); color:var(--gr); }
.pill-sharp-amber { background:rgba(251,191,36,0.08); border:1px solid rgba(251,191,36,0.2); color:var(--gold); }
.pill-sharp-red { background:rgba(255,51,85,0.08); border:1px solid rgba(255,51,85,0.2); color:var(--rd); }

/* ── Timeline ── */
.timeline-wrap { position:relative; padding-left:28px; }
.tl-spine { position:absolute; left:8px; top:0; bottom:0; width:2px; background:var(--bd); }
.tl-spine-fill { position:absolute; left:0; top:0; width:2px; background:linear-gradient(to bottom,var(--ac),var(--ac-l)); transition:height 1.4s ease; }
.tl-item { position:relative; margin-bottom:20px; opacity:0; transform:translateX(-10px); transition:opacity 0.4s ease,transform 0.4s ease; }
.tl-item.visible { opacity:1; transform:translateX(0); }
.tl-node { position:absolute; left:-32px; width:18px; height:18px; border-radius:50%; border:2px solid var(--bd); background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:9px; top:4px; z-index:2; }
.tl-node.node-green { border-color:var(--gr); background:rgba(0,229,160,0.1); box-shadow:0 0 8px rgba(0,229,160,0.2); }
.tl-node.node-purple { border-color:var(--ac); background:var(--acg); box-shadow:0 0 8px rgba(123,44,255,0.2); }
.tl-node.node-gold { border-color:var(--gold); background:rgba(251,191,36,0.08); box-shadow:0 0 8px rgba(251,191,36,0.2); }
.tl-node.node-logo { border:none; background:transparent; }
.tl-node.node-logo img { width:18px; height:18px; opacity:0.6; }
.tl-node.node-large { width:24px; height:24px; left:-35px; font-size:12px; }
.tl-body { background:var(--s1); border:1px solid var(--bd); border-radius:10px; padding:12px 14px; }
.tl-body.tl-body-purple { border-color:rgba(123,44,255,0.2); }
.tl-body.tl-body-gold { border-color:rgba(251,191,36,0.2); background:rgba(251,191,36,0.02); }
.tl-body.tl-body-green { border-color:rgba(0,229,160,0.15); }
.tl-title { font-family:var(--font-display); font-size:15px; font-weight:700; letter-spacing:0.5px; color:var(--tx); margin-bottom:2px; }
.tl-date { font-family:var(--font-mono); font-size:9px; color:var(--mu); letter-spacing:1px; }

/* ── Next Unlocks ── */
.unlock-item { margin-bottom:16px; }
.unlock-label { font-family:var(--font-body); font-size:13px; font-weight:600; color:var(--tx); margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
.unlock-prog-text { font-family:var(--font-mono); font-size:10px; color:var(--mu); }
.unlock-track { height:8px; background:rgba(255,255,255,0.05); border-radius:6px; overflow:hidden; }
.unlock-fill { height:100%; border-radius:6px; transition:width 0.8s cubic-bezier(0.34,1.15,0.64,1); background:var(--ac); }
.unlock-fill.fill-near { background:linear-gradient(90deg,var(--ac),var(--ac-l)); }

/* ── Momentum Panel ── */
.momentum-card { background:var(--s1); border:1px solid var(--bd); border-radius:12px; padding:24px; position:relative; overflow:hidden; }
.momentum-bg-chart { position:absolute; inset:0; pointer-events:none; opacity:0.12; }
.momentum-header { font-family:var(--font-display); font-size:16px; font-weight:700; letter-spacing:1px; margin-bottom:16px; position:relative; z-index:1; }
.momentum-stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; position:relative; z-index:1; margin-bottom:16px; }
.mom-stat { background:var(--s2); border:1px solid var(--bd); border-radius:8px; padding:12px; }
.mom-stat-val { font-family:var(--font-mono); font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; margin-bottom:3px; }
.mom-stat-lbl { font-family:var(--font-body); font-size:10px; color:var(--mu); letter-spacing:1px; text-transform:uppercase; }
.trend-row { display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11px; position:relative; z-index:1; }

/* ── Skill Radar ── */
.radar-card { background:var(--s1); border:1px solid var(--bd); border-radius:12px; padding:24px; display:flex; flex-direction:column; align-items:center; }
.radar-svg { width:280px; height:280px; overflow:visible; }
.radar-axis { stroke:var(--bd); stroke-width:1; }
.radar-grid { stroke:rgba(255,255,255,0.04); stroke-width:1; fill:none; }
.radar-polygon { transition:d 0.8s ease-out; }
.radar-label { font-family:var(--font-display); font-size:12px; font-weight:700; fill:var(--mu2); }
.radar-value { font-family:var(--font-mono); font-size:10px; fill:var(--tx); }

/* ── Season ── */
.season-hero { background:var(--s1); border:1px solid rgba(123,44,255,0.2); border-radius:12px; padding:24px; margin-bottom:16px; }
.season-name { font-family:var(--font-display); font-size:28px; font-weight:700; letter-spacing:3px; color:var(--tx); margin-bottom:4px; }
.season-days { font-family:var(--font-mono); font-size:11px; color:var(--mu); margin-bottom:16px; }
.season-countdown-track { height:6px; background:rgba(255,255,255,0.05); border-radius:4px; overflow:hidden; margin-bottom:8px; }
.season-countdown-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,var(--ac),var(--ac-l)); }
.rewards-row { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:20px; }
.rew-item { text-align:center; padding:12px 6px; border-radius:10px; border:1px solid var(--bd); background:var(--s2); position:relative; transition:transform 0.2s; }
.rew-item:hover { transform:translateY(-2px); }
.rew-item.rew-unlocked { border-color:rgba(0,229,160,0.2); background:rgba(0,229,160,0.03); }
.rew-item.rew-current { border-color:var(--ac); background:var(--acg); animation:rewPulse 2s ease-in-out infinite; }
.rew-item.rew-locked { opacity:0.4; }
@keyframes rewPulse { 0%,100%{box-shadow:0 0 0 0 rgba(123,44,255,0)} 50%{box-shadow:0 0 0 6px rgba(123,44,255,0.1)} }
.rew-icon { font-size:20px; display:block; margin-bottom:6px; }
.rew-div { font-family:var(--font-mono); font-size:7px; color:var(--mu); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
.rew-label { font-family:var(--font-body); font-size:9px; color:var(--mu2); line-height:1.4; }

/* ── Big Moments ── */
.moments-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.moment-card { background:var(--s1); border:1px solid var(--bd); border-radius:12px; padding:24px; position:relative; overflow:hidden; transition:border-color 0.2s,box-shadow 0.2s; }
.moment-card:hover { border-color:rgba(123,44,255,0.3); box-shadow:0 4px 20px rgba(123,44,255,0.08); }
.moment-watermark { position:absolute; top:12px; right:12px; width:24px; height:24px; opacity:0.08; }
.moment-icon { font-size:24px; margin-bottom:8px; }
.moment-value { font-family:var(--font-display); font-size:48px; font-weight:700; line-height:1; margin-bottom:4px; }
.moment-label { font-family:var(--font-body); font-size:10px; color:var(--mu); letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
.moment-date { font-family:var(--font-mono); font-size:10px; color:var(--mu); }

/* ── Animations ── */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.anim-hero { animation:fadeIn 0.3s ease both; }
.anim-slide { animation:slideUp 0.4s ease both; }
@media(prefers-reduced-motion:reduce) { *{animation:none!important;transition:none!important} }

/* ── Responsive ── */
@media(max-width:768px) {
  .two-col { grid-template-columns:1fr; }
  .moments-grid { grid-template-columns:1fr; }
  .rewards-row { grid-template-columns:repeat(4,1fr); }
  .hero-pills { flex-direction:row; flex-wrap:wrap; }
  .hero-inner { gap:16px; }
  .radar-svg { width:220px; height:220px; }
}
@media(max-width:480px) {
  .rewards-row { grid-template-columns:repeat(2,1fr); }
  .hero-av { width:64px; height:64px; font-size:22px; }
}

/* ── Demotion Warning ── */
.demotion-banner { display:flex; align-items:center; gap:10px; margin-top:10px; padding:9px 14px; border-radius:8px; font-family:var(--font-mono); font-size:11px; letter-spacing:0.5px; }
.demotion-banner.at-risk { background:rgba(255,51,85,0.07); border:1px solid rgba(255,51,85,0.25); color:#ff8899; }
.demotion-banner.safe { background:rgba(0,229,160,0.05); border:1px solid rgba(0,229,160,0.18); color:var(--gr); }
.demotion-banner .db-icon { font-size:14px; flex-shrink:0; }
.demotion-banner .db-pts { font-family:var(--font-display); font-size:14px; font-weight:700; margin-right:4px; }

/* ── IDENTITY: JOURNEY / EVOLUTION ── */
@keyframes riseUp{0%,100%{opacity:.3;transform:translateX(-50%) translateY(0)}50%{opacity:.52;transform:translateX(-50%) translateY(-18px)}}
.bg-horizon{position:fixed;bottom:-80px;left:50%;transform:translateX(-50%);width:1200px;height:380px;background:radial-gradient(ellipse,rgba(251,146,60,.07),rgba(251,191,36,.04) 30%,transparent 65%);pointer-events:none;z-index:0;animation:riseUp 11s ease-in-out infinite}
</style>

</head>
<body>
<div class="bg-glow"></div>
<div class="bg-horizon"></div>
<script src="/app-nav.js"></script>
<script src="/motion.js"></script>
<script>AppNav.init({active:'progress'});</script>

<div class="main" id="mainContent">
  <div style="text-align:center;padding:80px;color:var(--mu);font-family:var(--font-mono);font-size:12px">Loading progress...</div>
</div>

<script src="/divisions.js"></script>
<script src="/flow.js"></script>
<script src="/social.js"></script>
<script>
const API = 'https://ledgr-backend-production-c132.up.railway.app';

// Auth check
const _u = JSON.parse(localStorage.getItem('ledgr_user') || localStorage.getItem('user') || 'null');
const _t = localStorage.getItem('ledgr_token') || localStorage.getItem('token');
if (!_u || !_t) { window.location.replace('/login'); }

const USERNAME = _u ? _u.username : '';
const USER_ID  = _u ? _u.id : '';

// ELO tier system
const ELO_TIERS = [
  { name:'BRONZE',    min:0,    max:1000, color:'#b47850', bannerCls:'hero-banner-bronze', ringCls:'hring-bronze', icon:'▲' },
  { name:'SILVER',    min:1000, max:1400, color:'#94a3b8', bannerCls:'hero-banner-silver', ringCls:'hring-silver', icon:'◆' },
  { name:'GOLD',      min:1400, max:1800, color:'#fbbf24', bannerCls:'hero-banner-gold',   ringCls:'hring-gold',   icon:'★' },
  { name:'PLATINUM',  min:1800, max:2200, color:'#38bdf8', bannerCls:'hero-banner-platinum',ringCls:'hring-platinum',icon:'⬡' },
  { name:'DIAMOND',   min:2200, max:2800, color:'#b89fff', bannerCls:'hero-banner-diamond', ringCls:'hring-diamond', icon:'✦' },
  { name:'ELITE',     min:2800, max:3400, color:'#e879a0', bannerCls:'hero-banner-elite',   ringCls:'hring-elite',   icon:'⊕' },
  { name:'LEGENDARY', min:3400, max:4000, color:'#fbbf24', bannerCls:'hero-banner-legendary',ringCls:'hring-legendary',icon:'◉' },
];

function getEloTier(elo) {
  for (let i = ELO_TIERS.length - 1; i >= 0; i--) {
    if (elo >= ELO_TIERS[i].min) return ELO_TIERS[i];
  }
  return ELO_TIERS[0];
}

function getTierRoman(elo, tier) {
  const range = tier.max - tier.min;
  const pos = elo - tier.min;
  const frac = Math.min(1, pos / range);
  if (frac >= 0.75) return 'I';
  if (frac >= 0.50) return 'II';
  if (frac >= 0.25) return 'III';
  return 'IV';
}

const DIV_SCORE = {
  BRONZE:0, SILVER:20, GOLD:35, PLATINUM:50, DIAMOND:65, ELITE:80, LEGENDARY:92
};

function computeEloFromDivScore(divScore) {
  return Math.round(1000 + (divScore / 100) * 3000);
}

async function loadProgress() {
  const _ctrl=new AbortController();const _xt=setTimeout(()=>{_ctrl.abort();document.getElementById('mainContent').innerHTML='<div style="text-align:center;padding:80px;color:var(--mu);font-family:var(--font-mono)">Request timed out. <a href="/home" style="color:var(--ac)">Go home →</a></div>';},25000);
  try {
    const [picksRes, rankingsRes, seasonsRes, historyRes] = await Promise.all([
      fetch(API + '/picks?userId=' + USER_ID, { cache: 'no-store', signal: _ctrl.signal, headers: { Authorization: 'Bearer ' + _t } }),
      fetch(API + '/rankings', { cache: 'no-store' }).catch(() => null),
      fetch(API + '/seasons', { cache: 'no-store' }).catch(() => null),
      fetch(API + '/rankings/' + encodeURIComponent(USERNAME) + '/history', { cache: 'no-store' }).catch(() => null),
    ]);

    clearTimeout(_xt);
    const allPicks = await picksRes.json();
    const myPicks = (Array.isArray(allPicks) ? allPicks : [])
      .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

    let rankingMeta = null;
    let myRank = 0;
    let totalTipsters = 0;
    if (rankingsRes && rankingsRes.ok) {
      const rd = await rankingsRes.json();
      if (rd && Array.isArray(rd.tipsters)) {
        totalTipsters = rd.tipsters.length;
        const idx = rd.tipsters.findIndex(t => t.userId === USER_ID);
        if (idx >= 0) {
          rankingMeta = rd.tipsters[idx];
          myRank = idx + 1;
        }
      }
    }

    let activeSeason = null;
    let pastSeasons = [];
    if (seasonsRes && seasonsRes.ok) {
      try {
        const allSeasons = await seasonsRes.json();
        if (Array.isArray(allSeasons)) {
          activeSeason = allSeasons.find(s => s.isActive) || allSeasons[0];
          pastSeasons = allSeasons.filter(s => !s.isActive && s.champion);
        }
      } catch(e) {}
    }

    let rankHistory = [];
    if (historyRes && historyRes.ok) {
      try { const h = await historyRes.json(); if (Array.isArray(h)) rankHistory = h; } catch(e) {}
    }

    renderAll(myPicks, rankingMeta, myRank, totalTipsters, activeSeason, pastSeasons, rankHistory);
  } catch(e) {
    clearTimeout(_xt);
    document.getElementById('mainContent').innerHTML =
      '<div style="text-align:center;padding:80px;color:var(--mu);font-family:var(--font-mono)">Could not load progress. <a href="/home" style="color:var(--ac)">Go home →</a></div>';
  }
}

function renderAll(picks, rankingMeta, myRank, totalTipsters, activeSeason, pastSeasons, rankHistory) {
  rankHistory = rankHistory || [];
  const wins   = picks.filter(p => p.result === 'win').length;
  const losses = picks.filter(p => p.result === 'loss').length;
  const pushes = picks.filter(p => p.result === 'push').length;
  const pending = picks.filter(p => p.result === 'pending').length;
  const settledPicks = picks.filter(p => p.result === 'win' || p.result === 'loss');
  const totalStake = picks.reduce((s,p) => s + (p.stake||0), 0);
  const totalPnl   = picks.reduce((s,p) => s + (p.pnl||0), 0);
  const roi = totalStake > 0 ? (totalPnl / totalStake) * 100 : 0;
  const winRate = (wins + losses) > 0 ? wins / (wins + losses) : 0;
  const avgOdds = picks.length > 0 ? picks.reduce((s,p) => s + (p.odds||0), 0) / picks.length : 0;

  const elo = rankingMeta ? rankingMeta.elo : computeEloFromDivScore(rankingMeta ? rankingMeta.divisionScore : 0);
  const sharpScore = rankingMeta ? (rankingMeta.sharpScore || 0) : 0;
  const reliabilityScore = rankingMeta ? (rankingMeta.reliabilityScore || 0) : 0;
  const clvAvg = rankingMeta ? (rankingMeta.clvAvg || 0) : 0;
  const currentStreak = rankingMeta ? Math.max(0, rankingMeta.currentStreak || 0) : 0;
  const divisionName = rankingMeta ? (rankingMeta.division || 'BRONZE') : 'BRONZE';

  const actualElo = (rankingMeta && rankingMeta.elo != null) ? rankingMeta.elo : computeEloFromDivScore(DIV_SCORE[divisionName] || 0);
  const tier = getEloTier(actualElo);
  const roman = getTierRoman(actualElo, tier);
  const eloInTier = actualElo - tier.min;
  const tierRange = tier.max - tier.min;
  const eloPercent = Math.min(100, Math.round((eloInTier / tierRange) * 100));
  const eloToNext = tier.max - actualElo;
  const nextTier = ELO_TIERS[ELO_TIERS.indexOf(tier) + 1] || tier;

  const rankPct = totalTipsters > 0 ? Math.round((1 - myRank / totalTipsters) * 100) : null;

  const sorted = [...settledPicks].sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt));
  let streak = 0;
  for (const p of sorted) { if (p.result === 'win') streak++; else break; }

  const now = Date.now();
  const day14ago = now - 14*24*3600*1000;
  const day7ago  = now - 7*24*3600*1000;
  const recent14 = picks.filter(p => new Date(p.createdAt).getTime() >= day14ago);
  const recent7  = picks.filter(p => new Date(p.createdAt).getTime() >= day7ago);
  const prev7    = picks.filter(p => { const t = new Date(p.createdAt).getTime(); return t >= day14ago && t < day7ago; });
  const roi14 = (()=>{ const s=recent14.reduce((a,p)=>a+(p.stake||0),0); const n=recent14.reduce((a,p)=>a+(p.pnl||0),0); return s>0?(n/s)*100:0; })();
  const roi7  = (()=>{ const s=recent7.reduce((a,p)=>a+(p.stake||0),0);  const n=recent7.reduce((a,p)=>a+(p.pnl||0),0);  return s>0?(n/s)*100:0; })();
  const roiPrev7=(()=>{ const s=prev7.reduce((a,p)=>a+(p.stake||0),0); const n=prev7.reduce((a,p)=>a+(p.pnl||0),0); return s>0?(n/s)*100:0; })();
  const wr14  = (()=>{ const w=recent14.filter(p=>p.result==='win').length; const l=recent14.filter(p=>p.result==='loss').length; return(w+l)>0?Math.round(w/(w+l)*100):0; })();
  const pnl14 = recent14.reduce((s,p)=>s+(p.pnl||0),0);
  const trend = roi7 > roiPrev7 + 2 ? 'rising' : roi7 < roiPrev7 - 2 ? 'declining' : 'stable';

  const roiVar = (()=>{
    if (settledPicks.length < 3) return 50;
    const rs = settledPicks.map(p=>{const s=p.stake||1;return(p.pnl||0)/s*100;});
    const mean=rs.reduce((a,b)=>a+b,0)/rs.length;
    const variance=rs.reduce((a,b)=>a+Math.pow(b-mean,2),0)/rs.length;
    return Math.max(0,Math.min(100,100-Math.sqrt(variance)));
  })();
  const radarAxes = [
    { label:'Consistency', value:Math.round(roiVar) },
    { label:'Sharpness',   value:Math.round(Math.min(100,sharpScore)) },
    { label:'CLV',         value:Math.round(Math.min(100,Math.max(0,((clvAvg+10)/20)*100))) },
    { label:'Volume',      value:Math.round(Math.min(100,(picks.length/100)*100)) },
    { label:'Reliability', value:Math.round(Math.min(100,reliabilityScore)) },
    { label:'Safety',      value:Math.round(Math.min(100,Math.max(0,(1-(avgOdds-1)/4)*100))) },
  ];

  const flowState = window.Flow ? window.Flow.detect({
    picks: settledPicks, currentStreak, streakType: streak>0?'win':'', clvAvg, avgOdds, roi, winRate
  }) : null;

  // Division score & demotion check
  const DIV_THRESHOLDS = {BRONZE:0,SILVER:20,GOLD:35,PLATINUM:50,DIAMOND:65,ELITE:80,LEGENDARY:92};
  const divScore = Math.round(
    Math.min(40, Math.max(0, (roi / 20) * 40)) +
    Math.min(30, Math.max(0, (winRate * 100 / 70) * 30)) +
    Math.min(20, Math.max(0, (picks.length / 100) * 20)) +
    Math.min(10, picks.length)
  );
  const currentThreshold = DIV_THRESHOLDS[divisionName] ?? 0;
  const pointsAbove = divScore - currentThreshold;
  const demotionAtRisk = picks.length > 0 && divisionName !== 'BRONZE' && pointsAbove < 8;

  const biggestWin = wins > 0 ? Math.max(...picks.filter(p=>p.result==='win').map(p=>p.pnl||0)) : null;
  const biggestWinDate = biggestWin != null ? picks.find(p=>p.result==='win'&&Math.abs((p.pnl||0)-biggestWin)<0.01)?.createdAt : null;

  const byDay = {};
  picks.forEach(p => {
    const d = new Date(p.createdAt).toISOString().slice(0,10);
    byDay[d] = (byDay[d]||0) + (p.pnl||0);
  });
  const dayEntries = Object.entries(byDay).sort((a,b)=>b[1]-a[1]);
  const bestDay = dayEntries.length ? dayEntries[0] : null;

  let bestStreak = 0, curS = 0;
  for (const p of settledPicks) { if(p.result==='win'){curS++;bestStreak=Math.max(bestStreak,curS);}else curS=0; }

  document.getElementById('mainContent').innerHTML = buildHTML({
    picks, wins, losses, pushes, pending, streak, bestStreak,
    tier, roman, actualElo, eloInTier, tierRange, eloPercent, eloToNext, nextTier,
    sharpScore, roi, winRate, avgOdds, clvAvg, myRank, totalTipsters, rankPct,
    recent14, roi14, wr14, pnl14, trend,
    radarAxes, flowState, divisionName,
    biggestWin, biggestWinDate, bestDay, myRank,
    activeSeason, pastSeasons, totalPnl, totalStake, rankingMeta,
    divScore, pointsAbove, demotionAtRisk, rankHistory
  });

  requestAnimationFrame(() => {
    setTimeout(() => {
      const fill = document.getElementById('heroBarFill');
      if (fill) fill.style.width = eloPercent + '%';

      document.querySelectorAll('[data-unlock-target]').forEach(el => {
        el.style.width = el.getAttribute('data-unlock-target') + '%';
      });

      document.querySelectorAll('.tl-item').forEach((el, i) => {
        setTimeout(() => el.classList.add('visible'), i * 80);
      });

      animateRadar();

      document.querySelectorAll('.moment-card').forEach((el, i) => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        el.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        setTimeout(() => {
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
        }, 300 + i * 60);
      });
    }, 50);
  });
}

function buildTimeline(picks, wins, losses, myRank, totalTipsters, sharpScore, divColor) {
  const events = [];
  if (!picks.length) return '<div class="tl-item visible"><div class="tl-node node-logo"><img src="/assets/logo/ledgr-icon.png" alt=""></div><div class="tl-body"><div class="tl-title">Your journey starts here</div><div class="tl-date">Every legend begins with pick #1</div></div></div>';

  const settled = picks.filter(p=>p.result==='win'||p.result==='loss').sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));

  events.push({type:'purple', icon:'🚀', title:'Journey Begins', date:picks[0].createdAt, large:true});

  const firstWin = picks.find(p=>p.result==='win');
  if (firstWin) events.push({type:'green', icon:'✓', title:'First Win', date:firstWin.createdAt});

  [10, 50, 100, 250].forEach(n => {
    if (picks.length >= n) {
      events.push({type:'gold', icon:'#', title:`Pick #${n}`, date:picks[n-1]?.createdAt});
    }
  });

  let cur=0, bestS=0, streakDate=null;
  for (const p of settled) {
    if (p.result==='win'){cur++;if(cur>bestS){bestS=cur;streakDate=p.createdAt;}}else cur=0;
  }
  if (bestS >= 5) events.push({type:'green', icon:'🔥', title:`${bestS}W Winning Streak`, date:streakDate, large:true});

  const byDay = {};
  picks.forEach(p=>{const d=new Date(p.createdAt).toISOString().slice(0,10);byDay[d]=(byDay[d]||0)+(p.pnl||0);});
  const bestDay = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  if (bestDay && bestDay[1] > 0) events.push({type:'gold', icon:'💰', title:`Best Day: +${bestDay[1].toFixed(1)}u`, date:bestDay[0]+'T12:00:00Z'});

  if (sharpScore >= 70) events.push({type:'green', icon:'✓', title:'Verified Sharp Achieved', date:null, large:true});

  events.sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));

  return `<div class="tl-spine"><div class="tl-spine-fill" style="height:0%;--fill:100%"></div></div>` +
    events.map((ev, i) => {
      const dateStr = ev.date ? new Date(ev.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}) : 'Recently';
      const isFirst = i === 0;
      const nodeClass = isFirst ? 'node-logo' : `node-${ev.type}`;
      const iconContent = isFirst ? `<img src="/assets/logo/ledgr-icon.png" style="width:16px;height:16px;opacity:0.7" alt="">` : ev.icon;
      const bodyClass = `tl-body tl-body-${ev.type}`;
      const large = ev.large ? ' node-large' : '';
      return `
        <div class="tl-item">
          <div class="tl-node ${nodeClass}${large}">${iconContent}</div>
          <div class="${bodyClass}">
            <div class="tl-title">${ev.title}</div>
            <div class="tl-date">${dateStr}</div>
          </div>
        </div>
      `;
    }).join('');
}

  const divOrder = ['BRONZE','SILVER','GOLD','PLATINUM','DIAMOND','ELITE','LEGENDARY'];

  const currentDivIdx = divOrder.indexOf(divisionName);
  const nextDiv = divOrder[currentDivIdx + 1];

  const candidates = [];

  candidates.push({
    label: '🔥 Hot Streak Badge',
    current: streak,
    target: 5,
    text: `${streak}/5 consecutive wins`
  });

  if (totalPnl < 500) candidates.push({
    label: '💰 500u Profit',
    current: Math.max(0, totalPnl),
    target: 500,
    text: `${totalPnl.toFixed(1)}u / 500u`
  });

  if (picks.length >= 10) candidates.push({
    label: '📈 CLV Master',
    current: Math.max(0, clvAvg + 2),
    target: 7,
    text: `CLV avg: ${clvAvg.toFixed(1)}% / +5% target`
  });

  if (nextDiv) {
    const divScore = (()=>{
      const w=picks.filter(p=>p.result==='win').length;
      const l=picks.filter(p=>p.result==='loss').length;
      const stake=picks.reduce((s,p)=>s+(p.stake||0),0);
      const pnl=picks.reduce((s,p)=>s+(p.pnl||0),0);
      const roi=stake>0?(pnl/stake)*100:0;
      const wr=(w+l)>0?(w/(w+l))*100:0;
      return Math.round(Math.min(40,Math.max(0,(roi/20)*40))+Math.min(30,Math.max(0,(wr/70)*30))+Math.min(20,Math.max(0,(picks.length/100)*20))+Math.min(10,picks.length));
    })();
    candidates.push({
      label: `${nextDiv.charAt(0)+nextDiv.slice(1).toLowerCase()} Division`,
      current: Math.max(0, divScore - divThresh[divisionName]),
      target: divThresh[nextDiv] - divThresh[divisionName],
      text: `${divScore}/${divThresh[nextDiv]} points`
    });
  }

  [50, 100].forEach(n => {
    if (picks.length < n) candidates.push({
      label: `📋 ${n} Picks`,
      current: picks.length,
      target: n,
      text: `${picks.length}/${n} picks`
    });
  });

  if (sharpScore < 70) candidates.push({
    label: '🎯 Verified Sharp',
    current: Math.max(0, sharpScore),
    target: 70,
    text: `Sharp Score: ${sharpScore.toFixed(0)}/70`
  });

  const shown = candidates
    .filter(c => c.target > 0 && (c.current / c.target) > 0.05)
    .sort((a,b) => (b.current/b.target) - (a.current/a.target))
    .slice(0, 4);

  if (!shown.length) return '<div style="color:var(--mu);font-family:var(--font-body);font-size:13px">Keep posting picks to unlock achievements.</div>';

  return shown.map(u => {
    const pct = Math.min(100, Math.round((u.current / u.target) * 100));
    const near = pct >= 80;
    return `
      <div class="unlock-item">
        <div class="unlock-label">
          <span>${u.label}</span>
          <span class="unlock-prog-text">${u.text}</span>
        </div>
        <div class="unlock-track">
          <div class="unlock-fill${near?' fill-near':''}" style="width:0%" data-unlock-target="${pct}"></div>
        </div>
      </div>
    `;
  }).join('');
}

function buildSparkline(picks) {
  const now = Date.now();
  const cutoff = now - 14*24*3600*1000;
  const recent = picks.filter(p=>new Date(p.createdAt).getTime()>=cutoff).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  if (recent.length < 2) return '';
  let cum=0;
  const points = recent.map(p=>{cum+=(p.pnl||0);return cum;});
  const min=Math.min(0,...points), max=Math.max(0,...points);
  const range=max-min||1;
  const W=300,H=120;
  const pts = points.map((v,i)=>`${(i/(points.length-1))*W},${H-((v-min)/range)*(H-10)-5}`).join(' ');
  const isPos = points[points.length-1] >= 0;
  const color = isPos ? '#00e5a0' : '#ff3355';
  return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
    <polygon points="0,${H} ${pts} ${W},${H}" fill="${color}" opacity="0.3"/>`;
}

function buildRadar(axes, divColor) {
  const N = axes.length;
  const cx = 140, cy = 140, R = 100;
  const angleStep = (2 * Math.PI) / N;

  function point(r, i) {
    const angle = -Math.PI/2 + i * angleStep;
    return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  }

  let gridRings = '';
  [0.25, 0.5, 0.75, 1].forEach(frac => {
    const pts = Array.from({length:N},(_,i)=>point(R*frac,i).join(',')).join(' ');
    gridRings += `<polygon points="${pts}" class="radar-grid"/>`;
  });

  let axisLines = '';
  for (let i=0;i<N;i++) {
    const [x,y]=point(R,i);
    axisLines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="radar-axis"/>`;
  }

  const dataPts = axes.map((a,i)=>point(R*(a.value/100),i).join(',')).join(' ');

  let labels='';
  axes.forEach((a,i) => {
    const [lx,ly]=point(R+24,i);
    const [vx,vy]=point(R*(a.value/100)+14,i);
    const anchor=lx<cx-5?'end':lx>cx+5?'start':'middle';
    labels+=`<text x="${lx}" y="${ly+4}" class="radar-label" text-anchor="${anchor}">${a.label}</text>`;
    labels+=`<text x="${vx}" y="${vy+4}" class="radar-value" text-anchor="middle">${a.value}</text>`;
  });

  const logo=`<image href="/assets/logo/ledgr-icon.png" x="${cx-14}" y="${cy-14}" width="28" height="28" opacity="0.15"/>`;

  return `<svg class="radar-svg" viewBox="0 0 280 280" id="radarSvg">
    ${gridRings}
    ${axisLines}
    <polygon id="radarPoly" points="${dataPts}" fill="${divColor}" fill-opacity="0.2" stroke="${divColor}" stroke-width="2" class="radar-polygon"/>
    ${labels}
    ${logo}
  </svg>`;
}

function animateRadar() {
  const poly = document.getElementById('radarPoly');
  if (!poly) return;
  const finalPts = poly.getAttribute('points');
  const N = 6;
  const cx=140,cy=140;
  const collapsedPts = Array(N).fill(`${cx},${cy}`).join(' ');
  poly.setAttribute('points', collapsedPts);
  requestAnimationFrame(() => {
    poly.style.transition = 'points 0.8s ease-out';
    setTimeout(() => { poly.setAttribute('points', finalPts); }, 50);
  });
}

function buildSeasonSection(activeSeason, pastSeasons, myRank, divisionName, rankHistory) {
  rankHistory = rankHistory || [];
  const DIV_REWARDS = {
    BRONZE:   { icon:'▲', label:'Basic Badge', color:'#b47850' },
    SILVER:   { icon:'◆', label:'Profile Border', color:'#94a3b8' },
    GOLD:     { icon:'★', label:'Gold Name', color:'#fbbf24' },
    PLATINUM: { icon:'⬡', label:'Animated Ring', color:'#38bdf8' },
    DIAMOND:  { icon:'✦', label:'Particle FX', color:'#b89fff' },
    ELITE:    { icon:'⊕', label:'Elite Aura', color:'#e879a0' },
    LEGENDARY:{ icon:'◉', label:'HOF Entry', color:'#fbbf24' },
  };
  const divOrder = ['BRONZE','SILVER','GOLD','PLATINUM','DIAMOND','ELITE','LEGENDARY'];
  const currentDivIdx = divOrder.indexOf(divisionName);

  const daysLeft = activeSeason ? (()=>{
    try {
      const end = new Date(activeSeason.endsAt || activeSeason.endDate);
      const diff = Math.ceil((end - Date.now()) / (1000*3600*24));
      return Math.max(0, diff);
    } catch(e){ return null; }
  })() : null;

  const seasonPct = daysLeft != null && activeSeason ? (()=>{
    try {
      const start=new Date(activeSeason.startsAt||activeSeason.startDate||activeSeason.createdAt);
      const end=new Date(activeSeason.endsAt||activeSeason.endDate);
      const total=end-start; const elapsed=Date.now()-start;
      return Math.min(100,Math.max(0,Math.round(elapsed/total*100)));
    }catch(e){return 0;}
  })() : 0;

  const rewardsRow = divOrder.map((div, idx) => {
    const rw = DIV_REWARDS[div];
    const isPast = idx < currentDivIdx;
    const isCurrent = idx === currentDivIdx;
    const isLocked = idx > currentDivIdx;
    const cls = isPast?'rew-unlocked':isCurrent?'rew-current':'rew-locked';
    return `<div class="rew-item ${cls}" style="${isCurrent?'border-color:'+rw.color+';':isPast?'border-color:rgba(0,229,160,0.2);':''}">
      <span class="rew-icon">${isPast?'✓':isLocked?'🔒':rw.icon}</span>
      <div class="rew-div" style="color:${rw.color}">${div}</div>
      <div class="rew-label">${rw.label}</div>
    </div>`;
  }).join('');

  const pastHTML = pastSeasons.length ? `
    <div style="margin-top:12px;font-family:var(--font-mono);font-size:10px;color:var(--mu)">
      ${pastSeasons.slice(0,3).map(s=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd)">${s.name||'Past Season'} · ${s.champion?'Champion: @'+s.champion:'No champion'}</div>`).join('')}
    </div>
  ` : '';

  // Division change history from weekly snapshots
  let divHistoryHTML = '';
  if (rankHistory.length >= 2) {
    const changes = [];
    for (let i = 1; i < rankHistory.length; i++) {
      const prev = rankHistory[i-1];
      const cur  = rankHistory[i];
      if (prev.division && cur.division && prev.division !== cur.division) {
        const divOrder = ['BRONZE','SILVER','GOLD','PLATINUM','DIAMOND','ELITE','LEGENDARY'];
        const prevIdx = divOrder.indexOf(prev.division);
        const curIdx  = divOrder.indexOf(cur.division);
        if (prevIdx !== -1 && curIdx !== -1) {
          changes.push({
            week:      cur.isoWeek,
            direction: curIdx > prevIdx ? 'up' : 'down',
            from:      prev.division,
            to:        cur.division,
          });
        }
      }
    }
    if (changes.length) {
      divHistoryHTML = `<div style="margin-top:16px">
        <div style="font-family:var(--font-mono);font-size:9px;letter-spacing:2px;color:var(--mu);text-transform:uppercase;margin-bottom:8px">Division History</div>
        ${changes.slice(-5).reverse().map(c=>`
          <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-family:var(--font-mono);font-size:10px">
            <span style="color:${c.direction==='up'?'var(--gr)':'var(--rd)'}">${c.direction==='up'?'↑ Promoted':'↓ Demoted'}</span>
            <span style="color:var(--mu2)">${c.from} → ${c.to}</span>
            <span style="color:var(--mu);margin-left:auto">${c.week}</span>
          </div>`).join('')}
      </div>`;
    }
  }

  return `
    <div class="sec-title">Season Progression</div>
    <div class="season-hero">
      <div class="season-name">${activeSeason?(activeSeason.name||'CURRENT SEASON'):'SEASON'}</div>
      <div class="season-days">${daysLeft!=null?daysLeft+' days remaining':'Season active'}${myRank?` · #${myRank} this season`:''}</div>
      <div class="season-countdown-track">
        <div class="season-countdown-fill" style="width:${seasonPct}%"></div>
      </div>
      <div class="rewards-row">${rewardsRow}</div>
      ${divHistoryHTML}
      ${pastHTML}
    </div>
  `;
}

function logout(){['ledgr_token','ledgr_user','token','user','username'].forEach(k=>localStorage.removeItem(k));window.location.href='/';}

loadProgress();
