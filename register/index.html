<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Sign Up</title>
<meta name="description" content="Create your free LEDGR account — build a verified sports tipster record, post picks, and compete on the leaderboard.">
<meta property="og:title" content="Join LEDGR — Free Verified Tipster Account">
<meta property="og:description" content="Create your free account and start building a verified sports tipster record. Real picks. Real results.">
<meta property="og:image" content="https://getledgr.bet/og-image.png">
<meta property="og:url" content="https://getledgr.bet/register">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Join LEDGR — Free Verified Tipster Account">
<meta name="twitter:description" content="Create your free account and start building a verified sports tipster record.">
<meta name="twitter:image" content="https://getledgr.bet/og-image.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/brand.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0A0A0A;--s1:#121212;--s2:#1E1E1E;--bd:#2A2A2A;--bd2:rgba(123,44,255,0.4);--ac:#7B2CFF;--acg:rgba(123,44,255,0.08);--tx:#E6E6E6;--mu:#6B6B6B;--mu2:#9590b8;--gr:#00E5A0;--rd:#FF3355}
body{background:var(--bg);color:var(--tx);font-family:'Barlow',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.box{background:#121212;border:1px solid #2A2A2A;border-radius:16px;padding:40px;width:100%;max-width:400px;position:relative;z-index:1}
.logo{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:28px;letter-spacing:6px;color:var(--tx);text-decoration:none;display:block;text-align:center;margin-bottom:8px}
.logo span{color:var(--ac)}
.hero-tag{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:2px;margin-bottom:28px}
.form-label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;margin-top:14px}
.form-input{width:100%;background:#1E1E1E;border:1px solid #2A2A2A;border-radius:8px;color:#E6E6E6;font-size:13px;padding:12px 14px;outline:none;font-family:'Barlow',sans-serif;transition:border-color .2s}
.form-input:focus{border-color:var(--bd2)}
.form-input::placeholder{color:var(--mu)}
.submit-btn{width:100%;background:#7B2CFF;color:#fff;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s;margin-top:20px}
.submit-btn:hover{background:#9b4dff}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:12px;text-align:center;font-size:12px;font-family:'JetBrains Mono',monospace;min-height:16px}
.login-link{display:block;text-align:center;margin-top:16px;font-size:11px;color:var(--mu);font-family:'JetBrains Mono',monospace}
.login-link a{color:var(--ac);text-decoration:none}
.back{display:block;text-align:center;margin-top:12px;font-size:11px;color:var(--mu);font-family:'JetBrains Mono',monospace;text-decoration:none}
.back:hover{color:var(--ac)}
</style>
</head>
<body>
<div class="box">
  <a href="/" class="logo">LEDG<span>R</span></a>
  <div class="hero-tag">CREATE YOUR ACCOUNT</div>
  <label class="form-label">Email</label>
  <input type="email" id="regEmail" class="form-input" placeholder="your@email.com">
  <label class="form-label">Username</label>
  <input type="text" id="regUsername" class="form-input" placeholder="e.g. sharpbettor99">
  <label class="form-label">Password</label>
  <input type="password" id="regPassword" class="form-input" placeholder="Min 6 characters">
  <button class="submit-btn" id="registerBtn" onclick="handleRegister()">Create Account →</button>
  <div class="msg" id="authMsg"></div>
  <div class="login-link">Already have an account? <a href="/login">Log in →</a></div>
  <a href="/" class="back">← Back to homepage</a>
</div>
<script src="/verify.js"></script>
<script>
const API='https://ledgr-backend-production-c132.up.railway.app';
(function(){
  const u=localStorage.getItem('ledgr_user')||localStorage.getItem('user');
  const t=localStorage.getItem('ledgr_token')||localStorage.getItem('token');
  if(u&&t)window.location.href='/home';
})();
function setMsg(msg,color){const el=document.getElementById('authMsg');el.textContent=msg;el.style.color=color||'var(--mu)';}
async function handleRegister(){
  const email=document.getElementById('regEmail').value.trim();
  const username=document.getElementById('regUsername').value.trim();
  const password=document.getElementById('regPassword').value;
  if(!email||!username||!password){setMsg('Please fill in all fields','var(--rd)');return;}
  if(password.length<6){setMsg('Password must be at least 6 characters','var(--rd)');return;}
  if(username.length<3){setMsg('Username must be at least 3 characters','var(--rd)');return;}
  const btn=document.getElementById('registerBtn');
  btn.disabled=true;btn.textContent='Creating account...';
  setMsg('Setting up your account...','var(--mu)');
  try{
    const r=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,username,password})});
    const d=await r.json();
    if(d.message){
      // Re-enable button before handing off so "Back" restores it correctly
      btn.disabled=false;btn.textContent='Create Account →';
      window.VerifyEmail.show({
        email,
        box:document.querySelector('.box'),
        onSuccess(data){
          localStorage.setItem('ledgr_token',data.token);
          localStorage.setItem('ledgr_user',JSON.stringify(data.user));
          localStorage.setItem('token',data.token);
          localStorage.setItem('user',JSON.stringify(data.user));
          window.location.href='/home';
        }
      });
    }else{
      setMsg(d.error||'Could not create account','var(--rd)');
      btn.disabled=false;btn.textContent='Create Account →';
    }
  }catch(e){
    setMsg('Connection error — try again','var(--rd)');
    btn.disabled=false;btn.textContent='Create Account →';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')handleRegister();});
</script>
</body>
</html>
