<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07060d;--s1:#0c0a1a;--s2:#15122a;--bd:rgba(184,159,255,0.1);--bd2:rgba(184,159,255,0.18);--ac:#b89fff;--acg:rgba(184,159,255,0.08);--tx:#f0edff;--mu:#6a6690;--mu2:#9590b8;--gr:#34d399;--rd:#f87171}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.4}
.orb{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(124,95,230,0.07),transparent 70%);pointer-events:none;z-index:0}
.box{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:40px;width:100%;max-width:400px;position:relative;z-index:1}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:6px;color:var(--tx);text-decoration:none;display:block;text-align:center;margin-bottom:8px}
.logo span{color:var(--ac)}
.hero-tag{text-align:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:2px;margin-bottom:28px}
.form-label{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;margin-top:14px}
.form-input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px;padding:12px 14px;outline:none;font-family:'Syne',sans-serif;transition:border-color .2s}
.form-input:focus{border-color:var(--bd2)}
.form-input::placeholder{color:var(--mu)}
.submit-btn{width:100%;background:var(--ac);color:#07060d;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;transition:all .2s;margin-top:20px}
.submit-btn:hover{background:#cdb8ff}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:12px;text-align:center;font-size:12px;font-family:'DM Mono',monospace;min-height:16px}
.login-link{display:block;text-align:center;margin-top:16px;font-size:11px;color:var(--mu);font-family:'DM Mono',monospace}
.login-link a{color:var(--ac);text-decoration:none}
.back{display:block;text-align:center;margin-top:12px;font-size:11px;color:var(--mu);font-family:'DM Mono',monospace;text-decoration:none}
.back:hover{color:var(--ac)}
</style>
</head>
<body>
<div class="orb"></div>
<div class="box">
  <a href="/" class="logo">LEDG<span>R</span></a>
  <div class="hero-tag">CREATE YOUR ACCOUNT</div>
  <label class="form-label">Email</label>
  <input type="email" id="regEmail" class="form-input" placeholder="your@email.com">
  <label class="form-label">Username</label>
  <input type="text" id="regUsername" class="form-input" placeholder="e.g. sharpbettor99">
  <label class="form-label">Password</label>
  <input type="password" id="regPassword" class="form-input" placeholder="Min 6 characters">
  <button class="submit-btn" id="registerBtn" onclick="handleRegister()">Create Account →</button>
  <div class="msg" id="authMsg"></div>
  <div class="login-link">Already have an account? <a href="/login">Log in →</a></div>
  <a href="/" class="back">← Back to homepage</a>
</div>
<script src="/verify.js"></script>
<script>
const API='https://ledgr-backend-production-c132.up.railway.app';
(function(){
  const u=localStorage.getItem('ledgr_user')||localStorage.getItem('user');
  const t=localStorage.getItem('ledgr_token')||localStorage.getItem('token');
  if(u&&t)window.location.href='/home';
})();
function setMsg(msg,color){const el=document.getElementById('authMsg');el.textContent=msg;el.style.color=color||'var(--mu)';}
async function handleRegister(){
  const email=document.getElementById('regEmail').value.trim();
  const username=document.getElementById('regUsername').value.trim();
  const password=document.getElementById('regPassword').value;
  if(!email||!username||!password){setMsg('Please fill in all fields','var(--rd)');return;}
  if(password.length<6){setMsg('Password must be at least 6 characters','var(--rd)');return;}
  if(username.length<3){setMsg('Username must be at least 3 characters','var(--rd)');return;}
  const btn=document.getElementById('registerBtn');
  btn.disabled=true;btn.textContent='Creating account...';
  setMsg('Setting up your account...','var(--mu)');
  try{
    const r=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,username,password})});
    const d=await r.json();
    if(d.message){
      window.VerifyEmail.show({
        email,
        box:document.querySelector('.box'),
        onSuccess(data){
          localStorage.setItem('ledgr_token',data.token);
          localStorage.setItem('ledgr_user',JSON.stringify(data.user));
          localStorage.setItem('token',data.token);
          localStorage.setItem('user',JSON.stringify(data.user));
          window.location.href='/home';
        }
      });
    }else{
      setMsg(d.error||'Could not create account','var(--rd)');
      btn.disabled=false;btn.textContent='Create Account →';
    }
  }catch(e){
    setMsg('Connection error — try again','var(--rd)');
    btn.disabled=false;btn.textContent='Create Account →';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')handleRegister();});
</script>
</body>
</html>
