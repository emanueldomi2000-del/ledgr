<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0A0A0A;--s1:#0c0a1a;--bd:rgba(184,159,255,0.1);--bd2:rgba(184,159,255,0.18);--ac:#b89fff;--acg:rgba(184,159,255,0.08);--tx:#f0edff;--mu:#6a6690;--mu2:#9590b8;--gr:#34d399;--rd:#f87171}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.4}
.orb{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(124,95,230,0.06),transparent 70%);pointer-events:none;z-index:0}
.content{position:relative;z-index:1;max-width:480px}
.num{font-family:'Bebas Neue',sans-serif;font-size:clamp(100px,20vw,180px);letter-spacing:-4px;line-height:.85;color:var(--tx);margin-bottom:0;-webkit-text-stroke:2px rgba(184,159,255,0.15)}
.num span{color:var(--ac)}
.title{font-family:'Bebas Neue',sans-serif;font-size:clamp(24px,4vw,36px);letter-spacing:3px;color:var(--mu2);margin-bottom:16px}
.desc{font-size:14px;color:var(--mu2);line-height:1.8;margin-bottom:40px;font-family:'DM Mono',monospace}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-a{background:var(--ac);color:#07060d;padding:13px 28px;border-radius:7px;font-size:13px;font-weight:700;text-decoration:none;transition:all .2s}
.btn-a:hover{background:#cdb8ff;transform:translateY(-2px)}
.btn-b{color:var(--mu2);padding:13px 28px;border-radius:7px;font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--bd2);transition:all .2s}
.btn-b:hover{border-color:rgba(184,159,255,.35);color:var(--ac)}
.logo{display:block;margin-bottom:48px;line-height:0}
