<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/logo/ledgr-icon.png">
<title>LEDGR — Archetype Vault</title>
<meta name="description" content="Discover your betting DNA. 15 archetypes detected automatically from your pick history.">
<meta property="og:title" content="LEDGR — Archetype Vault">
<meta property="og:description" content="Your competitive identity, detected automatically from your betting history.">
<meta property="og:image" content="https://getledgr.bet/assets/logo/ledgr-logo.png">
<meta property="og:url" content="https://getledgr.bet/archetypes">
<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--profile-accent:#7B2CFF}
body{background:var(--bg);color:var(--tx);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:1;opacity:.4}
.bg-glow{position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:900px;height:600px;background:radial-gradient(ellipse,rgba(124,95,230,0.05),transparent 70%);pointer-events:none;z-index:0}

/* MAIN */
.main{max-width:1120px;margin:0 auto;padding:60px 24px 100px;position:relative;z-index:2}
.not-logged{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:16px}
.not-logged h2{font-family:var(--font-display);font-size:48px;letter-spacing:3px;color:var(--mu)}

/* HERO */
.hero{text-align:center;margin-bottom:72px}
.hero-eyebrow{font-family:var(--font-mono);font-size:10px;color:var(--mu);letter-spacing:4px;text-transform:uppercase;margin-bottom:20px}
.hero-title{font-family:var(--font-display);font-size:clamp(64px,11vw,120px);letter-spacing:2px;line-height:.88;color:var(--tx);margin-bottom:16px}
.hero-title span{color:var(--ac)}
.hero-sub{font-size:15px;color:var(--mu2);line-height:1.7;max-width:520px;margin:0 auto 40px}

/* CURRENT ARCHETYPE */
.current-arch-wrap{margin-bottom:72px}
.section-label{font-family:var(--font-mono);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--mu);margin-bottom:20px;display:flex;align-items:center;gap:12px}
.section-label::after{content:'';flex:1;height:1px;background:var(--bd)}
.current-card{border-radius:24px;padding:40px;position:relative;overflow:hidden;border:1px solid rgba(184,159,255,0.15)}
.current-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(184,159,255,0.08),transparent 60%);pointer-events:none}
.current-inner{display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center}
.ca-icon{font-size:72px;line-height:1;filter:drop-shadow(0 0 20px currentColor)}
.ca-name{font-family:var(--font-display);font-size:clamp(36px,6vw,64px);letter-spacing:3px;line-height:1;margin-bottom:8px}
.ca-desc{font-size:14px;color:var(--mu2);line-height:1.6;margin-bottom:20px;max-width:480px}
.ca-rarity{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:1px;padding:5px 12px;border-radius:20px;border:1px solid;margin-bottom:16px}
.ca-stats{display:flex;flex-direction:column;gap:8px;min-width:160px}
.ca-stat-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ca-stat-lbl{font-family:var(--font-mono);font-size:9px;color:var(--mu);letter-spacing:1px}
.ca-stat-val{font-family:var(--font-display);font-size:22px;letter-spacing:1px}
.ca-conf-bar{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-top:16px}
.ca-conf-fill{height:100%;border-radius:2px;transition:width .8s ease}
.ca-undefined{text-align:center;padding:60px 40px}
.ca-undefined-icon{font-size:64px;margin-bottom:20px;opacity:.3}
.ca-undefined-title{font-family:var(--font-display);font-size:32px;letter-spacing:3px;color:var(--mu);margin-bottom:8px}
.ca-undefined-sub{font-family:var(--font-mono);font-size:11px;color:var(--mu);line-height:1.7}

/* ARCHETYPE GRID */
.arch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:72px}
.arch-card{background:var(--s1);border:1.5px solid var(--bd);border-radius:18px;padding:24px 20px;position:relative;transition:all .2s;overflow:hidden}
.arch-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none}
.arch-card:hover{transform:translateY(-3px)}
.arch-card.unlocked:hover{border-color:var(--bd2)}
.arch-card.matched{border-color:rgba(184,159,255,0.3)}
.arch-card.matched::before{opacity:1}
.arch-card.is-primary{transform:translateY(-4px)}
.arch-card.greyed{opacity:.45;filter:grayscale(80%)}
.arch-match-badge{position:absolute;top:12px;right:12px;font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:20px;background:rgba(184,159,255,0.12);border:1px solid rgba(184,159,255,0.2);color:var(--ac)}
.arch-primary-badge{position:absolute;top:12px;right:12px;font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:1.5px;padding:3px 8px;border-radius:20px;color:#07060d}
.arch-icon{font-size:36px;margin-bottom:14px;display:block;line-height:1}
.arch-name{font-family:var(--font-display);font-size:18px;letter-spacing:2px;margin-bottom:6px}
.arch-desc{font-size:11px;color:var(--mu2);line-height:1.55;font-family:var(--font-mono);margin-bottom:12px}
.arch-rarity{font-family:var(--font-mono);font-size:9px;color:var(--mu);letter-spacing:.5px}
.arch-lock{display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9px;color:var(--mu);margin-top:8px}
.arch-conditions{list-style:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.arch-conditions li{font-family:var(--font-mono);font-size:9px;color:var(--mu2);padding:2px 0 2px 10px;position:relative;line-height:1.4}
.arch-conditions li::before{content:'·';position:absolute;left:0;color:var(--ac);opacity:.6}

/* EVOLUTION PATH */
.evolution-wrap{margin-bottom:72px}
.evo-grid{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:16px;align-items:center}
.evo-node{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:20px;text-align:center}
.evo-node.current{border-color:rgba(184,159,255,0.35);background:rgba(184,159,255,0.05)}
.evo-icon{font-size:32px;margin-bottom:8px}
.evo-name{font-family:var(--font-display);font-size:15px;letter-spacing:2px;margin-bottom:4px}
.evo-pct{font-family:var(--font-mono);font-size:10px;color:var(--mu)}
.evo-arrow{font-size:20px;color:var(--mu);text-align:center}
.evo-req{font-family:var(--font-mono);font-size:9px;color:var(--mu);text-align:center;line-height:1.5;padding:8px}

/* HOW IT WORKS */
.how-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.how-card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:24px}
.how-num{font-family:var(--font-display);font-size:48px;color:rgba(184,159,255,0.12);letter-spacing:2px;line-height:1;margin-bottom:8px}
.how-title{font-family:var(--font-display);font-size:16px;letter-spacing:2px;margin-bottom:8px}
.how-desc{font-family:var(--font-mono);font-size:10px;color:var(--mu2);line-height:1.6}

/* SECTION HEADERS */
.section-hd{margin-bottom:48px}
.s-eyebrow{font-family:var(--font-mono);font-size:9px;color:var(--mu);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}
.s-title{font-family:var(--font-display);font-size:clamp(32px,5vw,52px);letter-spacing:2px;color:var(--tx);margin-bottom:8px}
.s-sub{font-size:13px;color:var(--mu2);line-height:1.6}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--gr);color:#07060d;padding:12px 24px;border-radius:10px;font-family:var(--font-display);font-size:16px;letter-spacing:2px;z-index:1000;transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.toast.show{transform:translateY(0);opacity:1}

.loading-state{text-align:center;padding:80px 40px;font-family:var(--font-mono);font-size:12px;color:var(--mu)}

@media(max-width:768px){.current-inner{grid-template-columns:1fr;text-align:center}.ca-stats{min-width:unset}.evo-grid{grid-template-columns:1fr;gap:8px}.evo-arrow{transform:rotate(90deg)}}
@media(max-width:600px){.arch-grid{grid-template-columns:repeat(2,1fr)}.hero-title{font-size:64px}}

/* ── RARITY ── */
.rarity-pill{display:inline-block;font-size:8px;letter-spacing:0.15em;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:20px;margin-bottom:6px}

/* ── LOCKED CARDS ── */
.arch-card.locked-card{opacity:0.5;filter:grayscale(0.8);cursor:not-allowed;text-align:center;padding:20px 12px}
.arch-card.locked-card:hover{opacity:0.75;filter:grayscale(0.5);transform:none}
.locked-icon{font-size:28px;opacity:0.35;margin-bottom:8px}
.locked-name{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--mu);letter-spacing:0.05em;margin-bottom:6px}
.locked-hint{font-size:9px;color:var(--mu);font-family:'Syne',sans-serif;font-style:italic;line-height:1.5;margin-top:6px}

/* ── VAULT CARD HOVER ── */
.arch-vault-card{position:relative;overflow:hidden;transition:all 0.25s ease;cursor:pointer}
.arch-vault-card.common:hover{transform:translateY(-4px);border-color:#6B6B6B!important}
.arch-vault-card.rare:hover{transform:translateY(-4px);border-color:#4FC3F7!important;box-shadow:0 0 16px rgba(79,195,247,0.25)}
.arch-vault-card.epic:hover{transform:translateY(-4px);border-color:#7B2CFF!important;box-shadow:0 0 20px rgba(123,44,255,0.35)}
.arch-vault-card.legendary:hover{transform:translateY(-4px);border-color:#FFD700!important;box-shadow:0 0 24px rgba(255,215,0,0.4)}
.arch-vault-card.mythic:hover{border-color:#FF6BFF!important;box-shadow:0 0 24px rgba(255,107,255,0.4);animation:mythicGlitch 0.3s steps(2) infinite}
@keyframes mythicBorder{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}

/* ── CSS CHARACTER ART ── */
.css-char{position:relative;width:80px;height:100px;margin:0 auto}
.char-head{width:36px;height:36px;border-radius:50%;position:absolute;top:0;left:50%;transform:translateX(-50%)}
.char-body{width:44px;height:48px;border-radius:8px 8px 4px 4px;position:absolute;top:34px;left:50%;transform:translateX(-50%)}
.char-hood{width:42px;height:24px;border-radius:50% 50% 0 0;position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:2}
.char-visor{width:30px;height:8px;border-radius:4px;position:absolute;top:14px;left:50%;transform:translateX(-50%);box-shadow:0 0 8px rgba(123,44,255,0.8);z-index:3}
.char-scope{width:20px;height:3px;border-radius:2px;position:absolute;top:24px;right:0}
.char-horns{width:8px;height:16px;border-radius:4px 4px 0 0;background:#FF3355;position:absolute;top:-10px;left:10px}
.char-horns::after{content:'';width:8px;height:16px;border-radius:4px 4px 0 0;background:#FF3355;position:absolute;left:18px}
.char-flames{width:44px;height:20px;position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,100,0,0.6),transparent);animation:flameFlicker 0.8s ease-in-out infinite alternate}
.char-glasses{width:32px;height:6px;position:absolute;top:14px;left:50%;transform:translateX(-50%);border:2px solid #00E5A0;border-radius:2px}
.char-glasses::before{content:'';position:absolute;left:-8px;top:-1px;width:8px;height:8px;border-radius:50%;border:2px solid #00E5A0}
.char-glasses::after{content:'';position:absolute;right:-8px;top:-1px;width:8px;height:8px;border-radius:50%;border:2px solid #00E5A0}
.char-data{width:6px;height:20px;position:absolute;top:40px;right:2px;background:linear-gradient(180deg,#00E5A0 0%,transparent 100%);opacity:0.6;animation:dataStream 2s linear infinite}
.char-glow{position:absolute;inset:-10px;border-radius:50%;opacity:0.3;animation:charGlow 3s ease-in-out infinite;pointer-events:none}
.char-ears{width:44px;height:20px;position:absolute;top:2px;left:50%;transform:translateX(-50%)}
.char-ears::before{content:'';width:10px;height:20px;border-radius:40% 40% 0 0;background:#1e1e2e;position:absolute;left:0;top:-8px}
.char-ears::after{content:'';width:10px;height:20px;border-radius:40% 40% 0 0;background:#1e1e2e;position:absolute;right:0;top:-8px}
.sniper-glow{background:radial-gradient(circle,#7B2CFF,transparent)}
.demon-glow{background:radial-gradient(circle,#FF3355,transparent)}
.hunter-glow{background:radial-gradient(circle,#fbbf24,transparent)}
.sharp-glow{background:radial-gradient(circle,#00E5A0,transparent)}
@keyframes flameFlicker{from{transform:translateX(-50%) scaleY(1)}to{transform:translateX(-50%) scaleY(1.2)}}
@keyframes charGlow{0%,100%{opacity:0.2;transform:scale(1)}50%{opacity:0.45;transform:scale(1.12)}}
@keyframes dataStream{from{opacity:0.6;transform:scaleY(1)}to{opacity:0.1;transform:scaleY(0.3)}}
.char-art-wrap{display:flex;justify-content:center;align-items:center;margin-bottom:8px;height:110px}

/* ── DNA HERO ── */
.dna-hero{position:relative;overflow:hidden;padding:48px 0 32px;text-align:center}
.dna-scan-line{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac),transparent);animation:scanMove 3s ease-in-out infinite;opacity:0.6}
@keyframes scanMove{0%{top:0%;opacity:0}10%{opacity:0.6}90%{opacity:0.6}100%{top:100%;opacity:0}}
.dna-eyebrow{font-size:10px;letter-spacing:0.3em;color:var(--ac);font-family:'DM Mono',monospace;margin-bottom:12px;animation:eyebrowPulse 3s ease-in-out infinite}
@keyframes eyebrowPulse{0%,100%{opacity:0.7}50%{opacity:1}}
.dna-main-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,7vw,80px);color:var(--tx);letter-spacing:0.03em;line-height:1;margin-bottom:12px}
.dna-subtitle{font-size:13px;color:var(--mu);font-family:'Syne',sans-serif;max-width:480px;margin:0 auto}
@keyframes dnaParticle{0%,100%{transform:translate(0,0);opacity:0.3}33%{transform:translate(10px,-15px);opacity:0.6}66%{transform:translate(-8px,10px);opacity:0.2}}

/* ── HOVER REVEAL ── */
.arch-hover-reveal{position:absolute;inset:0;background:rgba(10,10,10,0.92);border-radius:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;opacity:0;transition:opacity 0.2s ease;pointer-events:none}
.arch-vault-card:hover .arch-hover-reveal{opacity:1}
.arch-vault-card:hover{transform:translateY(-6px)}

/* ── EVO ANIMATED LINES ── */
.evo-connector{display:flex;flex-direction:column;align-items:center;padding:0 8px;gap:3px}
.evo-line{width:40px;height:2px;background:linear-gradient(90deg,var(--ac),rgba(123,44,255,0.2));position:relative;overflow:hidden}
.evo-line::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,white,transparent);animation:evoFlow 2s linear infinite}
@keyframes evoFlow{from{left:-100%}to{left:100%}}
.evo-condition{font-size:8px;color:var(--ac);font-family:'DM Mono',monospace;letter-spacing:0.05em;white-space:nowrap}

/* ── MATCH BARS ── */
.arch-match-bars{padding:0 4px}

/* ── ORB HERO ── */
.arch-hero-visual{display:flex;justify-content:center;margin-bottom:16px}
.arch-orb{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.arch-orb::before{content:'';position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,var(--arch-color,rgba(123,44,255,0.3)) 0%,transparent 70%);opacity:0.25;animation:orbGlow 4s ease-in-out infinite}
@keyframes orbGlow{0%,100%{opacity:0.2}50%{opacity:0.4}}
.arch-orb-icon{font-size:52px;z-index:2;position:relative;filter:drop-shadow(0 0 20px var(--arch-color,#7B2CFF));animation:orbFloat 4s ease-in-out infinite}
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.05)}}
.arch-orb-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--arch-color,#7B2CFF);opacity:0.3;animation:ringPulse 3s ease-in-out infinite}
.arch-orb-ring-2{inset:-16px;animation:ringPulse 3s ease-in-out infinite 1s;opacity:0.15}
@keyframes ringPulse{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:0.1;transform:scale(1.05)}}
.arch-class-label{font-size:9px;letter-spacing:0.25em;font-family:'DM Mono',monospace;margin-top:4px;margin-bottom:12px;padding:3px 10px;border-radius:20px;display:inline-block}

/* ── RARITY VISUAL WEIGHT ── */
.arch-vault-card.common{opacity:0.7;border-color:rgba(255,255,255,0.06)!important}
.arch-vault-card.rare{border-color:rgba(79,195,247,0.2)!important}
.arch-vault-card.epic{border-color:rgba(123,44,255,0.25)!important}
.arch-vault-card.epic::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#7B2CFF,transparent);pointer-events:none}
.arch-vault-card.legendary{border-color:rgba(255,215,0,0.25)!important}
.arch-vault-card.legendary::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,215,0,0.06),transparent);animation:legendaryShimmer 4s linear infinite;pointer-events:none}
@keyframes legendaryShimmer{from{left:-100%}to{left:200%}}
.arch-vault-card.mythic{grid-row:span 2;border-color:rgba(255,107,255,0.3)!important;animation:mythicBorderCycle 3s linear infinite}
@keyframes mythicBorderCycle{0%{border-color:rgba(255,107,255,0.3)}33%{border-color:rgba(123,44,255,0.3)}66%{border-color:rgba(79,195,247,0.3)}100%{border-color:rgba(255,107,255,0.3)}}
@keyframes mythicGlitch{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,2px)}100%{transform:translate(0,0)}}

/* ── CLASSIFIED LOCKED ── */
@keyframes classifiedBlink{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes glitchText{0%,100%{transform:translate(0)}25%{transform:translate(-1px,0)}75%{transform:translate(1px,0)}}

/* ── POSSIBLE FUTURES ── */
.pf-eyebrow{font-size:9px;letter-spacing:0.25em;color:var(--mu);font-family:'DM Mono',monospace;margin-bottom:8px}
.pf-title{font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--tx);letter-spacing:0.03em;margin-bottom:6px}
.pf-subtitle{font-size:12px;color:var(--mu);font-family:'Syne',sans-serif;margin-bottom:24px}
.pf-paths{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pf-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;text-align:center;transition:all 0.2s ease;position:relative;overflow:hidden}
.pf-card:hover{border-color:var(--ac);transform:translateY(-3px)}
.pf-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--pf-color,var(--ac)),transparent)}
.pf-pct{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--pf-color,var(--ac));margin-bottom:4px}
.pf-name{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--tx);margin-bottom:6px}
.pf-trigger{font-size:10px;color:var(--ac);font-family:'Syne',sans-serif}
@media(max-width:600px){.pf-paths{grid-template-columns:1fr}}

/* ── CINEMATIC HERO CARD ── */
.arch-hero-card{display:flex;gap:0;align-items:stretch;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:0;position:relative;overflow:hidden;min-height:260px}
.arch-hero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--arch-c,#7B2CFF),transparent);z-index:3}
.arch-portrait-area{flex:0 0 40%;min-height:260px;background:linear-gradient(160deg,rgba(0,0,0,0.5) 0%,rgba(0,0,0,0.2) 100%);border-right:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}

.p-ring-2{inset:-16px;opacity:0.2;animation-delay:1s}

.portrait-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,var(--arch-c,rgba(123,44,255,0.4)) 0%,transparent 70%);opacity:0.3;animation:glowPulse 3s ease-in-out infinite}

.portrait-particles{position:absolute;inset:0;pointer-events:none}
.arch-identity-area{flex:1;padding:32px 28px}

/* ── VAULT RARITY SIZES ── */
.arch-vault-card.mythic::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,107,255,0.05),transparent,rgba(123,44,255,0.05));animation:mythicShift 4s ease infinite alternate;pointer-events:none}

/* ── EVO TREE ── */

.evo-branch-pct{font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--ac);min-width:60px;line-height:1}
.evo-branch-name{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--tx)}
.evo-branch-trigger{font-size:10px;color:var(--ac);font-family:'Syne',sans-serif}

/* ── SCAN PROCESS ── */
.scan-process{max-width:600px}
@keyframes stepReveal{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes dotPulse{0%,100%{opacity:0.3}50%{opacity:1}}

/* ── CHARACTER PORTRAIT KEYFRAMES ── */
@keyframes visorPulse{0%,100%{opacity:0.9}50%{opacity:0.5}}
@keyframes ghostGlitch{0%,100%{transform:translate(0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
@keyframes glitchLine{0%{top:30%;opacity:0.4}33%{top:50%}66%{top:70%}100%{top:85%;opacity:0}}

/* ── VAULT GHOST MYTHIC SCANLINES ── */
.arch-vault-card[data-arch="The Ghost"]{border-color:rgba(255,107,255,0.3)!important;background:rgba(255,107,255,0.03)!important}
.arch-vault-card[data-arch="The Ghost"]::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,107,255,0.03) 2px,rgba(255,107,255,0.03) 4px);pointer-events:none;animation:scanlines 8s linear infinite}
@keyframes scanlines{from{background-position:0 0}to{background-position:0 100px}}
.arch-vault-card[data-arch="The Ghost"]:hover{animation:vaultGlitch 0.4s steps(3) infinite!important}
@keyframes vaultGlitch{0%{transform:translate(0);filter:hue-rotate(0deg)}33%{transform:translate(-2px,1px);filter:hue-rotate(30deg)}66%{transform:translate(2px,-1px);filter:hue-rotate(-30deg)}100%{transform:translate(0);filter:hue-rotate(0deg)}}

/* ── POSSIBLE FUTURES HEADER ── */

/* ── TERMINAL SCAN ── */
.terminal-scan{background:rgba(0,0,0,0.6);border:1px solid rgba(0,229,160,0.2);border-radius:10px;padding:20px;font-family:'DM Mono',monospace;font-size:12px;max-width:600px}

@keyframes termReveal{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:translateX(0)}}
</style>

window.onload = () => {
  const ud = localStorage.getItem('ledgr_user') || localStorage.getItem('user');
  const tk = localStorage.getItem('ledgr_token') || localStorage.getItem('token');
  if (!ud || !tk) { document.getElementById('notLogged').style.display='flex'; return; }
  try { user = JSON.parse(ud); } catch(e) { user = {id:null,username:ud}; }
  if (!user?.username) { document.getElementById('notLogged').style.display='flex'; return; }

  document.getElementById('app').style.display = 'block';

  loadData();
};

async function loadData() {
  const _ctrl=new AbortController();const _xt=setTimeout(()=>_ctrl.abort(),25000);
  try {
    const r = await fetch(API + '/rankings/' + user.username, {signal:_ctrl.signal});
    clearTimeout(_xt);
    if (!r.ok) throw new Error();
    const data = await r.json();
    const settled = (data.wins||0) + (data.losses||0);
    userStats = {
      picks: data.picks || data.totalPicks || 0,
      wins: data.wins || 0,
      losses: data.losses || 0,
      roi: typeof data.roi === 'number' ? data.roi : parseFloat(data.roi) || 0,
      winRate: settled > 0 ? Math.round((data.wins||0) / settled * 100) : 0,
      currentStreak: data.currentStreak || 0,
      bestStreak: data.bestStreak || 0,
      sharpScore: data.sharpScore || 0,
      avgOdds: data.avgOdds || 0,
      followers: data.followers || 0,
      highVariance: false,
      nightOwl: false,
    };
  } catch(e) {
    clearTimeout(_xt);
    userStats = {picks:0,wins:0,losses:0,roi:0,winRate:0,currentStreak:0,bestStreak:0,sharpScore:0,avgOdds:0,followers:0,highVariance:false,nightOwl:false};
  }

  // Compute all scores
  allScores = ARCHETYPES_DATA.map(a => ({
    ...a,
    sc: a.id === 'hybrid' ? 0 : a.score(userStats),
  }));
  const hybridA = ARCHETYPES_DATA.find(a => a.id === 'hybrid');
  allScores.find(x => x.id === 'hybrid').sc = hybridA.score(userStats, allScores);

  const sorted = [...allScores].sort((a, b) => b.sc - a.sc);
  primaryArchetype = sorted[0].sc >= 40 ? sorted[0] : null;

  renderCurrentCard(sorted);
  renderGrid(sorted);
  renderEvolution(sorted);
  renderSecretSlots();
  renderTerminal(primaryArchetype ? primaryArchetype.name : 'UNKNOWN');
  if (primaryArchetype) showDNAIntro(primaryArchetype.name, primaryArchetype.color);
}

function renderGrid(sorted) {
  const grid = document.getElementById('archetypeGrid');
  const isPrimary = primaryArchetype?.id;

  grid.innerHTML = sorted.map(a => {
    const isP = a.id === isPrimary;
    const sc = Math.round(a.sc);
    const matched = sc >= 40;
    const close = sc >= 20 && !matched;
    const grey = sc < 20 && !isP;
    const rar = archetypeRarity[a.id] || {tier:'Common', color:'#6B6B6B'};
    const rarCls = rar.tier.toLowerCase();
    const rarPill = `<div class="rarity-pill" style="color:${rar.color};border:1px solid ${rar.color}44;background:${rar.color}11">${rar.tier.toUpperCase()}</div>`;

    if (grey) {
      const unlockHint = unlockConditions[a.id] || 'Keep posting picks to unlock';
      return `<div class="arch-card locked-card arch-vault-card ${rarCls}" data-arch="${a.name}">
        ${rarPill}
        <div class="locked-icon">🔒</div>
        <div class="locked-name">?????</div>
        <div class="locked-hint">${unlockHint}</div>
      </div>`;
    }

    return `<div class="arch-card arch-vault-card ${rarCls} ${isP?'is-primary matched':(matched?'matched unlocked':'unlocked')}" data-arch="${a.name}" style="${isP?`background:${a.color}10;border-color:${a.color}44`:matched?`border-color:${a.color}33`:''}">
      ${isP ? `<div class="arch-primary-badge" style="background:${a.color}">YOUR DNA</div>` : sc>0?`<div class="arch-match-badge">${sc}%</div>`:''}
      ${rarPill}
      <div class="arch-icon">${a.icon}</div>
      <div class="arch-name" style="${isP||matched?`color:${a.color}`:'color:var(--mu2)'}">${a.name}</div>
      <div class="arch-desc">${a.desc}</div>
      <div class="arch-rarity">${a.rarity}% of bettors</div>
      ${isP || matched ? `<ul class="arch-conditions">${a.conditions.map(c=>`<li>${c}</li>`).join('')}</ul>` : ''}
      ${close ? '<div class="arch-lock">— Within reach</div>' : ''}
      <div class="arch-hover-reveal"><div style="font-size:9px;letter-spacing:0.2em;color:var(--mu);font-family:'DM Mono';margin-bottom:8px">POPULATION</div><div style="font-family:'Bebas Neue';font-size:28px;color:var(--ac)">${a.rarity}%</div><div style="margin-top:10px;width:100%">${getArchStats(a.name).map(s=>`<div style="display:flex;justify-content:space-between;font-size:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="color:var(--mu);font-family:'Syne'">${s.label}</span><span style="color:var(--tx);font-family:'DM Mono'">${s.val}</span></div>`).join('')}</div></div>
    </div>`;
  }).join('');
}

function renderEvolution(sorted) {
  const el = document.getElementById('evolutionPath');
  if (!primaryArchetype) {
    el.innerHTML = `<div class="pf-eyebrow">EVOLUTION PATH</div><div class="pf-title">POSSIBLE FUTURES</div><div class="loading-state" style="margin-top:24px">No archetype detected yet — keep posting picks.</div>`;
    return;
  }
  const p = primaryArchetype;
  const rawPaths = evolutionPaths[p.id] || [];
  const evoData = [...rawPaths.slice(0,2)];
  if (evoData.length < 2) {
    const used = new Set([p.id, ...evoData.map(e=>ARCHETYPES_DATA.find(a=>a.name===e.name)?.id).filter(Boolean)]);
    const fallback = sorted.find(x => x.id !== p.id && !used.has(x.id));
    if (fallback) evoData.push({name:fallback.name, pct:Math.max(10,Math.round(fallback.sc)), condition:fallback.conditions[0]||'+ adapt'});
  }
  const branchesHtml = evoData.map(e => `
    <div class="evo-branch">
      <div class="evo-branch-pct">${e.pct}%</div>
      <div>
        <div class="evo-branch-name">→ ${e.name.toUpperCase()}</div>
        <div class="evo-branch-trigger">${e.condition}</div>
      </div>
    </div>`).join('');
  el.innerHTML = `<div class="pf-eyebrow">EVOLUTION PATH</div>
    <div class="pf-hero-header">
      <div class="pf-scanning-text">YOUR MIND IS <span>SHIFTING</span></div>
      <div class="pf-current-state">Current: <span id="pfCurrentArch">${p.name}</span></div>
    </div>
    <div class="evo-tree">
      <div class="evo-current-node">
        <div style="font-size:28px;margin-bottom:6px">${p.icon}</div>
        <div style="font-family:'Bebas Neue';font-size:14px;color:var(--ac);letter-spacing:0.05em">${p.name.toUpperCase()}</div>
        <div style="font-size:9px;color:var(--mu);font-family:'DM Mono';margin-top:2px">CURRENT</div>
      </div>
      <div class="evo-branches">${branchesHtml}</div>
    </div>`;
}

function renderTerminal(archName) {
  const container = document.getElementById('spSteps');
  if (!container) return;
  container.innerHTML = `<div class="terminal-scan">
    <div class="ts-header">
      <span class="ts-prompt">ledgr@dna:~$</span>
      <span class="ts-cmd"> analyze --picks --deep</span>
      <span class="ts-cursor">█</span>
    </div>
    <div class="ts-output" id="tsOutput"></div>
  </div>`;
  const termLines = [
    {text:'> Scanning pick history...', type:'', delay:300},
    {text:`  ✓ ${userStats.picks} picks loaded`, type:'success', delay:600},
    {text:'> Reading odds behavior...', type:'', delay:1000},
    {text:`  ✓ Avg odds: ${(userStats.avgOdds||2.0).toFixed(2)} (low-medium range)`, type:'success', delay:1300},
    {text:'> Analyzing risk profile...', type:'', delay:1700},
    {text:'  ✓ Variance: controlled', type:'success', delay:2000},
    {text:'> Checking CLV signature...', type:'', delay:2400},
    {text:'  ✓ Positive CLV detected', type:'success', delay:2700},
    {text:'> Matching behavioral DNA...', type:'', delay:3100},
    {text:'  ████████████ 100%', type:'highlight', delay:3400},
    {text:'', type:'', delay:3600},
    {text:`> IDENTITY: ${archName.toUpperCase()}`, type:'highlight', delay:3800},
    {text:'> Confidence: HIGH', type:'success', delay:4100},
  ];
  const output = document.getElementById('tsOutput');
  if (output) {
    termLines.forEach(line => {
      setTimeout(() => {
        const div = document.createElement('div');
        div.className = 'ts-line' + (line.type ? ' ' + line.type : '');
        div.textContent = line.text;
        output.appendChild(div);
      }, line.delay);
    });
  }
}

function renderSecretSlots() {
  const secretVersions = [
    {code:'SIG-7741', hint:'UNKNOWN SIGNAL DETECTED',  prob:'0.03%'},
    {code:'CLF-0192', hint:'CLASSIFIED IDENTITY',       prob:'0.01%'},
    {code:'???-????', hint:'SYSTEM ANOMALY',             prob:'UNDEFINED'},
  ];
  const vault = document.getElementById('archetypeGrid');
  if (!vault) return;
  secretVersions.forEach(s => {
    const card = document.createElement('div');
    card.className = 'arch-vault-card locked-secret';
    card.style.cssText = 'background:rgba(255,255,255,0.01);border:1px dashed rgba(255,107,255,0.15);border-radius:12px;padding:20px 12px;text-align:center;cursor:not-allowed;position:relative;overflow:hidden;';
    card.innerHTML = `<div style="font-size:9px;letter-spacing:0.2em;color:rgba(255,107,255,0.5);font-family:'DM Mono';margin-bottom:8px;animation:classifiedBlink 2s steps(1) infinite">${s.hint}</div><div style="font-family:'Bebas Neue';font-size:28px;color:rgba(255,255,255,0.08);letter-spacing:0.1em;margin-bottom:6px;animation:glitchText 4s steps(2) infinite">[REDACTED]</div><div style="font-size:8px;color:var(--mu);font-family:'DM Mono';margin-bottom:6px">Probability: ${s.prob}</div><div style="font-size:8px;color:rgba(255,107,255,0.4);font-family:'DM Mono';letter-spacing:0.1em">MYTHIC</div>`;
    vault.appendChild(card);
  });
}

function showToast(msg,isErr){
  const t=document.getElementById('toast');t.textContent=msg;t.style.background=isErr?'#f87171':'#34d399';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}
AppNav.init({ active: 'analytics' });

// Hero particles
setTimeout(() => {
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    const sz = 1 + Math.random() * 3;
    p.style.cssText = `position:absolute;width:${sz}px;height:${sz}px;border-radius:50%;background:rgba(123,44,255,${(0.3+Math.random()*0.3).toFixed(2)});left:${(Math.random()*90).toFixed(1)}%;top:${(Math.random()*90).toFixed(1)}%;pointer-events:none;animation:dnaParticle ${4+i*2}s ease-in-out infinite;animation-delay:${(i*0.8).toFixed(1)}s`;
    document.querySelector('.dna-hero')?.appendChild(p);
  }
}, 100);
</script>
