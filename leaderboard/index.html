<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07060d;
  --s1:#0c0a1a;
  --s2:#15122a;
  --bd:rgba(184,159,255,0.1);
  --bd2:rgba(184,159,255,0.18);
  --ac:#b89fff;
  --ac2:#7c5fe6;
  --acg:rgba(184,159,255,0.08);
  --tx:#f0edff;
  --mu:#6a6690;
  --mu2:#9590b8;
  --gr:#34d399;
  --rd:#f87171;
  --gold:#fbbf24;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden}
*{cursor:none!important}
.cursor{position:fixed;width:8px;height:8px;background:var(--ac);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
.cursor-ring{position:fixed;width:32px;height:32px;border:1px solid rgba(184,159,255,0.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .12s ease}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:1;opacity:.4}
nav{position:sticky;top:0;z-index:100;background:rgba(7,6,13,0.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);padding:0 48px;height:62px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:6px;color:var(--tx);text-decoration:none}
.logo span{color:var(--ac)}
.nav-links{display:flex;gap:4px}
.nav-link{color:var(--mu2);font-size:12px;text-decoration:none;padding:8px 14px;border-radius:6px;transition:all .2s;font-weight:500;letter-spacing:.3px}
.nav-link:hover{color:var(--tx);background:rgba(255,255,255,0.04)}
.nav-link.active{color:var(--ac);background:var(--acg)}
.nav-btn{background:var(--ac);color:#07060d;border:none;padding:9px 20px;border-radius:6px;font-size:12px;font-weight:700;cursor:none;font-family:'Syne',sans-serif;transition:all .2s;letter-spacing:.3px}
.nav-btn:hover{background:#cdb8ff;transform:translateY(-1px)}
.main{max-width:1100px;margin:0 auto;padding:52px 24px;position:relative;z-index:2}
.page-header{margin-bottom:40px}
.sec-tag{font-family:'DM Mono',monospace;font-size:10px;color:var(--ac);letter-spacing:3px;text-transform:uppercase;display:block;margin-bottom:10px;opacity:.8}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6vw,72px);letter-spacing:3px;line-height:1;color:var(--tx)}
.page-title span{color:var(--ac)}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
.sb{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:20px;text-align:center;transition:border-color .2s}
.sb:hover{border-color:var(--bd2)}
.sb-val{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--ac);line-height:1;letter-spacing:1px}
.sb-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.search-bar{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'Syne',sans-serif;font-size:14px;padding:13px 16px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--bd2)}
.search-input::placeholder{color:var(--mu)}
.sort-select{background:var(--s1);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'Syne',sans-serif;font-size:13px;padding:13px 16px;outline:none;cursor:none;transition:border-color .2s}
.sort-select:focus{border-color:var(--bd2)}
.sort-select option{background:#0c0a1a}
.filters{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.filter-btn{background:var(--s1);border:1px solid var(--bd);color:var(--mu2);padding:8px 18px;border-radius:20px;font-size:12px;cursor:none;transition:all .2s;font-family:'Syne',sans-serif}
.filter-btn:hover{border-color:var(--bd2);color:var(--tx)}
.filter-btn.active{background:var(--acg);border-color:var(--bd2);color:var(--ac)}
.lb-head{display:grid;grid-template-columns:56px 1fr 90px 90px 90px 90px 110px;gap:12px;padding:0 20px 12px;font-size:9px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;border-bottom:1px solid var(--bd);margin-bottom:8px}
.lb-row{display:grid;grid-template-columns:56px 1fr 90px 90px 90px 90px 110px;gap:12px;padding:16px 20px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;align-items:center;transition:all .2s;cursor:none}
.lb-row:hover{border-color:var(--bd2);background:var(--s2);transform:translateX(4px)}
.lb-row.top1{border-color:rgba(251,191,36,0.3);background:linear-gradient(135deg,rgba(251,191,36,0.04),var(--s1))}
.lb-row.top2{border-color:rgba(156,163,175,0.25)}
.lb-row.top3{border-color:rgba(180,120,80,0.25)}
.rank{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--mu);text-align:center;line-height:1}
.rank.r1{color:#fbbf24}.rank.r2{color:#9ca3af}.rank.r3{color:#b45309}
.tipster{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;flex-shrink:0;color:#fff}
.tip-name{font-weight:700;font-size:14px;margin-bottom:2px;letter-spacing:.1px}
.tip-meta{font-size:10px;color:var(--mu);font-family:'DM Mono',monospace}
.lb-stat{text-align:center}
.lsv{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px}
.lsv.pos{color:var(--gr)}.lsv.neg{color:var(--rd)}.lsv.neu{color:var(--tx)}
.lsl{font-size:9px;color:var(--mu);font-family:'DM Mono',monospace;letter-spacing:1px;margin-top:2px}
.follow-btn{padding:8px 18px;border:1px solid var(--bd2);color:var(--ac);background:var(--acg);border-radius:5px;font-size:11px;font-weight:700;cursor:none;transition:all .2s;font-family:'Syne',sans-serif;white-space:nowrap;letter-spacing:.2px}
.follow-btn:hover{background:var(--ac);color:#07060d;border-color:var(--ac)}
.empty{text-align:center;padding:80px;color:var(--mu);font-family:'DM Mono',monospace;font-size:13px;letter-spacing:1px}
@media(max-width:900px){.lb-head,.lb-row{grid-template-columns:44px 1fr 70px 70px 70px}.lb-head>*:nth-child(6),.lb-row>*:nth-child(6){display:none}.stats-bar{grid-template-columns:repeat(2,1fr)}nav{padding:0 20px}.nav-link{display:none}}
@media(max-width:600px){.lb-head,.lb-row{grid-template-columns:40px 1fr 60px 60px}.lb-head>*:nth-child(5),.lb-row>*:nth-child(5),.lb-head>*:nth-child(6),.lb-row>*:nth-child(6){display:none}.search-bar{flex-direction:column}}
</style>
</head>
<body>
<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="ring"></div>

<nav>
  <a href="/" class="logo">LEDG<span>R</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/leaderboard.html" class="nav-link active">Leaderboard</a>
    <a href="/compare.html" class="nav-link">Compare</a>
    <a href="/simulator.html" class="nav-link">Simulator</a>
    <a href="/dashboard.html" class="nav-link">Dashboard</a>
  </div>
  <button class="nav-btn" onclick="window.location.href='/dashboard.html'">My Dashboard</button>
</nav>

<div class="main">
  <div class="page-header">
    <span class="sec-tag">Rankings</span>
    <div class="page-title">LEADER<span>BOARD</span></div>
  </div>

  <div class="stats-bar">
    <div class="sb"><div class="sb-val" id="sbTipsters">—</div><div class="sb-lbl">Active Tipsters</div></div>
    <div class="sb"><div class="sb-val" id="sbPicks">—</div><div class="sb-lbl">Total Picks</div></div>
    <div class="sb"><div class="sb-val" id="sbWinRate">—</div><div class="sb-lbl">Avg Win Rate</div></div>
    <div class="sb"><div class="sb-val" id="sbROI">—</div><div class="sb-lbl">Avg ROI</div></div>
  </div>

  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="Search tipster..." oninput="renderLeaderboard()">
    <select class="sort-select" id="sortSelect" onchange="renderLeaderboard()">
      <option value="roi">Sort by ROI</option>
      <option value="wr">Sort by Win Rate</option>
      <option value="picks">Sort by Picks</option>
      <option value="pnl">Sort by P&L</option>
    </select>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterBy('all',this)">All Sports</button>
    <button class="filter-btn" onclick="filterBy('Soccer',this)">⚽ Soccer</button>
    <button class="filter-btn" onclick="filterBy('Basketball',this)">🏀 Basketball</button>
    <button class="filter-btn" onclick="filterBy('Tennis',this)">🎾 Tennis</button>
    <button class="filter-btn" onclick="filterBy('Football',this)">🏈 Football</button>
    <button class="filter-btn" onclick="filterBy('MMA/Boxing',this)">🥊 MMA</button>
    <button class="filter-btn" onclick="filterBy('Other',this)">🎯 Other</button>
  </div>

  <div class="lb-head">
    <span></span>
    <span>Tipster</span>
    <span style="text-align:center">ROI</span>
    <span style="text-align:center">Win Rate</span>
    <span style="text-align:center">Picks</span>
    <span style="text-align:center">P&L</span>
    <span></span>
  </div>

  <div id="lbContainer">
    <div class="empty">Loading leaderboard...</div>
  </div>
</div>

<script>
const cur=document.getElementById('cur');
const ring=document.getElementById('ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px'});
(function lerp(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(lerp)})();

const API='https://ledgr-backend-production-c132.up.railway.app';
let allPicks=[];
let currentFilter='all';
let allTipsters=[];

const colors=['linear-gradient(135deg,#7c5fe6,#b89fff)','linear-gradient(135deg,#1e9175,#34d399)','linear-gradient(135deg,#9c4b8a,#e879f9)','linear-gradient(135deg,#2d6fbc,#60a5fa)','linear-gradient(135deg,#5e4fc2,#a78bfa)','linear-gradient(135deg,#0f766e,#2dd4bf)','linear-gradie
