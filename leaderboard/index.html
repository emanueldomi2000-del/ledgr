<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/logo/ledgr-icon.png">
<title>LEDGR — Leaderboard</title>
<meta name="description" content="See who's the sharpest tipster on LEDGR. Real picks, verified results, zero fake ROI. Full leaderboard ranked by performance.">
<meta property="og:title" content="LEDGR Leaderboard — Top Verified Tipsters">
<meta property="og:description" content="Real picks. Verified results. Zero fake ROI. See the sharpest sports tipsters ranked by ROI, win rate, and reliability.">
<meta property="og:image" content="https://getledgr.bet/assets/logo/ledgr-logo.png">
<meta property="og:url" content="https://getledgr.bet/leaderboard">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>
body{min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:1;opacity:.4}
.bg-glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:600px;
  background:radial-gradient(ellipse,rgba(251,191,36,.04) 0%,transparent 70%);pointer-events:none;z-index:0}

/* ── MAIN ── */
.main{max-width:1120px;margin:0 auto;padding:32px 24px 80px;position:relative;z-index:2}

/* ── PAGE HEADER ── */
.lb-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.lb-title{font-family:var(--font-display);font-size:clamp(26px,3vw,34px);letter-spacing:4px;line-height:.92;color:var(--tx)}
.lb-title span{color:var(--ac)}
.lb-sub{font-family:var(--font-mono);font-size:10px;color:var(--mu);letter-spacing:3px;text-transform:uppercase;margin-top:6px}
.lb-live-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:20px;padding:6px 14px;font-family:var(--font-mono);font-size:9px;color:var(--gr);letter-spacing:2px}
.lb-live-dot{width:6px;height:6px;background:var(--gr);border-radius:50%;animation:live-pulse 1.5s ease-in-out infinite}
@keyframes live-pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,.4)}50%{opacity:.7;box-shadow:0 0 0 5px rgba(52,211,153,0)}}

/* ── LIVE STATS BAR ── */
.live-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bd);border-radius:14px;overflow:hidden;margin-bottom:28px;border:1px solid var(--bd)}
.lb-stat-box{background:var(--s1);padding:16px 18px;position:relative;transition:background .2s;border-top:2px solid transparent}
.lb-stat-box:nth-child(1){border-top-color:rgba(184,159,255,.5)}
.lb-stat-box:nth-child(2){border-top-color:rgba(52,211,153,.5)}
.lb-stat-box:nth-child(3){border-top-color:rgba(251,146,60,.5)}
.lb-stat-box:nth-child(4){border-top-color:rgba(251,191,36,.5)}
.lb-stat-box:hover{background:var(--s2)}
.lsb-label{font-family:var(--font-mono);font-size:8px;color:var(--mu);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.lsb-live-dot{width:4px;height:4px;background:var(--gr);border-radius:50%;animation:live-pulse 1.5s ease-in-out infinite}
.lsb-val{font-family:'DM Mono',monospace;font-size:32px;letter-spacing:-0.5px;line-height:1;color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums}
.lsb-sub{font-family:var(--font-mono);font-size:9px;color:var(--mu);margin-top:3px}

/* ── GAMING CONTROL BAR ── */
.control-bar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:340px}
.search-wrap::before{content:'⌕';position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:16px;pointer-events:none;line-height:1}
.search-input{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:var(--font-body);font-size:13px;padding:11px 14px 11px 38px;outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(184,159,255,.1)}
.search-input::placeholder{color:var(--mu)}
.sort-select{background:var(--s1);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:var(--font-mono);font-size:11px;padding:11px 14px;outline:none;cursor:pointer;letter-spacing:1px;transition:border-color .2s}
.sort-select:focus{border-color:var(--bd2)}
.sort-select option{background:var(--s1)}
.min-picks-select{background:var(--s1);border:1px solid var(--bd);border-radius:8px;color:var(--mu2);font-family:var(--font-mono);font-size:11px;padding:11px 12px;outline:none;cursor:pointer;transition:border-color .2s}

/* ── PERIOD TABS (FACEIT-style) ── */
.period-tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:16px}
.pt-tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--mu2);font-family:var(--font-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:10px 16px;cursor:pointer;transition:all .2s;margin-bottom:-1px;white-space:nowrap}
.pt-tab:hover{color:var(--tx)}
.pt-tab.active{color:var(--ac);border-bottom-color:var(--ac)}
.pt-tab.season{color:#b89464}
.pt-tab.season.active{color:var(--gold);border-bottom-color:var(--gold)}
.pt-divider{width:1px;height:20px;background:rgba(255,255,255,.08);margin:0 6px;flex-shrink:0}
.pt-label{font-family:var(--font-mono);font-size:8px;color:var(--mu);letter-spacing:2px;padding:0 8px;white-space:nowrap}

/* ── SPORT FILTERS (gaming pill tabs) ── */
.sport-filters{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:6px;
  color:var(--mu2);padding:7px 14px;font-size:11px;cursor:pointer;transition:all .2s;
  font-family:var(--font-mono);letter-spacing:.5px;white-space:nowrap}
.filter-btn:hover{color:var(--tx);border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.06)}
.filter-btn.active{background:rgba(184,159,255,.14);border-color:var(--ac);color:var(--ac);box-shadow:0 0 12px rgba(184,159,255,.15)}

/* ── SEASON BANNER ── */
.season-banner{background:linear-gradient(135deg,rgba(251,191,36,.06),rgba(184,159,255,.04));
  border:1px solid rgba(251,191,36,.18);border-radius:12px;padding:14px 18px;margin-bottom:20px;
  display:none;align-items:center;gap:14px}
.season-banner.show{display:flex}
.season-banner-icon{font-size:22px}
.season-banner-title{font-family:var(--font-display);font-size:18px;letter-spacing:3px;color:var(--gold);line-height:1}
.season-banner-sub{font-family:var(--font-mono);font-size:9px;color:var(--mu);margin-top:2px}
.season-winner-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);border-radius:8px;padding:6px 12px;font-family:var(--font-mono);font-size:10px;color:var(--gold);font-weight:700;margin-left:auto;white-space:nowrap}

/* ── PODIUM ── */
.podium-section{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:14px;align-items:end;margin-bottom:28px}
/* confetti */
.conf-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit}
.conf-p{position:absolute;bottom:-6px;border-radius:50%;animation:conf-rise var(--cd,6s) ease-in var(--cdl,0s) infinite}
@keyframes conf-rise{0%{transform:translateY(0) scale(1) rotate(0);opacity:0}8%{opacity:1}85%{opacity:.7}100%{transform:translateY(-260px) scale(.3) rotate(360deg);opacity:0}}
/* spring entrance */
@keyframes pod-in{0%{opacity:0;transform:translateY(48px) scale(.78)}65%{transform:translateY(-8px) scale(1.02)}82%{transform:translateY(3px) scale(.99)}100%{opacity:1;transform:none}}
.podium-card{position:relative;border-radius:18px;padding:28px 20px 20px;text-align:center;cursor:pointer;overflow:hidden;
  transition:transform .3s cubic-bezier(.4,0,.2,1),box-shadow .3s;
  animation:pod-in .75s cubic-bezier(.34,1.56,.64,1) both}
.podium-card.p2{animation-delay:.18s}
.podium-card.p1{animation-delay:.06s}
.podium-card.p3{animation-delay:.3s}
.podium-card::before{content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(160deg,rgba(255,255,255,.04),transparent 55%);pointer-events:none}
.podium-card:hover{transform:translateY(-6px)}

/* P1 Gold */
.podium-card.p1{
  background:linear-gradient(#0c0a1a,#0c0a1a) padding-box,
             linear-gradient(160deg,rgba(251,191,36,.7),rgba(251,191,36,.25),rgba(251,191,36,.5)) border-box;
  border:1.5px solid transparent;
  box-shadow:0 0 60px rgba(251,191,36,.14),0 20px 48px rgba(0,0,0,.4)}
.podium-card.p1:hover{box-shadow:0 0 80px rgba(251,191,36,.22),0 24px 56px rgba(0,0,0,.5)}
/* P2 Silver */
.podium-card.p2{
  background:linear-gradient(#0c0a1a,#0c0a1a) padding-box,
             linear-gradient(160deg,rgba(148,163,184,.5),rgba(148,163,184,.15),rgba(148,163,184,.4)) border-box;
  border:1.5px solid transparent;
  box-shadow:0 0 32px rgba(148,163,184,.08),0 14px 36px rgba(0,0,0,.35)}
/* P3 Bronze */
.podium-card.p3{
  background:linear-gradient(#0c0a1a,#0c0a1a) padding-box,
             linear-gradient(160deg,rgba(180,120,80,.5),rgba(180,120,80,.15),rgba(180,120,80,.4)) border-box;
  border:1.5px solid transparent;
  box-shadow:0 0 28px rgba(180,120,80,.08),0 14px 36px rgba(0,0,0,.35)}

/* Podium platform base */
.podium-base{height:32px;display:flex;align-items:center;justify-content:center;border-radius:0 0 10px 10px;margin-top:0}
.p1 .podium-base{background:linear-gradient(rgba(251,191,36,.18),rgba(251,191,36,.08));border:1px solid rgba(251,191,36,.25);border-top:none}
.p2 .podium-base{background:linear-gradient(rgba(148,163,184,.12),rgba(148,163,184,.05));border:1px solid rgba(148,163,184,.2);border-top:none}
.p3 .podium-base{background:linear-gradient(rgba(180,120,80,.12),rgba(180,120,80,.05));border:1px solid rgba(180,120,80,.2);border-top:none}
.podium-base-num{font-family:var(--font-display);font-size:18px;letter-spacing:2px}
.p1 .podium-base-num{color:rgba(251,191,36,.7)}
.p2 .podium-base-num{color:rgba(148,163,184,.7)}
.p3 .podium-base-num{color:rgba(180,120,80,.7)}

/* Crown animation (P1 only) */
.podium-crown{font-size:28px;margin-bottom:8px;display:block;filter:drop-shadow(0 0 14px rgba(251,191,36,.8));animation:crown-bob 3s ease-in-out infinite}
@keyframes crown-bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.podium-medal-emoji{font-size:24px;margin-bottom:8px;display:block}
.podium-name{font-family:var(--font-display);font-size:20px;letter-spacing:2px;margin-bottom:2px}
.p1 .podium-name{color:var(--gold);text-shadow:0 0 20px rgba(251,191,36,.4)}
.p2 .podium-name{color:var(--silver)}
.p3 .podium-name{color:var(--bronze)}
.podium-roi{font-family:var(--font-display);font-size:36px;color:var(--gr);line-height:1;margin-bottom:4px;text-shadow:0 0 20px rgba(52,211,153,.3)}
.podium-picks-sub{font-family:var(--font-mono);font-size:9px;color:var(--mu);margin-bottom:10px}
.podium-stats{display:flex;justify-content:center;gap:14px;margin-bottom:10px}
.ps-i{text-align:center}
.ps-v{font-family:var(--font-display);font-size:17px;color:var(--tx);line-height:1}
.ps-l{font-family:var(--font-mono);font-size:7px;color:var(--mu);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.podium-badges{display:flex;justify-content:center;gap:5px;margin-bottom:8px;min-height:20px}
.podium-streak{font-family:var(--font-mono);font-size:10px;color:var(--orange);margin-top:4px}
.podium-elo{display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:rgba(184,159,255,.08);border:1px solid rgba(184,159,255,.2);border-radius:6px;padding:3px 9px;font-family:var(--font-mono);font-size:10px;color:var(--ac)}
.p1 .podium-elo{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.25);color:var(--gold)}

/* ── LEADERBOARD TABLE ── */
.lb-table-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--bd)}
.lb-head{display:grid;grid-template-columns:60px 1fr 88px 88px 72px 80px 80px 88px 100px;
  gap:0;padding:10px 20px;background:rgba(255,255,255,.025);
  font-size:8px;color:var(--mu);letter-spacing:2.5px;text-transform:uppercase;font-family:var(--font-mono);
  border-bottom:1px solid var(--bd)}
.lb-row{display:grid;grid-template-columns:60px 1fr 88px 88px 72px 80px 80px 88px 100px;
  gap:0;padding:14px 20px;background:var(--s1);border-bottom:1px solid rgba(255,255,255,.04);
  align-items:center;cursor:pointer;
  transition:background .18s,transform .18s;
  animation:row-slide-in .4s cubic-bezier(.34,1.1,.64,1) both;
  animation-delay:min(0.4s, calc(var(--ri,0) * 0.05s))}
.lb-row:last-child{border-bottom:none}
.lb-row:hover{background:var(--s2);transform:translateX(4px)}
.lb-row:hover .rank-glow{opacity:1}
@keyframes row-slide-in{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}

/* Rank cell */
.rank-cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.rank-num{font-family:var(--font-display);font-size:22px;line-height:1;text-align:center}
.rn-1{color:var(--gold);text-shadow:0 0 12px rgba(251,191,36,.4)}
.rn-2{color:var(--silver)}
.rn-3{color:var(--bronze)}
.rn-top{color:var(--ac)}
.rn-rest{color:var(--mu)}
.rank-move{font-family:var(--font-mono);font-size:9px;font-weight:700;line-height:1;white-space:nowrap}
.rank-move.up{color:var(--gr)}
.rank-move.down{color:var(--rd)}
.rank-move.same{color:var(--mu);opacity:.5}
@keyframes rank-change-pulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.rank-move.changed{animation:rank-change-pulse .5s ease}

/* Tipster cell */
.tipster-col{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13px;flex-shrink:0;color:#fff;position:relative}
.live-dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--gr);border:2px solid var(--s1);animation:live-pulse 1.5s ease-in-out infinite}
.tip-info{min-width:0}
.tip-name{font-weight:700;font-size:13px;margin-bottom:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tip-sub{font-size:9px;color:var(--mu);font-family:var(--font-mono)}
.tip-badges{display:flex;align-items:center;gap:3px;margin-top:3px;flex-wrap:wrap}

/* Stat cells */
.lb-stat{text-align:center;padding:0 4px}
.lsv{font-family:var(--font-display);font-size:17px;letter-spacing:.5px;line-height:1}
.lsv.pos{color:var(--gr)}.lsv.neg{color:var(--rd)}.lsv.neu{color:var(--tx)}
.lsl{font-size:7px;color:var(--mu);font-family:var(--font-mono);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.streak-col{text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--orange)}
.rel-col{text-align:center}
.rel-score{font-family:var(--font-display);font-size:16px;line-height:1}
.rel-bar-wrap{width:44px;height:3px;background:rgba(255,255,255,.05);border-radius:2px;margin:3px auto}
.rel-bar-fill{height:100%;border-radius:2px}

/* ELO cell */
.elo-cell{text-align:center}
.elo-val{font-family:var(--font-display);font-size:18px;line-height:1;letter-spacing:1px}
.elo-lbl{font-size:7px;color:var(--mu);font-family:var(--font-mono);letter-spacing:1.5px;margin-top:2px}

/* Follow btn */
.follow-btn{padding:7px 14px;border:1px solid var(--bd2);color:var(--ac);background:var(--acg);border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;transition:all .2s;font-family:var(--font-mono);letter-spacing:.5px;white-space:nowrap}
.follow-btn:hover,.follow-btn.following{background:var(--ac);color:#07060d;border-color:var(--ac)}

/* Empty states */
.empty-lb{text-align:center;padding:64px 20px;color:var(--mu)}
.empty-lb .icon{font-size:40px;margin-bottom:14px;display:block;opacity:.5}
.empty-lb h3{font-family:var(--font-display);font-size:26px;letter-spacing:2px;color:var(--mu2);margin-bottom:8px}
.empty-lb p{font-size:11px;font-family:var(--font-mono);line-height:1.7;max-width:340px;margin:0 auto}

/* Skeleton */
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.skel{border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:1200px 100%;animation:shimmer 1.6s linear infinite;display:inline-block}

/* Division badges */
.dv-pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;font-family:var(--font-mono);font-weight:700;letter-spacing:1px;white-space:nowrap;font-size:8px;padding:2px 7px}
.div-bronze{background:rgba(180,120,80,.12);border:1px solid rgba(180,120,80,.3);color:var(--bronze)}
.div-silver{background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.25);color:var(--silver)}
.div-gold{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);color:var(--gold)}
.div-platinum{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.25);color:var(--cyan)}
.div-diamond{background:rgba(184,159,255,.12);border:1px solid rgba(184,159,255,.3);color:var(--ac)}
.div-elite{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:var(--rd)}
.div-legend{background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(184,159,255,.1));border:1px solid rgba(251,191,36,.4);color:var(--gold)}
.elo-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(184,159,255,.08);border:1px solid rgba(184,159,255,.2);border-radius:6px;padding:2px 7px;font-family:var(--font-mono);font-size:9px;color:var(--ac)}
.elo-badge.top{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.25);color:var(--gold)}
.elo-badge.low{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.2);color:var(--rd)}

/* Frozen season results */
.frozen-banner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(251,191,36,.07),rgba(184,159,255,.04));border:1px solid rgba(251,191,36,.25);border-radius:14px;padding:16px 20px;margin-bottom:16px}
.frozen-banner-icon{font-size:28px}
.frozen-banner-title{font-family:var(--font-display);font-size:18px;letter-spacing:3px;color:var(--gold);line-height:1;margin-bottom:3px}
.frozen-banner-sub{font-family:var(--font-mono);font-size:10px;color:var(--mu2)}
.frozen-champion-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);border-radius:8px;padding:5px 12px;font-family:var(--font-mono);font-size:10px;color:var(--gold);font-weight:700;margin-left:auto;white-space:nowrap}
.frozen-row{display:grid;grid-template-columns:56px 1fr 90px 90px 80px 90px 110px;gap:0;padding:14px 20px;background:var(--s1);border-bottom:1px solid rgba(255,255,255,.04);align-items:center;cursor:pointer;transition:background .18s}
.frozen-row:hover{background:var(--s2)}
.frozen-row.champion-row{background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(251,191,36,.02));border-color:rgba(251,191,36,.35);box-shadow:0 0 28px rgba(251,191,36,.07)}
.fr-rank{font-family:var(--font-display);font-size:22px;color:var(--mu);text-align:center}
.fr-rank.gold{color:var(--gold)}.fr-rank.silver{color:#94a3b8}.fr-rank.bronze{color:#b47850}
.fr-tipster{display:flex;align-items:center;gap:10px}
.fr-av{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13px;color:#fff}
.fr-name{font-weight:700;font-size:13px;margin-bottom:1px}
.fr-div{font-family:var(--font-mono);font-size:8px;letter-spacing:1px;color:var(--mu);margin-top:2px}
.fr-stat{text-align:center}
.fr-sv{font-family:var(--font-display);font-size:18px;letter-spacing:1px}
.fr-sv.pos{color:var(--gr)}.fr-sv.neg{color:var(--rd)}.fr-sv.neu{color:var(--tx)}
.fr-sl{font-size:8px;color:var(--mu);font-family:var(--font-mono);letter-spacing:1px;margin-top:2px}

/* Responsive */
@media(max-width:1060px){
  .lb-head,.lb-row{grid-template-columns:52px 1fr 80px 80px 68px 76px 76px}
  .lb-head>*:nth-child(8),.lb-row>*:nth-child(8),
  .lb-head>*:nth-child(9),.lb-row>*:nth-child(9){display:none}
  .live-bar{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  nav{padding:0 16px}
  .nav-link{display:none}
  .mobile-menu-btn{display:block}
  .lb-head,.lb-row{grid-template-columns:40px 1fr 68px 68px}
  .lb-head>*:nth-child(5),.lb-row>*:nth-child(5),
  .lb-head>*:nth-child(6),.lb-row>*:nth-child(6),
  .lb-head>*:nth-child(7),.lb-row>*:nth-child(7),
  .lb-head>*:nth-child(8),.lb-row>*:nth-child(8),
  .lb-head>*:nth-child(9),.lb-row>*:nth-child(9){display:none}
  .podium-section{grid-template-columns:1fr;align-items:stretch}
  .podium-card.p1,.podium-card.p2,.podium-card.p3{animation-delay:0s}
  .live-bar{grid-template-columns:1fr 1fr}
  .control-bar{flex-wrap:wrap}
  .search-wrap{max-width:100%;width:100%}
  .frozen-row{grid-template-columns:40px 1fr 68px 68px}
  .frozen-row>*:nth-child(5),.frozen-row>*:nth-child(6),.frozen-row>*:nth-child(7){display:none}
}
@media(max-width:768px){
  /* Podium — horizontal scroll with snap */
  .podium-section{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:12px;padding-bottom:16px;align-items:flex-end;grid-template-columns:unset}
  .podium-section::-webkit-scrollbar{display:none}
  .podium-card{min-width:200px;flex-shrink:0;scroll-snap-align:center}
  /* Table — show only Rank + Tipster + ROI */
  .lb-head,.lb-row{grid-template-columns:44px 1fr 72px}
  .lb-head>*:nth-child(n+4),.lb-row>*:nth-child(n+4){display:none}
  .frozen-row{grid-template-columns:44px 1fr 72px}
  .frozen-row>*:nth-child(n+4){display:none}
  /* Search */
  .search-input{height:44px;font-size:16px}
  .search-wrap{max-width:100%;width:100%;margin-bottom:12px}
}

/* ── IDENTITY: COMPETITION ARENA ── */
@keyframes spotBreath{0%,100%{opacity:.3}50%{opacity:.6}}
.bg-spot-l{position:fixed;top:-120px;left:-60px;width:800px;height:600px;background:radial-gradient(ellipse at top left,rgba(251,191,36,.055),transparent 60%);pointer-events:none;z-index:0;animation:spotBreath 10s ease-in-out infinite}

.lb-eyebrow{font-family:var(--font-mono);font-size:9px;letter-spacing:4px;color:var(--mu);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}

.podium-card.p3{animation-delay:.4s!important}
/* #1 breathing glow */
@keyframes goldBreath{0%,100%{box-shadow:0 0 20px rgba(255,215,0,.2),0 4px 24px rgba(0,0,0,.4)}50%{box-shadow:0 0 40px rgba(255,215,0,.4),0 0 60px rgba(255,215,0,.15),0 4px 24px rgba(0,0,0,.4)}}

<script>
const API = 'https://ledgr-backend-production-c132.up.railway.app';
let allPicks = [], currentFilter = 'all', allTipsters = [], allSeasons = [];
let rankingsData = null;
let _picksLoaded = false, _picksLoading = null;
const COLORS = ['linear-gradient(135deg,#7c3aed,#a855f7)','linear-gradient(135deg,#059669,#10b981)','linear-gradient(135deg,#b45309,#f59e0b)','linear-gradient(135deg,#0369a1,#38bdf8)','linear-gradient(135deg,#0f766e,#14b8a6)','linear-gradient(135deg,#dc2626,#ef4444)','linear-gradient(135deg,#7c3aed,#ec4899)'];

// ── Skeleton on load ────────────────────────────────────────
(function() {
  document.getElementById('lbTableWrap').style.display = 'block';
  document.getElementById('lbContainer').innerHTML = Array.from({length:7}, (_, i) => `
    <div style="display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.04)">
      <span class="skel" style="width:40px;height:40px;border-radius:10px;flex-shrink:0"></span>
      <span class="skel" style="width:38px;height:38px;border-radius:50%;flex-shrink:0"></span>
      <div style="flex:1;display:flex;flex-direction:column;gap:5px">
        <span class="skel" style="width:${100+Math.random()*60|0}px;height:12px"></span>
        <span class="skel" style="width:60px;height:9px"></span>
      </div>
      <span class="skel" style="width:52px;height:20px;margin-left:auto"></span>
      <span class="skel" style="width:52px;height:20px"></span>
      <span class="skel" style="width:40px;height:20px"></span>
    </div>`).join('');
})();

// ── Helpers ─────────────────────────────────────────────────
function getDivision(t) {
  const roi = t.stake > 0 ? (t.pnl / t.stake) * 100 : 0;
  const wr  = (t.wins + t.losses) > 0 ? (t.wins / (t.wins + t.losses)) * 100 : 0;
  if (window.Divisions) return window.Divisions.getFromStats(roi, wr, t.picks);
  const score = Math.round(Math.min(40,Math.max(0,(roi/20)*40))+Math.min(30,Math.max(0,(wr/70)*30))+Math.min(20,Math.max(0,(t.picks/100)*20))+Math.min(10,t.picks));
  if (score>=92) return {name:'LEGENDARY',cls:'div-legend',icon:'◉',score};
  if (score>=80) return {name:'ELITE',cls:'div-elite',icon:'⊕',score};
  if (score>=65) return {name:'DIAMOND',cls:'div-diamond',icon:'✦',score};
  if (score>=50) return {name:'PLATINUM',cls:'div-platinum',icon:'⬡',score};
  if (score>=35) return {name:'GOLD',cls:'div-gold',icon:'★',score};
  if (score>=20) return {name:'SILVER',cls:'div-silver',icon:'◆',score};
  return {name:'BRONZE',cls:'div-bronze',icon:'▲',score};
}

function getRankMove(username, currentRank) {
  const stored = JSON.parse(localStorage.getItem('ledgr_ranks') || '{}');
  const prev = stored[username];
  stored[username] = currentRank;
  localStorage.setItem('ledgr_ranks', JSON.stringify(stored));
  if (!prev || prev === currentRank) return '<span class="rank-move same">—</span>';
  if (prev > currentRank) return `<span class="rank-move up changed">▲${prev - currentRank}</span>`;
  return `<span class="rank-move down changed">▼${currentRank - prev}</span>`;
}

function getBadgeIcons(t) {
  const icons = [];
  const roi = t.roi != null ? t.roi : (t.stake > 0 ? (t.pnl / t.stake) * 100 : 0);
  const wr  = t.winRate != null ? t.winRate * 100 : ((t.wins + t.losses) > 0 ? (t.wins / (t.wins + t.losses)) * 100 : 0);
  if (t.streak >= 5) icons.push('🔥');
  if (roi >= 20 && t.picks >= 50) icons.push('💎');
  if (wr >= 60 && t.picks >= 30) icons.push('🎯');
  if (t.picks >= 100) icons.push('👑');
  if (roi >= 15 && t.picks >= 10 && t.picks < 50) icons.push('🚀');
  return icons;
}

function getReliability(t) {
  if (t.picks < 3) return {score:0,color:'var(--mu)',label:'—'};
  const roi = t.stake > 0 ? (t.pnl / t.stake) * 100 : 0;
  const wr  = (t.wins + t.losses) > 0 ? (t.wins / (t.wins + t.losses)) * 100 : 0;
  const score = Math.round(Math.min(40,Math.max(0,(roi/20)*40))+Math.min(30,Math.max(0,(wr/70)*30))+Math.min(20,Math.max(0,(t.picks/100)*20))+Math.min(10,t.picks));
  const color = score >= 70 ? 'var(--gr)' : score >= 40 ? 'var(--gold)' : 'var(--rd)';
  return {score, color, label: score + '/100'};
}

// ── Division lookup from pre-computed ranking string ────────────────────────
function _divFromRanking(t) {
  const D = {
    LEGENDARY:{name:'LEGENDARY',cls:'div-legend',icon:'◉'},
    ELITE:    {name:'ELITE',cls:'div-elite',icon:'⊕'},
    DIAMOND:  {name:'DIAMOND',cls:'div-diamond',icon:'✦'},
    PLATINUM: {name:'PLATINUM',cls:'div-platinum',icon:'⬡'},
    GOLD:     {name:'GOLD',cls:'div-gold',icon:'★'},
    SILVER:   {name:'SILVER',cls:'div-silver',icon:'◆'},
    BRONZE:   {name:'BRONZE',cls:'div-bronze',icon:'▲'},
  };
  if (typeof t.division === 'string' && D[t.division]) return {...D[t.division], score: t.divisionScore || 0};
  return getDivision(t);
}

// ── Build allTipsters from GET /rankings response ───────────────────────────
function _buildTipstersFromRankings() {
  if (!rankingsData || !Array.isArray(rankingsData.tipsters)) return;
  allTipsters = rankingsData.tipsters.map((r, i) => ({
    username:         r.username,
    userId:           r.userId,
    rank:             i + 1,
    picks:            r.totalPicks,
    wins:             r.wins,
    losses:           r.losses,
    stake:            r.totalStake,
    pnl:              r.totalPnl,
    roi:              r.roi,
    winRate:          r.winRate,
    elo:              r.elo,
    divisionScore:    r.divisionScore,
    division:         r.division,
    sharpScore:       r.sharpScore,
    reliabilityScore: r.reliabilityScore,
    avgOdds:          r.avgOdds,
    clvAvg:           r.clvAvg,
    streak:           r.streakType === 'win' ? r.currentStreak : 0,
    streakType:       r.streakType,
    bestStreak:       r.bestStreak,
    archetype:        r.archetype,
    flowState:        r.flowState,
    isLive:           r.isLive,
    lastPickAt:       r.lastPickAt,
    recentPicks:      r.recentPicks || [],
  }));
}

// ── Lazy-load allPicks only when a time/sport filter is applied ─────────────
async function _ensurePicksLoaded() {
  if (_picksLoaded) return;
  if (_picksLoading) return _picksLoading;
  _picksLoading = (async () => {
    try {
      const r = await fetch(API + '/picks', {cache:'no-store'});
      if (r.ok) {
        allPicks = await r.json();
        if (!Array.isArray(allPicks)) allPicks = [];
        const eloMap = {};
        allPicks.forEach(p => { if (p.eloAfter) eloMap[p.username] = p.eloAfter; });
        window._eloMap = eloMap;
        _picksLoaded = true;
      }
    } catch(e) {}
    _picksLoading = null;
  })();
  return _picksLoading;
}

// ELO counter animation (target is 0-based display value)
function animateElo(el, target) {
  if (!el || isNaN(target)) return;
  const start = Math.max(0, target - 150);
  const duration = 1000;
  const t0 = performance.now();
  function tick(now) {
    const p = Math.min(1, (now - t0) / duration);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(start + (target - start) * e);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// Count-up for numeric stat boxes
function countUpEl(el, target) {
  if (!el || isNaN(target) || target <= 0) return;
  const dur = 700;
  const t0 = Date.now();
  const tick = () => {
    const p = Math.min((Date.now() - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * e);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// Gold particles inside #1 podium card
function addPodiumParticles(cardEl) {
  if (cardEl._particles) return;
  cardEl._particles = true;
  for (let i = 0; i < 4; i++) {
    const p = document.createElement('div');
    p.style.cssText = `position:absolute;width:${3+i}px;height:${3+i}px;border-radius:50%;background:rgba(255,215,0,0.45);pointer-events:none;z-index:3;animation:podParticle ${3+i*1.5}s ease-in-out infinite;animation-delay:${i*0.7}s;left:${20+i*20}%;bottom:${10+i*10}%`;
    cardEl.appendChild(p);
  }
}

// Today's movers section
function renderMovers(tipsters) {
  const el = document.getElementById('todaysMovers');
  const cards = document.getElementById('tmCards');
  if (!el || !cards || !tipsters || !tipsters.length) return;
  const topStreak = [...tipsters].filter(t => t.streak > 0).sort((a, b) => b.streak - a.streak)[0];
  const topRoi = [...tipsters].filter(t => t.picks >= 5).sort((a, b) => {
    const rA = a.roi != null ? a.roi : 0;
    const rB = b.roi != null ? b.roi : 0;
    return rB - rA;
  })[0];
  const activeCount = tipsters.filter(t => t.picks >= 1).length;
  cards.innerHTML = `
    <div class="tm-card">
      <div class="tm-icon">🔥</div>
      <div>
        <div class="tm-label">LONGEST STREAK</div>
        <div class="tm-value">${topStreak ? '@' + topStreak.username : '—'}</div>
        <div class="tm-sub">${topStreak ? topStreak.streak + 'W active' : 'No active streaks'}</div>
      </div>
    </div>
    <div class="tm-card">
      <div class="tm-icon">👑</div>
      <div>
        <div class="tm-label">LEADING ROI</div>
        <div class="tm-value">${topRoi ? '@' + topRoi.username : '—'}</div>
        <div class="tm-sub">${topRoi ? (topRoi.roi >= 0 ? '+' : '') + (topRoi.roi != null ? topRoi.roi.toFixed(1) : '0.0') + '%' : ''}</div>
      </div>
    </div>
    <div class="tm-card">
      <div class="tm-icon">⚔️</div>
      <div>
        <div class="tm-label">MOST COMPETITIVE</div>
        <div class="tm-value">${tipsters.length} tipsters</div>
        <div class="tm-sub">${activeCount} with picks</div>
      </div>
    </div>`;
  el.style.display = 'block';
}

function filterPicksByTime(picks) {
  if (currentTimeFilter === 'all') return picks;
  if (currentTimeFilter === '7d')  { const c = Date.now()-7*86400000;  return picks.filter(p => new Date(p.createdAt) >= c); }
  if (currentTimeFilter === '30d') { const c = Date.now()-30*86400000; return picks.filter(p => new Date(p.createdAt) >= c); }
  if (SEASON_CONFIG[currentTimeFilter]) { const {start,end} = SEASON_CONFIG[currentTimeFilter]; return picks.filter(p => { const t = new Date(p.createdAt).getTime(); return t >= start && t <= end; }); }
  return picks;
}

function updateSeasonBanner(filter, tipsters) {
  const banner = document.getElementById('seasonBanner');
  const cfg = SEASON_CONFIG[filter];
  if (!cfg) { banner.classList.remove('show'); return; }
  banner.classList.add('show');
  const apiSeason = filter.startsWith('s') ? seasonForKey(filter) : null;
  const title = apiSeason ? apiSeason.name : cfg.title;
  const fmt = d => new Date(d).toLocaleDateString('en-GB', {month:'short', year:'numeric'});
  const sub = apiSeason ? (fmt(apiSeason.startDate)+' – '+fmt(apiSeason.endDate)+(apiSeason.isActive?' · ACTIVE':' · Ended')) : cfg.sub;
  document.getElementById('seasonBannerTitle').textContent = title;
  document.getElementById('seasonBannerSub').textContent = sub;
  const wb = document.getElementById('seasonWinnerBadge');
  const champ = apiSeason?.champion;
  if (champ) { wb.style.display='inline-flex'; wb.textContent='👑 Champion: @'+champ; }
  else if (!apiSeason && tipsters?.length && filter !== 's3') { wb.style.display='inline-flex'; wb.textContent='👑 Leader: @'+tipsters[0].username; }
  else { wb.style.display='none'; }
}

async function loadLeaderboard() {
  await wakeBackend();
  const _ctrl=new AbortController();const _xt=setTimeout(()=>{_ctrl.abort();document.getElementById('lbTableWrap').style.display='none';document.getElementById('lbEmpty').style.display='block';document.getElementById('lbEmpty').innerHTML='<div class="empty-lb"><span class="icon">⚠️</span><h3>SERVER WAKING UP</h3><p>Request timed out — <a href="" onclick="location.reload()" style="color:var(--ac)">Retry</a></p></div>';},15000);
  try {
    const [rankingsRes, seasonsRes] = await Promise.all([
      fetch(API + '/rankings', {cache:'no-store',signal:_ctrl.signal}),
      fetch(API + '/seasons', {cache:'no-store'}).catch(() => null)
    ]);
    if (!rankingsRes.ok) throw new Error('Server error');
    clearTimeout(_xt);
    rankingsData = await rankingsRes.json();
    if (!rankingsData || !Array.isArray(rankingsData.tipsters)) throw new Error('Invalid response');

    if (seasonsRes && seasonsRes.ok) {
      allSeasons = await seasonsRes.json();
      allSeasons.forEach(s => {

          if (frozen) btn.title = 'Champion: @' + s.champion;
        }
      });

    _buildTipstersFromRankings();
    updateStats();

  }

function buildTipsters() {
  const map = {};
  const now = Date.now();
  const yesterday = now - 86400000;
  const filtered = currentFilter === 'all' ? allPicks : allPicks.filter(p => p.sport === currentFilter);
  const timePicks = filterPicksByTime(filtered);

  timePicks.forEach(p => {
    if (!p.username) return;
    const u = p.username;
    if (!map[u]) map[u] = {username:u, picks:0, wins:0, losses:0, stake:0, pnl:0, streak:0, userId:null, lastPickAt:0};
    map[u].picks++;
    map[u].stake += p.stake;
    map[u].pnl += p.pnl;
    if (!map[u].userId) map[u].userId = p.userId || null;
    if (p.result === 'win') map[u].wins++;
    if (p.result === 'loss') map[u].losses++;
    const pt = new Date(p.createdAt).getTime();
    if (pt > map[u].lastPickAt) map[u].lastPickAt = pt;
  });

  Object.keys(map).forEach(u => {
    const userPicks = filtered.filter(p => p.username === u && p.result !== 'pending')
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    let streak = 0;
    for (const p of userPicks) { if (p.result === 'win') streak++; else break; }
    map[u].streak = streak;
    map[u].isLive = map[u].lastPickAt >= yesterday;
    map[u].elo = (window._eloMap && window._eloMap[u] != null) ? window._eloMap[u] : 0;
    const allTimePicks = allPicks.filter(p => p.username === u);
    map[u].sharpScore = window.getSharpScore ? window.getSharpScore(allTimePicks) : 0;
    map[u].archetype  = window.getArchetype  ? window.getArchetype(allTimePicks)  : null;
    // Pre-compute roi/winRate for consistent rendering with rankings path
    map[u].roi     = map[u].stake > 0 ? (map[u].pnl / map[u].stake) * 100 : 0;
    map[u].winRate = (map[u].wins + map[u].losses) > 0 ? map[u].wins / (map[u].wins + map[u].losses) : 0;
  });

  // Flow detection
  if (window.Flow) {
    const picksMap = {};
    Object.keys(map).forEach(u => { picksMap[u] = allPicks.filter(p => p.username === u); });
    const flowMap = window.Flow.detectAll(picksMap);
    Object.keys(map).forEach(u => { map[u].flowState = flowMap[u] || null; });
  }

  allTipsters = Object.values(map);
}

function updateStats() {
  if (rankingsData && rankingsData.todayStats) {
    const ts = rankingsData.todayStats;
    const total = (ts.winsToday || 0) + (ts.lossesToday || 0);
    document.getElementById('sbToday').textContent = total || '—';
    if (total) countUpEl(document.getElementById('sbToday'), total);
    document.getElementById('sbTodaySub').textContent = total ? 'Last 24 hours' : 'No picks yet today';
    document.getElementById('sbBigWin').textContent = ts.bigWinPnl != null ? (ts.bigWinPnl >= 0 ? '+' : '') + Number(ts.bigWinPnl).toFixed(1) + 'u' : '—';
    document.getElementById('sbBigWinSub').textContent = ts.bigWinPnl != null ? 'Best P&L in 24h' : 'No wins yet today';
    const active = ts.activeToday || 0;
    document.getElementById('sbActive').textContent = active || '—';
    document.getElementById('sbActiveSub').textContent = active ? active + ' tipsters active' : 'No activity yet';
  } else {
    // Fallback: compute from allPicks (loaded when filter is applied)
    const now = Date.now();
    const yesterday = now - 86400000;
    const todayPicks = allPicks.filter(p => new Date(p.createdAt).getTime() >= yesterday);
    document.getElementById('sbToday').textContent = todayPicks.length || '—';
    if (todayPicks.length) countUpEl(document.getElementById('sbToday'), todayPicks.length);
    document.getElementById('sbTodaySub').textContent = todayPicks.length ? `across ${new Set(todayPicks.map(p=>p.username)).size} tipsters` : 'No picks yet today';
    const todayWins = todayPicks.filter(p => p.result === 'win' && p.pnl > 0).sort((a,b) => b.pnl - a.pnl);
    const bigW = todayWins[0];
    document.getElementById('sbBigWin').textContent = bigW ? (bigW.pnl >= 0 ? '+' : '') + bigW.pnl.toFixed(1) + 'u' : '—';
    document.getElementById('sbBigWinSub').textContent = bigW ? '@' + (bigW.username || '?') : 'No wins yet today';
    const actMap = {};
    todayPicks.forEach(p => { if (!p.username) return; actMap[p.username] = (actMap[p.username] || 0) + 1; });
    const mostActive = Object.entries(actMap).sort((a, b) => b[1] - a[1])[0];
    document.getElementById('sbActive').textContent = mostActive ? '@' + mostActive[0] : '—';
    document.getElementById('sbActiveSub').textContent = mostActive ? mostActive[1] + ' picks today' : 'No activity yet';
  }

  // #1 ROI all time (from allTipsters, whichever path populated it)
  const sorted = [...allTipsters].filter(t => t.picks >= 5).sort((a,b) => {
    const roiA = a.roi != null ? a.roi : (a.stake>0?(a.pnl/a.stake)*100:0);
    const roiB = b.roi != null ? b.roi : (b.stake>0?(b.pnl/b.stake)*100:0);
    return roiB - roiA;
  });
  if (sorted[0]) {
    const roi = sorted[0].roi != null ? sorted[0].roi : (sorted[0].stake>0?(sorted[0].pnl/sorted[0].stake)*100:0);
    document.getElementById('sbTopROI').textContent = (roi >= 0 ? '+' : '') + roi.toFixed(1) + '%';
    document.getElementById('sbTopSub').textContent = '@' + sorted[0].username;
  }
}

function renderLeaderboard() {
  const search   = document.getElementById('searchInput').value.toLowerCase().trim();
  const sort     = document.getElementById('sortSelect').value;
  const minPicks = parseInt(document.getElementById('minPicksSelect').value) || 1;
  let list = [...allTipsters].filter(t => t.picks >= minPicks);
  if (search) list = list.filter(t => t.username.toLowerCase().includes(search));

  list.sort((a, b) => {
    const roiA = a.roi != null ? a.roi : (a.stake>0?(a.pnl/a.stake)*100:0);
    const roiB = b.roi != null ? b.roi : (b.stake>0?(b.pnl/b.stake)*100:0);
    const wrA  = a.winRate != null ? a.winRate*100 : ((a.wins+a.losses)>0?(a.wins/(a.wins+a.losses))*100:0);
    const wrB  = b.winRate != null ? b.winRate*100 : ((b.wins+b.losses)>0?(b.wins/(b.wins+b.losses))*100:0);
    if (sort==='roi')   return roiB-roiA;
    if (sort==='wr')    return wrB-wrA;
    if (sort==='picks') return b.picks-a.picks;
    if (sort==='pnl')   return b.pnl-a.pnl;
    if (sort==='rel') {
      const relA = a.reliabilityScore != null ? a.reliabilityScore : getReliability(a).score;
      const relB = b.reliabilityScore != null ? b.reliabilityScore : getReliability(b).score;
      return relB-relA;
    }
    return roiB-roiA;
  });

  const podiumEl  = document.getElementById('podium');
  const tableWrap = document.getElementById('lbTableWrap');
  const lbCont    = document.getElementById('lbContainer');
  const lbHead    = document.getElementById('lbHead');
  const emptyEl   = document.getElementById('lbEmpty');

  if (!list.length) {
    podiumEl.style.display = 'none';
    tableWrap.style.display = 'none';
    emptyEl.style.display = 'block';
    emptyEl.innerHTML = search
      ? `<div class="empty-lb"><span class="icon">🔍</span><h3>NO RESULTS</h3><p>No tipsters found for "@${search}".</p></div>`
      : `<div class="empty-lb"><span class="icon">📊</span><h3>NO DATA YET</h3><p>No tipsters with picks in this time period.<br>Try "ALL TIME" or post your first pick.</p></div>`;
    return;
  }

  emptyEl.style.display = 'none';

  // ── PODIUM ─────────────────────────────────────────────────
  if (!search && list.length >= 3) {
    podiumEl.style.display = 'grid';
    const top3 = list.slice(0, 3);
    const ORDER = [1, 0, 2]; // silver-center-gold, gold-center position
    podiumEl.innerHTML = ORDER.map(i => {
      const t    = top3[i];
      const roi  = t.roi != null ? t.roi : (t.stake > 0 ? (t.pnl / t.stake * 100) : 0);
      const wr   = t.winRate != null ? t.winRate * 100 : ((t.wins + t.losses) > 0 ? (t.wins / (t.wins + t.losses) * 100) : 0);
      const div  = _divFromRanking(t);

      const divPill = window.Divisions ? window.Divisions.pillHTML(div,'sm') : `<span class="dv-pill ${div.cls}">${div.icon} ${div.name}</span>`;
      const _podPhoto = window.LedgrAvatar ? window.LedgrAvatar.get(t.userId || t.username) : null;
      const podAv = _podPhoto
        ? `<div style="width:72px;height:72px;border-radius:50%;overflow:hidden;margin:0 auto"><img src="${_podPhoto}" style="width:100%;height:100%;object-fit:cover" alt="@${t.username}"></div>`

  lbHead.style.display = tableList.length ? 'grid' : 'none';

  lbCont.innerHTML = tableList.map((t, idx) => {
    const globalRank = (!search && t.rank) ? t.rank : (search ? idx + 1 : idx + 4);
    const roi  = t.roi != null ? t.roi : (t.stake > 0 ? (t.pnl / t.stake * 100) : 0);
    const wr   = t.winRate != null ? t.winRate * 100 : ((t.wins + t.losses) > 0 ? (t.wins / (t.wins + t.losses) * 100) : 0);
    const relRaw = t.reliabilityScore != null ? t.reliabilityScore : getReliability(t).score;
    const score = Math.round(relRaw);
    const color = score >= 70 ? 'var(--gr)' : score >= 40 ? 'var(--gold)' : 'var(--rd)';
    const div  = _divFromRanking(t);
    const icons= getBadgeIcons(t).slice(0, 2);
    const move = getRankMove(t.username, globalRank);

    const rankCls = globalRank === 1 ? 'rn-1' : globalRank === 2 ? 'rn-2' : globalRank === 3 ? 'rn-3' : globalRank <= 10 ? 'rn-top' : 'rn-rest';

    const storedAv = window.LedgrAvatar ? window.LedgrAvatar.get(t.userId) : (t.userId ? localStorage.getItem('ledgr_avatar_' + t.userId) : null);
    const avHTML = storedAv
      ? `<div class="av" style="background:${COLORS[idx%COLORS.length]};overflow:hidden;padding:0">${t.isLive?'<div class="live-dot"></div>':''}<img src="${storedAv}" style="width:100%;height:100%;object-fit:cover" alt="${t.username}"></div>`
      : (window.Divisions
          ? `<div style="position:relative">${window.Divisions.avHTML(t.username.slice(0,2).toUpperCase(),COLORS[idx%COLORS.length],div,{width:38,height:38,borderRadius:10,noParticles:true})}${t.isLive?'<div class="live-dot"></div>':''}</div>`
          : `<div class="av" style="background:${COLORS[idx%COLORS.length]}">${t.isLive?'<div class="live-dot"></div>':''}${t.username.slice(0,2).toUpperCase()}</div>`);

    const divPill = window.Divisions ? window.Divisions.pillHTML(div,'sm') : `<span class="dv-pill ${div.cls}">${div.icon} ${div.name}</span>`;
    const archHtml = t.archetype && window.archetypeBadgeHTML ? window.archetypeBadgeHTML(t.archetype, true) : '';
    const flowHtml = t.flowState && window.Flow ? window.Flow.chipHTML(t.flowState) : '';
    const ss = t.sharpScore || 0;
    const ssColor = ss >= 70 ? 'var(--gr)' : ss >= 40 ? 'var(--gold)' : 'var(--rd)';
    const _elo = t.elo != null ? t.elo : 0;
    const _displayElo = Math.max(0, _elo - 1000);
    const eloClass = _displayElo >= 800 ? 'top' : _displayElo < 200 ? 'low' : '';
    const usernameColor = globalRank === 1 ? 'var(--gold)' : globalRank <= 10 ? 'var(--ac-light)' : '';
    const usernamePfx = globalRank === 1 ? '👑 ' : '';
    const sharpMark = ss > 70 ? `<span style="color:var(--gr);font-size:11px;margin-left:4px">✓ Sharp</span>` : '';

    return `<div class="lb-row" style="--ri:${idx}" data-sh-user="${t.username}" onclick="window.location.href='/tipster?u=${t.username}'">
      <div class="rank-cell">
        <div class="rank-num ${rankCls}">${globalRank}${roi > 20 ? `<span style="font-size:9px;color:#00E5A0;font-family:'DM Mono',monospace;margin-left:2px">▲</span>` : roi < 0 ? `<span style="font-size:9px;color:#FF3355;font-family:'DM Mono',monospace;margin-left:2px">▼</span>` : ''}</div>
        ${move}
      </div>
      <div class="tipster-col">
        ${avHTML}
        <div class="tip-info">
          <div class="tip-name" ${usernameColor?`style="color:${usernameColor}"`:''}>${usernamePfx}@${t.username} ${icons.map(ic=>`<span style="font-size:11px">${ic}</span>`).join('')}${sharpMark}</div>
          <div class="tip-sub">${t.picks} picks</div>
          <div class="tip-badges">${divPill}${flowHtml||archHtml}</div>
        </div>
      </div>
      <div class="lb-stat">
        <div class="lsv ${roi>=0?'pos':'neg'}">${roi>=0?'+':''}${roi.toFixed(1)}%</div>
        <div class="lsl">ROI</div>
      </div>
      <div class="lb-stat">
        <div class="lsv neu">${wr.toFixed(0)}%</div>
        <div class="lsl">WIN RATE</div>
      </div>
      <div class="lb-stat">
        <div class="lsv neu">${t.picks}</div>
        <div class="lsl">PICKS</div>
      </div>
      <div class="streak-col">${t.streak>0?'🔥'+t.streak+'W':'—'}</div>
      <div class="rel-col">
        ${score>0
          ? `<div class="rel-score" style="color:${color}">${score}</div>
             <div class="rel-bar-wrap"><div class="rel-bar-fill" style="width:${score}%;background:${color}"></div></div>
             <div style="font-size:7px;color:var(--mu);font-family:var(--font-mono)">/100</div>`
          : '<span style="color:var(--mu);font-size:12px">—</span>'}
      </div>
      <div class="elo-cell">
        ${ss > 0
          ? `<div class="elo-val" style="color:${ssColor}" data-elo="${Math.round(ss)}">${Math.round(ss)}</div><div class="elo-lbl">SHARP</div>`
          : `<div class="elo-badge ${eloClass}" data-elo="${_displayElo}">${_displayElo}</div><div class="elo-lbl">ELO</div>`}
      </div>
      <button class="follow-btn" data-user-id="${t.userId||''}" onclick="event.stopPropagation()">Follow</button>
    </div>`;
  }).join('');

  // Animate ELO/score counters in table
  setTimeout(() => {
    lbCont.querySelectorAll('[data-elo]').forEach((el, idx) => {
      setTimeout(() => animateElo(el, parseInt(el.dataset.elo)), idx * 30);
    });
    if (window.animateSharpGauges) window.animateSharpGauges();
    if (window.Follows) window.Follows.initFollowButtons();
    if (window.LEDGR && LEDGR.observeReveal) LEDGR.observeReveal();
  }, 60);
}

loadLeaderboard();

// Pause pulsing animations on off-screen elements
(function() {
  if (!('IntersectionObserver' in window)) return;
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      e.target.style.animationPlayState = e.isIntersecting ? 'running' : 'paused';
    });
  }, {threshold: 0});
  function observe() {
    document.querySelectorAll('.live-dot,.lb-live-dot,.lsb-live-dot,.podium-crown,.conf-p').forEach(function(el) {
      if (!el._lbIo) { el._lbIo = true; io.observe(el); }
    });
  }
  observe();
  new MutationObserver(observe).observe(document.body, {childList: true, subtree: true});
})();
</script>
<img src="/assets/logo/ledgr-icon.png" alt="" style="position:fixed;bottom:80px;right:20px;height:100px;opacity:0.03;pointer-events:none;z-index:0;">
</body>
</html>
