
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07060d;--s1:#0c0a1a;--s2:#15122a;--bd:rgba(184,159,255,0.1);--bd2:rgba(184,159,255,0.18);--ac:#b89fff;--acg:rgba(184,159,255,0.08);--tx:#f0edff;--mu:#6a6690;--mu2:#9590b8;--gr:#34d399;--rd:#f87171}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh}
*{cursor:none!important}
.cursor{position:fixed;width:8px;height:8px;background:var(--ac);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .15s,height .15s}
.cursor-ring{position:fixed;width:32px;height:32px;border:1px solid rgba(184,159,255,0.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%)}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:1;opacity:.4}
nav{position:sticky;top:0;z-index:50;background:rgba(7,6,13,0.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);padding:0 32px;height:62px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:6px;color:var(--tx);text-decoration:none}
.logo span{color:var(--ac)}
.nav-links{display:flex;gap:4px}
.nav-link{color:var(--mu2);font-size:12px;font-weight:500;text-decoration:none;padding:8px 12px;border-radius:6px;transition:all .2s;letter-spacing:.3px}
.nav-link:hover{color:var(--tx);background:rgba(255,255,255,0.04)}
.nav-link.active{color:var(--ac);background:var(--acg)}
.nav-btn{background:var(--ac);color:#07060d;border:none;padding:9px 20px;border-radius:6px;font-size:12px;font-weight:700;cursor:none;font-family:'Syne',sans-serif;transition:all .2s}
.nav-btn:hover{background:#cdb8ff;transform:translateY(-1px)}
.main{max-width:1100px;margin:0 auto;padding:48px 24px;position:relative;z-index:1}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6vw,64px);letter-spacing:3px;margin-bottom:8px;color:var(--tx)}
.page-title span{color:var(--ac)}
.page-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:32px}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
.sb{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:18px;text-align:center;transition:border-color .2s}
.sb:hover{border-color:var(--bd2)}
.sb-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--ac);line-height:1}
.sb-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.search-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'Syne',sans-serif;font-size:13px;padding:12px 16px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--bd2)}
.search-input::placeholder{color:var(--mu)}
.sort-select{background:var(--s1);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'Syne',sans-serif;font-size:13px;padding:12px 16px;outline:none;cursor:none;transition:border-color .2s}
.sort-select:focus{border-color:var(--bd2)}
.sort-select option{background:#0c0a1a}
.filters{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.filter-btn{background:var(--s1);border:1px solid var(--bd);color:var(--mu2);padding:7px 16px;border-radius:20px;font-size:12px;cursor:none;transition:all .2s;font-family:'Syne',sans-serif}
.filter-btn:hover{color:var(--tx);border-color:var(--bd2)}
.filter-btn.active{background:var(--acg);border-color:var(--bd2);color:var(--ac)}
.lb-head{display:grid;grid-template-columns:56px 1fr 90px 90px 90px 90px 110px;gap:12px;padding:0 20px 12px;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;border-bottom:1px solid var(--bd);margin-bottom:8px}
.lb-row{display:grid;grid-template-columns:56px 1fr 90px 90px 90px 90px 110px;gap:12px;padding:16px 20px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;align-items:center;transition:all .2s;cursor:none}
.lb-row:hover{border-color:var(--bd2);background:var(--s2);transform:translateX(3px)}
.lb-row.top1{border-color:rgba(251,191,36,0.4);background:linear-gradient(135deg,rgba(251,191,36,0.05),var(--s1))}
.lb-row.top2{border-color:rgba(156,163,175,0.3)}
.lb-row.top3{border-color:rgba(180,120,80,0.3)}
.rank{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--mu);text-align:center;line-height:1}
.rank.r1{color:#fbbf24}.rank.r2{color:#9ca3af}.rank.r3{color:#b47850}
.tipster{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;flex-shrink:0;color:#fff}
.tip-name{font-weight:700;font-size:14px;margin-bottom:2px}
.tip-picks{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace}
.lb-stat{text-align:center}
.lsv{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px}
.lsv.pos{color:var(--gr)}.lsv.neg{color:var(--rd)}.lsv.neu{color:var(--tx)}
.lsl{font-size:9px;color:var(--mu);font-family:'DM Mono',monospace;letter-spacing:1px;margin-top:2px}
.follow-btn{padding:7px 16px;border:1px solid var(--bd2);color:var(--ac);background:var(--acg);border-radius:6px;font-size:11px;font-weight:700;cursor:none;transition:all .2s;font-family:'Syne',sans-serif;white-space:nowrap}
.follow-btn:hover{background:var(--ac);color:#07060d;border-color:var(--ac)}
.empty{text-align:center;padding:60px;color:var(--mu);font-family:'DM Mono',monospace;font-size:13px}
@media(max-width:900px){.lb-head,.lb-row{grid-template-columns:44px 1fr 70px 70px 70px}.lb-head>*:nth-child(6),.lb-row>*:nth-child(6){display:none}.stats-bar{grid-template-columns:repeat(2,1fr)}nav{padding:0 16px}.nav-link{display:none}}
@media(max-width:600px){.lb-head,.lb-row{grid-template-columns:40px 1fr 60px 60px}.lb-head>*:nth-child(5),.lb-row>*:nth-child(5),.lb-head>*:nth-child(6),.lb-row>*:nth-child(6){display:none}}
</style>
</head>
<body>
<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="ring"></div>
<nav>
  <a href="/home" class="logo">LEDG<span>R</span></a>
  <div class="nav-links">
    <a href="/home" class="nav-link">Home</a>
    <a href="/leaderboard" class="nav-link active">Leaderboard</a>
    <a href="/compare" class="nav-link">Compare</a>
    <a href="/simulator" class="nav-link">Simulator</a>
    <a href="/badges" class="nav-link">🏅 Badges</a>
  </div>
  <button class="nav-btn" onclick="window.location.href='/dashboard'">My Dashboard</button>
</nav>
<div class="main">
  <div class="page-title">LEADER<span>BOARD</span></div>
  <div class="page-sub">REAL PICKS · VERIFIED RECORDS · UPDATED LIVE</div>
  <div class="stats-bar">
    <div class="sb"><div class="sb-val" id="sbTipsters">—</div><div class="sb-lbl">Active Tipsters</div></div>
    <div class="sb"><div class="sb-val" id="sbPicks">—</div><div class="sb-lbl">Total Picks</div></div>
    <div class="sb"><div class="sb-val" id="sbWinRate">—</div><div class="sb-lbl">Avg Win Rate</div></div>
    <div class="sb"><div class="sb-val" id="sbROI">—</div><div class="sb-lbl">Avg ROI</div></div>
  </div>
  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍  Search tipster..." oninput="renderLeaderboard()">
    <select class="sort-select" id="sortSelect" onchange="renderLeaderboard()">
      <option value="roi">Sort by ROI</option>
      <option value="wr">Sort by Win Rate</option>
      <option value="picks">Sort by Picks</option>
      <option value="pnl">Sort by P&L</option>
    </select>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="filterBy('all',this)">All Sports</button>
    <button class="filter-btn" onclick="filterBy('Soccer',this)">⚽ Soccer</button>
    <button class="filter-btn" onclick="filterBy('Basketball',this)">🏀 Basketball</button>
    <button class="filter-btn" onclick="filterBy('Tennis',this)">🎾 Tennis</button>
    <button class="filter-btn" onclick="filterBy('Football',this)">🏈 Football</button>
    <button class="filter-btn" onclick="filterBy('MMA/Boxing',this)">🥊 MMA</button>
  </div>
  <div class="lb-head">
    <span></span><span>Tipster</span>
    <span style="text-align:center">ROI</span>
    <span style="text-align:center">Win Rate</span>
    <span style="text-align:center">Picks</span>
    <span style="text-align:center">P&L</span>
    <span></span>
  </div>
  <div id="lbContainer"><div class="empty">Loading...</div></div>
</div>
<script>
const cur=document.getElementById('cur'),ring=document.getElementById('ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px'});
(function lerp(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(lerp)})();
document.querySelectorAll('a,button,.lb-row').forEach(el=>{el.addEventListener('mouseenter',()=>{cur.style.width='14px';cur.style.height='14px'});el.addEventListener('mouseleave',()=>{cur.style.width='8px';cur.style.height='8px'})});

const API='https://ledgr-backend-production-c132.up.railway.app';
let allPicks=[],currentFilter='all',allTipsters=[];
const medals=['🥇','🥈','🥉'];
const colors=['linear-gradient(135deg,#7c3aed,#a855f7)','linear-gradient(135deg,#059669,#10b981)','linear-gradient(135deg,#b45309,#f59e0b)','linear-gradient(135deg,#0369a1,#38bdf8)','linear-gradient(135deg,#0f766e,#14b8a6)','linear-gradient(135deg,#dc2626,#ef4444)','linear-gradient(135deg,#7c3aed,#ec4899)','linear-gradient(135deg,#d97706,#f59e0b)'];

function getBadges(t){
  const badges=[];
  const roi=t.stake>0?(t.pnl/t.stake)*100:0;
  const wr=(t.wins+t.losses)>0?(t.wins/(t.wins+t.losses))*100:0;
  if(roi>=20&&t.picks>=50)badges.push('💎');
  if(wr>=60&&(t.wins+t.losses)>=30)badges.push('🎯');
  if(roi>=15&&t.picks>=10&&t.picks<50)badges.push('🚀');
  if(t.picks>=100)badges.push('👑');
  return badges.join(' ');
}

async function loadLeaderboard(){
  const c=document.getElementById('lbContainer');
  c.innerHTML='<div class="empty">Loading...</div>';
  try{
    const r=await fetch(API+'/picks',{cache:'no-store'});
    if(!r.ok)throw new Error('Server error '+r.status);
    const data=await r.json();
    allPicks=Array.isArray(data)?data:[];
    buildTipsters();
    updateStats();
    renderLeaderboard();
  }catch(e){
    c.innerHTML='<div class="empty">⚠️ Could not load data.<br><br><span style="font-size:11px">'+e.message+'</span></div>';
  }
}

function buildTipsters(){
  const map={};
  const filtered=currentFilter==='all'?allPicks:allPicks.filter(p=>p.sport===currentFilter);
  filtered.forEach(p=>{
    if(!p.user)return;
    const u=p.user.username;
    if(!map[u])map[u]={username:u,picks:0,wins:0,losses:0,stake:0,pnl:0};
    map[u].picks++;map[u].stake+=p.stake;map[u].pnl+=p.pnl;
    if(p.result==='win')map[u].wins++;
    if(p.result==='loss')map[u].losses++;
  });
  allTipsters=Object.values(map);
}

function updateStats(){
  const wins=allPicks.filter(p=>p.result==='win').length;
  const settled=allPicks.filter(p=>p.result!=='pending').length;
  const avgWR=settled>0?((wins/settled)*100).toFixed(0):0;
  const totalStake=allPicks.reduce((s,p)=>s+p.stake,0);
  const totalPnL=allPicks.reduce((s,p)=>s+p.pnl,0);
  const avgROI=totalStake>0?((totalPnL/totalStake)*100).toFixed(1):0;
  document.getElementById('sbTipsters').textContent=allTipsters.length||0;
  document.getElementById('sbPicks').textContent=allPicks.length;
  document.getElementById('sbWinRate').textContent=avgWR+'%';
  document.getElementById('sbROI').textContent=(parseFloat(avgROI)>=0?'+':'')+avgROI+'%';
}

function filterBy(sport,btn){
  currentFilter=sport;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildTipsters();
  renderLeaderboard();
}

function renderLeaderboard(){
  const search=document.getElementById('searchInput').value.toLowerCase().trim();
  const sort=document.getElementById('sortSelect').value;
  let list=[...allTipsters];
  if(search)list=list.filter(t=>t.username.toLowerCase().includes(search));
  list.sort((a,b)=>{
    const roiA=a.stake>0?(a.pnl/a.stake)*100:0;
    const roiB=b.stake>0?(b.pnl/b.stake)*100:0;
    const wrA=(a.wins+a.losses)>0?(a.wins/(a.wins+a.losses))*100:0;
    const wrB=(b.wins+b.losses)>0?(b.wins/(b.wins+b.losses))*100:0;
    if(sort==='roi')return roiB-roiA;
    if(sort==='wr')return wrB-wrA;
    if(sort==='picks')return b.picks-a.picks;
    if(sort==='pnl')return b.pnl-a.pnl;
    return roiB-roiA;
  });
  const c=document.getElementById('lbContainer');
  if(!list.length){c.innerHTML=search?`<div class="empty">No tipsters found for "${search}"</div>`:'<div class="empty">No tipsters yet. Be the first!</div>';return;}
  c.innerHTML=list.map((t,i)=>{
    const roi=t.stake>0?((t.pnl/t.stake)*100).toFixed(1):0;
    const wr=(t.wins+t.losses)>0?((t.wins/(t.wins+t.losses))*100).toFixed(0):0;
    const cls=i===0?'top1':i===1?'top2':i===2?'top3':'';
    const rnkCls=i===0?'r1':i===1?'r2':i===2?'r3':'';
    const roiPos=parseFloat(roi)>=0;
    const pnlPos=t.pnl>=0;
    const badges=getBadges(t);
    return`<div class="lb-row ${cls}" onclick="window.location.href='/tipster?u=${t.username}'">
      <div class="rank ${rnkCls}">${i<3?medals[i]:i+1}</div>
      <div class="tipster">
        <div class="av" style="background:${colors[i%colors.length]}">${t.username.substring(0,2).toUpperCase()}</div>
        <div>
          <div class="tip-name">@${t.username} ${badges}</div>
          <div class="tip-picks">${t.picks} pick${t.picks!==1?'s':''}</div>
        </div>
      </div>
      <div class="lb-stat"><div class="lsv ${roiPos?'pos':'neg'}">${roiPos?'+':''}${roi}%</div><div class="lsl">ROI</div></div>
      <div class="lb-stat"><div class="lsv neu">${wr}%</div><div class="lsl">WIN RATE</div></div>
      <div class="lb-stat"><div class="lsv neu">${t.picks}</div><div class="lsl">PICKS</div></div>
      <div class="lb-stat"><div class="lsv ${pnlPos?'pos':'neg'}">${pnlPos?'+€':'-€'}${Math.abs(t.pnl).toFixed(2)}</div><div class="lsl">P&L</div></div>
      <button class="follow-btn" onclick="event.stopPropagation();this.textContent=this.textContent==='Follow'?'Following ✓':'Follow'">Follow</button>
    </div>`;
  }).join('');
  // re-attach cursor hover after render
  document.querySelectorAll('.lb-row,.follow-btn').forEach(el=>{el.addEventListener('mouseenter',()=>{cur.style.width='14px';cur.style.height='14px'});el.addEventListener('mouseleave',()=>{cur.style.width='8px';cur.style.height='8px'})});
}

loadLeaderboard();
</script>
</body>
</html>
