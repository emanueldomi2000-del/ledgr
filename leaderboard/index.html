<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05050a;--s1:#0b0b14;--s2:#111120;--bd:#18182e;--ac:#e8ff00;--tx:#f2f2fa;--mu:#5a5a7a;--mu2:#8888aa;--gr:#00e5a0;--rd:#ff3355}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(232,255,0,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,255,0,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
nav{position:sticky;top:0;z-index:50;background:rgba(5,5,10,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:5px;color:var(--ac);text-decoration:none}
.nav-links{display:flex;gap:8px}
.nav-link{color:var(--mu2);font-size:13px;text-decoration:none;padding:8px 14px;border-radius:8px;transition:all .2s}
.nav-link:hover{color:var(--tx);background:var(--s2)}
.nav-link.active{color:var(--ac);background:rgba(232,255,0,0.08)}
.nav-btn{background:var(--ac);color:#05050a;border:none;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif}
.main{max-width:1100px;margin:0 auto;padding:48px 24px;position:relative;z-index:1}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6vw,64px);letter-spacing:3px;margin-bottom:8px}
.page-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:32px}
.filters{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.filter-btn{background:var(--s2);border:1px solid var(--bd);color:var(--mu2);padding:8px 18px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif}
.filter-btn.active{background:rgba(232,255,0,0.1);border-color:var(--ac);color:var(--ac)}
.lb-head{display:grid;grid-template-columns:56px 1fr 90px 90px 90px 90px 110px;gap:12px;padding:0 20px 12px;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;border-bottom:1px solid var(--bd);margin-bottom:8px}
.lb-row{display:grid;grid-template-columns:56px 1fr 90px 90px 90px 90px 110px;gap:12px;padding:16px 20px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;align-items:center;transition:all .2s;cursor:pointer}
.lb-row:hover{border-color:rgba(232,255,0,0.25);background:var(--s2);transform:translateX(4px)}
.lb-row.top1{border-color:#f59e0b;background:linear-gradient(135deg,rgba(245,158,11,0.06),var(--s1))}
.lb-row.top2{border-color:rgba(156,163,175,0.4)}
.lb-row.top3{border-color:rgba(180,120,80,0.4)}
.rank{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--mu);text-align:center;line-height:1}
.rank.r1{color:#f59e0b}.rank.r2{color:#9ca3af}.rank.r3{color:#b47850}
.tipster{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;flex-shrink:0;background:linear-gradient(135deg,#7c3aed,#a855f7)}
.tip-name{font-weight:700;font-size:14px;margin-bottom:2px}
.tip-picks{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace}
.lb-stat{text-align:center}
.lsv{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px}
.lsv.pos{color:var(--gr)}.lsv.neg{color:var(--rd)}.lsv.neu{color:var(--tx)}
.lsl{font-size:9px;color:var(--mu);font-family:'DM Mono',monospace;letter-spacing:1px;margin-top:2px}
.follow-btn{padding:8px 18px;border:1px solid rgba(232,255,0,0.25);color:var(--ac);background:rgba(232,255,0,0.05);border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif;white-space:nowrap}
.follow-btn:hover,.follow-btn.following{background:var(--ac);color:#05050a;border-color:var(--ac)}
.loading{text-align:center;padding:60px;color:var(--mu)}
.loading .spin{font-size:32px;animation:spin 1s linear infinite;display:block;margin-bottom:12px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px;color:var(--mu)}
.empty .icon{font-size:40px;margin-bottom:12px}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:40px}
.sb{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:18px;text-align:center}
.sb-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--ac);line-height:1}
.sb-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-top:6px}
@media(max-width:900px){.lb-head,.lb-row{grid-template-columns:44px 1fr 70px 70px 70px}.lb-head>*:nth-child(6),.lb-row>*:nth-child(6){display:none}.stats-bar{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.lb-head,.lb-row{grid-template-columns:40px 1fr 60px 60px}.lb-head>*:nth-child(5),.lb-row>*:nth-child(5),.lb-head>*:nth-child(6),.lb-row>*:nth-child(6){display:none}}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">LEDGR</a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/leaderboard" class="nav-link active">Leaderboard</a>
    <a href="/dashboard" class="nav-link">Dashboard</a>
  </div>
  <button class="nav-btn" onclick="window.location.href='/dashboard'">My Dashboard</button>
</nav>

<div class="main">
  <div class="page-title">LEADERBOARD</div>
  <div class="page-sub">REAL PICKS · VERIFIED RECORDS · UPDATED LIVE</div>

  <div class="stats-bar">
    <div class="sb"><div class="sb-val" id="sbTipsters">0</div><div class="sb-lbl">Active Tipsters</div></div>
    <div class="sb"><div class="sb-val" id="sbPicks">0</div><div class="sb-lbl">Total Picks</div></div>
    <div class="sb"><div class="sb-val" id="sbWinRate">0%</div><div class="sb-lbl">Avg Win Rate</div></div>
    <div class="sb"><div class="sb-val" id="sbROI">0%</div><div class="sb-lbl">Avg ROI</div></div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterBy('all',this)">All Sports</button>
    <button class="filter-btn" onclick="filterBy('Soccer',this)">⚽ Soccer</button>
    <button class="filter-btn" onclick="filterBy('Basketball',this)">🏀 Basketball</button>
    <button class="filter-btn" onclick="filterBy('Tennis',this)">🎾 Tennis</button>
    <button class="filter-btn" onclick="filterBy('Football',this)">🏈 Football</button>
    <button class="filter-btn" onclick="filterBy('MMA/Boxing',this)">🥊 MMA</button>
  </div>

  <div class="lb-head">
    <span></span>
    <span>Tipster</span>
    <span style="text-align:center">ROI</span>
    <span style="text-align:center">Win Rate</span>
    <span style="text-align:center">Picks</span>
    <span style="text-align:center">P&L</span>
    <span></span>
  </div>

  <div id="lbContainer">
    <div class="loading"><span class="spin">⟳</span>Loading leaderboard...</div>
  </div>
</div>

<script>
const API='https://ledgr-backend-production-c132.up.railway.app';
let allPicks=[];
let currentFilter='all';
const medals=['🥇','🥈','🥉'];
const colors=['linear-gradient(135deg,#7c3aed,#a855f7)','linear-gradient(135deg,#059669,#10b981)','linear-gradient(135deg,#b45309,#f59e0b)','linear-gradient(135deg,#0369a1,#38bdf8)','linear-gradient(135deg,#dc2626,#ef4444)','linear-gradient(135deg,#0f766e,#14b8a6)'];

async function loadLeaderboard(){
  try{
    const r=await fetch(API+'/picks');
    allPicks=await r.json();
    renderLeaderboard();
  }catch(e){
    document.getElementById('lbContainer').innerHTML='<div class="empty"><div class="icon">⚠️</div><p>Could not load data. Try again later.</p></div>';
  }
}

function filterBy(sport,btn){
  currentFilter=sport;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLeaderboard();
}

function renderLeaderboard(){
  const filtered=currentFilter==='all'?allPicks:allPicks.filter(p=>p.sport===currentFilter);
  
  // Group by user
  const tipsters={};
  filtered.forEach(p=>{
    if(!p.user)return;
    const u=p.user.username;
    if(!tipsters[u])tipsters[u]={username:u,picks:0,wins:0,losses:0,stake:0,pnl:0};
    tipsters[u].picks++;
    tipsters[u].stake+=p.stake;
    tipsters[u].pnl+=p.pnl;
    if(p.result==='win')tipsters[u].wins++;
    if(p.result==='loss')tipsters[u].losses++;
  });

  const arr=Object.values(tipsters).sort((a,b)=>{
    const roiA=a.stake>0?(a.pnl/a.stake)*100:0;
    const roiB=b.stake>0?(b.pnl/b.stake)*100:0;
    return roiB-roiA;
  });

  // Update stats bar
  const totalPicks=filtered.length;
  const allWins=filtered.filter(p=>p.result==='win').length;
  const allSettled=filtered.filter(p=>p.result!=='pending').length;
  const avgWR=allSettled>0?((allWins/allSettled)*100).toFixed(0):0;
  const totalStake=filtered.reduce((s,p)=>s+p.stake,0);
  const totalPnL=filtered.reduce((s,p)=>s+p.pnl,0);
  const avgROI=totalStake>0?((totalPnL/totalStake)*100).toFixed(1):0;
  document.getElementById('sbTipsters').textContent=arr.length;
  document.getElementById('sbPicks').textContent=totalPicks;
  document.getElementById('sbWinRate').textContent=avgWR+'%';
  document.getElementById('sbROI').textContent=(avgROI>=0?'+':'')+avgROI+'%';

  const c=document.getElementById('lbContainer');
  if(!arr.length){
    c.innerHTML='<div class="empty"><div class="icon">📊</div><p>No picks yet for this sport. Be the first!</p></div>';
    return;
  }

  c.innerHTML=arr.map((t,i)=>{
    const roi=t.stake>0?((t.pnl/t.stake)*100).toFixed(1):0;
    const wr=(t.wins+t.losses)>0?((t.wins/(t.wins+t.losses))*100).toFixed(0):0;
    const cls=i===0?'top1':i===1?'top2':i===2?'top3':'';
    const rnkCls=i===0?'r1':i===1?'r2':i===2?'r3':'';
    const initials=t.username.substring(0,2).toUpperCase();
    const color=colors[i%colors.length];
    const roiPos=parseFloat(roi)>=0;
    const pnlPos=t.pnl>=0;
    return`<div class="lb-row ${cls}">
      <div class="rank ${rnkCls}">${i<3?medals[i]:i+1}</div>
      <div class="tipster">
        <div class="av" style="background:${color}">${initials}</div>
        <div><div class="tip-name">@${t.username}</div><div class="tip-picks">${t.picks} pick${t.picks!==1?'s':''}</div></div>
      </div>
      <div class="lb-stat"><div class="lsv ${roiPos?'pos':'neg'}">${roiPos?'+':''}${roi}%</div><div class="lsl">ROI</div></div>
      <div class="lb-stat"><div class="lsv neu">${wr}%</div><div class="lsl">WIN RATE</div></div>
      <div class="lb-stat"><div class="lsv neu">${t.picks}</div><div class="lsl">PICKS</div></div>
      <div class="lb-stat"><div class="lsv ${pnlPos?'pos':'neg'}">${pnlPos?'+€':'-€'}${Math.abs(t.pnl).toFixed(2)}</div><div class="lsl">P&L</div></div>
      <button class="follow-btn" onclick="this.classList.toggle('following');this.textContent=this.classList.contains('following')?'Following':'Follow'">Follow</button>
    </div>`;
  }).join('');
}

loadLeaderboard();
</script>
</body>
</html>
