<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Badge Vault</title>
<link rel="icon" href="/assets/logo/ledgr-icon.png">
<meta property="og:title" content="LEDGR — Badge Vault">
<meta property="og:description" content="Build your legend. Earn rare badges for streaks, ROI, CLV, and prestige milestones.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>
:root{
  --div-color: var(--ac-vivid);  /* set dynamically by JS per user division */
}

/* ── HERO ── */
.hero{position:relative;overflow:hidden;padding:64px 24px 52px;text-align:center;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.hero-bg-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 55% at 50% 40%,var(--div-color),transparent 70%);opacity:0.18}
.hero-watermark{position:absolute;top:16px;right:20px;height:100px;opacity:0.04;pointer-events:none}
.hero-bg-badge{position:absolute;font-size:200px;opacity:0.06;filter:blur(2px);transform:scale(6) rotate(0deg);animation:bgSpin 60s linear infinite;pointer-events:none;line-height:1;top:50%;left:50%;margin:-60px 0 0 -60px}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--div-color);opacity:0.15;animation:floatUp var(--dur,12s) var(--delay,0s) linear infinite}
@keyframes floatUp{0%{transform:translateY(100vh) translateX(0);opacity:0.15}100%{transform:translateY(-60px) translateX(var(--drift,20px));opacity:0}}
@keyframes bgSpin{to{transform:scale(6) rotate(360deg)}}
.hero-title{font-family:var(--font-display);font-size:clamp(42px,8vw,72px);font-weight:700;letter-spacing:4px;line-height:1;position:relative;z-index:2}
.hero-subtitle{font-size:14px;color:var(--mu2);margin-top:6px;font-weight:500;letter-spacing:1px;position:relative;z-index:2}
.hero-stats{display:flex;align-items:center;gap:0;margin-top:24px;background:rgba(18,18,18,0.7);border:1px solid var(--bd);border-radius:10px;overflow:hidden;position:relative;z-index:2;backdrop-filter:blur(8px)}
.hero-stat{padding:12px 22px;font-family:var(--font-mono);font-size:12px}
.hero-stat-val{font-size:16px;font-weight:700;display:block;color:var(--tx)}
.hero-stat-lbl{color:var(--mu);font-size:10px;margin-top:1px}
.hero-stat+.hero-stat{border-left:1px solid var(--bd)}
.hero-next{margin-top:20px;background:rgba(18,18,18,0.75);border:1px solid var(--bd);border-radius:10px;padding:14px 22px;min-width:280px;max-width:380px;position:relative;z-index:2;backdrop-filter:blur(8px)}
.hero-next-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:6px;font-family:var(--font-mono)}
.hero-next-name{font-family:var(--font-display);font-size:16px;font-weight:700;margin-bottom:8px}
.hero-next-track{height:5px;background:var(--s2);border-radius:3px;overflow:hidden}
.hero-next-fill{height:100%;background:var(--div-color);border-radius:3px;transition:width 1.2s ease-out}
.hero-next-sub{font-size:11px;color:var(--mu);margin-top:5px;font-family:var(--font-mono)}

/* ── SHOWCASE ── */
.showcase-wrap{max-width:1140px;margin:0 auto 0;padding:32px 24px 0}
.sec-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sec-header-title{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--mu)}
.sec-header::after{content:'';flex:1;height:1px;background:var(--bd)}
.sec-header-img{width:14px;height:14px;opacity:0.25}
.showcase-slots{display:flex;gap:12px;flex-wrap:wrap}
.showcase-slot{width:80px;height:88px;border-radius:12px;border:1.5px dashed var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;position:relative;background:var(--s1)}
.showcase-slot:hover{border-color:var(--ac);background:var(--acg)}
.showcase-slot.has-badge{border-style:solid}
.showcase-slot .slot-plus{font-size:20px;color:var(--bd)}
.showcase-slot .slot-icon{font-size:28px;line-height:1}
.showcase-slot .slot-name{font-size:8px;font-family:var(--font-mono);color:var(--mu);margin-top:3px;text-align:center;padding:0 4px;line-height:1.2}
.showcase-slot.selecting{border-color:var(--ac);background:var(--acg);animation:slotPulse 1s ease infinite}
@keyframes slotPulse{0%,100%{box-shadow:0 0 0 0 rgba(123,44,255,0)}50%{box-shadow:0 0 0 4px rgba(123,44,255,0.2)}}

/* ── PAGE BODY ── */
.page{max-width:1140px;margin:0 auto;padding:32px 24px 60px}

/* ── SECTION ── */
.badge-section{margin-bottom:40px}
.badge-section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;border-left:3px solid var(--ac);padding-left:10px;cursor:pointer}
.badge-section-title{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.badge-section-count{font-family:var(--font-mono);font-size:11px;color:var(--mu);margin-left:auto}
.badge-section-count.complete{color:var(--gr)}
.badge-section-toggle{font-size:11px;color:var(--mu);white-space:nowrap}
.section-divider{display:flex;align-items:center;gap:8px;margin:32px 0 28px}
.section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:var(--bd)}
.section-divider img{width:14px;height:14px;opacity:0.25}

/* ── BADGE GRID ── */
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.badge-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:580px){.badge-grid{grid-template-columns:repeat(2,1fr)}}

/* FEATURED grid (3 larger) */
.badge-grid-featured{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px}
@media(max-width:600px){.badge-grid-featured{grid-template-columns:1fr 1fr}}

/* ── BADGE CARD ── */
.badge-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.badge-card:hover{transform:translateY(-2px)}
.badge-card.locked{filter:grayscale(0.7);opacity:0.45}
.badge-card.locked .badge-icon{opacity:0.5}
.badge-card-featured{padding:20px 14px;border-radius:16px}
.badge-lock-overlay{position:absolute;top:8px;right:8px;font-size:11px;opacity:0.5}
.badge-icon{font-size:36px;line-height:1;position:relative;z-index:1}
.badge-card-featured .badge-icon{font-size:48px}
.badge-name{font-family:var(--font-display);font-size:13px;font-weight:700;text-align:center;line-height:1.2}
.badge-card-featured .badge-name{font-size:16px}
.badge-rarity-pill{font-size:8px;font-family:var(--font-mono);letter-spacing:1.5px;padding:2px 7px;border-radius:10px;border:1px solid currentColor;font-weight:700;text-transform:uppercase}

/* rarity treatments */
.rarity-common .badge-rarity-pill{color:var(--rarity-common);border-color:var(--rarity-common)}
.rarity-rare{box-shadow:0 0 12px rgba(79,195,247,0.3);border-color:#4FC3F7}
.rarity-rare .badge-rarity-pill{color:var(--rarity-rare);border-color:var(--rarity-rare)}
.rarity-epic{box-shadow:0 0 16px rgba(123,44,255,0.4);border-color:rgba(123,44,255,0.5)}
.rarity-epic .badge-rarity-pill{color:var(--rarity-epic);border-color:var(--rarity-epic)}
.rarity-legendary{box-shadow:0 0 24px rgba(255,215,0,0.4);border-color:rgba(255,215,0,0.5);animation:legendGlow 3s ease infinite}
@keyframes legendGlow{0%,100%{box-shadow:0 0 24px rgba(255,215,0,0.4)}50%{box-shadow:0 0 36px rgba(255,215,0,0.6)}}
.rarity-legendary .badge-rarity-pill{color:var(--rarity-legendary);border-color:var(--rarity-legendary)}
.rarity-mythic{border-color:transparent;animation:mythicBorder 8s linear infinite,legendGlow 2s ease infinite}
@keyframes mythicBorder{0%{border-color:hsl(0,80%,60%)}14%{border-color:hsl(51,80%,60%)}28%{border-color:hsl(102,80%,60%)}42%{border-color:hsl(153,80%,60%)}56%{border-color:hsl(204,80%,60%)}70%{border-color:hsl(255,80%,60%)}84%{border-color:hsl(306,80%,60%)}100%{border-color:hsl(360,80%,60%)}}
.rarity-mythic .badge-rarity-pill{animation:mythicText 8s linear infinite;border-color:transparent}
@keyframes mythicText{0%{color:hsl(0,80%,70%)}25%{color:hsl(90,80%,70%)}50%{color:hsl(180,80%,70%)}75%{color:hsl(270,80%,70%)}100%{color:hsl(360,80%,70%)}}

/* legendary orbit particles */
.orbit-ring{position:absolute;inset:-6px;pointer-events:none}
.orbit-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);top:50%;left:50%;transform-origin:0 0;animation:orbitDot 4s linear infinite}
@keyframes orbitDot{to{transform:rotate(360deg) translateX(44px) rotate(-360deg)}}

/* rare pulse */
.rarity-rare{animation:rarePulse 3s ease infinite}
@keyframes rarePulse{0%,100%{box-shadow:0 0 12px rgba(79,195,247,0.3)}50%{box-shadow:0 0 20px rgba(79,195,247,0.5)}}

/* shimmer on epic */
.rarity-epic::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(123,44,255,0.06) 50%,transparent 60%);animation:shimmer 3s linear infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}

/* ── MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal-card{background:var(--s1);border:1px solid var(--bd);border-radius:20px;width:100%;max-width:400px;padding:32px 28px;position:relative;transform:translateY(20px) scale(.97);transition:transform .2s;text-align:center}
.modal-backdrop.open .modal-card{transform:translateY(0) scale(1)}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--mu);font-size:20px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:4px;transition:color .15s}
.modal-close:hover{color:var(--tx)}
.modal-icon{font-size:72px;line-height:1;margin-bottom:12px;display:block}
.modal-rarity{font-size:9px;font-family:var(--font-mono);letter-spacing:2px;padding:3px 10px;border-radius:10px;border:1px solid currentColor;display:inline-block;margin-bottom:10px}
.modal-name{font-family:var(--font-display);font-size:28px;font-weight:700;margin-bottom:6px}
.modal-desc{font-size:14px;color:var(--mu2);line-height:1.6;margin-bottom:16px}
.modal-divider{height:1px;background:var(--bd);margin:16px 0}
.modal-meta{font-family:var(--font-mono);font-size:11px;color:var(--mu);text-align:left;display:flex;flex-direction:column;gap:8px}
.modal-meta-row{display:flex;justify-content:space-between;align-items:center}
.modal-meta-lbl{color:var(--mu);font-size:10px;letter-spacing:1px}
.modal-meta-val{color:var(--tx)}
.modal-progress-track{height:5px;background:var(--s2);border-radius:3px;overflow:hidden;margin-top:4px}
.modal-progress-fill{height:100%;border-radius:3px;transition:width 1s ease-out}
.modal-secret{color:var(--mu);font-style:italic;font-size:13px;margin:12px 0}
.modal-hint{font-size:11px;color:var(--mu);border:1px dashed var(--bd);border-radius:6px;padding:8px 12px;margin-top:8px;text-align:center;font-style:italic}
.modal-equip-btn{width:100%;margin-top:14px;padding:10px;border-radius:8px;border:1px solid var(--ac);background:var(--acg);color:var(--ac);font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s}
.modal-equip-btn:hover{background:var(--ac);color:#fff}
.modal-equip-btn.equipped{background:rgba(0,229,160,0.1);border-color:var(--gr);color:var(--gr)}
.modal-watermark{position:absolute;bottom:12px;right:14px;width:28px;height:28px;opacity:0.06}
.modal-unlock-date{color:var(--gr);font-size:11px}
.modal-pct{color:var(--mu);font-size:11px}
.modal-reward{background:rgba(123,44,255,0.06);border:1px solid rgba(123,44,255,0.2);border-radius:6px;padding:8px 12px;text-align:left;margin-top:8px}
.modal-reward-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:3px;font-family:var(--font-mono)}
.modal-reward-val{font-size:13px;color:var(--ac-light)}

/* ── LOADING ── */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:12px;color:var(--mu)}
.spinner{width:32px;height:32px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── UTILS ── */
.collapsed .badge-grid,.collapsed .badge-grid-featured{display:none}
.show-toggle{font-size:12px;color:var(--ac);cursor:pointer;margin-top:6px;display:inline-block;font-family:var(--font-body);font-weight:500}
.show-toggle:hover{text-decoration:underline}

/* ── IDENTITY: BADGE VAULT ── */
@keyframes vaultBreath{0%,100%{opacity:.35}50%{opacity:.55}}
.bg-vignette{position:fixed;inset:0;background:radial-gradient(ellipse 90% 72% at 50% 32%,transparent 38%,rgba(0,0,0,.42) 100%);pointer-events:none;z-index:0}
.bg-vault-floor{position:fixed;bottom:-100px;left:50%;transform:translateX(-50%);width:1000px;height:320px;background:radial-gradient(ellipse,rgba(251,191,36,.055),transparent 65%);pointer-events:none;z-index:0;animation:vaultBreath 9s ease-in-out infinite}
</style>
</head>
<body>
<div class="bg-vignette"></div>
<div class="bg-vault-floor"></div>
<script src="/shared/avatar.js"></script>
<script src="/app-nav.js"></script>
<script src="/motion.js"></script>
<script>AppNav.init({active:'badges'});</script>

<!-- HERO -->
<div class="hero" id="hero">
  <div class="hero-bg-glow" id="heroBgGlow"></div>
  <img class="hero-watermark" src="/assets/logo/ledgr-icon.png" alt="">
  <div class="particles" id="particlesWrap"></div>
  <div class="hero-bg-badge" id="heroBgBadge"></div>

  <div class="hero-title" id="heroTitle">BADGE VAULT</div>
  <div class="hero-subtitle" id="heroSubtitle">BUILD YOUR LEGEND</div>

  <div class="hero-stats" id="heroStats">
    <div class="hero-stat"><span class="hero-stat-val" id="hUnlocked">—</span><div class="hero-stat-lbl">Unlocked</div></div>
    <div class="hero-stat"><span class="hero-stat-val" id="hLegendary" style="color:var(--gold)">—</span><div class="hero-stat-lbl">Legendary</div></div>
    <div class="hero-stat"><span class="hero-stat-val" id="hEpic" style="color:var(--rarity-epic)">—</span><div class="hero-stat-lbl">Epic</div></div>
    <div class="hero-stat"><span class="hero-stat-val" id="hCompletion" style="color:var(--ac)">—</span><div class="hero-stat-lbl">Completion</div></div>
  </div>

  <div class="hero-next" id="heroNext" style="display:none">
    <div class="hero-next-label">Next Unlock</div>
    <div class="hero-next-name" id="heroNextName">—</div>
    <div class="hero-next-track"><div class="hero-next-fill" id="heroNextFill" style="width:0%"></div></div>
    <div class="hero-next-sub" id="heroNextSub"></div>
  </div>
</div>

<!-- SHOWCASE -->
<div class="showcase-wrap">
  <div class="sec-header">
    <span class="sec-header-title">Your Showcase</span>
    
  </div>
  <div class="showcase-slots" id="showcaseSlots">
    <div class="showcase-slot" data-slot="0" onclick="selectShowcaseSlot(0)"><span class="slot-plus">+</span></div>
    <div class="showcase-slot" data-slot="1" onclick="selectShowcaseSlot(1)"><span class="slot-plus">+</span></div>
    <div class="showcase-slot" data-slot="2" onclick="selectShowcaseSlot(2)"><span class="slot-plus">+</span></div>
    <div class="showcase-slot" data-slot="3" onclick="selectShowcaseSlot(3)"><span class="slot-plus">+</span></div>
  </div>
</div>

<!-- BADGE SECTIONS -->
<div class="page" id="badgePage">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div>Loading your vault…</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal" onclick="closeModal(event)">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div id="modalInner"></div>
    <img class="modal-watermark" src="/assets/logo/ledgr-icon.png" alt="">
  </div>
</div>

<script>
const API = 'https://ledgr-backend-7hmh.onrender.com';

// Auth
const _raw = localStorage.getItem('ledgr_user') || localStorage.getItem('user');
const _t = localStorage.getItem('ledgr_token') || localStorage.getItem('token');
if (!_raw || !_t) { window.location.replace('/login/'); throw 0; }
let _me;
try { _me = JSON.parse(_raw); } catch(e) { window.location.replace('/login/'); throw 0; }
const ME_ID = _me.userId || _me.id || '';
const ME_USERNAME = _me.username || _me.name || '';

function authHdr() { return { 'Authorization': 'Bearer ' + _t }; }
function logout() { ['ledgr_token','ledgr_user','token','user','username'].forEach(k=>localStorage.removeItem(k)); window.location.href='/'; }

// ── BADGE DEFINITIONS ─────────────────────────────────────────────────────────
const BADGES = [
  // CAREER
  { id:'first-blood',    cat:'career',    icon:'🩸', name:'First Blood',    rarity:'common',    desc:'Your first verified win pick.',              req:'1 win',          reward:'Profile badge',         check: d => d.wins>=1,                          progress: d => ({cur:d.wins,max:1}) },
  { id:'apprentice',     cat:'career',    icon:'📋', name:'Apprentice',     rarity:'common',    desc:'10 picks posted.',                           req:'10 picks',       reward:'Starter tag',           check: d => d.picks>=10,                        progress: d => ({cur:d.picks,max:10}) },
  { id:'veteran',        cat:'career',    icon:'🎖️', name:'Veteran',        rarity:'rare',      desc:'100 picks posted.',                          req:'100 picks',      reward:'Veteran border',        check: d => d.picks>=100,                       progress: d => ({cur:d.picks,max:100}) },
  { id:'grinder',        cat:'career',    icon:'⚙️', name:'Grinder',        rarity:'rare',      desc:'500 picks posted.',                          req:'500 picks',      reward:'Grinder aura',          check: d => d.picks>=500,                       progress: d => ({cur:d.picks,max:500}) },
  { id:'machine',        cat:'career',    icon:'🤖', name:'Machine',        rarity:'epic',      desc:'1000 picks posted.',                         req:'1000 picks',     reward:'Machine name effect',   check: d => d.picks>=1000,                      progress: d => ({cur:d.picks,max:1000}) },
  { id:'immortal',       cat:'career',    icon:'♾️', name:'Immortal',       rarity:'legendary', desc:'5000 picks posted.',                         req:'5000 picks',     reward:'Immortal ring + aura',  check: d => d.picks>=5000,                      progress: d => ({cur:d.picks,max:5000}) },
  // STREAKS
  { id:'heat-check',     cat:'streak',    icon:'🌡️', name:'Heat Check',     rarity:'common',    desc:'3 consecutive wins.',                        req:'3 win streak',   reward:'Streak tag',            check: d => d.bestStreak>=3,                    progress: d => ({cur:Math.min(d.bestStreak,3),max:3}) },
  { id:'on-fire',        cat:'streak',    icon:'🔥', name:'On Fire',        rarity:'common',    desc:'5 consecutive wins.',                        req:'5 win streak',   reward:'Fire emoji border',     check: d => d.bestStreak>=5,                    progress: d => ({cur:Math.min(d.bestStreak,5),max:5}) },
  { id:'demon-mode',     cat:'streak',    icon:'😈', name:'Demon Mode',     rarity:'rare',      desc:'10 consecutive wins.',                       req:'10 win streak',  reward:'Demon aura',            check: d => d.bestStreak>=10,                   progress: d => ({cur:Math.min(d.bestStreak,10),max:10}) },
  { id:'unstoppable',    cat:'streak',    icon:'🌪️', name:'Unstoppable',    rarity:'epic',      desc:'15 consecutive wins.',                       req:'15 win streak',  reward:'Unstoppable ring',      check: d => d.bestStreak>=15,                   progress: d => ({cur:Math.min(d.bestStreak,15),max:15}) },
  { id:'mythic-run',     cat:'streak',    icon:'⚡', name:'Mythic Run',     rarity:'epic',      desc:'20 consecutive wins.',                       req:'20 win streak',  reward:'Mythic streak effect',  check: d => d.bestStreak>=20,                   progress: d => ({cur:Math.min(d.bestStreak,20),max:20}) },
  { id:'god-mode',       cat:'streak',    icon:'👁️', name:'God Mode',       rarity:'legendary', desc:'30 consecutive wins.',                       req:'30 win streak',  reward:'God Mode title + aura', check: d => d.bestStreak>=30,                   progress: d => ({cur:Math.min(d.bestStreak,30),max:30}) },
  // PROFIT

// Showcase
let showcaseIds = JSON.parse(localStorage.getItem('ledgr_badge_showcase') || '["","","",""]');
while (showcaseIds.length < 4) showcaseIds.push('');

function saveShowcase() { localStorage.setItem('ledgr_badge_showcase', JSON.stringify(showcaseIds)); }

function selectShowcaseSlot(i) {
  selectingSlot = i;
  document.querySelectorAll('.showcase-slot').forEach((el,j) => el.classList.toggle('selecting', j===i));
  document.querySelectorAll('.badge-card').forEach(el => el.style.outline = allUnlocked.has(el.dataset.id) ? '2px solid rgba(123,44,255,0.5)' : '');
  // scroll to badges
  document.getElementById('badgePage').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderShowcase() {
  document.querySelectorAll('.showcase-slot').forEach((slot, i) => {
    const id = showcaseIds[i];
    const b = id ? BADGES.find(x=>x.id===id) : null;
    if (b) {
      slot.classList.add('has-badge');
      slot.style.borderColor = rarityColor(b.rarity);
      slot.innerHTML = `<span class="slot-icon">${b.icon}</span><span class="slot-name">${b.name}</span>`;
    } else {
      slot.classList.remove('has-badge');
      slot.style.borderColor = '';
      slot.innerHTML = '<span class="slot-plus">+</span>';
    }
  });
}

function rarityColor(r) {
  return { common:'var(--rarity-common)', rare:'var(--rarity-rare)', epic:'var(--rarity-epic)', legendary:'var(--rarity-legendary)', mythic:'#ff6ac1' }[r] || 'var(--mu)';
}

// Particles
function buildParticles(color) {
  const wrap = document.getElementById('particlesWrap');
  wrap.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `left:${Math.random()*100}%;bottom:${Math.random()*20-10}%;--dur:${10+Math.random()*10}s;--delay:${-Math.random()*12}s;--drift:${(Math.random()-0.5)*60}px;background:${color}`;
    wrap.appendChild(p);
  }
}

// Main load
async function loadBadges() {
  const _bCtrl=new AbortController();const _bXt=setTimeout(()=>{_bCtrl.abort();document.getElementById('badgePage').innerHTML='<div class="loading-wrap">Request timed out. <a href="" style="color:var(--ac)">Retry</a></div>';},25000);
  try {
    const [picksRes, rankingRes, seasonsRes] = await Promise.all([
      fetch(API + '/picks?username=' + encodeURIComponent(ME_USERNAME), { headers: authHdr(), signal: _bCtrl.signal }),
      fetch(API + '/rankings/' + encodeURIComponent(ME_USERNAME), { headers: authHdr(), signal: _bCtrl.signal }),
      fetch(API + '/seasons', { signal: _bCtrl.signal }).catch(() => null),
    ]);
    clearTimeout(_bXt);

    let picks = [];
    let rm = null;
    let seasons = [];

    if (picksRes.ok) { try { picks = await picksRes.json(); } catch(e){} }
    if (Array.isArray(picks) && picks.data) picks = picks.data;
    if (!Array.isArray(picks)) picks = [];

    if (rankingRes.ok) { try { rm = await rankingRes.json(); } catch(e){} }
    if (seasonsRes && seasonsRes.ok) { try { seasons = await seasonsRes.json(); } catch(e){} }
    if (!Array.isArray(seasons)) seasons = [];

    // Compute data
    const d = computeBadgeData(picks, rm, seasons);
    computedData = d;

    // Division theme
    const div = d.division || 'bronze';
    const divColor = DIV_COLORS[div] || '#7B2CFF';
    document.documentElement.style.setProperty('--div-color', divColor);

    // Hero
    document.getElementById('heroSubtitle').textContent = (div.toUpperCase()) + ' · BUILD YOUR LEGEND';
    buildParticles(divColor);
    document.getElementById('heroBgGlow').style.background = `radial-gradient(ellipse 60% 55% at 50% 40%,${divColor},transparent 70%)`;

    // Compute unlocked
    BADGES.forEach(b => { if (b.check(d)) allUnlocked.add(b.id); });

    // Stats
    const total = BADGES.length;
    const unlocked = allUnlocked.size;
    const legendaryCount = BADGES.filter(b=>b.rarity==='legendary'&&allUnlocked.has(b.id)).length;
    const epicCount = BADGES.filter(b=>b.rarity==='epic'&&allUnlocked.has(b.id)).length;
    document.getElementById('hUnlocked').textContent = unlocked + ' / ' + total;
    document.getElementById('hLegendary').textContent = legendaryCount;
    document.getElementById('hEpic').textContent = epicCount;
    document.getElementById('hCompletion').textContent = Math.round(unlocked/total*100) + '%';

    // Bg badge: rarest unlocked
    const rarestUnlocked = BADGES.filter(b=>allUnlocked.has(b.id)).sort((a,b)=>RARITY_ORDER.indexOf(b.rarity)-RARITY_ORDER.indexOf(a.rarity))[0];
    if (rarestUnlocked) document.getElementById('heroBgBadge').textContent = rarestUnlocked.icon;

    // Next unlock
    const locked = BADGES.filter(b=>!allUnlocked.has(b.id)&&!b.secret);
    const closest = locked.map(b => {
      const p = b.progress(d);
      const pct = p.max > 0 ? Math.min(100, Math.round(p.cur/p.max*100)) : 0;
      return { b, pct, p };
    }).sort((a,bb)=>bb.pct-a.pct)[0];
    if (closest && closest.pct > 0) {
      document.getElementById('heroNext').style.display = '';
      document.getElementById('heroNextName').textContent = closest.b.name.toUpperCase();
      const rem = closest.p.max - Math.min(closest.p.cur, closest.p.max);
      document.getElementById('heroNextSub').textContent = closest.p.secondary || (rem + ' remaining');
      setTimeout(() => { document.getElementById('heroNextFill').style.width = closest.pct + '%'; }, 300);
    }

    // Render sections
    renderAllSections(d);
    renderShowcase();

  } catch(err) {
    clearTimeout(_bXt);
    document.getElementById('badgePage').innerHTML = `<div class="loading-wrap">Failed to load badges. <a href="" style="color:var(--ac)">Retry</a></div>`;
    console.error(err);
  }
}

function computeBadgeData(picks, rm, seasons) {
  const settled = picks.filter(p=>p.result&&p.result!=='pending'&&p.result!=='void');
  const wins = settled.filter(p=>p.result==='win');
  const losses = settled.filter(p=>p.result==='loss');
  const pnl = (rm&&rm.totalPnl!=null)?rm.totalPnl:settled.reduce((s,p)=>{
    const v=p.pnl!=null?parseFloat(p.pnl):(p.result==='win'?(parseFloat(p.odds-1)*parseFloat(p.stake||1)):-parseFloat(p.stake||1));
    return s+v;
  },0);
  const roi = (rm&&rm.roi!=null)?rm.roi:0;
  const clvAvg = (rm&&rm.clvAvg!=null)?rm.clvAvg:0;
  const division = (rm&&rm.division)?rm.division.toLowerCase():'bronze';
  const divIndex = DIV_MAP[division]||0;

  // Best streak
  let bestStreak=0, cur=0;
  [...settled].sort((a,b)=>new Date(a.createdAt||a.date)-new Date(b.createdAt||b.date)).forEach(p=>{
    if(p.result==='win'){cur++;bestStreak=Math.max(bestStreak,cur);}
    else if(p.result==='loss')cur=0;
  });

  // Underdog wins
  const underdogWins = wins.filter(p=>parseFloat(p.odds||0)>=2.5).length;

  // Consecutive loss streak (for ice-cold: recover after 8 losses)
  let maxLoss=0, curL=0;
  settled.forEach(p=>{ if(p.result==='loss'){curL++;maxLoss=Math.max(maxLoss,curL);}else curL=0; });

  // Profitable days streak (approximate)
  const byDay={};
  settled.forEach(p=>{
    const d=(p.createdAt||p.date||'').slice(0,10);
    if(!d)return;
    const v=p.pnl!=null?parseFloat(p.pnl):(p.result==='win'?(parseFloat(p.odds-1)*parseFloat(p.stake||1)):-parseFloat(p.stake||1));
    byDay[d]=(byDay[d]||0)+v;
  });
  const days=Object.entries(byDay).sort((a,b)=>a[0].localeCompare(b[0]));
  let profDays=0,curPD=0;
  days.forEach(([,v])=>{ if(v>0){curPD++;profDays=Math.max(profDays,curPD);}else curPD=0; });

  // Night owl: picks between 00-04 local time
  const nightPicks = wins.filter(p=>{
    try{const h=new Date(p.createdAt||p.date).getHours();return h>=0&&h<4;}catch(e){return false;}
  });

  // 10 consecutive underdog wins
  let consecUnder=0, maxConsecUnder=0;
  wins.sort((a,b)=>new Date(a.createdAt||a.date)-new Date(b.createdAt||b.date));
  // simplified: count underdog wins in sequence
  settled.sort((a,b)=>new Date(a.createdAt||a.date)-new Date(b.createdAt||b.date)).forEach(p=>{
    if(p.result==='win'&&parseFloat(p.odds||0)>=2.5){consecUnder++;}else{consecUnder=0;}
    maxConsecUnder=Math.max(maxConsecUnder,consecUnder);
  });

  const rank = rm&&rm.rank?rm.rank:999999;
  const totalTipsters = 1000; // estimate; would come from /rankings list

  return {
    picks: picks.length,
    wins: wins.length,
    losses: losses.length,
    pnl,
    roi,
    clvAvg,
    division,
    divIndex,
    bestStreak,
    underdogWins,
    profDays,
    clvTop5: clvAvg>0&&picks.length>=10, // simplified
    clvTop1: clvAvg>2&&picks.length>=50,
    isTop1: rank<=Math.max(1,Math.round(totalTipsters*0.01)),
    isSeasonChamp: Array.isArray(seasons) && seasons.some(s => !s.isActive && s.champion === ME_USERNAME),
    seasonTop10: false,
    foundingSeason: false,
    lossStreak8: maxLoss>=8,
    comebackKing: false,
    nightOwl: nightPicks.length>=5,
    tenConsecUnderdog: maxConsecUnder>=10,
    ghostMode: false,
    isOrigin: false,
    earlySharp: false,
    seasonZero: false,
    foundingMember: false,
  };
}

function renderAllSections(d) {
  let html = '';
  SECTIONS.forEach((sec, si) => {
    let badges;
    if (sec.featured) {
      // top 3 rarest unlocked
      badges = BADGES.filter(b=>allUnlocked.has(b.id)).sort((a,b)=>RARITY_ORDER.indexOf(b.rarity)-RARITY_ORDER.indexOf(a.rarity)).slice(0,3);
      if (!badges.length) return;
    } else {
      badges = BADGES.filter(b=>b.cat===sec.key);
    }
    if (!badges.length) return;

    const unlockedInSec = badges.filter(b=>allUnlocked.has(b.id)).length;
    const allComplete = unlockedInSec===badges.length;
    const noneUnlocked = unlockedInSec===0&&!sec.featured;

    if (si > 0) {
      html += `<div class="section-divider"></div>`;
    }

    const collapseId = 'sec-' + sec.key;
    html += `<div class="badge-section" id="${collapseId}${noneUnlocked?' collapsed':''}">`;
    html += `<div class="badge-section-header" onclick="toggleSection('${collapseId}')">
      <span class="badge-section-title">${sec.label}</span>
      <span class="badge-section-count${allComplete?' complete':''}">
        ${sec.featured?unlockedInSec+' shown':(allComplete?unlockedInSec+'/'+badges.length+' ✓':unlockedInSec+'/'+badges.length)}
      </span>
      <span class="badge-section-toggle" style="color:var(--mu)">▾</span>
    </div>`;

    if (sec.featured) {
      html += `<div class="badge-grid-featured">`;
      badges.forEach((b,i) => { html += renderBadgeCard(b, true, i, si); });
      html += `</div>`;
    } else {
      html += `<div class="badge-grid">`;
      badges.forEach((b,i) => { html += renderBadgeCard(b, false, i, si); });
      html += `</div>`;
    }

    if (noneUnlocked) {
      html += `<span class="show-toggle" onclick="toggleSection('${collapseId}')">Show locked (${badges.length})</span>`;
    }

    html += `</div>`;
  });
  document.getElementById('badgePage').innerHTML = html;
}

function renderBadgeCard(b, featured, idx, secIdx) {
  const unlocked = allUnlocked.has(b.id);
  const isSecret = b.secret && !unlocked;
  const rarityClass = 'rarity-' + b.rarity;
  const lockedClass = unlocked ? '' : ' locked';
  const featuredClass = featured ? ' badge-card-featured' : '';
  const delay = Math.min((secIdx * 80 + idx * 25), 600);

  let orbits = '';
  if (b.rarity === 'legendary' || b.rarity === 'mythic') {
    const numOrbs = b.rarity === 'mythic' ? 8 : 6;
    orbits = '<div class="orbit-ring">';
    for (let i=0;i<numOrbs;i++) {
      orbits += `<div class="orbit-dot" style="animation-delay:${(i/numOrbs)*4}s;animation-duration:${b.rarity==='mythic'?3:4}s"></div>`;
    }
    orbits += '</div>';
  }

  return `<div class="badge-card${featuredClass} ${rarityClass}${lockedClass}"
    data-id="${b.id}"
    style="animation-delay:${delay}ms"
    onclick="${selectingSlot>=0&&unlocked?`equipBadge('${b.id}')`:`openModal('${b.id}')`}">
    ${!unlocked?'<span class="badge-lock-overlay">🔒</span>':''}
    ${orbits}
    <span class="badge-icon">${isSecret?'🔍':b.icon}</span>
    <span class="badge-name">${isSecret?'???':b.name}</span>
    <span class="badge-rarity-pill">${b.rarity.toUpperCase()}</span>
  </div>`;
}

function toggleSection(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('collapsed');
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
let currentModalBadge = null;

function openModal(id) {
  const b = BADGES.find(x=>x.id===id);
  if (!b) return;
  currentModalBadge = b;
  const unlocked = allUnlocked.has(b.id);
  const isSecret = b.secret && !unlocked;
  const d = computedData;
  const p = b.progress(d);
  const pct = p.max>0?Math.min(100,Math.round(p.cur/p.max*100)):0;
  const rarityColor = {common:'var(--rarity-common)',rare:'var(--rarity-rare)',epic:'var(--rarity-epic)',legendary:'var(--rarity-legendary)',mythic:'#ff6ac1'}[b.rarity];
  const equipped = showcaseIds.includes(b.id);
  const rarityPct = RARITY_PCT[b.rarity] || 5;

  let inner = `
    <span class="modal-icon" style="${b.rarity==='legendary'||b.rarity==='mythic'?'filter:drop-shadow(0 0 16px '+rarityColor+')':(b.rarity==='epic'?'filter:drop-shadow(0 0 10px '+rarityColor+')':'')}">${isSecret?'🔍':b.icon}</span>
    <div class="modal-rarity" style="color:${rarityColor};border-color:${rarityColor}">${b.rarity.toUpperCase()}</div>
    <div class="modal-name">${isSecret?'???':b.name}</div>
    <div class="modal-desc">${isSecret?'Hidden achievement — the legend knows, the legend doesn\'t tell.':b.desc}</div>
    <div class="modal-divider"></div>
  `;

  if (unlocked) {
    inner += `<div class="modal-meta">
      <div class="modal-meta-row"><span class="modal-meta-lbl">Unlocked</span><span class="modal-unlock-date">✓ Earned</span></div>
      <div class="modal-meta-row"><span class="modal-meta-lbl">Rarity</span><span class="modal-pct">Only ${rarityPct}% of users own this</span></div>
      ${b.reward?`<div class="modal-reward"><div class="modal-reward-lbl">Reward</div><div class="modal-reward-val">${b.reward}</div></div>`:''}
    </div>
    <button class="modal-equip-btn${equipped?' equipped':''}" onclick="toggleEquip('${b.id}')">
      ${equipped ? '✓ Equipped in Showcase' : 'Equip to Showcase'}
    </button>`;
  } else if (isSecret) {
    inner += `<div class="modal-secret">Some legends are discovered, not chased.</div>
    <div class="modal-hint">Complete hidden requirements to unlock this badge.</div>`;
  } else {
    inner += `<div class="modal-meta">
      <div class="modal-meta-row"><span class="modal-meta-lbl">Requirement</span><span class="modal-meta-val">${b.req}</span></div>
      <div class="modal-meta-row"><span class="modal-meta-lbl">Progress</span><span class="modal-meta-val">${pct}%</span></div>
      <div class="modal-progress-track"><div class="modal-progress-fill" id="modalFill" style="width:0%;background:${rarityColor}"></div></div>
      ${p.secondary?`<div class="modal-meta-row" style="margin-top:4px"><span class="modal-meta-lbl">Also need</span><span class="modal-meta-val">${p.secondary}</span></div>`:''}
      ${b.reward?`<div class="modal-reward" style="margin-top:10px"><div class="modal-reward-lbl">Reward (upon unlock)</div><div class="modal-reward-val">${b.reward}</div></div>`:''}
    </div>`;
  }

  document.getElementById('modalInner').innerHTML = inner;
  document.getElementById('modal').classList.add('open');
  if (!unlocked && !isSecret) {
    setTimeout(()=>{ const el=document.getElementById('modalFill'); if(el) el.style.width=pct+'%'; },100);
  }
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modal').classList.remove('open');
  currentModalBadge = null;
}

function toggleEquip(id) {
  if (showcaseIds.includes(id)) {
    const i = showcaseIds.indexOf(id);
    showcaseIds[i] = '';
  } else {
    const emptySlot = showcaseIds.indexOf('');
    if (emptySlot >= 0) {
      showcaseIds[emptySlot] = id;
    } else {
      showcaseIds[3] = id; // replace last
    }
  }
  saveShowcase();
  renderShowcase();
  // re-open to update state
  openModal(id);
}

function equipBadge(id) {
  if (selectingSlot < 0 || !allUnlocked.has(id)) return;
  showcaseIds[selectingSlot] = id;
  saveShowcase();
  renderShowcase();
  // clear selection
  selectingSlot = -1;
  document.querySelectorAll('.showcase-slot').forEach(el => el.classList.remove('selecting'));
  document.querySelectorAll('.badge-card').forEach(el => el.style.outline = '');
}

// Close modal on Escape
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModalDirect(); });

loadBadges();
</script>
<script src="/shared/identity.js"></script>
</body>
</html>
