<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Badges</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07060d;--s1:#0c0a1a;--s2:#15122a;
  --bd:rgba(184,159,255,0.1);--bd2:rgba(184,159,255,0.18);
  --ac:#b89fff;--acg:rgba(184,159,255,0.08);
  --tx:#f0edff;--mu:#6a6690;--mu2:#9590b8;
  --gr:#34d399;--rd:#f87171;--gold:#fbbf24;
  --common:#6b7280;--rare:#3b82f6;--epic:#8b5cf6;--legendary:#f59e0b;--elite:#ec4899;
}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden}
*{cursor:none!important}
.cursor{position:fixed;width:8px;height:8px;background:var(--ac);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
.cursor-ring{position:fixed;width:32px;height:32px;border:1px solid rgba(184,159,255,0.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%)}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:1;opacity:.4}
nav{position:sticky;top:0;z-index:100;background:rgba(7,6,13,0.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);padding:0 48px;height:62px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:6px;color:var(--tx);text-decoration:none}
.logo span{color:var(--ac)}
.nav-links{display:flex;gap:4px;align-items:center}
.nav-link{color:var(--mu2);font-size:12px;font-weight:500;text-decoration:none;padding:8px 14px;border-radius:6px;transition:all .2s}
.nav-link:hover{color:var(--tx);background:rgba(255,255,255,0.04)}
.nav-link.active{color:var(--ac);background:var(--acg)}
.main{max-width:1100px;margin:0 auto;padding:52px 24px;position:relative;z-index:2}
.page-header{margin-bottom:16px}
.sec-tag{font-family:'DM Mono',monospace;font-size:10px;color:var(--ac);letter-spacing:3px;text-transform:uppercase;display:block;margin-bottom:10px;opacity:.8}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6vw,72px);letter-spacing:3px;line-height:1;color:var(--tx)}
.page-title span{color:var(--ac)}
.page-sub{color:var(--mu2);font-size:14px;margin-top:10px;margin-bottom:40px;line-height:1.7}

/* RARITY FILTERS */
.rarity-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:40px}
.rf{padding:8px 20px;border-radius:20px;border:1px solid;font-size:12px;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:1px;cursor:none;transition:all .2s;background:transparent}
.rf.all{border-color:var(--bd2);color:var(--mu2)}.rf.all.active{background:var(--acg);color:var(--ac);border-color:var(--ac)}
.rf.common{border-color:var(--common);color:var(--common)}.rf.common.active{background:rgba(107,114,128,0.15)}
.rf.rare{border-color:var(--rare);color:var(--rare)}.rf.rare.active{background:rgba(59,130,246,0.15)}
.rf.epic{border-color:var(--epic);color:var(--epic)}.rf.epic.active{background:rgba(139,92,246,0.15)}
.rf.legendary{border-color:var(--legendary);color:var(--legendary)}.rf.legendary.active{background:rgba(245,158,11,0.15)}
.rf.elite{border-color:var(--elite);color:var(--elite)}.rf.elite.active{background:rgba(236,72,153,0.15)}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:48px}
.sb{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:20px;text-align:center}
.sb-val{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--ac);line-height:1;letter-spacing:1px}
.sb-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-top:6px}

/* BADGE GRID */
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.badge-card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:24px;transition:all .3s;position:relative;overflow:hidden}
.badge-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;border-radius:16px}
.badge-card:hover{transform:translateY(-4px)}
.badge-card.locked{opacity:.5}
.badge-card.unlocked{border-color:var(--bd2)}

/* rarity glow on hover */
.badge-card.common:hover{border-color:var(--common);box-shadow:0 0 20px rgba(107,114,128,0.15)}
.badge-card.rare:hover{border-color:var(--rare);box-shadow:0 0 20px rgba(59,130,246,0.15)}
.badge-card.epic:hover{border-color:var(--epic);box-shadow:0 0 20px rgba(139,92,246,0.2)}
.badge-card.legendary:hover{border-color:var(--legendary);box-shadow:0 0 20px rgba(245,158,11,0.2)}
.badge-card.elite:hover{border-color:var(--elite);box-shadow:0 0 20px rgba(236,72,153,0.25)}

.badge-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.badge-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;position:relative}
.badge-icon.locked-icon{filter:grayscale(1);opacity:.4}
.badge-icon.common-bg{background:rgba(107,114,128,0.15);border:1px solid rgba(107,114,128,0.3)}
.badge-icon.rare-bg{background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.3)}
.badge-icon.epic-bg{background:rgba(139,92,246,0.12);border:1px solid rgba(139,92,246,0.3)}
.badge-icon.legendary-bg{background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.3)}
.badge-icon.elite-bg{background:rgba(236,72,153,0.12);border:1px solid rgba(236,72,153,0.3)}

.badge-info{flex:1}
.badge-name{font-weight:700;font-size:15px;margin-bottom:4px;letter-spacing:.2px}
.badge-rarity{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.badge-rarity.common{color:var(--common)}.badge-rarity.rare{color:var(--rare)}.badge-rarity.epic{color:var(--epic)}.badge-rarity.legendary{color:var(--legendary)}.badge-rarity.elite{color:var(--elite)}
.badge-desc{font-size:12px;color:var(--mu2);line-height:1.6}

/* PROGRESS */
.progress-section{margin-top:14px}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-req{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace}
.progress-val{font-size:11px;font-weight:600;font-family:'DM Mono',monospace}
.progress-val.common{color:var(--common)}.progress-val.rare{color:var(--rare)}.progress-val.epic{color:var(--epic)}.progress-val.legendary{color:var(--legendary)}.progress-val.elite{color:var(--elite)}
.progress-bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.progress-fill.common{background:var(--common)}.progress-fill.rare{background:var(--rare)}.progress-fill.epic{background:linear-gradient(90deg,var(--epic),#a78bfa)}.progress-fill.legendary{background:linear-gradient(90deg,var(--legendary),#fcd34d)}.progress-fill.elite{background:linear-gradient(90deg,var(--elite),#f9a8d4)}

.unlocked-stamp{position:absolute;top:16px;right:16px;background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.25);color:var(--gr);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;padding:4px 10px;border-radius:4px}
.locked-text{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:1px;margin-top:12px;text-align:center;padding:8px;background:rgba(255,255,255,0.03);border-radius:6px}

/* SECTION HEADERS */
.section-header{margin:48px 0 20px;display:flex;align-items:center;gap:14px}
.section-line{flex:1;height:1px;background:var(--bd)}
.section-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;padding:0 4px}
.section-label.common{color:var(--common)}.section-label.rare{color:var(--rare)}.section-label.epic{color:var(--epic)}.section-label.legendary{color:var(--legendary)}.section-label.elite{color:var(--elite)}

@media(max-width:768px){nav{padding:0 20px}.stats-bar{grid-template-columns:repeat(2,1fr)}.badges-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="ring"></div>

<nav>
  <a href="/" class="logo">LEDG<span>R</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/leaderboard" class="nav-link">Leaderboard</a>
    <a href="/dashboard" class="nav-link">Dashboard</a>
    <a href="/badges" class="nav-link active">Badges</a>
  </div>
</nav>

<div class="main">
  <div class="page-header">
    <span class="sec-tag">Achievements</span>
    <div class="page-title">YOUR <span>BADGES</span></div>
    <p class="page-sub">Earn badges by hitting milestones. Show them off on your public profile.</p>
  </div>

  <div class="stats-bar">
    <div class="sb"><div class="sb-val" id="statUnlocked">0</div><div class="sb-lbl">Unlocked</div></div>
    <div class="sb"><div class="sb-val" id="statTotal">0</div><div class="sb-lbl">Total Badges</div></div>
    <div class="sb"><div class="sb-val" id="statRarest">—</div><div class="sb-lbl">Rarest Earned</div></div>
    <div class="sb"><div class="sb-val" id="statPct">0%</div><div class="sb-lbl">Completion</div></div>
  </div>

  <div class="rarity-filters">
    <button class="rf all active" onclick="filterRarity('all',this)">All</button>
    <button class="rf common" onclick="filterRarity('common',this)">⬜ Common</button>
    <button class="rf rare" onclick="filterRarity('rare',this)">🔷 Rare</button>
    <button class="rf epic" onclick="filterRarity('epic',this)">🟣 Epic</button>
    <button class="rf legendary" onclick="filterRarity('legendary',this)">🟡 Legendary</button>
    <button class="rf elite" onclick="filterRarity('elite',this)">💗 Elite</button>
  </div>

  <div id="badgesContainer"></div>
</div>

<script>
const cur=document.getElementById('cur'),ring=document.getElementById('ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px'});
(function lerp(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(lerp)})();

const API='https://ledgr-backend-production-c132.up.railway.app';

const BADGES=[
  // COMMON
  {id:'first_pick',rarity:'common',icon:'🎯',name:'First Pick',desc:'Post your very first verified pick on LEDGR.',req:'Post 1 pick',target:1,stat:'picks'},
  {id:'getting_started',rarity:'common',icon:'🚀',name:'Getting Started',desc:'Post 10 verified picks.',req:'10 picks',target:10,stat:'picks'},
  {id:'on_the_board',rarity:'common',icon:'📋',name:'On The Board',desc:'Appear on the leaderboard for the first time.',req:'Post 5+ picks',target:5,stat:'picks'},
  {id:'first_win',rarity:'common',icon:'✅',name:'First Win',desc:'Record your first winning pick.',req:'Win 1 pick',target:1,stat:'wins'},
  {id:'first_follower',rarity:'common',icon:'👥',name:'First Follower',desc:'Get your first follower on LEDGR.',req:'1 follower',target:1,stat:'followers'},

  // RARE
  {id:'hot_streak',rarity:'rare',icon:'🔥',name:'Hot Streak',desc:'Win 5 picks in a row without a single loss.',req:'5 win streak',target:5,stat:'streak'},
  {id:'sharp',rarity:'rare',icon:'🎯',name:'Sharp',desc:'Maintain 60%+ win rate across 30+ picks.',req:'60% WR / 30 picks',target:30,stat:'picks'},
  {id:'consistent',rarity:'rare',icon:'📈',name:'Consistent',desc:'Post picks for 4 consecutive weeks.',req:'4 weeks active',target:4,stat:'weeks'},
  {id:'crowd_pleaser',rarity:'rare',icon:'💬',name:'Crowd Pleaser',desc:'Get 25 followers.',req:'25 followers',target:25,stat:'followers'},
  {id:'half_century',rarity:'rare',icon:'5️⃣',name:'Half Century',desc:'Post 50 verified picks.',req:'50 picks',target:50,stat:'picks'},

  // EPIC
  {id:'rising_star',rarity:'epic',icon:'⭐',name:'Rising Star',desc:'Achieve +15% ROI in your first 20 picks.',req:'+15% ROI / 20 picks',target:20,stat:'picks'},
  {id:'value_hunter',rarity:'epic',icon:'💡',name:'Value Hunter',desc:'Maintain positive ROI on odds above 2.5 across 20+ picks.',req:'Positive ROI high odds',target:20,stat:'picks'},
  {id:'inferno',rarity:'epic',icon:'🌋',name:'Inferno',desc:'Win 10 picks in a row.',req:'10 win streak',target:10,stat:'streak'},
  {id:'century',rarity:'epic',icon:'💯',name:'Century',desc:'Post 100 verified picks.',req:'100 picks',target:100,stat:'picks'},
  {id:'big_following',rarity:'epic',icon:'🏟️',name:'Big Following',desc:'Reach 100 followers.',req:'100 followers',target:100,stat:'followers'},

  // LEGENDARY
  {id:'diamond',rarity:'legendary',icon:'💎',name:'Diamond',desc:'Achieve +20% ROI across 50+ picks. The mark of a true professional.',req:'+20% ROI / 50 picks',target:50,stat:'picks'},
  {id:'unstoppable',rarity:'legendary',icon:'⚡',name:'Unstoppable',desc:'Win 15 picks in a row.',req:'15 win streak',target:15,stat:'streak'},
  {id:'veteran',rarity:'legendary',icon:'👑',name:'Veteran',desc:'Post 200+ verified picks.',req:'200 picks',target:200,stat:'picks'},
  {id:'top10',rarity:'legendary',icon:'🏆',name:'Top 10',desc:'Reach the top 10 on the global leaderboard.',req:'Top 10 leaderboard',target:10,stat:'rank'},
  {id:'fan_favourite',rarity:'legendary',icon:'❤️',name:'Fan Favourite',desc:'Reach 500 followers.',req:'500 followers',target:500,stat:'followers'},

  // ELITE
  {id:'goat',rarity:'elite',icon:'🐐',name:'The GOAT',desc:'Maintain +25% ROI across 100+ picks for a full month. Untouchable.',req:'+25% ROI / 100 picks',target:100,stat:'picks'},
  {id:'god_streak',rarity:'elite',icon:'🌠',name:'God Streak',desc:'Win 20 picks in a row. Almost impossible.',req:'20 win streak',target:20,stat:'streak'},
  {id:'number_one',rarity:'elite',icon:'🥇',name:'Number One',desc:'Reach #1 on the global leaderboard.',req:'#1 leaderboard',target:1,stat:'rank'},
  {id:'legend',rarity:'elite',icon:'🔮',name:'Legend',desc:'Post 500+ verified picks and maintain positive ROI.',req:'500 picks + positive ROI',target:500,stat:'picks'},
  {id:'massive',rarity:'elite',icon:'🌍',name:'Massive',desc:'Reach 1,000 followers on LEDGR.',req:'1000 followers',target:1000,stat:'followers'},
];

const RARITY_ORDER=['common','rare','epic','legendary','elite'];
let userStats={picks:0,wins:0,losses:0,streak:0,followers:0,weeks:1,rank:999,roi:0};
let currentFilter='all';

async function loadUserStats(){
  const token=localStorage.getItem('token');
  if(!token){renderBadges();return;}
  try{
    const headers={'Authorization':'Bearer '+token};
    const [picksRes,profileRes]=await Promise.all([
      fetch(API+'/picks',{headers}),
      fetch(API+'/profile',{headers})
    ]);
    if(picksRes.ok){
      const picks=await picksRes.json();
      const mine=picks.filter(p=>p.user?.username===localStorage.getItem('username'));
      userStats.picks=mine.length;
      userStats.wins=mine.filter(p=>p.result==='win').length;
      userStats.losses=mine.filter(p=>p.result==='loss').length;
      const stake=mine.reduce((s,p)=>s+p.stake,0);
      const pnl=mine.reduce((s,p)=>s+p.pnl,0);
      userStats.roi=stake>0?(pnl/stake)*100:0;
      // calc current streak
      let streak=0;
      const settled=[...mine].filter(p=>p.result!=='pending').reverse();
      for(const p of settled){if(p.result==='win')streak++;else break;}
      userStats.streak=streak;
    }
    if(profileRes.ok){
      const profile=await profileRes.json();
      userStats.followers=profile.followers||0;
    }
  }catch(e){console.log('Stats load error',e);}
  renderBadges();
}

function getProgress(badge){
  const v=userStats[badge.stat]||0;
  if(badge.stat==='rank') return badge.target===1?Math.min(100,Math.max(0,100-(userStats.rank-1))):Math.min(100,Math.max(0,(11-userStats.rank)));
  return Math.min(100,(v/badge.target)*100);
}

function isUnlocked(badge){
  const pct=getProgress(badge);
  if(badge.stat==='rank') return userStats.rank<=badge.target;
  return pct>=100;
}

function filterRarity(rarity,btn){
  currentFilter=rarity;
  document.querySelectorAll('.rf').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderBadges();
}

function renderBadges(){
  const container=document.getElementById('badgesContainer');
  const filtered=currentFilter==='all'?BADGES:BADGES.filter(b=>b.rarity===currentFilter);
  const byRarity={};
  RARITY_ORDER.forEach(r=>{byRarity[r]=filtered.filter(b=>b.rarity===r)});

  let html='';
  for(const rarity of RARITY_ORDER){
    const group=byRarity[rarity];
    if(!group.length)continue;
    const label={common:'⬜ Common',rare:'🔷 Rare',epic:'🟣 Epic',legendary:'🟡 Legendary',elite:'💗 Elite'}[rarity];
    html+=`<div class="section-header"><div class="section-line"></div><span class="section-label ${rarity}">${label}</span><div class="section-line"></div></div>`;
    html+=`<div class="badges-grid">`;
    for(const badge of group){
      const unlocked=isUnlocked(badge);
      const pct=getProgress(badge);
      const cur=Math.min(userStats[badge.stat]||0,badge.target);
      html+=`
        <div class="badge-card ${badge.rarity} ${unlocked?'unlocked':'locked'}">
          ${unlocked?'<div class="unlocked-stamp">✓ UNLOCKED</div>':''}
          <div class="badge-top">
            <div class="badge-icon ${badge.rarity}-bg ${unlocked?'':'locked-icon'}">${badge.icon}</div>
            <div class="badge-info">
              <div class="badge-name">${badge.name}</div>
              <div class="badge-rarity ${badge.rarity}">${badge.rarity.toUpperCase()}</div>
              <div class="badge-desc">${badge.desc}</div>
            </div>
          </div>
          <div class="progress-section">
            <div class="progress-header">
              <span class="progress-req">${badge.req}</span>
              <span class="progress-val ${badge.rarity}">${badge.stat==='rank'?'Rank #'+userStats.rank:cur+' / '+badge.target}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill ${badge.rarity}" style="width:${pct}%" data-pct="${pct}"></div>
            </div>
          </div>
          ${!unlocked?`<div class="locked-text">🔒 Keep going — ${badge.req}</div>`:''}
        </div>`;
    }
    html+=`</div>`;
  }
  container.innerHTML=html;

  // animate progress bars
  setTimeout(()=>{
    document.querySelectorAll('.progress-fill').forEach(el=>{
      const w=el.getAttribute('data-pct');
      el.style.width='0%';
      requestAnimationFrame(()=>{el.style.width=w+'%'});
    });
  },50);

  // update stats
  const unlocked=BADGES.filter(b=>isUnlocked(b));
  document.getElementById('statUnlocked').textContent=unlocked.length;
  document.getElementById('statTotal').textContent=BADGES.length;
  document.getElementById('statPct').textContent=Math.round((unlocked.length/BADGES.length)*100)+'%';
  const rarityRank={elite:4,legendary:3,epic:2,rare:1,common:0};
  const rarest=unlocked.sort((a,b)=>rarityRank[b.rarity]-rarityRank[a.rarity])[0];
  document.getElementById('statRarest').textContent=rarest?rarest.icon+''+rarest.rarity.charAt(0).toUpperCase()+rarest.rarity.slice(1):'—';
}

loadUserStats();
</script>
</body>
</html>
