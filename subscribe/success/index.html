<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Subscribed! 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07060d;--s1:#0c0a1a;--ac:#b89fff;--tx:#f0edff;--mu:#6a6690;--gr:#34d399;--gold:#fbbf24}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.4}

.card{background:var(--s1);border:1px solid rgba(52,211,153,0.25);border-radius:24px;padding:52px 48px;text-align:center;max-width:440px;width:90%;position:relative;z-index:2;box-shadow:0 0 80px rgba(52,211,153,0.08)}
.icon{font-size:72px;line-height:1;margin-bottom:20px;animation:pop .5s .1s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.title{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;color:var(--gr);margin-bottom:10px}
.sub{font-family:'DM Mono',monospace;font-size:12px;color:#9590b8;line-height:1.7;margin-bottom:32px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-p{background:var(--gr);color:#07060d;border:none;border-radius:8px;padding:12px 28px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;cursor:pointer;transition:all .2s}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(52,211,153,.25)}
.btn-s{background:transparent;border:1px solid rgba(184,159,255,0.25);color:var(--ac);border-radius:8px;padding:12px 28px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;cursor:pointer;transition:all .2s}
.btn-s:hover{border-color:rgba(184,159,255,.5)}

/* Confetti */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.cf{position:absolute;width:8px;height:8px;border-radius:2px;animation:cf-fall linear forwards}
@keyframes cf-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="confetti-wrap" id="confettiWrap"></div>
<div class="card">
  <div class="icon">🎉</div>
  <div class="title">YOU'RE IN!</div>
  <div class="sub">Your subscription is now active.<br>You'll receive real-time picks from this tipster.<br>Manage it anytime in your settings.</div>
  <div class="btns">
    <button class="btn-p" onclick="window.location.href='/home'">GO TO DASHBOARD</button>
    <button class="btn-s" onclick="window.location.href='/settings'">My Subscriptions</button>
  </div>
</div>
<script>
// Confetti
const COLORS=['#b89fff','#34d399','#fbbf24','#38bdf8','#fb923c','#f87171','#f0edff'];
const wrap=document.getElementById('confettiWrap');
for(let i=0;i<80;i++){
  const el=document.createElement('div');
  el.className='cf';
  const x=Math.random()*100;
  const dur=1.8+Math.random()*2;
  const delay=Math.random()*1.5;
  const size=4+Math.random()*8;
  el.style.cssText=`left:${x}%;width:${size}px;height:${size}px;background:${COLORS[i%COLORS.length]};animation-duration:${dur}s;animation-delay:${delay}s;border-radius:${Math.random()>.5?'50%':'2px'}`;
  wrap.appendChild(el);
}
// Read tipster from URL
const u=new URLSearchParams(window.location.search).get('u');
if(u){
  document.querySelector('.sub').innerHTML=
    `You're now subscribed to <strong style="color:var(--ac)">@${u}</strong>.<br>Real-time picks will appear in your dashboard.<br>Manage it anytime in your settings.`;
}
</script>
</body>
</html>
