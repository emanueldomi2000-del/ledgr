<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Checkout Cancelled</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07060d;--s1:#0c0a1a;--ac:#b89fff;--tx:#f0edff;--mu:#6a6690;--mu2:#9590b8}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;opacity:.4}
.card{background:var(--s1);border:1px solid rgba(184,159,255,0.12);border-radius:24px;padding:52px 48px;text-align:center;max-width:420px;width:90%;position:relative;z-index:2}
.icon{font-size:56px;line-height:1;margin-bottom:20px;opacity:.7}
.title{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:4px;color:var(--mu2);margin-bottom:10px}
.sub{font-family:'DM Mono',monospace;font-size:12px;color:var(--mu);line-height:1.8;margin-bottom:32px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-p{background:var(--ac);color:#07060d;border:none;border-radius:8px;padding:12px 28px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;cursor:pointer;transition:all .2s}
.btn-p:hover{background:#cdb8ff;transform:translateY(-2px)}
.btn-s{background:transparent;border:1px solid rgba(184,159,255,0.2);color:var(--mu2);border-radius:8px;padding:12px 28px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;cursor:pointer;transition:all .2s}
.btn-s:hover{color:var(--tx)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">↩️</div>
  <div class="title">CHECKOUT CANCELLED</div>
  <div class="sub">No payment was taken.<br>You can subscribe any time by visiting the tipster's profile.</div>
  <div class="btns">
    <button class="btn-p" id="backBtn" onclick="window.history.back()">← Go Back</button>
    <button class="btn-s" onclick="window.location.href='/leaderboard'">Browse Tipsters</button>
  </div>
</div>
<script>
const u=new URLSearchParams(window.location.search).get('u');
if(u){
  document.getElementById('backBtn').onclick=()=>window.location.href='/tipster?u='+u;
}
</script>
</body>
</html>
