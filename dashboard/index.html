<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05050a;--s1:#0b0b14;--s2:#111120;--bd:#18182e;--ac:#e8ff00;--tx:#f2f2fa;--mu:#5a5a7a;--mu2:#8888aa;--gr:#00e5a0;--rd:#ff3355}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(232,255,0,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,255,0,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
nav{position:sticky;top:0;z-index:50;background:rgba(5,5,10,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:5px;color:var(--ac);text-decoration:none}
.nav-r{display:flex;align-items:center;gap:12px}
.user-badge{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 16px;font-size:13px;font-family:'DM Mono',monospace;color:var(--mu2)}
.logout-btn{background:transparent;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif}
.logout-btn:hover{border-color:var(--rd);color:var(--rd)}
.main{max-width:1100px;margin:0 auto;padding:40px 24px;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:20px}
.stat-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1px;color:var(--tx)}
.stat-val.pos{color:var(--gr)}.stat-val.neg{color:var(--rd)}
.grid{display:grid;grid-template-columns:1fr 380px;gap:20px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:24px}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--ac);margin-bottom:20px;display:flex;align-items:center;gap:10px}
.panel-title::after{content:'';flex:1;height:1px;background:var(--bd)}
.form-group{margin-bottom:14px}
label{display:block;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:6px}
input,select{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'Syne',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--ac)}
select option{background:#111120}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rbtn{padding:10px;border-radius:8px;border:2px solid var(--bd);background:transparent;color:var(--mu);font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;cursor:pointer;transition:all .2s}
.submit-btn{width:100%;padding:14px;background:var(--ac);color:#05050a;border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;cursor:pointer;margin-top:8px;transition:all .2s}
.submit-btn:hover{background:#f5ff33;transform:translateY(-1px)}
.pick-card{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:10px}
.pick-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.pick-event{font-weight:700;font-size:14px;margin-bottom:2px}
.pick-market{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace}
.pick-odds{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--ac)}
.pick-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:10px;font-family:'DM Mono',monospace}
.badge-win{background:rgba(0,229,160,.12);color:var(--gr)}
.badge-loss{background:rgba(255,51,85,.12);color:var(--rd)}
.badge-pending{background:rgba(245,158,11,.12);color:#f59e0b}
.badge-sport{background:rgba(232,255,0,.1);color:var(--ac)}
.pick-time{font-size:10px;color:var(--mu);font-family:'DM Mono',monospace;margin-left:auto}
.empty{text-align:center;padding:40px;color:var(--mu)}
.empty .icon{font-size:36px;margin-bottom:10px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ac);color:#05050a;padding:12px 24px;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;z-index:1000;transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.toast.show{transform:translateY(0);opacity:1}
.not-logged{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center}
.not-logged h2{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:3px;color:var(--ac);margin-bottom:12px}
.not-logged p{color:var(--mu2);margin-bottom:28px}
.go-home{background:var(--ac);color:#05050a;padding:14px 32px;border-radius:8px;font-size:15px;font-weight:700;text-decoration:none;display:inline-block}
@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="notLogged" class="not-logged" style="display:none">
  <h2>ACCESS DENIED</h2>
  <p>You need to log in to access your dashboard.</p>
  <a href="/" class="go-home">Back to LEDGR</a>
</div>
<div id="app" style="display:none">
  <nav>
    <a href="/" class="logo">LEDGR</a>
    <div class="nav-r">
      <div class="user-badge" id="userBadge">Loading...</div>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
  </nav>
  <div class="main">
    <div class="stats">
      <div class="stat"><div class="stat-label">Total Picks</div><div class="stat-val" id="statTotal">0</div></div>
      <div class="stat"><div class="stat-label">ROI %</div><div class="stat-val pos" id="statROI">0%</div></div>
      <div class="stat"><div class="stat-label">Win Rate</div><div class="stat-val" id="statWR">0%</div></div>
      <div class="stat"><div class="stat-label">Total P&L</div><div class="stat-val" id="statPnL">0</div></div>
    </div>
    <div class="grid">
      <div class="panel">
        <div class="panel-title">POST A PICK</div>
        <div class="form-group"><label>Event</label><input type="text" id="pickEvent" placeholder="e.g. Real Madrid vs Barcelona"></div>
        <div class="form-group"><label>Market / Pick</label><input type="text" id="pickMarket" placeholder="e.g. Real Madrid -0.5 AH"></div>
        <div class="form-row">
          <div class="form-group"><label>Sport</label>
            <select id="pickSport">
              <option value="Soccer">Soccer</option>
              <option value="Basketball">Basketball</option>
              <option value="Tennis">Tennis</option>
              <option value="Football">Football</option>
              <option value="Baseball">Baseball</option>
              <option value="MMA/Boxing">MMA/Boxing</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group"><label>Odds</label><input type="number" id="pickOdds" placeholder="2.10" step="0.01" min="1.01"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Stake (units)</label><input type="number" id="pickStake" placeholder="1" step="0.5" min="0.5"></div>
          <div class="form-group"><label>P&L (euros)</label><input type="number" id="pickPnl" placeholder="0.00" step="0.01"></div>
        </div>
        <div class="form-group">
          <label>Result</label>
          <div class="result-btns">
            <button class="rbtn" id="rbPending" onclick="selectResult('pending')" style="border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,.08)">PENDING</button>
            <button class="rbtn" id="rbWin" onclick="selectResult('win')">WIN</button>
            <button class="rbtn" id="rbLoss" onclick="selectResult('loss')">LOSS</button>
          </div>
        </div>
        <button class="submit-btn" onclick="postPick()">+ POST PICK</button>
      </div>
      <div class="panel">
        <div class="panel-title">MY PICKS</div>
        <div id="myPicks"><div class="empty"><div class="icon">📊</div><p>No picks yet.</p></div></div>
      </div>
    </div>
  </div>
</div>
<script>
const API='https://ledgr-backend-production-c132.up.railway.app';
let currentResult='pending';
let user=null;
let token=null;

window.onload=()=>{
  token=localStorage.getItem('ledgr_token');
  const ud=localStorage.getItem('ledgr_user');
  if(!token||!ud){document.getElementById('notLogged').style.display='flex';return}
  user=JSON.parse(ud);
  document.getElementById('app').style.display='block';
  document.getElementById('userBadge').textContent='@'+user.username;
  loadPicks();
};

function logout(){localStorage.removeItem('ledgr_token');localStorage.removeItem('ledgr_user');window.location.href='/'}

function selectResult(r){
  currentResult=r;
  const styles={pending:'border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,.08)',win:'border-color:var(--gr);color:var(--gr);background:rgba(0,229,160,.08)',loss:'border-color:var(--rd);color:var(--rd);background:rgba(255,51,85,.08)',none:'border-color:var(--bd);color:var(--mu);background:transparent'};
  document.getElementById('rbPending').style.cssText=r==='pending'?styles.pending:styles.none;
  document.getElementById('rbWin').style.cssText=r==='win'?styles.win:styles.none;
  document.getElementById('rbLoss').style.cssText=r==='loss'?styles.loss:styles.none;
}

async function postPick(){
  const event=document.getElementById('pickEvent').value.trim();
  const market=document.getElementById('pickMarket').value.trim();
  const odds=parseFloat(document.getElementById('pickOdds').value);
  const stake=parseFloat(document.getElementById('pickStake').value);
  const pnl=parseFloat(document.getElementById('pickPnl').value)||0;
  const sport=document.getElementById('pickSport').value;
  if(!event||!market||!odds||!stake){showToast('Fill all fields!');return}
  try{
    const r=await fetch(API+'/picks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:user.id,sport,event,market,odds,stake,result:currentResult,pnl})});
    const d=await r.json();
    if(d.id){showToast('PICK POSTED!');document.getElementById('pickEvent').value='';document.getElementById('pickMarket').value='';document.getElementById('pickOdds').value='';document.getElementById('pickStake').value='';document.getElementById('pickPnl').value='';selectResult('pending');loadPicks();}
    else showToast('Error');
  }catch(e){showToast('Connection error');}
}

async function loadPicks(){
  try{
    const r=await fetch(API+'/picks');
    const picks=await r.json();
    const my=picks.filter(p=>p.userId===user.id);
    const wins=my.filter(p=>p.result==='win').length;
    const losses=my.filter(p=>p.result==='loss').length;
    const ts=my.reduce((s,p)=>s+p.stake,0);
    const tp=my.reduce((s,p)=>s+p.pnl,0);
    const roi=ts>0?((tp/ts)*100).toFixed(1):'0';
    const wr=(wins+losses)>0?((wins/(wins+losses))*100).toFixed(0):'0';
    document.getElementById('statTotal').textContent=my.length;
    document.getElementById('statROI').textContent=(tp>=0?'+':'')+roi+'%';
    document.getElementById('statROI').className='stat-val '+(tp>=0?'pos':'neg');
    document.getElementById('statWR').textContent=wr+'%';
    document.getElementById('statPnL').textContent=(tp>=0?'+':'')+'€'+tp.toFixed(2);
    document.getElementById('statPnL').className='stat-val '+(tp>=0?'pos':'neg');
    const c=document.getElementById('myPicks');
    if(!my.length){c.innerHTML='<div class="empty"><div class="icon">📊</div><p>No picks yet.</p></div>';return}
    c.innerHTML=my.slice(0,20).map(p=>{
      const rb=p.result==='win'?'<span class="badge badge-win">WIN</span>':p.result==='loss'?'<span class="badge badge-loss">LOSS</span>':'<span class="badge badge-pending">PENDING</span>';
      return`<div class="pick-card"><div class="pick-top"><div><div class="pick-event">${p.event}</div><div class="pick-market">${p.market}</div></div><div class="pick-odds">${p.odds}</div></div><div class="pick-meta"><span class="badge badge-sport">${p.sport}</span><span style="font-size:11px;color:var(--mu);font-family:'DM Mono',monospace">${p.stake}u</span>${rb}<span class="pick-time">${new Date(p.createdAt).toLocaleDateString()}</span></div></div>`;
    }).join('');
  }catch(e){console.error(e)}
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
async function updatePick(id,result,pnl){try{const r=await fetch(API+"/picks/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({result,pnl:parseFloat(pnl)})});const d=await r.json();if(d.id){showToast(result==="win"?"WIN CONFIRMED!":"LOSS MARKED");loadPicks();}else showToast("Error");}catch(e){showToast("Connection error");}}
async function deletePick(id){if(!confirm("Delete this pick?"))return;try{const r=await fetch(API+"/picks/"+id,{method:"DELETE"});const d=await r.json();if(d.success){showToast("PICK DELETED");loadPicks();}else showToast("Error");}catch(e){showToast("Connection error");}}
</script>
</body>
</html>
