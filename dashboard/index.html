<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05050a;--s1:#0b0b14;--s2:#111120;--bd:#18182e;--ac:#e8ff00;--tx:#f2f2fa;--mu:#5a5a7a;--mu2:#8888aa;--gr:#00e5a0;--rd:#ff3355}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(232,255,0,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,255,0,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
nav{position:sticky;top:0;z-index:50;background:rgba(5,5,10,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:5px;color:var(--ac);text-decoration:none}
.nav-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-link{color:var(--mu2);font-size:13px;text-decoration:none;padding:8px 14px;border-radius:8px;transition:all .2s}
.nav-link:hover{color:var(--tx)}
.user-badge{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 16px;font-size:13px;font-family:'DM Mono',monospace;color:var(--mu2)}
.logout-btn{background:transparent;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;font-family:'Syne',sans-serif}
.logout-btn:hover{border-color:var(--rd);color:var(--rd)}
.main{max-width:1200px;margin:0 auto;padding:32px 24px;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:18px}
.stat-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:var(--tx)}
.stat-val.pos{color:var(--gr)}.stat-val.neg{color:var(--rd)}
.grid{display:grid;grid-template-columns:1fr 360px;gap:20px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:24px}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--ac);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.panel-title::after{content:'';flex:1;height:1px;background:var(--bd)}
.form-group{margin-bottom:12px}
label{display:block;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:6px}
input,select{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'Syne',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--ac)}
select option{background:#111120}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* SPORT TABS */
.sport-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sport-tab{padding:7px 14px;border:1px solid var(--bd);border-radius:20px;font-size:12px;cursor:pointer;transition:all .2s;color:var(--mu2);background:transparent}
.sport-tab.active{background:rgba(232,255,0,0.1);border-color:var(--ac);color:var(--ac)}

/* DATE TABS */
.date-tabs{display:flex;gap:6px;margin-bottom:12px}
.date-tab{flex:1;padding:8px;border:1px solid var(--bd);border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s;color:var(--mu2);background:transparent;text-align:center;font-family:'DM Mono',monospace}
.date-tab.active{background:rgba(232,255,0,0.1);border-color:var(--ac);color:var(--ac)}

/* FIXTURE SELECTOR */
.fixture-search{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:8px 8px 0 0;color:var(--tx);font-family:'Syne',sans-serif;font-size:13px;padding:10px 14px;outline:none;border-bottom:none}
.fixture-search:focus{border-color:var(--ac)}
.fixture-list{background:var(--s2);border:1px solid var(--bd);border-radius:0 0 8px 8px;max-height:240px;overflow-y:auto;margin-bottom:12px}
.fixture-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(24,24,46,0.5);transition:background .2s}
.fixture-item:hover{background:rgba(232,255,0,0.05)}
.fixture-item:last-child{border:none}
.fixture-item.selected{background:rgba(232,255,0,0.08);border-left:2px solid var(--ac)}
.fi-teams{font-weight:700;font-size:13px;margin-bottom:2px}
.fi-meta{font-size:10px;color:var(--mu);font-family:'DM Mono',monospace}
.fixture-loading{padding:16px;text-align:center;color:var(--mu);font-size:12px;font-family:'DM Mono',monospace}

/* LEAGUE FILTER */
.league-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.league-chip{padding:4px 12px;border:1px solid var(--bd);border-radius:20px;font-size:11px;cursor:pointer;transition:all .2s;color:var(--mu);font-family:'DM Mono',monospace}
.league-chip.active{border-color:var(--ac);color:var(--ac);background:rgba(232,255,0,0.06)}

/* SELECTED FIXTURE */
.selected-fixture-box{background:rgba(232,255,0,0.06);border:1px solid rgba(232,255,0,0.2);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:none}
.sfb-teams{font-weight:700;font-size:14px;color:var(--ac)}
.sfb-meta{font-size:11px;color:var(--mu2);font-family:'DM Mono',monospace;margin-top:2px}

/* MARKET SECTIONS */
.market-section{margin-bottom:10px}
.market-section-title{font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:6px}
.market-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid var(--bd);border-radius:20px;font-size:11px;cursor:pointer;transition:all .2s;color:var(--mu2)}
.chip:hover,.chip.selected{background:rgba(232,255,0,0.1);border-color:var(--ac);color:var(--ac)}

.result-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.rbtn{padding:10px;border-radius:8px;border:2px solid var(--bd);background:transparent;color:var(--mu);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;cursor:pointer;transition:all .2s}
.submit-btn{width:100%;padding:14px;background:var(--ac);color:#05050a;border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;cursor:pointer;transition:all .2s}
.submit-btn:hover{background:#f5ff33;transform:translateY(-1px)}

/* PICKS */
.pick-card{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:8px}
.pick-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.pick-event{font-weight:700;font-size:13px;margin-bottom:2px}
.pick-market{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace}
.pick-odds{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--ac)}
.pick-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-family:'DM Mono',monospace}
.badge-win{background:rgba(0,229,160,.12);color:var(--gr)}
.badge-loss{background:rgba(255,51,85,.12);color:var(--rd)}
.badge-pending{background:rgba(245,158,11,.12);color:#f59e0b}
.badge-sport{background:rgba(232,255,0,.1);color:var(--ac)}
.pick-time{font-size:10px;color:var(--mu);font-family:'DM Mono',monospace;margin-left:auto}
.pick-actions{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--bd)}
.btn-win{flex:1;padding:6px;background:rgba(0,229,160,.1);border:1px solid var(--gr);color:var(--gr);border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
.btn-win:hover{background:var(--gr);color:#05050a}
.btn-loss{flex:1;padding:6px;background:rgba(255,51,85,.1);border:1px solid var(--rd);color:var(--rd);border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
.btn-loss:hover{background:var(--rd);color:#fff}
.btn-del{padding:6px 12px;background:transparent;border:1px solid var(--bd);color:var(--mu);border-radius:6px;font-size:11px;cursor:pointer}
.btn-del:hover{border-color:var(--rd);color:var(--rd)}
.empty{text-align:center;padding:40px;color:var(--mu)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ac);color:#05050a;padding:12px 24px;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;z-index:1000;transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.toast.show{transform:translateY(0);opacity:1}
.not-logged{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center}
.not-logged h2{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:3px;color:var(--ac);margin-bottom:12px}
.not-logged p{color:var(--mu2);margin-bottom:28px}
.go-home{background:var(--ac);color:#05050a;padding:14px 32px;border-radius:8px;font-size:15px;font-weight:700;text-decoration:none;display:inline-block}
@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="notLogged" class="not-logged" style="display:none">
  <h2>ACCESS DENIED</h2>
  <p>You need to log in.</p>
  <a href="/" class="go-home">Back to LEDGR</a>
</div>
<div id="app" style="display:none">
  <nav>
    <a href="/" class="logo">LEDGR</a>
    <div class="nav-r">
      <a href="/leaderboard" class="nav-link">Leaderboard</a>
      <a href="/compare" class="nav-link">Compare</a>
      <a href="/simulator" class="nav-link">Simulator</a>
      <div class="user-badge" id="userBadge">...</div>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
  </nav>
  <div class="main">
    <div class="stats">
      <div class="stat"><div class="stat-label">Total Picks</div><div class="stat-val" id="statTotal">0</div></div>
      <div class="stat"><div class="stat-label">ROI</div><div class="stat-val pos" id="statROI">0%</div></div>
      <div class="stat"><div class="stat-label">Win Rate</div><div class="stat-val" id="statWR">0%</div></div>
      <div class="stat"><div class="stat-label">Total P&L</div><div class="stat-val" id="statPnL">€0</div></div>
    </div>
    <div class="grid">
      <div class="panel">
        <div class="panel-title">POST A PICK</div>

        <!-- SPORT TABS -->
        <div class="form-group">
          <label>Sport</label>
          <div class="sport-tabs">
            <div class="sport-tab active" onclick="selectSport('Soccer',this)">⚽ Soccer</div>
            <div class="sport-tab" onclick="selectSport('Basketball',this)">🏀 NBA</div>
            <div class="sport-tab" onclick="selectSport('Tennis',this)">🎾 Tennis</div>
            <div class="sport-tab" onclick="selectSport('Football',this)">🏈 NFL</div>
            <div class="sport-tab" onclick="selectSport('Baseball',this)">⚾ MLB</div>
            <div class="sport-tab" onclick="selectSport('MMA/Boxing',this)">🥊 MMA</div>
          </div>
        </div>

        <!-- DATE TABS -->
        <div class="form-group">
          <label>Date</label>
          <div class="date-tabs">
            <div class="date-tab active" onclick="selectDate(0,this)">Today</div>
            <div class="date-tab" onclick="selectDate(1,this)">Tomorrow</div>
            <div class="date-tab" onclick="selectDate(2,this)">In 2 days</div>
          </div>
        </div>

        <!-- LEAGUE FILTER -->
        <div class="form-group">
          <label>League</label>
          <div class="league-filter" id="leagueFilter">
            <div class="league-chip active" onclick="selectLeague('all',this)">All</div>
          </div>
        </div>

        <!-- FIXTURE SEARCH -->
        <div class="form-group">
          <label>Search Match <span style="color:var(--ac);font-size:9px">LIVE FROM API</span></label>
          <input type="text" class="fixture-search" id="fixtureSearch" placeholder="🔍 Type team name..." oninput="filterFixtures()">
          <div class="fixture-list" id="fixtureList">
            <div class="fixture-loading" id="fixtureLoading">Loading matches...</div>
          </div>
        </div>

        <!-- SELECTED FIXTURE -->
        <div class="selected-fixture-box" id="selectedFixtureBox">
          <div class="sfb-teams" id="sfbTeams"></div>
          <div class="sfb-meta" id="sfbMeta"></div>
        </div>

        <!-- MARKETS -->
        <div class="form-group" id="marketSection">
          <label>Market</label>
          <div id="marketSections"></div>
          <input type="text" id="pickMarket" placeholder="Or type custom market..." style="margin-top:8px">
        </div>

        <div class="form-row">
          <div class="form-group"><label>Odds</label><input type="number" id="pickOdds" placeholder="2.10" step="0.01" min="1.01"></div>
          <div class="form-group"><label>Stake (units)</label><input type="number" id="pickStake" placeholder="1" step="0.5" min="0.5"></div>
        </div>

        <div class="form-group">
          <label>Result</label>
          <div class="result-btns">
            <button class="rbtn" id="rbPending" onclick="selectResult('pending')" style="border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,.08)">PENDING</button>
            <button class="rbtn" id="rbWin" onclick="selectResult('win')">WIN</button>
            <button class="rbtn" id="rbLoss" onclick="selectResult('loss')">LOSS</button>
          </div>
        </div>
        <button class="submit-btn" onclick="postPick()">+ POST PICK</button>
      </div>

      <div class="panel">
        <div class="panel-title">MY PICKS</div>
        <div id="myPicks"><div class="empty"><p style="font-size:36px;margin-bottom:10px">📊</p><p>No picks yet.</p></div></div>
      </div>
    </div>
  </div>
</div>

<script>
const API='https://ledgr-backend-production-c132.up.railway.app';
let user=null;
let currentResult='pending';
let currentSport='Soccer';
let currentDateOffset=0;
let currentLeague='all';
let allFixtures=[];
let selectedFixture=null;

const MARKETS={
  Soccer:{
    'Result':['Home Win (1)','Draw (X)','Away Win (2)','Double Chance 1X','Double Chance X2','Double Chance 12','Tie No Bet Home','Tie No Bet Away'],
    'Goals':['Over 0.5','Over 1.5','Over 2.5','Over 3.5','Over 4.5','Under 0.5','Under 1.5','Under 2.5','BTTS Yes','BTTS No','Result + BTTS HW&Yes','Result + BTTS AW&Yes'],
    'Half Time':['HT Home Win','HT Draw','HT Away Win','HT Over 0.5','HT Over 1.5'],
    'Corners':['Over 8.5 Corners','Over 9.5 Corners','Over 10.5 Corners','Under 8.5 Corners'],
    'Cards':['Over 2.5 Cards','Over 3.5 Cards','Over 4.5 Cards','Home Team Card','Away Team Card'],
    'Player':['Anytime Scorer','First Scorer','To Assist','Player Over 1.5 Shots']
  },
  Basketball:{
    'Game':['Home Win','Away Win','Over/Under Points','Spread/Handicap','First Half O/U'],
    'Player Props':['Player Pts Over 10.5','Player Pts Over 15.5','Player Pts Over 20.5','Player Pts Over 25.5','Player Pts Over 30.5','Player Reb Over 4.5','Player Reb Over 7.5','Player Ast Over 4.5','Player Ast Over 7.5','Player 3PM Over 1.5','Player 3PM Over 2.5','Double Double','Triple Double']
  },
  Tennis:{
    'Match':['Match Winner','Set Handicap +1.5','-1.5','Total Games Over 20.5','Total Games Over 22.5','First Set Winner','Correct Score']
  },
  Football:{
    'Game':['Moneyline Home','Moneyline Away','Spread -3.5','+3.5','Over 45.5 Points','Under 45.5 Points'],
    'Player':['First TD Scorer','Anytime TD','Player Passing Yds O/U','Player Rushing Yds O/U']
  },
  Baseball:{
    'Game':['Moneyline','Run Line -1.5','+1.5','Over 8.5 Runs','Under 8.5 Runs','First 5 Innings Winner']
  },
  'MMA/Boxing':{
    'Fight':['Fighter A by KO/TKO','Fighter A by Decision','Fighter B by KO/TKO','Fighter B by Decision','Goes to Decision Yes','Goes to Decision No','Round 1 Finish','Over 2.5 Rounds']
  }
};

window.onload=()=>{
  const ud=localStorage.getItem('ledgr_user');
  const tk=localStorage.getItem('ledgr_token');
  if(!ud||!tk){document.getElementById('notLogged').style.display='flex';return}
  user=JSON.parse(ud);
  document.getElementById('app').style.display='block';
  document.getElementById('userBadge').textContent='@'+user.username;
  renderMarkets('Soccer');
  loadFixtures();
  loadPicks();
};

function logout(){localStorage.removeItem('ledgr_token');localStorage.removeItem('ledgr_user');window.location.href='/'}

function selectSport(sport,el){
  currentSport=sport;
  document.querySelectorAll('.sport-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderMarkets(sport);
  selectedFixture=null;
  document.getElementById('selectedFixtureBox').style.display='none';
  document.getElementById('fixtureSearch').value='';
  loadFixtures();
}

function selectDate(offset,el){
  currentDateOffset=offset;
  document.querySelectorAll('.date-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  loadFixtures();
}

function selectLeague(league,el){
  currentLeague=league;
  document.querySelectorAll('.league-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  filterFixtures();
}

function renderMarkets(sport){
  const sections=MARKETS[sport]||MARKETS.Soccer;
  const container=document.getElementById('marketSections');
  container.innerHTML=Object.entries(sections).map(([section,markets])=>`
    <div class="market-section">
      <div class="market-section-title">${section}</div>
      <div class="market-chips">${markets.map(m=>`<div class="chip" onclick="selectMarket('${m}',this)">${m}</div>`).join('')}</div>
    </div>
  `).join('');
}

function selectMarket(m,el){
  document.getElementById('pickMarket').value=m;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}

async function loadFixtures(){
  const list=document.getElementById('fixtureList');
  list.innerHTML='<div class="fixture-loading">Loading matches...</div>';
  document.getElementById('leagueFilter').innerHTML='<div class="league-chip active" onclick="selectLeague(\'all\',this)">All</div>';
  currentLeague='all';

  try{
    const r=await fetch(API+'/fixtures?sport='+currentSport+'&dateOffset='+currentDateOffset);
    allFixtures=await r.json();

    // Build league filter
    const leagues=[...new Set(allFixtures.map(f=>f.league))];
    const lf=document.getElementById('leagueFilter');
    leagues.forEach(l=>{
      const chip=document.createElement('div');
      chip.className='league-chip';
      chip.textContent=l;
      chip.onclick=function(){selectLeague(l,this)};
      lf.appendChild(chip);
    });

    filterFixtures();
  }catch(e){
    list.innerHTML='<div class="fixture-loading" style="color:var(--mu2)">Could not load matches — type manually</div>';
  }
}

function filterFixtures(){
  const search=document.getElementById('fixtureSearch').value.toLowerCase();
  const list=document.getElementById('fixtureList');

  let filtered=allFixtures;
  if(currentLeague!=='all')filtered=filtered.filter(f=>f.league===currentLeague);
  if(search)filtered=filtered.filter(f=>f.home.toLowerCase().includes(search)||f.away.toLowerCase().includes(search));

  if(!filtered.length){
    list.innerHTML='<div class="fixture-loading">No matches found</div>';
    return;
  }

  list.innerHTML=filtered.slice(0,30).map(f=>`
    <div class="fixture-item ${selectedFixture&&selectedFixture.id===f.id?'selected':''}" onclick='selectFixture(${JSON.stringify(f)})'>
      <div class="fi-teams">${f.home} vs ${f.away}</div>
      <div class="fi-meta">${f.league} · ${f.date} ${f.time}</div>
    </div>
  `).join('');
}

function selectFixture(f){
  selectedFixture=f;
  document.getElementById('sfbTeams').textContent=f.home+' vs '+f.away;
  document.getElementById('sfbMeta').textContent=f.league+' · '+f.date+' '+f.time;
  document.getElementById('selectedFixtureBox').style.display='block';
  document.getElementById('fixtureSearch').value=f.home+' vs '+f.away;
  filterFixtures();
}

function selectResult(r){
  currentResult=r;
  const none='border-color:var(--bd);color:var(--mu);background:transparent';
  document.getElementById('rbPending').style.cssText=r==='pending'?'border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,.08)':none;
  document.getElementById('rbWin').style.cssText=r==='win'?'border-color:#00e5a0;color:#00e5a0;background:rgba(0,229,160,.08)':none;
  document.getElementById('rbLoss').style.cssText=r==='loss'?'border-color:#ff3355;color:#ff3355;background:rgba(255,51,85,.08)':none;
}

async function postPick(){
  const market=document.getElementById('pickMarket').value.trim();
  const odds=parseFloat(document.getElementById('pickOdds').value);
  const stake=parseFloat(document.getElementById('pickStake').value);
  if(!market||!odds||!stake){showToast('Fill all fields!');return}
  if(!selectedFixture){showToast('Select a match first!');return}
  const event=selectedFixture.home+' vs '+selectedFixture.away;
  try{
    const r=await fetch(API+'/picks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:user.id,sport:currentSport,event,fixtureId:selectedFixture.id,homeTeam:selectedFixture.home,awayTeam:selectedFixture.away,market,odds,stake,result:currentResult,pnl:0})});
    const d=await r.json();
    if(d.id){
      showToast('PICK POSTED! ✅');
      selectedFixture=null;
      document.getElementById('selectedFixtureBox').style.display='none';
      document.getElementById('fixtureSearch').value='';
      document.getElementById('pickMarket').value='';
      document.getElementById('pickOdds').value='';
      document.getElementById('pickStake').value='';
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
      selectResult('pending');
      filterFixtures();
      loadPicks();
    }else showToast('Error: '+d.error);
  }catch(e){showToast('Connection error');}
}

async function updatePick(id,result,pnl){
  try{
    const r=await fetch(API+'/picks/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({result,pnl:parseFloat(pnl)})});
    const d=await r.json();
    if(d.id){showToast(result==='win'?'WIN! 🏆':'LOSS marked');loadPicks();}
  }catch(e){showToast('Connection error');}
}

async function deletePick(id){
  if(!confirm('Delete this pick?'))return;
  try{
    const r=await fetch(API+'/picks/'+id,{method:'DELETE'});
    const d=await r.json();
    if(d.success){showToast('Deleted');loadPicks();}
  }catch(e){showToast('Connection error');}
}

async function loadPicks(){
  try{
    const r=await fetch(API+'/picks');
    const picks=await r.json();
    const my=picks.filter(p=>p.userId===user.id);
    const wins=my.filter(p=>p.result==='win').length;
    const losses=my.filter(p=>p.result==='loss').length;
    const ts=my.reduce((s,p)=>s+p.stake,0);
    const tp=my.reduce((s,p)=>s+p.pnl,0);
    const roi=ts>0?((tp/ts)*100).toFixed(1):'0';
    const wr=(wins+losses)>0?((wins/(wins+losses))*100).toFixed(0):'0';
    document.getElementById('statTotal').textContent=my.length;
    document.getElementById('statROI').textContent=(tp>=0?'+':'')+roi+'%';
    document.getElementById('statROI').className='stat-val '+(tp>=0?'pos':'neg');
    document.getElementById('statWR').textContent=wr+'%';
    document.getElementById('statPnL').textContent=(tp>=0?'+':'')+'€'+tp.toFixed(2);
    document.getElementById('statPnL').className='stat-val '+(tp>=0?'pos':'neg');
    const c=document.getElementById('myPicks');
    if(!my.length){c.innerHTML='<div class="empty"><p style="font-size:36px;margin-bottom:10px">📊</p><p>No picks yet.</p></div>';return}
    c.innerHTML=my.slice(0,20).map(p=>{
      const rb=p.result==='win'?'<span class="badge badge-win">WIN</span>':p.result==='loss'?'<span class="badge badge-loss">LOSS</span>':'<span class="badge badge-pending">PENDING</span>';
      const wp=(p.stake*(p.odds-1)).toFixed(2);
      const lp=(-p.stake).toFixed(2);
      const pa=p.result==='pending'?`<button class="btn-win" onclick="updatePick('${p.id}','win',${wp})">✓ WIN</button><button class="btn-loss" onclick="updatePick('${p.id}','loss',${lp})">✗ LOSS</button>`:'';
      return`<div class="pick-card"><div class="pick-top"><div><div class="pick-event">${p.event}</div><div class="pick-market">${p.market}</div></div><div class="pick-odds">${p.odds}</div></div><div class="pick-meta"><span class="badge badge-sport">${p.sport}</span><span style="font-size:11px;color:var(--mu)">${p.stake}u</span>${rb}<span class="pick-time">${new Date(p.createdAt).toLocaleDateString()}</span></div><div class="pick-actions">${pa}<button class="btn-del" onclick="deletePick('${p.id}')">Delete</button></div></div>`;
    }).join('');
  }catch(e){console.error(e)}
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
</script>
