
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Compare Tipsters</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07060d;--s1:#0c0a1a;--s2:#15122a;--bd:rgba(184,159,255,0.1);--bd2:rgba(184,159,255,0.18);--ac:#b89fff;--acg:rgba(184,159,255,0.08);--tx:#f0edff;--mu:#6a6690;--mu2:#9590b8;--gr:#34d399;--rd:#f87171;--bl:#38bdf8}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh}
*{cursor:none!important}
.cursor{position:fixed;width:8px;height:8px;background:var(--ac);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .15s,height .15s}
.cursor-ring{position:fixed;width:32px;height:32px;border:1px solid rgba(184,159,255,0.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%)}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:1;opacity:.4}
nav{position:sticky;top:0;z-index:50;background:rgba(7,6,13,0.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);padding:0 32px;height:62px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:6px;color:var(--tx);text-decoration:none}
.logo span{color:var(--ac)}
.nav-links{display:flex;gap:4px}
.nav-link{color:var(--mu2);font-size:12px;font-weight:500;text-decoration:none;padding:8px 12px;border-radius:6px;transition:all .2s;letter-spacing:.3px}
.nav-link:hover{color:var(--tx);background:rgba(255,255,255,0.04)}
.nav-link.active{color:var(--ac);background:var(--acg)}
.nav-btn{background:var(--ac);color:#07060d;border:none;padding:9px 20px;border-radius:6px;font-size:12px;font-weight:700;cursor:none;font-family:'Syne',sans-serif;transition:all .2s}
.nav-btn:hover{background:#cdb8ff;transform:translateY(-1px)}
.main{max-width:1000px;margin:0 auto;padding:48px 24px;position:relative;z-index:1}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6vw,64px);letter-spacing:3px;margin-bottom:8px;color:var(--tx)}
.page-title span{color:var(--ac)}
.page-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:40px}
.select-box{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:32px;margin-bottom:32px}
.select-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--ac);margin-bottom:20px}
.select-row{display:grid;grid-template-columns:1fr 60px 1fr auto;gap:12px;align-items:end}
.vs{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--mu);text-align:center;padding-bottom:12px}
.form-label{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.form-select{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'Syne',sans-serif;font-size:14px;padding:12px 16px;outline:none;cursor:none;transition:border-color .2s}
.form-select:focus{border-color:var(--bd2)}
.form-select option{background:#15122a}
.compare-btn{background:var(--ac);color:#07060d;border:none;border-radius:8px;padding:12px 28px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:none;white-space:nowrap;transition:all .2s}
.compare-btn:hover{background:#cdb8ff;transform:translateY(-1px)}
.comp-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:0;margin-bottom:24px}
.comp-side{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:28px}
.comp-side.left{border-right:none;border-radius:16px 0 0 16px}
.comp-side.right{border-left:none;border-radius:0 16px 16px 0;text-align:right}
.comp-middle{background:var(--s2);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:center;padding:0 12px;min-width:52px}
.comp-avatar{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:22px;margin-bottom:8px;color:#fff}
.comp-username{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;margin-bottom:4px}
.comp-username.a{color:var(--ac)}.comp-username.b{color:var(--bl)}
.stat-compare{display:grid;grid-template-columns:1fr 80px 1fr;gap:0;background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.stat-compare-a{padding:16px 20px;text-align:right}
.stat-compare-mid{background:var(--s2);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:1px;text-transform:uppercase;writing-mode:vertical-rl;padding:8px 0}
.stat-compare-b{padding:16px 20px}
.stat-val-big{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;line-height:1}
.stat-val-big.pos{color:var(--gr)}.stat-val-big.neg{color:var(--rd)}.stat-val-big.neu{color:var(--tx)}
.winner-a{background:rgba(184,159,255,0.05);border-color:rgba(184,159,255,0.3)}
.winner-b{background:rgba(56,189,248,0.05);border-color:rgba(56,189,248,0.25)}
.verdict{background:var(--s1);border:1px solid var(--bd2);border-radius:16px;padding:32px;text-align:center;margin-top:24px;position:relative;overflow:hidden}
.verdict::before{content:'';position:absolute;inset:-1px;border-radius:16px;background:linear-gradient(135deg,rgba(184,159,255,0.2),rgba(52,211,153,0.1),rgba(124,95,230,0.15));z-index:-1}
.verdict::after{content:'';position:absolute;inset:1px;border-radius:15px;background:var(--s1);z-index:-1}
.verdict h3{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:3px;margin-bottom:8px;position:relative;z-index:1}
.verdict p{color:var(--mu2);font-size:14px;line-height:1.7;position:relative;z-index:1}
.verdict-btn{background:var(--ac);color:#07060d;padding:12px 28px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;display:inline-block;margin-top:16px;transition:all .2s;position:relative;z-index:1}
.verdict-btn:hover{background:#cdb8ff;transform:translateY(-1px)}
.empty-state{text-align:center;padding:60px;color:var(--mu)}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state h3{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:8px;color:var(--tx)}
.winner-badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:10px;font-family:'DM Mono',monospace;letter-spacing:1px;margin-top:4px;font-weight:700}
.winner-badge.a{background:rgba(184,159,255,0.15);color:var(--ac);border:1px solid rgba(184,159,255,0.3)}
.winner-badge.b{background:rgba(56,189,248,0.15);color:var(--bl);border:1px solid rgba(56,189,248,0.3)}
@media(max-width:700px){.select-row{grid-template-columns:1fr}.vs{display:none}.comp-grid{grid-template-columns:1fr}.comp-side.left{border-radius:16px;border-right:1px solid var(--bd);margin-bottom:8px}.comp-side.right{border-radius:16px;border-left:1px solid var(--bd);text-align:left}.comp-middle{display:none}nav{padding:0 16px}.nav-link{display:none}}
</style>
</head>
<body>
<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="ring"></div>
<nav>
  <a href="/home" class="logo">LEDG<span>R</span></a>
  <div class="nav-links">
    <a href="/home" class="nav-link">Home</a>
    <a href="/leaderboard" class="nav-link">Leaderboard</a>
    <a href="/compare" class="nav-link active">Compare</a>
    <a href="/simulator" class="nav-link">Simulator</a>
    <a href="/badges" class="nav-link">🏅 Badges</a>
  </div>
  <button class="nav-btn" onclick="window.location.href='/dashboard'">My Dashboard</button>
</nav>
<div class="main">
  <div class="page-title">COMPARE <span>TIPSTERS</span></div>
  <div class="page-sub">HEAD TO HEAD — WHO PERFORMED BETTER?</div>
  <div class="select-box">
    <div class="select-title">SELECT TWO TIPSTERS</div>
    <div class="select-row">
      <div>
        <label class="form-label">Tipster A</label>
        <select class="form-select" id="selectA"><option value="">Loading...</option></select>
      </div>
      <div class="vs">VS</div>
      <div>
        <label class="form-label">Tipster B</label>
        <select class="form-select" id="selectB"><option value="">Loading...</option></select>
      </div>
      <button class="compare-btn" onclick="runComparison()">COMPARE →</button>
    </div>
  </div>
  <div id="compResult">
    <div class="empty-state">
      <div class="icon">⚔️</div>
      <h3>SELECT TIPSTERS</h3>
      <p style="font-size:14px;line-height:1.7;color:var(--mu2)">Choose two tipsters from the dropdowns above and click Compare to see who performed better.</p>
    </div>
  </div>
</div>
<script>
const cur=document.getElementById('cur'),ring=document.getElementById('ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px'});
(function lerp(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(lerp)})();
document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>{cur.style.width='14px';cur.style.height='14px'});el.addEventListener('mouseleave',()=>{cur.style.width='8px';cur.style.height='8px'})});

const API='https://ledgr-backend-production-c132.up.railway.app';
let allPicks=[];
const colors=['linear-gradient(135deg,#7c3aed,#a855f7)','linear-gradient(135deg,#059669,#10b981)','linear-gradient(135deg,#b45309,#f59e0b)','linear-gradient(135deg,#0369a1,#38bdf8)','linear-gradient(135deg,#0f766e,#14b8a6)','linear-gradient(135deg,#dc2626,#ef4444)'];

function calcStats(picks){
  const settled=picks.filter(p=>p.result==='win'||p.result==='loss');
  const wins=settled.filter(p=>p.result==='win').length;
  const losses=settled.filter(p=>p.result==='loss').length;
  const stake=picks.reduce((s,p)=>s+p.stake,0);
  const pnl=picks.reduce((s,p)=>s+p.pnl,0);
  const roi=stake>0?((pnl/stake)*100).toFixed(1):0;
  const wr=settled.length>0?((wins/settled.length)*100).toFixed(0):0;
  const avgOdds=picks.length>0?(picks.reduce((s,p)=>s+p.odds,0)/picks.length).toFixed(2):0;
  return{wins,losses,roi:parseFloat(roi),wr:parseFloat(wr),pnl,picks:picks.length,avgOdds:parseFloat(avgOdds)};
}

async function loadTipsters(){
  try{
    const r=await fetch(API+'/picks',{cache:'no-store'});
    if(!r.ok)throw new Error('error');
    allPicks=await r.json();
    if(!Array.isArray(allPicks))allPicks=[];
    const tipsters={};
    allPicks.forEach(p=>{if(p.user)tipsters[p.user.username]=true;});
    const names=Object.keys(tipsters).sort();
    const optA=document.getElementById('selectA');
    const optB=document.getElementById('selectB');
    optA.innerHTML='<option value="">Select tipster A...</option>'+names.map(n=>`<option value="${n}">@${n}</option>`).join('');
    optB.innerHTML='<option value="">Select tipster B...</option>'+names.map(n=>`<option value="${n}">@${n}</option>`).join('');
  }catch(e){
    document.getElementById('selectA').innerHTML='<option>Could not load</option>';
    document.getElementById('selectB').innerHTML='<option>Could not load</option>';
  }
}

function runComparison(){
  const userA=document.getElementById('selectA').value;
  const userB=document.getElementById('selectB').value;
  const c=document.getElementById('compResult');
  if(!userA||!userB){c.innerHTML='<div class="empty-state"><div class="icon">⚠️</div><h3>SELECT BOTH</h3><p style="color:var(--mu2)">Please select two tipsters.</p></div>';return;}
  if(userA===userB){c.innerHTML='<div class="empty-state"><div class="icon">😅</div><h3>SAME TIPSTER</h3><p style="color:var(--mu2)">Please select two different tipsters.</p></div>';return;}

  const picksA=allPicks.filter(p=>p.user&&p.user.username===userA);
  const picksB=allPicks.filter(p=>p.user&&p.user.username===userB);
  const sA=calcStats(picksA);const sB=calcStats(picksB);

  let aWins=0,bWins=0;
  if(sA.roi>sB.roi)aWins++;else if(sB.roi>sA.roi)bWins++;
  if(sA.wr>sB.wr)aWins++;else if(sB.wr>sA.wr)bWins++;
  if(sA.pnl>sB.pnl)aWins++;else if(sB.pnl>sA.pnl)bWins++;
  if(sA.picks>sB.picks)aWins++;else if(sB.picks>sA.picks)bWins++;
  if(sA.avgOdds>sB.avgOdds)aWins++;else if(sB.avgOdds>sA.avgOdds)bWins++;

  const winner=aWins>bWins?userA:bWins>aWins?userB:'TIE';

  function statRow(label,valA,valB,fmt,higherWins=true){
    const aNum=parseFloat(valA);const bNum=parseFloat(valB);
    const aWin=higherWins?aNum>bNum:aNum<bNum;
    const bWin=higherWins?bNum>aNum:bNum<aNum;
    const fmtVal=(v,pos)=>{
      const n=parseFloat(v);
      if(fmt==='pct')return(n>=0?'+':'')+v+'%';
      if(fmt==='eur')return(n>=0?'+€':'-€')+Math.abs(n).toFixed(2);
      return v;
    };
    return`<div class="stat-compare ${aWin?'winner-a':bWin?'winner-b':''}">
      <div class="stat-compare-a">
        <div class="stat-val-big ${fmt==='pct'||fmt==='eur'?(aNum>=0?'pos':'neg'):'neu'}">${fmtVal(valA)}</div>
        ${aWin?'<div class="winner-badge a">▲ BETTER</div>':''}
      </div>
      <div class="stat-compare-mid">${label}</div>
      <div class="stat-compare-b">
        <div class="stat-val-big ${fmt==='pct'||fmt==='eur'?(bNum>=0?'pos':'neg'):'neu'}">${fmtVal(valB)}</div>
        ${bWin?'<div class="winner-badge b">▲ BETTER</div>':''}
      </div>
    </div>`;
  }

  const winnerColor=aWins>bWins?'var(--ac)':bWins>aWins?'var(--bl)':'var(--mu2)';

  c.innerHTML=`
    <div class="comp-grid">
      <div class="comp-side left">
        <div class="comp-avatar" style="background:${colors[0]}">${userA.substring(0,2).toUpperCase()}</div>
        <div class="comp-username a">@${userA}</div>
        <div style="font-size:11px;color:var(--mu);font-family:'DM Mono',monospace">${sA.picks} picks</div>
      </div>
      <div class="comp-middle"><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--mu)">VS</div></div>
      <div class="comp-side right">
        <div class="comp-avatar" style="background:${colors[3]};margin-left:auto">${userB.substring(0,2).toUpperCase()}</div>
        <div class="comp-username b">@${userB}</div>
        <div style="font-size:11px;color:var(--mu);font-family:'DM Mono',monospace">${sB.picks} picks</div>
      </div>
    </div>
    ${statRow('ROI',sA.roi,sB.roi,'pct')}
    ${statRow('WIN RATE',sA.wr,sB.wr,'pct')}
    ${statRow('TOTAL P&L',sA.pnl,sB.pnl,'eur')}
    ${statRow('TOTAL PICKS',sA.picks,sB.picks,'num')}
    ${statRow('AVG ODDS',sA.avgOdds,sB.avgOdds,'num')}
    <div class="verdict">
      <h3 style="color:${winnerColor}">${winner==='TIE'?"IT'S A TIE!":'@'+winner+' WINS!'}</h3>
      <p>${winner==='TIE'?'Both tipsters performed equally well.':'@'+winner+' outperforms @'+(winner===userA?userB:userA)+' in '+(aWins>bWins?aWins:bWins)+' out of 5 categories.'}</p>
      ${winner!=='TIE'?`<a href="/tipster?u=${winner}" class="verdict-btn">View @${winner}'s Profile →</a>`:''}
    </div>`;

  document.querySelectorAll('.stat-compare,.verdict-btn').forEach(el=>{
    el.addEventListener('mouseenter',()=>{cur.style.width='14px';cur.style.height='14px'});
    el.addEventListener('mouseleave',()=>{cur.style.width='8px';cur.style.height='8px'});
  });
}

loadTipsters();
</script>
</body>
</html>
