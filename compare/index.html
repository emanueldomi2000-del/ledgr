<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Compare Tipsters</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05050a;--s1:#0b0b14;--s2:#111120;--bd:#18182e;--ac:#e8ff00;--tx:#f2f2fa;--mu:#5a5a7a;--mu2:#8888aa;--gr:#00e5a0;--rd:#ff3355;--bl:#38bdf8}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(232,255,0,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,255,0,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
nav{position:sticky;top:0;z-index:50;background:rgba(5,5,10,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:5px;color:var(--ac);text-decoration:none}
.nav-links{display:flex;gap:8px}
.nav-link{color:var(--mu2);font-size:13px;text-decoration:none;padding:8px 14px;border-radius:8px;transition:all .2s}
.nav-link:hover{color:var(--tx);background:var(--s2)}
.nav-btn{background:var(--ac);color:#05050a;border:none;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif}
.main{max-width:1000px;margin:0 auto;padding:48px 24px;position:relative;z-index:1}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6vw,64px);letter-spacing:3px;margin-bottom:8px}
.page-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:40px}
.select-box{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:32px;margin-bottom:32px}
.select-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--ac);margin-bottom:20px}
.select-row{display:grid;grid-template-columns:1fr 60px 1fr auto;gap:12px;align-items:end}
.vs{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--mu);text-align:center;padding-bottom:12px}
.form-label{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.form-select{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'Syne',sans-serif;font-size:14px;padding:12px 16px;outline:none;cursor:pointer}
.form-select:focus{border-color:var(--ac)}
.form-select option{background:#111120}
.compare-btn{background:var(--ac);color:#05050a;border:none;border-radius:8px;padding:12px 28px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;white-space:nowrap;transition:all .2s}
.compare-btn:hover{background:#f5ff33}

/* COMPARISON */
.comp-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:0;margin-bottom:32px}
.comp-side{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:28px}
.comp-side.left{border-right:none;border-radius:16px 0 0 16px}
.comp-side.right{border-left:none;border-radius:0 16px 16px 0;text-align:right}
.comp-middle{background:var(--s2);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:28px 0;min-width:60px}
.comp-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:24px;margin-bottom:8px;border:3px solid transparent}
.comp-avatar.a{border-color:var(--ac)}
.comp-avatar.b{border-color:var(--bl)}
.comp-username{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;margin-bottom:4px}
.comp-username.a{color:var(--ac)}
.comp-username.b{color:var(--bl)}

/* STAT ROWS */
.stat-compare{display:grid;grid-template-columns:1fr 80px 1fr;gap:0;background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden}
.stat-compare-a{padding:16px 20px;text-align:right}
.stat-compare-mid{background:var(--s2);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:1px;text-transform:uppercase;writing-mode:vertical-rl;text-orientation:mixed;padding:8px 0}
.stat-compare-b{padding:16px 20px}
.stat-val-big{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;line-height:1}
.stat-val-big.pos{color:var(--gr)}.stat-val-big.neg{color:var(--rd)}.stat-val-big.neu{color:var(--tx)}
.winner-a{background:rgba(232,255,0,0.05);border-color:rgba(232,255,0,0.2)}
.winner-b{background:rgba(56,189,248,0.05);border-color:rgba(56,189,248,0.2)}

/* VERDICT */
.verdict{background:var(--ac);border-radius:16px;padding:32px;text-align:center;margin-bottom:32px}
.verdict h3{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:3px;color:#05050a;margin-bottom:8px}
.verdict p{color:rgba(5,5,10,0.7);font-size:15px}
.verdict-btn{background:#05050a;color:var(--ac);padding:12px 28px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;display:inline-block;margin-top:16px;transition:all .2s}
.verdict-btn:hover{background:#111120}

.empty-state{text-align:center;padding:60px;color:var(--mu)}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state h3{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:8px;color:var(--tx)}

@media(max-width:700px){.select-row{grid-template-columns:1fr}.vs{display:none}.comp-grid{grid-template-columns:1fr}.comp-side.left{border-radius:16px;border-right:1px solid var(--bd);margin-bottom:8px}.comp-side.right{border-radius:16px;border-left:1px solid var(--bd);text-align:left}.comp-middle{display:none}.stat-compare{grid-template-columns:1fr auto 1fr}}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">LEDGR</a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/leaderboard" class="nav-link">Leaderboard</a>
    <a href="/compare" class="nav-link">Compare</a>
    <a href="/simulator" class="nav-link">Simulator</a>
    <a href="/dashboard" class="nav-link">Dashboard</a>
  </div>
  <button class="nav-btn" onclick="window.location.href='/dashboard'">My Dashboard</button>
</nav>

<div class="main">
  <div class="page-title">COMPARE TIPSTERS</div>
  <div class="page-sub">HEAD TO HEAD — WHO PERFORMED BETTER?</div>

  <div class="select-box">
    <div class="select-title">SELECT TWO TIPSTERS</div>
    <div class="select-row">
      <div>
        <label class="form-label">Tipster A</label>
        <select class="form-select" id="selectA"><option value="">Loading...</option></select>
      </div>
      <div class="vs">VS</div>
      <div>
        <label class="form-label">Tipster B</label>
        <select class="form-select" id="selectB"><option value="">Loading...</option></select>
      </div>
      <button class="compare-btn" onclick="runComparison()">COMPARE →</button>
    </div>
  </div>

  <div id="compResult">
    <div class="empty-state">
      <div class="icon">⚔️</div>
      <h3>SELECT TIPSTERS</h3>
      <p style="font-size:14px;line-height:1.7;color:var(--mu2)">Choose two tipsters from the dropdowns above and click Compare to see who performed better.</p>
    </div>
  </div>
</div>

<script>
const API='https://ledgr-backend-production-c132.up.railway.app';
let allPicks=[];
const colors=['linear-gradient(135deg,#7c3aed,#a855f7)','linear-gradient(135deg,#059669,#10b981)','linear-gradient(135deg,#b45309,#f59e0b)','linear-gradient(135deg,#0369a1,#38bdf8)','linear-gradient(135deg,#0f766e,#14b8a6)','linear-gradient(135deg,#dc2626,#ef4444)'];

function calcStats(picks){
  const settled=picks.filter(p=>p.result==='win'||p.result==='loss');
  const wins=settled.filter(p=>p.result==='win').length;
  const losses=settled.filter(p=>p.result==='loss').length;
  const stake=picks.reduce((s,p)=>s+p.stake,0);
  const pnl=picks.reduce((s,p)=>s+p.pnl,0);
  const roi=stake>0?((pnl/stake)*100).toFixed(1):0;
  const wr=settled.length>0?((wins/settled.length)*100).toFixed(0):0;
  const avgOdds=picks.length>0?(picks.reduce((s,p)=>s+p.odds,0)/picks.length).toFixed(2):0;
  return{wins,losses,roi:parseFloat(roi),wr:parseFloat(wr),pnl,picks:picks.length,avgOdds:parseFloat(avgOdds),settled:settled.length};
}

async function loadTipsters(){
  try{
    const r=await fetch(API+'/picks');
    allPicks=await r.json();
    const tipsters={};
    allPicks.forEach(p=>{if(p.user)tipsters[p.user.username]=true;});
    const names=Object.keys(tipsters);
    const optA=document.getElementById('selectA');
    const optB=document.getElementById('selectB');
    optA.innerHTML='<option value="">Select tipster A...</option>'+names.map(n=>`<option value="${n}">@${n}</option>`).join('');
    optB.innerHTML='<option value="">Select tipster B...</option>'+names.map(n=>`<option value="${n}">@${n}</option>`).join('');
  }catch(e){console.error(e);}
}

function runComparison(){
  const userA=document.getElementById('selectA').value;
  const userB=document.getElementById('selectB').value;
  const c=document.getElementById('compResult');

  if(!userA||!userB){c.innerHTML='<div class="empty-state"><div class="icon">⚠️</div><h3>SELECT BOTH</h3><p style="color:var(--mu2)">Please select two different tipsters.</p></div>';return;}
  if(userA===userB){c.innerHTML='<div class="empty-state"><div class="icon">😅</div><h3>SAME TIPSTER</h3><p style="color:var(--mu2)">Please select two different tipsters.</p></div>';return;}

  const picksA=allPicks.filter(p=>p.user&&p.user.username===userA);
  const picksB=allPicks.filter(p=>p.user&&p.user.username===userB);
  const sA=calcStats(picksA);
  const sB=calcStats(picksB);

  // Determine winner
  let aWins=0,bWins=0;
  if(sA.roi>sB.roi)aWins++;else bWins++;
  if(sA.wr>sB.wr)aWins++;else bWins++;
  if(sA.pnl>sB.pnl)aWins++;else bWins++;
  if(sA.picks>sB.picks)aWins++;else bWins++;

  const winner=aWins>bWins?userA:bWins>aWins?userB:'TIE';
  const winnerColor=aWins>bWins?'var(--ac)':bWins>aWins?'var(--bl)':'var(--mu2)';

  function statRow(label,valA,valB,format,higherWins=true){
    const aNum=parseFloat(valA);const bNum=parseFloat(valB);
    const aWin=higherWins?aNum>bNum:aNum<bNum;
    const bWin=higherWins?bNum>aNum:bNum<aNum;
    const aPos=aNum>=0;const bPos=bNum>=0;
    return`<div class="stat-compare ${aWin?'winner-a':bWin?'winner-b':''}">
      <div class="stat-compare-a">
        <div class="stat-val-big ${format==='pct'||format==='eur'?(aPos?'pos':'neg'):'neu'}">${format==='pct'?(aPos?'+':'')+valA+'%':format==='eur'?(aPos?'+€':'-€')+Math.abs(aNum).toFixed(2):valA}</div>
        ${aWin?'<div style="font-size:10px;color:var(--ac);font-family:DM Mono,monospace;margin-top:4px">▲ BETTER</div>':''}
      </div>
      <div class="stat-compare-mid">${label}</div>
      <div class="stat-compare-b">
        <div class="stat-val-big ${format==='pct'||format==='eur'?(bPos?'pos':'neg'):'neu'}">${format==='pct'?(bPos?'+':'')+valB+'%':format==='eur'?(bPos?'+€':'-€')+Math.abs(bNum).toFixed(2):valB}</div>
        ${bWin?'<div style="font-size:10px;color:var(--bl);font-family:DM Mono,monospace;margin-top:4px">▲ BETTER</div>':''}
      </div>
    </div>`;
  }

  c.innerHTML=`
    <div class="comp-grid">
      <div class="comp-side left">
        <div class="comp-avatar a" style="background:${colors[0]}">${userA.substring(0,2).toUpperCase()}</div>
        <div class="comp-username a">@${userA}</div>
        <div style="font-size:11px;color:var(--mu);font-family:DM Mono,monospace">${sA.picks} picks</div>
      </div>
      <div class="comp-middle">
        <div style="font-family:Bebas Neue,sans-serif;font-size:24px;color:var(--mu);margin-top:20px">VS</div>
      </div>
      <div class="comp-side right">
        <div class="comp-avatar b" style="background:${colors[3]};margin-left:auto">${userB.substring(0,2).toUpperCase()}</div>
        <div class="comp-username b">@${userB}</div>
        <div style="font-size:11px;color:var(--mu);font-family:DM Mono,monospace">${sB.picks} picks</div>
      </div>
    </div>

    ${statRow('ROI',sA.roi,sB.roi,'pct')}
    ${statRow('WIN RATE',sA.wr,sB.wr,'pct')}
    ${statRow('TOTAL P&L',sA.pnl,sB.pnl,'eur')}
    ${statRow('TOTAL PICKS',sA.picks,sB.picks,'num')}
    ${statRow('AVG ODDS',sA.avgOdds,sB.avgOdds,'num')}

    <div class="verdict" style="margin-top:24px">
      <h3 style="color:${winnerColor}">${winner==='TIE'?'IT\'S A TIE!':'@'+winner+' WINS!'}</h3>
      <p>${winner==='TIE'?'Both tipsters performed equally well.':('@'+winner+' outperforms @'+(winner===userA?userB:userA)+' in '+(aWins>bWins?aWins:bWins)+' out of 5 categories.')}</p>
      ${winner!=='TIE'?`<a href="/tipster?u=${winner}" class="verdict-btn">View @${winner}'s Profile →</a>`:''}
    </div>`;
}

loadTipsters();
</script>
</body>
</html>
