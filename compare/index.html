<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Head to Head</title>
<meta name="description" content="Compare two LEDGR tipsters head-to-head — ROI, win rate, streaks, best picks, and full performance breakdown.">

<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>



body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");pointer-events:none;z-index:1;opacity:.4}

/* ── MAIN ── */
.main{max-width:1060px;margin:0 auto;padding:32px 24px 80px;position:relative;z-index:2}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ── HERO ── */
.cmp-hero{text-align:center;padding:40px 0 48px;position:relative}
.cmp-hero-eyebrow{font-family:var(--font-mono);font-size:10px;color:var(--mu);letter-spacing:5px;text-transform:uppercase;margin-bottom:14px}
.cmp-hero-title{font-family:var(--font-display);font-size:clamp(34px,5vw,48px);letter-spacing:4px;line-height:.88;
  background:linear-gradient(180deg,#f0edff 0%,var(--ac) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 40px rgba(184,159,255,.3));margin-bottom:0}
.cmp-hero-title .vs-word{color:var(--gold);-webkit-text-fill-color:var(--gold);filter:drop-shadow(0 0 30px rgba(251,191,36,.5));animation:vs-pulse 2s ease-in-out infinite}
@keyframes vs-pulse{0%,100%{filter:drop-shadow(0 0 20px rgba(251,191,36,.5))}50%{filter:drop-shadow(0 0 50px rgba(251,191,36,.9))}}
.cmp-hero-sub{font-family:var(--font-mono);font-size:11px;color:var(--mu);letter-spacing:3px;text-transform:uppercase;margin-top:16px}

/* ── SELECTOR ARENA ── */
.arena{display:grid;grid-template-columns:1fr 100px 1fr;gap:16px;align-items:start;margin-bottom:32px}
.selector-side{display:flex;flex-direction:column;gap:10px}
.selected-slot{border-radius:16px;padding:20px;text-align:center;cursor:default;transition:all .3s;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.selected-slot.empty{background:rgba(255,255,255,.02);border:2px dashed rgba(255,255,255,.1)}
.selected-slot.empty:hover{border-color:rgba(184,159,255,.3)}
.slot-empty-icon{font-size:28px;opacity:.3}
.slot-empty-text{font-family:var(--font-mono);font-size:10px;color:var(--mu);letter-spacing:3px;text-transform:uppercase}
.slot-filled-a{background:linear-gradient(135deg,rgba(184,159,255,.1),rgba(184,159,255,.03));border:2px solid rgba(184,159,255,.35);box-shadow:0 0 32px rgba(184,159,255,.1)}
.slot-filled-b{background:linear-gradient(135deg,rgba(56,189,248,.1),rgba(56,189,248,.03));border:2px solid rgba(56,189,248,.35);box-shadow:0 0 32px rgba(56,189,248,.1)}
.slot-av{width:52px;height:52px;border-radius:var(--r-lg,14px);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:18px;color:#fff;margin:0 auto}
.slot-name{font-family:var(--font-display);font-size:22px;letter-spacing:2px}
.slot-name-a{color:var(--ac)}
.slot-name-b{color:var(--bl)}
.slot-stats{font-family:var(--font-mono);font-size:9px;color:var(--mu2);letter-spacing:1px}
.slot-change{font-family:var(--font-mono);font-size:8px;color:var(--mu);text-decoration:underline;cursor:pointer;margin-top:4px}
.slot-change:hover{color:var(--tx)}
.tipster-search{position:relative}
.tipster-search input{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:var(--font-mono);font-size:11px;padding:9px 12px 9px 32px;outline:none;letter-spacing:.5px;transition:border-color .2s}
.tipster-search input:focus{border-color:var(--bd2)}
.tipster-search input::placeholder{color:var(--mu)}
.tipster-search::before{content:'⌕';position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:14px;pointer-events:none}
.tipster-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:260px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(184,159,255,.2) transparent}
.tipster-grid::-webkit-scrollbar{width:4px}
.tipster-grid::-webkit-scrollbar-thumb{background:rgba(184,159,255,.2);border-radius:2px}
.tc{background:var(--s1);border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:10px 10px 8px;cursor:pointer;transition:all .18s;text-align:center}
.tc:hover{border-color:var(--bd2);background:var(--s2);transform:translateY(-2px)}
.tc.selected-a{border-color:rgba(184,159,255,.5);background:rgba(184,159,255,.08)}
.tc.selected-b{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.08)}
.tc-av{width:32px;height:32px;border-radius:var(--r-lg,14px);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:12px;color:#fff}
.tc-name{font-family:var(--font-mono);font-size:9px;color:var(--mu2);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.tc-roi{font-family:var(--font-display);font-size:16px;line-height:1}
.tc-sub{font-family:var(--font-mono);font-size:8px;color:var(--mu);margin-top:2px}

/* ── VS CENTER ── */
.vs-zone{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:24px;gap:8px}
.vs-bolt{font-size:24px;animation:bolt-flash 1.2s ease-in-out infinite}
@keyframes bolt-flash{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.9)}}
.vs-bolt:nth-child(3){animation-delay:.6s}
.vs-text{font-family:var(--font-display);font-size:42px;letter-spacing:3px;color:var(--gold);text-shadow:0 0 24px rgba(251,191,36,.5);line-height:1}
.battle-btn{background:linear-gradient(135deg,var(--ac),#7c3aed);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-family:var(--font-display);font-size:18px;letter-spacing:2px;cursor:pointer;transition:all .2s;white-space:nowrap;margin-top:8px;box-shadow:0 0 24px rgba(184,159,255,.2)}
.battle-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 32px rgba(184,159,255,.35)}
.battle-btn:disabled{opacity:.35;cursor:not-allowed;background:var(--mu)}

/* ── VERDICT ── */
.verdict-wrap{position:relative;border-radius:22px;padding:48px 36px;text-align:center;margin-bottom:24px;overflow:hidden}
.verdict-bg-a{background:linear-gradient(135deg,rgba(184,159,255,.12),rgba(184,159,255,.04));border:2px solid rgba(184,159,255,.35)}
.verdict-bg-b{background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(56,189,248,.04));border:2px solid rgba(56,189,248,.35)}
.verdict-bg-tie{background:var(--s1);border:2px solid var(--bd2)}
.verdict-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vp{position:absolute;border-radius:50%;animation:vp-rise var(--d,5s) ease-in var(--dl,0s) infinite}
@keyframes vp-rise{0%{transform:translateY(120%) scale(1);opacity:0}10%{opacity:1}90%{opacity:.6}100%{transform:translateY(-100%) scale(.3);opacity:0}}
.verdict-label{font-family:var(--font-mono);font-size:10px;letter-spacing:5px;text-transform:uppercase;margin-bottom:12px;opacity:.7}
.verdict-crown{font-size:40px;margin-bottom:8px;animation:crown-bob 2.5s ease-in-out infinite}
@keyframes crown-bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.verdict-name{font-family:var(--font-display);font-size:clamp(34px,5vw,56px);letter-spacing:4px;line-height:1;margin-bottom:6px}
.verdict-name-a{color:var(--ac);text-shadow:0 0 40px rgba(184,159,255,.5)}
.verdict-name-b{color:var(--bl);text-shadow:0 0 40px rgba(56,189,248,.5)}
.verdict-margin{font-family:var(--font-mono);font-size:12px;letter-spacing:2px;color:var(--mu2);margin-bottom:24px}
.verdict-stats{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-bottom:24px}
.vd-st{text-align:center}
.vd-val{font-family:var(--font-display);font-size:28px;line-height:1}
.vd-lbl{font-family:var(--font-mono);font-size:8px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
.verdict-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.va-btn{padding:10px 22px;border-radius:8px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.va-btn-primary{background:var(--ac);color:#07060d;border:none}
.va-btn-primary:hover{background:#cdb8ff}
.va-btn-secondary{background:transparent;border:1px solid var(--bd2);color:var(--mu2)}
.va-btn-secondary:hover{color:var(--tx);border-color:var(--ac)}

/* ── SPLIT SCREEN HEADER ── */
.split-header{display:grid;grid-template-columns:1fr 60px 1fr;gap:0;margin-bottom:20px;border-radius:16px;overflow:hidden}
.sh-side{padding:20px;text-align:center}
.sh-side-a{background:linear-gradient(135deg,rgba(184,159,255,.08),rgba(184,159,255,.02))}
.sh-side-b{background:linear-gradient(135deg,rgba(56,189,248,.08),rgba(56,189,248,.02))}
.sh-side.winner-side-a{border:1px solid rgba(184,159,255,.4);box-shadow:0 0 32px rgba(184,159,255,.12)}
.sh-side.winner-side-b{border:1px solid rgba(56,189,248,.4);box-shadow:0 0 32px rgba(56,189,248,.12)}
.sh-mid{background:var(--s2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;color:var(--mu)}
.sh-av{width:48px;height:48px;border-radius:var(--r-lg,14px);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;color:#fff}
.sh-name{font-family:var(--font-display);font-size:18px;letter-spacing:2px}
.sh-name-a{color:var(--ac)}
.sh-name-b{color:var(--bl)}
.sh-sub{font-family:var(--font-mono);font-size:9px;color:var(--mu);margin-top:3px}
.sh-winner-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);border-radius:20px;padding:3px 10px;font-family:var(--font-mono);font-size:8px;color:var(--gr);letter-spacing:1px;margin-top:6px}

/* ── STAT BAR ROWS ── */
.stats-card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:24px;margin-bottom:16px}
.stat-row{margin-bottom:16px}
.stat-row:last-child{margin-bottom:0}
.stat-row-inner{display:grid;grid-template-columns:1fr 120px 1fr;gap:8px;align-items:center}
.stat-val{font-family:var(--font-display);font-size:20px;line-height:1}
.stat-val-a{text-align:right;color:var(--ac)}
.stat-val-b{text-align:left;color:var(--bl)}
.stat-val.winner-val{transform:scale(1.1);transform-origin:right center}
.stat-val-b.winner-val{transform-origin:left center}
.stat-bar-zone{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-label{font-family:var(--font-mono);font-size:8px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;text-align:center}
.stat-track{height:7px;background:rgba(255,255,255,.05);border-radius:4px;position:relative;overflow:hidden;width:100%}
.stat-fill-a{position:absolute;right:50%;top:0;height:100%;background:linear-gradient(to left,#b89fff,rgba(184,159,255,.35));border-radius:4px 0 0 4px;width:0;transition:width 1s cubic-bezier(.34,1.1,.64,1)}
.stat-fill-b{position:absolute;left:50%;top:0;height:100%;background:linear-gradient(to right,#38bdf8,rgba(56,189,248,.35));border-radius:0 4px 4px 0;width:0;transition:width 1s cubic-bezier(.34,1.1,.64,1)}
.stat-fill-a.glow-a{box-shadow:0 0 10px rgba(184,159,255,.6)}
.stat-fill-b.glow-b{box-shadow:0 0 10px rgba(56,189,248,.6)}
.stat-win-badge{font-family:var(--font-mono);font-size:7px;letter-spacing:1px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.stat-win-a{background:rgba(184,159,255,.12);border:1px solid rgba(184,159,255,.25);color:var(--ac)}
.stat-win-b{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);color:var(--bl)}

/* ── ROI CHART ── */
.chart-card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:22px;margin-bottom:16px}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.chart-title{font-family:var(--font-display);font-size:18px;letter-spacing:2px;color:var(--ac)}
.chart-legend{display:flex;gap:16px}
.cl-item{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:1px}
.cl-line{width:20px;height:2px;border-radius:1px}
.chart-svg-wrap{width:100%;overflow:hidden;border-radius:8px}

/* ── SIMILAR ── */
.similar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.sim-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all .2s}
.sim-card:hover{border-color:var(--bd2);transform:translateY(-3px)}
.sim-av{width:36px;height:36px;border-radius:var(--r-lg,14px);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13px;color:#fff}
.sim-name{font-family:var(--font-mono);font-size:9px;color:var(--mu2);margin-bottom:4px}
.sim-roi{font-family:var(--font-display);font-size:18px}

.empty-state{text-align:center;padding:64px 24px;color:var(--mu)}
.empty-state .icon{font-size:48px;margin-bottom:16px;display:block;opacity:.5}
.empty-state h3{font-family:var(--font-display);font-size:28px;letter-spacing:2px;color:var(--mu2);margin-bottom:8px}
.empty-state p{font-size:13px;color:var(--mu2);line-height:1.7;max-width:380px;margin:0 auto}

@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:800px 100%;animation:shimmer 1.6s linear infinite;display:inline-block}

@media(max-width:800px){
  nav{padding:0 16px}
  .nav-link{display:none}
  .mobile-menu-btn{display:block}
  .arena{grid-template-columns:1fr;gap:12px}
  .vs-zone{flex-direction:row;justify-content:center;padding-top:0;gap:12px}
  .battle-btn{margin-top:0}
  .split-header{grid-template-columns:1fr 40px 1fr}
  .stat-row-inner{grid-template-columns:80px 1fr 80px}
  .similar-grid{grid-template-columns:1fr 1fr}
}
</style>

</head>
<body>
<div class="bg-glow"></div>
<script src="/app-nav.js"></script>
<script>AppNav.init({active:'compare'});</script>

<div class="main">

  <!-- HERO -->
  <div class="cmp-hero">
    <div class="cmp-hero-eyebrow">LEDGR · TIPSTER ANALYSIS</div>
    <div class="cmp-hero-title">HEAD<br>TO <span class="vs-word">HEAD</span></div>
    <div class="cmp-hero-sub">Select two tipsters · See who's really sharper</div>
  </div>

  <!-- SELECTOR ARENA -->
  <div class="arena" id="arena">
    <!-- Side A -->
    <div class="selector-side">
      <div class="selected-slot empty" id="slotA">
        <div class="slot-empty-icon">👤</div>
        <div class="slot-empty-text">Select Tipster A</div>
      </div>
      <div class="tipster-search"><input type="search" placeholder="Search tipster..." id="searchA" oninput="filterGrid('A',this.value)"></div>
      <div class="tipster-grid" id="gridA"><div class="skel" style="height:80px;width:100%;border-radius:10px"></div></div>
    </div>

    <!-- VS -->
    <div class="vs-zone">
      <div class="vs-bolt">⚡</div>
      <div class="vs-text">VS</div>
      <div class="vs-bolt">⚡</div>
      <button class="battle-btn" id="battleBtn" onclick="runComparison()" disabled>BATTLE →</button>
    </div>

    <!-- Side B -->
    <div class="selector-side">
      <div class="selected-slot empty" id="slotB">
        <div class="slot-empty-icon">👤</div>
        <div class="slot-empty-text">Select Tipster B</div>
      </div>
      <div class="tipster-search"><input type="search" placeholder="Search tipster..." id="searchB" oninput="filterGrid('B',this.value)"></div>
      <div class="tipster-grid" id="gridB"><div class="skel" style="height:80px;width:100%;border-radius:10px"></div></div>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="compResult"></div>

</div>

<script>
const API = 'https://ledgr-backend-production-c132.up.railway.app';
const COLORS = ['linear-gradient(135deg,#7c3aed,#a855f7)','linear-gradient(135deg,#059669,#10b981)','linear-gradient(135deg,#b45309,#f59e0b)','linear-gradient(135deg,#0369a1,#38bdf8)','linear-gradient(135deg,#0f766e,#14b8a6)','linear-gradient(135deg,#dc2626,#ef4444)'];

let allPicks = [], allTipsters = [];
let selectedA = null, selectedB = null;

function logout() { localStorage.clear(); window.location.href = '/login'; }
function goToProfile() { const u = localStorage.getItem('username'); if (u) window.location.href = '/tipster?u=' + u; }



(function() {
  const u = localStorage.getItem('username');
  if (u) { const ub = document.getElementById('userBadge'); if (ub) ub.textContent = '@' + u; const sn = document.getElementById('slideName'); if (sn) sn.textContent = '@' + u; const sa = document.getElementById('slideAvatar'); if (sa) sa.textContent = u[0].toUpperCase(); }
})();

function calcStats(picks) {
  const settled = picks.filter(p => p.result === 'win' || p.result === 'loss');
  const wins = settled.filter(p => p.result === 'win').length;
  const stake = picks.reduce((s, p) => s + (p.stake || 0), 0);
  const pnl   = picks.reduce((s, p) => s + (p.pnl || 0), 0);
  const roi   = stake > 0 ? (pnl / stake) * 100 : 0;
  const wr    = settled.length > 0 ? (wins / settled.length) * 100 : 0;
  const avgOdds = picks.length > 0 ? picks.reduce((s, p) => s + (p.odds || 0), 0) / picks.length : 0;
  const sorted = [...settled].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  let streak = 0; for (const p of sorted) { if (p.result === 'win') streak++; else break; }
  const relScore = Math.round(Math.min(40,Math.max(0,(roi/20)*40))+Math.min(30,Math.max(0,(wr/70)*30))+Math.min(20,Math.max(0,(picks.length/100)*20))+Math.min(10,picks.length));
  return { wins, losses: settled.length - wins, roi, wr, pnl, picks: picks.length, avgOdds, streak, settled: settled.length, relScore };
}

async function loadTipsters() {
  try {
    const resp = await fetch(API + '/picks', { cache: 'no-store' });
    allPicks = await resp.json();
    if (!Array.isArray(allPicks)) allPicks = [];
    const map = {};
    allPicks.forEach(p => {
      if (!p.user) return;
      const u = p.user.username;
      if (!map[u]) map[u] = { username: u, picks: [], idx: Object.keys(map).length };
      map[u].picks.push(p);
    });
    allTipsters = Object.values(map).map(t => ({
      username: t.username, picks: t.picks, color: COLORS[t.idx % COLORS.length],
      ...calcStats(t.picks)
    })).sort((a, b) => b.roi - a.roi);
    renderGrid('A'); renderGrid('B');
  } catch (e) {
    document.getElementById('gridA').innerHTML = '<div style="color:var(--rd);font-family:\'DM Mono\',monospace;font-size:11px;padding:12px">⚠️ Could not load tipsters. Refresh to retry.</div>';
    document.getElementById('gridB').innerHTML = document.getElementById('gridA').innerHTML;
  }
}

function renderGrid(side, query = '') {
  const el = document.getElementById('grid' + side);
  const q = query.toLowerCase();
  const list = q ? allTipsters.filter(t => t.username.toLowerCase().includes(q)) : allTipsters;
  if (!list.length) { el.innerHTML = '<div style="color:var(--mu);font-family:\'DM Mono\',monospace;font-size:10px;padding:10px;text-align:center">No tipsters found</div>'; return; }
  const other = side === 'A' ? selectedB : selectedA;
  el.innerHTML = list.map(t => {
    const sel = side === 'A' ? selectedA : selectedB;
    const isSel = sel === t.username;
    const isOther = other === t.username;
    const cls = isSel ? `selected-${side.toLowerCase()}` : '';
    return `<div class="tc ${cls}${isOther?' style_grayed':''}" onclick="selectTipster('${side}','${t.username}')" title="@${t.username} · ${t.roi >= 0 ? '+' : ''}${t.roi.toFixed(1)}% ROI">
      <div class="tc-av" style="background:${t.color}">${t.username.slice(0,2).toUpperCase()}</div>
      <div class="tc-name">@${t.username}</div>
      <div class="tc-roi" style="color:${t.roi>=0?'var(--gr)':'var(--rd)'}">${t.roi>=0?'+':''}${t.roi.toFixed(1)}%</div>
      <div class="tc-sub">${t.picks} picks · ${t.wr.toFixed(0)}% WR</div>
    </div>`;
  }).join('');
}

function filterGrid(side, query) { renderGrid(side, query); }

function selectTipster(side, username) {
  if (side === 'A') selectedA = username;
  else selectedB = username;

  const t = allTipsters.find(x => x.username === username);
  if (!t) return;

  const slot = document.getElementById('slot' + side);
  const cls = side === 'A' ? 'slot-filled-a' : 'slot-filled-b';
  const nameCls = side === 'A' ? 'slot-name-a' : 'slot-name-b';
  slot.className = `selected-slot ${cls}`;
  slot.innerHTML = `
    <div class="slot-av" style="background:${t.color}">${t.username.slice(0,2).toUpperCase()}</div>
    <div class="slot-name ${nameCls}">@${t.username}</div>
    <div class="slot-stats">${t.picks} picks · ${t.roi>=0?'+':''}${t.roi.toFixed(1)}% ROI · ${t.wr.toFixed(0)}% WR</div>
    <div class="slot-change" onclick="clearSlot('${side}')">Change tipster</div>`;

  renderGrid('A'); renderGrid('B');
  const btn = document.getElementById('battleBtn');
  btn.disabled = !(selectedA && selectedB && selectedA !== selectedB);
}

function clearSlot(side) {
  if (side === 'A') selectedA = null;
  else selectedB = null;
  const slot = document.getElementById('slot' + side);
  slot.className = 'selected-slot empty';
  slot.innerHTML = `<div class="slot-empty-icon">👤</div><div class="slot-empty-text">Select Tipster ${side}</div>`;
  document.getElementById('battleBtn').disabled = true;
  renderGrid('A'); renderGrid('B');
}

function spawnVerdictParticles(container, color) {
  const COLS = [color, '#fbbf24', '#34d399', '#f43f5e', '#38bdf8', '#b89fff'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'vp';
    const size = 3 + Math.random() * 5;
    p.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;
      --d:${4+Math.random()*6}s;--dl:${-Math.random()*8}s;
      background:${COLS[Math.random()*COLS.length|0]};
      border-radius:${Math.random()>.4?'50%':'2px'}`;
    container.appendChild(p);
  }
}

function drawROIChart(picksA, picksB, userA, userB) {
  const sortA = [...picksA].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  const sortB = [...picksB].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  let cA = 0, stA = 0, cB = 0, stB = 0;
  const ptA = [0, ...sortA.map(p => { cA += p.pnl || 0; stA += p.stake || 0; return stA > 0 ? (cA / stA) * 100 : 0; })];
  const ptB = [0, ...sortB.map(p => { cB += p.pnl || 0; stB += p.stake || 0; return stB > 0 ? (cB / stB) * 100 : 0; })];
  const all = [...ptA, ...ptB];
  const mn = Math.min(...all) - 2, mx = Math.max(...all) + 2, rng = mx - mn || 1;
  const W = 600, H = 140;
  function py(v) { return H - ((v - mn) / rng) * (H - 16) - 8; }
  function toPoints(pts) { return pts.map((v, i) => `${(i / (pts.length - 1 || 1)) * W},${py(v)}`).join(' '); }
  const ptsA = toPoints(ptA), ptsB = toPoints(ptB);
  const zero = py(0);
  const idA = 'gA' + Date.now(), idB = 'gB' + Date.now();
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="${idA}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#b89fff" stop-opacity=".3"/>
        <stop offset="100%" stop-color="#b89fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="${idB}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/>
        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <line x1="0" y1="${zero}" x2="${W}" y2="${zero}" stroke="rgba(255,255,255,.08)" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="3" y="${zero-4}" fill="rgba(255,255,255,.2)" font-size="9" font-family="DM Mono,monospace">0%</text>
    <polygon points="${ptsA} ${W},${zero} 0,${zero}" fill="url(#${idA})"/>
    <polygon points="${ptsB} ${W},${zero} 0,${zero}" fill="url(#${idB})"/>
    <polyline points="${ptsA}" fill="none" stroke="#b89fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${ptsB}" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function shareComparison(userA, userB, sA, sB, winner) {
  const canvas = document.createElement('canvas');
  canvas.width = 1200; canvas.height = 630;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#07060d'; ctx.fillRect(0, 0, 1200, 630);
  // Background glow
  const grad = ctx.createRadialGradient(600, 200, 0, 600, 200, 500);
  grad.addColorStop(0, 'rgba(184,159,255,0.08)'); grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 1200, 630);
  // Logo
  ctx.fillStyle = '#f0edff'; ctx.font = 'bold 28px sans-serif'; ctx.fillText('LEDGR', 60, 64);
  ctx.fillStyle = '#b89fff'; ctx.fillText('HEAD TO HEAD', 60, 100);
  // Divider
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(60, 120, 1080, 1);
  // A side
  ctx.fillStyle = '#b89fff'; ctx.font = 'bold 48px sans-serif'; ctx.fillText('@' + userA, 60, 200);
  ctx.fillStyle = sA.roi >= 0 ? '#34d399' : '#f87171'; ctx.font = 'bold 80px sans-serif'; ctx.fillText((sA.roi >= 0 ? '+' : '') + sA.roi.toFixed(1) + '%', 60, 310);
  ctx.fillStyle = '#6a6690'; ctx.font = '20px sans-serif'; ctx.fillText(sA.picks + ' picks  ·  ' + sA.wr.toFixed(0) + '% WR  ·  W' + sA.streak + ' streak', 60, 360);
  // VS
  ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 56px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('VS', 600, 290);
  ctx.textAlign = 'left';
  // B side
  ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 48px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('@' + userB, 1140, 200);
  ctx.fillStyle = sB.roi >= 0 ? '#34d399' : '#f87171'; ctx.font = 'bold 80px sans-serif'; ctx.fillText((sB.roi >= 0 ? '+' : '') + sB.roi.toFixed(1) + '%', 1140, 310);
  ctx.fillStyle = '#6a6690'; ctx.font = '20px sans-serif'; ctx.fillText(sB.picks + ' picks  ·  ' + sB.wr.toFixed(0) + '% WR  ·  W' + sB.streak + ' streak', 1140, 360);
  ctx.textAlign = 'left';
  // Winner
  if (winner && winner !== 'TIE') {
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.beginPath(); ctx.roundRect(300, 420, 600, 100, 16); ctx.fill();
    ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('WINNER', 600, 455);
    ctx.fillStyle = '#f0edff'; ctx.font = 'bold 40px sans-serif'; ctx.fillText('@' + winner, 600, 500);
    ctx.textAlign = 'left';
  }
  // Footer
  ctx.fillStyle = '#544f6e'; ctx.font = '14px sans-serif'; ctx.fillText('getledgr.bet', 60, 600);
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `ledgr-${userA}-vs-${userB}.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}

function fmtVal(v, fmt) {
  if (fmt === 'pct') return (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
  if (fmt === 'eur') return (v >= 0 ? '+' : '-') + '€' + Math.abs(v).toFixed(1);
  return typeof v === 'number' ? v.toFixed(v % 1 ? 2 : 0) : v;
}

function runComparison() {
  if (!selectedA || !selectedB || selectedA === selectedB) return;
  const picksA = allPicks.filter(p => p.user?.username === selectedA);
  const picksB = allPicks.filter(p => p.user?.username === selectedB);
  const sA = calcStats(picksA), sB = calcStats(picksB);
  const tA = allTipsters.find(t => t.username === selectedA);
  const tB = allTipsters.find(t => t.username === selectedB);

  const cats = [
    { label: 'ROI',         a: sA.roi,      b: sB.roi,      fmt: 'pct' },
    { label: 'WIN RATE',    a: sA.wr,       b: sB.wr,       fmt: 'pct' },
    { label: 'P&L',         a: sA.pnl,      b: sB.pnl,      fmt: 'eur' },
    { label: 'PICKS',       a: sA.picks,    b: sB.picks,    fmt: 'num' },
    { label: 'AVG ODDS',    a: sA.avgOdds,  b: sB.avgOdds,  fmt: 'num' },
    { label: 'RELIABILITY', a: sA.relScore, b: sB.relScore, fmt: 'num' },
    { label: 'STREAK',      a: sA.streak,   b: sB.streak,   fmt: 'num' },
  ];
  let aWins = 0, bWins = 0;
  cats.forEach(c => { if (c.a > c.b) aWins++; else if (c.b > c.a) bWins++; });
  const winner = aWins > bWins ? selectedA : bWins > aWins ? selectedB : 'TIE';
  const winnerSide = winner === selectedA ? 'a' : winner === selectedB ? 'b' : 'tie';
  const winnerStats = winner === selectedA ? sA : winner === selectedB ? sB : null;

  // Similar tipsters
  const otherTipsters = allTipsters.filter(t => t.username !== selectedA && t.username !== selectedB).slice(0, 3);

  const verdictColorMap = { a: 'rgba(184,159,255,.35)', b: 'rgba(56,189,248,.35)', tie: 'var(--bd2)' };
  const verdictBgClass = { a: 'verdict-bg-a', b: 'verdict-bg-b', tie: 'verdict-bg-tie' };
  const verdictNameClass = { a: 'verdict-name-a', b: 'verdict-name-b', tie: '' };

  const c = document.getElementById('compResult');
  c.innerHTML = `
    <!-- VERDICT -->
    <div class="verdict-wrap ${verdictBgClass[winnerSide]}">
      <div class="verdict-particles" id="vdConf"></div>
      ${winner !== 'TIE'
        ? `<div class="verdict-label">🏆 WINNER BY ${Math.max(aWins, bWins)} CATEGORIES</div>
           <div class="verdict-crown">👑</div>
           <div class="verdict-name ${verdictNameClass[winnerSide]}">@${winner}</div>
           <div class="verdict-margin">Beats @${winner === selectedA ? selectedB : selectedA} in ${Math.max(aWins, bWins)} of ${cats.length} head-to-head stats</div>
           <div class="verdict-stats">
             <div class="vd-st"><div class="vd-val" style="color:${winnerStats.roi>=0?'var(--gr)':'var(--rd)'}">${winnerStats.roi>=0?'+':''}${winnerStats.roi.toFixed(1)}%</div><div class="vd-lbl">ROI</div></div>
             <div class="vd-st"><div class="vd-val">${winnerStats.wr.toFixed(0)}%</div><div class="vd-lbl">Win Rate</div></div>
             <div class="vd-st"><div class="vd-val" style="color:${winnerStats.pnl>=0?'var(--gr)':'var(--rd)'}">${winnerStats.pnl>=0?'+':'-'}€${Math.abs(winnerStats.pnl).toFixed(0)}</div><div class="vd-lbl">P&L</div></div>
             <div class="vd-st"><div class="vd-val">${winnerStats.picks}</div><div class="vd-lbl">Picks</div></div>
             ${winnerStats.streak>=3?`<div class="vd-st"><div class="vd-val" style="color:var(--orange)">🔥 W${winnerStats.streak}</div><div class="vd-lbl">Streak</div></div>`:''}
           </div>`
        : `<div class="verdict-label">RESULT</div>
           <div class="verdict-name" style="color:var(--mu2)">IT'S A TIE!</div>
           <div class="verdict-margin">Both tipsters tied across all ${cats.length} categories</div>`}
      <div class="verdict-actions">
        ${winner !== 'TIE' ? `<a href="/tipster?u=${winner}" class="va-btn va-btn-primary">View @${winner}'s Profile →</a>` : ''}
        <button class="va-btn va-btn-secondary" onclick="shareComparison('${selectedA}','${selectedB}',${JSON.stringify(sA)},${JSON.stringify(sB)},'${winner}')">📸 Share as Image</button>
      </div>
    </div>

    <!-- SPLIT HEADER -->
    <div class="split-header">
      <div class="sh-side sh-side-a ${winner === selectedA ? 'winner-side-a' : ''}">
        <div class="sh-av" style="background:${tA?.color||COLORS[0]}">${selectedA.slice(0,2).toUpperCase()}</div>
        <div class="sh-name sh-name-a">@${selectedA}</div>
        <div class="sh-sub">${sA.picks} picks · ${sA.wr.toFixed(0)}% WR</div>
        ${winner === selectedA ? '<div class="sh-winner-chip">✓ WINNER</div>' : ''}
      </div>
      <div class="sh-mid">VS</div>
      <div class="sh-side sh-side-b ${winner === selectedB ? 'winner-side-b' : ''}">
        <div class="sh-av" style="background:${tB?.color||COLORS[3]};margin:0 auto 8px">${selectedB.slice(0,2).toUpperCase()}</div>
        <div class="sh-name sh-name-b">@${selectedB}</div>
        <div class="sh-sub">${sB.picks} picks · ${sB.wr.toFixed(0)}% WR</div>
        ${winner === selectedB ? '<div class="sh-winner-chip">✓ WINNER</div>' : ''}
      </div>
    </div>

    <!-- STAT BARS -->
    <div class="stats-card">
      ${cats.map(cat => {
        const mx = Math.max(Math.abs(cat.a), Math.abs(cat.b), 0.01);
        const pa = Math.min(50, (Math.abs(cat.a) / mx) * 50);
        const pb = Math.min(50, (Math.abs(cat.b) / mx) * 50);
        const aw = cat.a > cat.b, bw = cat.b > cat.a;
        return `<div class="stat-row">
          <div class="stat-row-inner">
            <div style="text-align:right">
              <div class="stat-val stat-val-a ${aw?'winner-val':''}">${fmtVal(cat.a, cat.fmt)}</div>
              ${aw ? '<div class="stat-win-badge stat-win-a">▲ WIN</div>' : ''}
            </div>
            <div class="stat-bar-zone">
              <div class="stat-label">${cat.label}</div>
              <div class="stat-track">
                <div class="stat-fill-a ${aw?'glow-a':''}" data-w="${pa}"></div>
                <div class="stat-fill-b ${bw?'glow-b':''}" data-w="${pb}"></div>
              </div>
            </div>
            <div style="text-align:left">
              <div class="stat-val stat-val-b ${bw?'winner-val':''}">${fmtVal(cat.b, cat.fmt)}</div>
              ${bw ? '<div class="stat-win-badge stat-win-b">▲ WIN</div>' : ''}
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- ROI CHART -->
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">ROI EVOLUTION</div>
        <div class="chart-legend">
          <div class="cl-item"><div class="cl-line" style="background:#b89fff"></div><span style="color:var(--ac)">@${selectedA}</span></div>
          <div class="cl-item"><div class="cl-line" style="background:#38bdf8"></div><span style="color:var(--bl)">@${selectedB}</span></div>
        </div>
      </div>
      <div class="chart-svg-wrap">${drawROIChart(picksA, picksB, selectedA, selectedB)}</div>
    </div>

    ${otherTipsters.length ? `<div class="chart-card">
      <div class="chart-title" style="margin-bottom:12px">YOU MIGHT ALSO LIKE</div>
      <div class="similar-grid">
        ${otherTipsters.map(t => `<div class="sim-card" onclick="window.location.href='/tipster?u=${t.username}'">
          <div class="sim-av" style="background:${t.color}">${t.username.slice(0,2).toUpperCase()}</div>
          <div class="sim-name">@${t.username}</div>
          <div class="sim-roi" style="color:${t.roi>=0?'var(--gr)':'var(--rd)'}">${t.roi>=0?'+':''}${t.roi.toFixed(1)}%</div>
          <div style="font-family:var(--font-mono);font-size:8px;color:var(--mu);margin-top:3px">${t.picks} picks</div>
        </div>`).join('')}
      </div>
    </div>` : ''}`;

  // Animate bars
  setTimeout(() => {
    document.querySelectorAll('.stat-fill-a[data-w],.stat-fill-b[data-w]').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
    // Spawn confetti
    const conf = document.getElementById('vdConf');
    if (conf && winner !== 'TIE') spawnVerdictParticles(conf, winner === selectedA ? '#b89fff' : '#38bdf8');
  }, 60);

  c.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

loadTipsters();
</script>

</body>
</html>
