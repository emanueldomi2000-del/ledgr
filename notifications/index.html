<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Notifications</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07060d;--s1:#0c0a1a;--s2:#15122a;--bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.12);--ac:#b89fff;--acg:rgba(184,159,255,0.07);--tx:#f0edff;--mu:#6a6690;--mu2:#9590b8;--gr:#34d399;--rd:#f87171;--gold:#fbbf24;--cyan:#38bdf8;--orange:#fb923c}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh}
.bg-glow{position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:900px;height:600px;background:radial-gradient(ellipse,rgba(100,70,200,0.05),transparent 65%);pointer-events:none;z-index:0}
nav{position:sticky;top:0;z-index:50;background:rgba(7,6,13,0.94);backdrop-filter:blur(28px);border-bottom:1px solid var(--bd);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:6px;color:var(--tx);text-decoration:none}.logo span{color:var(--ac)}
.nav-links{display:flex;gap:2px;align-items:center}
.nav-link{color:var(--mu2);font-size:12px;font-weight:500;text-decoration:none;padding:7px 12px;border-radius:6px;transition:all .2s}.nav-link:hover{color:var(--tx)}.nav-link.active{color:var(--ac);background:var(--acg)}
.user-badge{background:transparent;border:1px solid var(--bd);border-radius:8px;padding:7px 14px;font-size:12px;font-family:'DM Mono',monospace;color:var(--mu2);cursor:pointer;transition:all .2s}.user-badge:hover{color:var(--ac);border-color:var(--bd2)}
.logout-btn{background:transparent;border:none;color:var(--mu);padding:7px 10px;font-size:11px;cursor:pointer;font-family:'Syne',sans-serif}.logout-btn:hover{color:var(--rd)}
.mobile-menu-btn{display:none;background:none;border:none;color:var(--mu2);font-size:20px;cursor:pointer}
.main{max-width:640px;margin:0 auto;padding:40px 24px;position:relative;z-index:2}
.page-head{margin-bottom:28px;display:flex;align-items:flex-end;justify-content:space-between}
.head-left{}
.page-eyebrow{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:4px;text-transform:uppercase;margin-bottom:6px}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:3px;line-height:1}
.clear-all-btn{background:transparent;border:1px solid rgba(248,113,113,0.2);border-radius:8px;padding:7px 14px;color:var(--rd);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s}.clear-all-btn:hover{background:rgba(248,113,113,0.06)}
.filter-row{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--mu2);cursor:pointer;transition:all .2s}.filter-btn:hover{color:var(--tx);border-color:var(--bd2)}.filter-btn.active{background:var(--acg);border-color:rgba(184,159,255,0.3);color:var(--ac)}
.notifs-list{display:flex;flex-direction:column;gap:3px}
.notif-day-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--mu);text-transform:uppercase;padding:12px 0 6px}
.notif-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:all .2s;position:relative}
.notif-card:hover{border-color:var(--bd2);background:rgba(255,255,255,0.025)}
.notif-card.unread{border-left:2px solid var(--ac)}
.notif-card.unread::before{content:'';position:absolute;top:18px;left:-1px;width:2px;height:16px;background:var(--ac);border-radius:1px}
.nf-icon{font-size:22px;flex-shrink:0;margin-top:2px}
.nf-body{flex:1}
.nf-text{font-size:13px;color:var(--tx);line-height:1.5}.nf-text b{color:var(--ac)}
.nf-time{font-family:'DM Mono',monospace;font-size:9px;color:var(--mu);margin-top:4px}
.nf-type-badge{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1px;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:middle}
.nf-type-badge.new_pick{background:rgba(184,159,255,0.1);color:var(--ac)}
.nf-type-badge.streak{background:rgba(251,191,36,0.1);color:var(--gold)}
.nf-type-badge.division{background:rgba(56,189,248,0.1);color:var(--cyan)}
.nf-unread-dot{width:7px;height:7px;background:var(--ac);border-radius:50%;flex-shrink:0;margin-top:6px}
.empty-state{text-align:center;padding:64px 24px}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--mu);margin-bottom:8px}
.empty-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--mu);line-height:1.7}
.follow-cta{display:inline-block;margin-top:20px;background:rgba(184,159,255,0.1);border:1px solid rgba(184,159,255,0.2);border-radius:10px;padding:10px 20px;font-family:'DM Mono',monospace;font-size:11px;color:var(--ac);text-decoration:none;letter-spacing:1px;transition:all .2s}.follow-cta:hover{background:rgba(184,159,255,0.18)}
/* SLIDE NAV */
.slide-nav{position:fixed;top:0;right:-100%;width:280px;height:100vh;background:#0a0910;border-left:1px solid var(--bd);z-index:200;transition:right .3s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.slide-nav.open{right:0}.slide-nav-overlay{position:fixed;inset:0;background:rgba(7,6,13,0.75);z-index:199;display:none;backdrop-filter:blur(6px)}.slide-nav-overlay.open{display:block}
.slide-nav-header{padding:20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}.slide-nav-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:5px}.slide-nav-logo span{color:var(--ac)}.slide-nav-close{background:none;border:none;color:var(--mu);font-size:18px;cursor:pointer}
.slide-nav-links{padding:12px 8px}.snl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--mu2);transition:all .2s;margin-bottom:2px}.snl:hover{background:rgba(255,255,255,0.04);color:var(--tx)}.snl.active{background:var(--acg);color:var(--ac)}.snl-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}.snl-text{font-size:13px;font-weight:600;color:var(--tx)}
.slide-nav-logout{padding:0 16px 16px}.snl-logout{width:100%;padding:10px;background:transparent;border:1px solid rgba(248,113,113,0.2);border-radius:10px;color:var(--rd);font-family:'Syne',sans-serif;font-size:12px;cursor:pointer}.snl-logout:hover{background:rgba(248,113,113,0.06)}
@media(max-width:700px){.nav-link{display:none}.mobile-menu-btn{display:block}.page-head{flex-direction:column;gap:12px;align-items:flex-start}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="slide-nav-overlay" id="slideOverlay" onclick="closeSlideNav()"></div>
<div class="slide-nav" id="slideNav">
  <div class="slide-nav-header"><div class="slide-nav-logo">LEDG<span>R</span></div><button class="slide-nav-close" onclick="closeSlideNav()">✕</button></div>
  <div class="slide-nav-links">
    <a href="/home" class="snl"><span class="snl-icon">🏠</span><div class="snl-text">Home</div></a>
    <a href="/leaderboard" class="snl"><span class="snl-icon">🏆</span><div class="snl-text">Leaderboard</div></a>
    <a href="/feed" class="snl"><span class="snl-icon">🔴</span><div class="snl-text">Live Feed</div></a>
    <a href="/parlay" class="snl"><span class="snl-icon">🎰</span><div class="snl-text">Parlay Builder</div></a>
    <a href="/notifications" class="snl active"><span class="snl-icon">🔔</span><div class="snl-text">Notifications</div></a>
    <a href="/analytics" class="snl"><span class="snl-icon">📊</span><div class="snl-text">Analytics</div></a>
    <a href="/settings" class="snl"><span class="snl-icon">⚙️</span><div class="snl-text">Customize Profile</div></a>
  </div>
  <div class="slide-nav-logout"><button class="snl-logout" onclick="logout()">Log Out</button></div>
</div>

<nav>
  <a href="/home" class="logo">LEDG<span>R</span></a>
  <div class="nav-links">
    <a href="/home" class="nav-link">Home</a>
    <a href="/leaderboard" class="nav-link">Leaderboard</a>
    <a href="/feed" class="nav-link">🔴 Live</a>
    <a href="/parlay" class="nav-link">🎰 Parlay</a>
    <a href="/notifications" class="nav-link active">🔔 Alerts</a>
    <a href="/analytics" class="nav-link">📊 Analytics</a>
    <a href="/settings" class="nav-link">⚙️ Profile</a>
    <div class="user-badge" id="userBadge" onclick="goToProfile()">...</div>
    <button class="logout-btn" onclick="logout()">Log Out</button>
    <button class="mobile-menu-btn" onclick="openSlideNav()">☰</button>
  </div>
</nav>

<div class="main">
  <div class="page-head">
    <div class="head-left">
      <div class="page-eyebrow">LEDGR ALERTS</div>
      <div class="page-title">🔔 NOTIFICATIONS</div>
    </div>
    <button class="clear-all-btn" onclick="clearAll()">CLEAR ALL</button>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('new_pick',this)">📌 New Picks</button>
    <button class="filter-btn" onclick="setFilter('streak',this)">🔥 Streaks</button>
    <button class="filter-btn" onclick="setFilter('division',this)">🏆 Divisions</button>
  </div>

  <div id="notifsList"></div>
</div>

<script>
let user=null;let currentFilter='all';
function logout(){['ledgr_token','ledgr_user','token','user','username'].forEach(k=>localStorage.removeItem(k));window.location.href='/';}
function goToProfile(){if(user)window.location.href='/tipster?u='+user.username;}
function openSlideNav(){document.getElementById('slideNav').classList.add('open');document.getElementById('slideOverlay').classList.add('open');document.body.style.overflow='hidden';}
function closeSlideNav(){document.getElementById('slideNav').classList.remove('open');document.getElementById('slideOverlay').classList.remove('open');document.body.style.overflow='';}
function getTimeAgo(d){const diff=Date.now()-d.getTime();const mins=Math.floor(diff/60000),hrs=Math.floor(diff/3600000),days=Math.floor(diff/86400000);if(mins<1)return'just now';if(mins<60)return mins+'m ago';if(hrs<24)return hrs+'h ago';return days+'d ago';}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderNotifs();}

window.onload=()=>{
  const ud=localStorage.getItem('ledgr_user')||localStorage.getItem('user');
  const tk=localStorage.getItem('ledgr_token')||localStorage.getItem('token');
  if(!ud||!tk){window.location.href='/';return;}
  try{user=JSON.parse(ud);}catch(e){user={id:null,username:ud};}
  if(!user||!user.username){window.location.href='/';return;}
  document.getElementById('userBadge').textContent='@'+user.username;
  markAllRead();
  renderNotifs();
};

function getNotifs(){return JSON.parse(localStorage.getItem('ledgr_notifications')||'[]');}
function saveNotifs(n){localStorage.setItem('ledgr_notifications',JSON.stringify(n));}
function markAllRead(){const n=getNotifs().map(x=>({...x,read:true}));saveNotifs(n);}
function clearAll(){saveNotifs([]);renderNotifs();}

function renderNotifs(){
  const list=document.getElementById('notifsList');
  let notifs=getNotifs();
  if(currentFilter!=='all')notifs=notifs.filter(n=>n.type===currentFilter);
  if(!notifs.length){
    list.innerHTML=`<div class="empty-state"><div class="empty-icon">🔔</div><div class="empty-title">ALL CLEAR</div><div class="empty-sub">No notifications yet.<br>Follow tipsters on the leaderboard<br>to get alerts when they post picks.</div><a href="/leaderboard" class="follow-cta">Browse Tipsters →</a></div>`;
    return;
  }
  // Group by day
  const groups={};notifs.forEach(n=>{
    const d=new Date(n.ts);const key=isToday(d)?'Today':isYesterday(d)?'Yesterday':d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    if(!groups[key])groups[key]=[];groups[key].push(n);
  });
  const TYPE_LABELS={new_pick:'NEW PICK',streak:'STREAK',division:'DIVISION'};
  list.innerHTML=Object.entries(groups).map(([day,items])=>`
    <div class="notif-day-label">${day}</div>
    ${items.map(n=>`<div class="notif-card ${n.read?'':'unread'}" onclick="handleClick('${n.type||''}','${n.ref||''}')">
      <span class="nf-icon">${n.icon||'🔔'}</span>
      <div class="nf-body">
        <div class="nf-text">${n.text}${n.type&&TYPE_LABELS[n.type]?`<span class="nf-type-badge ${n.type}">${TYPE_LABELS[n.type]}</span>`:''}</div>
        <div class="nf-time">${getTimeAgo(new Date(n.ts))}</div>
      </div>
      ${!n.read?'<div class="nf-unread-dot"></div>':''}
    </div>`).join('')}
  `).join('');
}

function handleClick(type,ref){
  if((type==='new_pick'||type==='streak')&&ref)window.location.href='/tipster?u='+ref;
  else if(type==='division')window.location.href='/leaderboard';
}

function isToday(d){const t=new Date();return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear();}
function isYesterday(d){const y=new Date(Date.now()-86400000);return d.getDate()===y.getDate()&&d.getMonth()===y.getMonth()&&d.getFullYear()===y.getFullYear();}
</script>
</body>
</html>
