<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGR — Notifications</title>
<meta name="description" content="Your LEDGR notifications — get alerted when tipsters you follow post new picks, hit streaks, or reach new divisions.">
<meta property="og:title" content="LEDGR — Notifications">
<meta property="og:description" content="Stay up to date — alerts when tipsters you follow post picks, hit streaks, or level up.">
<meta property="og:image" content="https://getledgr.bet/og-image.png">
<meta property="og:url" content="https://getledgr.bet/notifications">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="LEDGR — Notifications">
<meta name="twitter:description" content="Alerts when tipsters you follow post picks, hit streaks, or level up.">
<meta name="twitter:image" content="https://getledgr.bet/og-image.png">
<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>
.main{max-width:640px;margin:0 auto;padding:40px 24px;position:relative;z-index:2}
.page-head{margin-bottom:28px;display:flex;align-items:flex-end;justify-content:space-between}
.head-left{}
.page-eyebrow{font-family:var(--font-mono);font-size:9px;color:var(--mu);letter-spacing:4px;text-transform:uppercase;margin-bottom:6px}
.page-title{font-family:var(--font-display);font-size:42px;letter-spacing:3px;line-height:1}
.clear-all-btn{background:transparent;border:1px solid rgba(248,113,113,0.2);border-radius:8px;padding:7px 14px;color:var(--rd);font-family:var(--font-mono);font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s}.clear-all-btn:hover{background:rgba(248,113,113,0.06)}
.filter-row{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;font-family:var(--font-mono);font-size:9px;letter-spacing:1px;color:var(--mu2);cursor:pointer;transition:all .2s}.filter-btn:hover{color:var(--tx);border-color:var(--bd2)}.filter-btn.active{background:var(--acg);border-color:rgba(184,159,255,0.3);color:var(--ac)}
.notifs-list{display:flex;flex-direction:column;gap:3px}
.notif-day-label{font-family:var(--font-mono);font-size:9px;letter-spacing:2px;color:var(--mu);text-transform:uppercase;padding:12px 0 6px}
.notif-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:all .2s;position:relative}
.notif-card:hover{border-color:var(--bd2);background:rgba(255,255,255,0.025)}
.notif-card.read{opacity:.5;border-color:transparent}
.notif-card.read:hover{opacity:.75;border-color:var(--bd)}
.notif-card.unread{border-left:3px solid #2A2A2A}
.notif-card.unread-elite{border-left:3px solid #7B2CFF}
.notif-card.unread-system{border-left:3px solid #FFD700}
.elite-pill{display:inline-flex;align-items:center;gap:3px;background:rgba(123,44,255,0.12);border:1px solid rgba(123,44,255,0.35);color:#b89fff;font-family:var(--font-mono);font-size:8px;letter-spacing:1.5px;padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:middle;flex-shrink:0}
.nf-icon{font-size:22px;flex-shrink:0;margin-top:2px}
.nf-body{flex:1}
.nf-text{font-size:13px;color:var(--tx);line-height:1.5}.nf-text b{color:var(--ac)}
.nf-time{font-family:var(--font-mono);font-size:9px;color:var(--mu);margin-top:4px}
.nf-type-badge{font-family:var(--font-mono);font-size:8px;letter-spacing:1px;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:middle}
.nf-type-badge.new_pick{background:rgba(184,159,255,0.1);color:var(--ac)}
.nf-type-badge.streak{background:rgba(251,191,36,0.1);color:var(--gold)}
.nf-type-badge.division{background:rgba(56,189,248,0.1);color:var(--cyan)}
.nf-unread-dot{width:7px;height:7px;background:var(--ac);border-radius:50%;flex-shrink:0;margin-top:6px}
.empty-state{text-align:center;padding:64px 24px}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-family:var(--font-display);font-size:24px;letter-spacing:2px;color:var(--mu);margin-bottom:8px}
.empty-sub{font-family:var(--font-mono);font-size:11px;color:var(--mu);line-height:1.7}
.follow-cta{display:inline-block;margin-top:20px;background:rgba(184,159,255,0.1);border:1px solid rgba(184,159,255,0.2);border-radius:10px;padding:10px 20px;font-family:var(--font-mono);font-size:11px;color:var(--ac);text-decoration:none;letter-spacing:1px;transition:all .2s}.follow-cta:hover{background:rgba(184,159,255,0.18)}
/* PUSH PANEL */
.push-panel{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:22px 24px;margin-bottom:24px}
.push-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.push-title{font-family:var(--font-display);font-size:18px;letter-spacing:3px;color:var(--tx)}
.push-status{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;padding:4px 10px;border-radius:20px}
.push-status.granted{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.25);color:var(--gr)}
.push-status.denied{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.2);color:var(--rd)}
.push-status.default{background:rgba(255,255,255,0.05);border:1px solid var(--bd);color:var(--mu2)}
.push-status.unsupported{background:rgba(255,255,255,0.04);border:1px solid var(--bd);color:var(--mu)}
.push-desc{font-family:var(--font-mono);font-size:11px;color:var(--mu2);line-height:1.7;margin-bottom:16px}
.push-perks{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.push-perk{font-family:var(--font-mono);font-size:11px;color:var(--mu);display:flex;align-items:center;gap:8px}
.push-perk::before{content:'✓';color:var(--gr);flex-shrink:0}
.push-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.push-enable-btn{background:var(--ac);color:#07060d;border:none;border-radius:8px;padding:11px 24px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-body);transition:all .2s}
.push-enable-btn:hover:not(:disabled){background:#cdb8ff;transform:translateY(-1px)}
.push-enable-btn:disabled{opacity:.65;cursor:not-allowed}
.push-disable-btn{background:transparent;border:1px solid rgba(248,113,113,0.25);color:var(--rd);border-radius:8px;padding:10px 18px;font-size:12px;cursor:pointer;font-family:var(--font-mono);transition:all .2s}
.push-disable-btn:hover{background:rgba(248,113,113,0.06)}
.push-msg{font-family:var(--font-mono);font-size:11px;margin-top:10px;min-height:16px}
@media(max-width:700px){.page-head{flex-direction:column;gap:12px;align-items:flex-start}}
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="main">
  <div class="page-head">
    <div class="head-left">
      <div class="page-eyebrow">LEDGR ALERTS</div>
      <div class="page-title">🔔 NOTIFICATIONS</div>
    </div>
    <button class="clear-all-btn" onclick="clearAll()">CLEAR ALL</button>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('new_pick',this)">📌 New Picks</button>
    <button class="filter-btn" onclick="setFilter('streak',this)">🔥 Streaks</button>
    <button class="filter-btn" onclick="setFilter('division',this)">🏆 Divisions</button>
  </div>

  <!-- PUSH NOTIFICATIONS PANEL -->
  <div class="push-panel" id="pushPanel">
    <div class="push-header">
      <div class="push-title">🔔 PUSH NOTIFICATIONS</div>
      <span class="push-status default" id="pushStatus">CHECKING…</span>
    </div>
    <div class="push-desc">Get notified the moment a tipster you follow posts a pick — even when LEDGR isn't open.</div>
    <div class="push-perks">
      <div class="push-perk">Instant alerts when followed tipsters post picks</div>
      <div class="push-perk">Works on mobile and desktop</div>
      <div class="push-perk">Only from tipsters you follow — no spam</div>
    </div>
    <div class="push-actions" id="pushActions">
      <button class="push-enable-btn" id="pushEnableBtn">Enable Notifications</button>
    </div>
    <div class="push-msg" id="pushMsg"></div>
  </div>

  <div id="notifsList"></div>
</div>

<script src="/app-nav.js"></script>
<script src="/ledgr-ws.js"></script>
<script src="/push.js"></script>
<script>
AppNav.init({ active: 'notifications' });
const API='https://ledgr-backend-production-c132.up.railway.app';
let user=null;let currentFilter='all';
let eliteSet=new Set(); // usernames in ELITE or LEGENDARY division

async function loadRankingsForElite(){
  try{
    const r=await fetch(API+'/rankings',{cache:'no-store'});
    if(!r.ok)return;
    const d=await r.json();
    const list=Array.isArray(d)?d:(d&&d.tipsters?d.tipsters:[]);
    list.forEach(t=>{
      if(t.division==='ELITE'||t.division==='LEGENDARY')eliteSet.add(t.username);
    });
  }catch(e){}
}
function getTimeAgo(d){const diff=Date.now()-d.getTime();const mins=Math.floor(diff/60000),hrs=Math.floor(diff/3600000),days=Math.floor(diff/86400000);if(mins<1)return'just now';if(mins<60)return mins+'m ago';if(hrs<24)return hrs+'h ago';return days+'d ago';}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderNotifs();}

// ── Backend notification helpers ──────────────────────────────
function _beNotifToLocal(n){
  const p=n.payload||{};
  const username=p.username||p.tipster||p.tailedBy||'';
  const ts=new Date(n.createdAt).getTime();
  let icon='🔔',text='',ref='',type=n.type;
  if(n.type==='followed_posted'){
    icon='📌';text=`<b>@${username}</b> posted: ${p.event||''} @ ${parseFloat(p.odds||0).toFixed(2)}`;ref=username;type='new_pick';
  }else if(n.type==='pick_result'){
    if(p.result==='win'){icon='✅';text=`Your pick on <b>${p.event||'a game'}</b> won — +${parseFloat(p.pnl||0).toFixed(2)}u`;}
    else if(p.result==='loss'){icon='❌';text=`Your pick on <b>${p.event||'a game'}</b> lost`;}
    else{icon='🔄';text=`Your pick on <b>${p.event||'a game'}</b> was a push`;}
    type='pick_result';
  }else if(n.type==='pick_tailed'){
    icon='✈️';text=`<b>@${username||'Someone'}</b> tailed your pick`;type='pick_tailed';
  }else if(n.type==='streak_milestone'){
    icon='🔥';text=`<b>@${username}</b> is on a <b>${p.streak}-win streak</b>`;ref=username;type='streak';
  }else if(n.type==='division_up'){
    icon='🏆';text=`<b>@${username}</b> reached <b>${p.toDivision}</b>`;ref=username;type='division';
  }else{
    text=`New activity from <b>@${username}</b>`;ref=username;
  }
  return{id:'_be_'+n.id,_backendId:n.id,type,icon,text,ref,ts,read:!!n.readAt};
}

async function loadNotificationsFromAPI(){
  if(!user||!user.id)return;
  const tk=localStorage.getItem('ledgr_token')||localStorage.getItem('token')||'';
  try{
    const r=await fetch(API+'/notifications?userId='+user.id,{headers:tk?{Authorization:'Bearer '+tk}:{}});
    if(!r.ok)return;
    const data=await r.json();
    const backendNotifs=(Array.isArray(data)?data:data.notifications||[]).map(_beNotifToLocal);
    if(!backendNotifs.length)return;
    // Merge: prepend backend notifs that aren't already in localStorage
    const existing=getNotifs();
    const existingBeIds=new Set(existing.filter(n=>n._backendId).map(n=>n._backendId));
    const newOnes=backendNotifs.filter(n=>!existingBeIds.has(n._backendId));
    if(newOnes.length){
      saveNotifs([...newOnes,...existing].slice(0,100));
      renderNotifs();
    }
  }catch(e){}
}

async function markAllReadOnBackend(){
  if(!user||!user.id)return;
  const tk=localStorage.getItem('ledgr_token')||localStorage.getItem('token')||'';
  try{
    await fetch(API+'/notifications/read-all',{
      method:'PATCH',headers:{'Content-Type':'application/json',...(tk?{Authorization:'Bearer '+tk}:{})},
      body:JSON.stringify({userId:user.id}),
    });
  }catch(e){}
}

function subscribeWS(){
  if(!window.LedgrWS)return;
  // Live personal notifications → prepend to list
  var PERSONAL=['pick_result','pick_tailed','followed_posted'];
  PERSONAL.forEach(function(type){
    window.LedgrWS.on(type,function(ev){
      // Convert to local shape and prepend
      var fake={id:Date.now(),type:ev.type,payload:ev.payload||{},createdAt:new Date().toISOString(),readAt:new Date().toISOString()};
      var notif=_beNotifToLocal(fake);
      notif.id=Date.now()+'_ws_'+Math.random().toString(36).slice(2,6);
      notif.read=true; // page is open, user sees it
      var existing=getNotifs();
      saveNotifs([notif,...existing].slice(0,100));
      renderNotifs();
    });
  });
}

window.onload=()=>{
  const ud=localStorage.getItem('ledgr_user')||localStorage.getItem('user');
  const tk=localStorage.getItem('ledgr_token')||localStorage.getItem('token');
  if(!ud||!tk){window.location.href='/login';return;}
  try{user=JSON.parse(ud);}catch(e){user={id:null,username:ud};}
  if(!user||!user.username){window.location.href='/';return;}
  markAllRead();
  markAllReadOnBackend();
  renderNotifs();
  loadNotificationsFromAPI();
  loadRankingsForElite();
  subscribeWS();
  if(window.Push)window.Push.init().then(()=>initPushUI());
};

function initPushUI(){
  const statusEl=document.getElementById('pushStatus');
  const actionsEl=document.getElementById('pushActions');
  const msgEl=document.getElementById('pushMsg');
  const enableBtn=document.getElementById('pushEnableBtn');

  if(!window.Push||!window.Push.supported()){
    statusEl.textContent='NOT SUPPORTED';statusEl.className='push-status unsupported';
    actionsEl.innerHTML='<span style="font-family:\'DM Mono\',monospace;font-size:11px;color:var(--mu)">Your browser doesn\'t support push notifications.</span>';
    return;
  }

  const perm=window.Push.status();

  if(perm==='granted'&&window.Push.isSubscribed()){
    statusEl.textContent='✓ ENABLED';statusEl.className='push-status granted';
    actionsEl.innerHTML='<button class="push-disable-btn" id="pushDisableBtn">Disable Notifications</button>';
    document.getElementById('pushDisableBtn').onclick=async function(){
      this.disabled=true;this.textContent='Disabling…';
      await window.Push.unsubscribe();
      initPushUI();
    };
    return;
  }

  if(perm==='denied'){
    statusEl.textContent='BLOCKED';statusEl.className='push-status denied';
    actionsEl.innerHTML='';
    msgEl.style.color='var(--rd)';
    msgEl.textContent='Notifications are blocked. Enable them in your browser site settings, then reload.';
    return;
  }

  // Default — not yet asked
  statusEl.textContent='NOT ENABLED';statusEl.className='push-status default';
  actionsEl.innerHTML='<button class="push-enable-btn" id="pushEnableBtn">Enable Notifications</button>';
  document.getElementById('pushEnableBtn').onclick=async function(){
    this.disabled=true;this.textContent='Enabling…';
    msgEl.textContent='';
    const result=await window.Push.subscribe();
    if(result.success){
      msgEl.style.color='var(--gr)';
      msgEl.textContent='✓ Notifications enabled! You\'ll be notified when followed tipsters post picks.';
      setTimeout(initPushUI,800);
    }else{
      this.disabled=false;this.textContent='Enable Notifications';
      msgEl.style.color='var(--rd)';
      msgEl.textContent=result.error||'Could not enable — try again.';
      setTimeout(initPushUI,200);
    }
  };
}

function getNotifs(){return JSON.parse(localStorage.getItem('ledgr_notifications')||'[]');}
function saveNotifs(n){localStorage.setItem('ledgr_notifications',JSON.stringify(n));}
function markAllRead(){const n=getNotifs().map(x=>({...x,read:true}));saveNotifs(n);}
function clearAll(){saveNotifs([]);renderNotifs();}

function renderNotifs(){
  const list=document.getElementById('notifsList');
  let notifs=getNotifs();
  if(currentFilter!=='all')notifs=notifs.filter(n=>n.type===currentFilter);
  if(!notifs.length){
    list.innerHTML=`<div class="empty-state"><div class="empty-icon">🔔</div><div class="empty-title">ALL CLEAR</div><div class="empty-sub">No notifications yet.<br>Follow tipsters on the leaderboard<br>to get alerts when they post picks.</div><a href="/leaderboard" class="follow-cta">Browse Tipsters →</a></div>`;
    return;
  }
  // Group by day
  const groups={};notifs.forEach(n=>{
    const d=new Date(n.ts);const key=isToday(d)?'Today':isYesterday(d)?'Yesterday':d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    if(!groups[key])groups[key]=[];groups[key].push(n);
  });
  const TYPE_LABELS={new_pick:'NEW PICK',streak:'STREAK',division:'DIVISION'};
  const SYSTEM_TYPES=new Set(['pick_result','pick_tailed']);
  list.innerHTML=Object.entries(groups).map(([day,items])=>`
    <div class="notif-day-label">${day}</div>
    ${items.map(n=>{
      const isSystem=SYSTEM_TYPES.has(n.type)||!n.ref;
      const isElite=!n.read&&!isSystem&&eliteSet.has(n.ref);
      const cardCls=n.read?'read':isSystem?'unread-system':isElite?'unread-elite':'unread';
      const eliteTag=isElite?`<span class="elite-pill">⚡ ELITE</span>`:'';
      return`<div class="notif-card ${cardCls}" onclick="handleClick('${n.type||''}','${n.ref||''}')">
        <span class="nf-icon">${n.icon||'🔔'}</span>
        <div class="nf-body">
          <div class="nf-text">${eliteTag}${n.text}${n.type&&TYPE_LABELS[n.type]?`<span class="nf-type-badge ${n.type}">${TYPE_LABELS[n.type]}</span>`:''}</div>
          <div class="nf-time">${getTimeAgo(new Date(n.ts))}</div>
        </div>
        ${!n.read?'<div class="nf-unread-dot"></div>':''}
      </div>`;
    }).join('')}
  `).join('');
}

function handleClick(type,ref){
  if((type==='new_pick'||type==='streak')&&ref)window.location.href='/tipster?u='+ref;
  else if(type==='division')window.location.href='/leaderboard';
}

function isToday(d){const t=new Date();return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear();}
function isYesterday(d){const y=new Date(Date.now()-86400000);return d.getDate()===y.getDate()&&d.getMonth()===y.getMonth()&&d.getFullYear()===y.getFullYear();}
</script>
</body>
</html>
