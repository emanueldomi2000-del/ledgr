<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/logo/ledgr-icon.png">
<title>LEDGR — Log In</title>
<meta name="description" content="Log in to LEDGR — your verified sports tipster platform. Track picks, compete on the leaderboard, build your record.">
<meta property="og:title" content="Log In to LEDGR">
<meta property="og:description" content="Log in and access your verified tipster dashboard — picks, rankings, and real performance data.">
<meta property="og:image" content="https://getledgr.bet/assets/logo/ledgr-logo.png">
<meta property="og:url" content="https://getledgr.bet/login">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Log In to LEDGR">
<meta name="twitter:description" content="Log in and access your verified tipster dashboard.">
<meta name="twitter:image" content="https://getledgr.bet/assets/logo/ledgr-logo.png">
<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.4}
/* ledger rule lines behind the card — replaces the generic orb glow */
.ledger-lines{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(to bottom,rgba(184,159,255,0.05) 0,rgba(184,159,255,0.05) 1px,transparent 1px,transparent 34px);mask-image:radial-gradient(ellipse 600px 500px at 50% 40%,#000 40%,transparent 80%)}

.box{background:var(--s1);border:1px solid var(--bd);border-radius:0 0 14px 14px;padding:36px 40px 40px;width:100%;max-width:400px;position:relative;z-index:1;box-shadow:0 24px 60px rgba(0,0,0,0.4);opacity:0;transform:translateY(10px);animation:ticketIn .5s cubic-bezier(.2,.8,.2,1) .1s forwards}
@keyframes ticketIn{to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.box{animation:none;opacity:1;transform:none}}
/* perforated tear-off edge */
.box::before{content:'';position:absolute;top:-1px;left:0;right:0;height:14px;background-image:radial-gradient(circle 5px at 14px 0,transparent 5px,var(--bg) 5.5px);background-size:28px 14px;background-repeat:repeat-x;background-position:center top}
.box::after{content:'';position:absolute;top:12px;left:0;right:0;border-top:1px dashed var(--bd2)}

.ticket-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-top:6px}
.logo{display:block;text-decoration:none;line-height:0}
.ticket-time{font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;color:var(--mu);text-align:right}
.ticket-time b{color:var(--gold);font-weight:600}

.tabs{display:flex;gap:6px;background:var(--s2);border-radius:10px;padding:4px;margin-bottom:24px}
.tab{flex:1;padding:9px;border-radius:7px;border:none;background:transparent;color:var(--mu2);font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.tab.active{background:var(--ac);color:#07060d;font-weight:700}
.form-label{display:block;font-family:var(--font-mono);font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;margin-top:14px}
.form-input{width:100%;background:var(--s2);border:1px solid var(--bd);border-bottom:2px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px;padding:12px 14px;outline:none;font-family:var(--font-body);transition:border-color .2s}
.form-input:focus{border-color:var(--bd2);border-bottom-color:var(--ac-vivid);box-shadow:0 0 0 3px rgba(123,44,255,0.15)}
.form-input::placeholder{color:var(--mu)}
.submit-btn{width:100%;background:var(--ac);color:#07060d;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-body);transition:all .15s;margin-top:20px;position:relative;overflow:hidden}
.submit-btn:hover:not(:disabled){background:#cdb8ff}
.submit-btn:active:not(:disabled){transform:scale(.98)}
.submit-btn:disabled{opacity:.7;cursor:not-allowed}
.submit-btn:focus-visible,.tab:focus-visible,.form-input:focus-visible,.back:focus-visible{outline:2px solid var(--ac-vivid);outline-offset:2px}
.msg{margin-top:12px;text-align:center;font-size:12px;font-family:var(--font-mono);min-height:18px;line-height:1.5}
.foot-rule{border-top:1px dashed var(--bd);margin-top:22px;padding-top:14px;text-align:center}
.foot-stamp{font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase}
.foot-stamp b{color:var(--gr)}
.back{display:block;text-align:center;margin-top:10px;font-size:11px;color:var(--mu);font-family:var(--font-mono);text-decoration:none}
.back:hover{color:var(--ac)}
.wake-bar{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.15);border-radius:8px;padding:10px 14px;margin-bottom:16px;display:none}
.wake-bar-text{font-size:11px;color:var(--gold);font-family:var(--font-mono);text-align:center}
.wake-progress{height:2px;background:rgba(251,191,36,0.15);border-radius:1px;margin-top:6px;overflow:hidden}
.wake-fill{height:100%;background:var(--gold);border-radius:1px;width:0%;transition:width .3s}
</style>
</head>
<body>
<div class="ledger-lines"></div>
<div class="box">
  <div class="ticket-header">
    <a href="/" class="logo"><img src="/assets/logo/ledgr-logo.png" alt="LEDGR" style="height:44px;width:auto;display:inline-block;"></a>
    <div class="ticket-time" id="ticketTime">TIMESTAMPED<br><b id="ticketClock">--:--:--</b></div>
  </div>

  <!-- Wake up bar — shows when backend is cold starting -->
  <div class="wake-bar" id="wakeBar">
    <div class="wake-bar-text">Waking up server — this takes ~10 seconds on first load</div>
    <div class="wake-progress"><div class="wake-fill" id="wakeFill"></div></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">Log In</button>
    <button class="tab" id="tabRegister" onclick="switchTab('register')">Sign Up</button>
  </div>

  <!-- LOGIN -->
  <div id="loginForm">
    <label class="form-label">Email</label>
    <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com">
    <label class="form-label">Password</label>
    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••">
    <button class="submit-btn" id="loginBtn" onclick="handleLogin()">Log In →</button>
  </div>

  <!-- REGISTER -->
  <div id="registerForm" style="display:none">
    <label class="form-label">Email</label>
    <input type="email" id="regEmail" class="form-input" placeholder="your@email.com">
    <label class="form-label">Username</label>
    <input type="text" id="regUsername" class="form-input" placeholder="e.g. sharpbettor99">
    <label class="form-label">Password</label>
    <input type="password" id="regPassword" class="form-input" placeholder="Min 6 characters">
    <button class="submit-btn" id="registerBtn" onclick="handleRegister()">Create Account →</button>
  </div>

  <div class="msg" id="authMsg"></div>
  <div class="foot-rule">
    <div class="foot-stamp"><b>✓</b> IMMUTABLE ON ENTRY · NO EDITS · NO DELETIONS</div>
    <a href="/" class="back">← Back to homepage</a>
  </div>
</div>

<script src="/verify.js"></script>
<script>
const API='https://ledgr-backend-7hmh.onrender.com';
const TIMEOUT=25000; // 25 second timeout for cold start

// Redirect if already logged in
(function(){
  const u=localStorage.getItem('ledgr_user')||localStorage.getItem('user');
  const t=localStorage.getItem('ledgr_token')||localStorage.getItem('token');
  if(u&&t){
    try{
      const parsed=JSON.parse(u);
      if(parsed&&parsed.id)window.location.href='/home';
    }catch(e){
      localStorage.removeItem('ledgr_user');
      localStorage.removeItem('ledgr_token');
    }
  }
})();

// Live timestamp — ties the entry moment to a real clock, not a fabricated count
function tickClock(){
  const el=document.getElementById('ticketClock');
  if(!el)return;
  const now=new Date();
  const hh=String(now.getUTCHours()).padStart(2,'0');
  const mm=String(now.getUTCMinutes()).padStart(2,'0');
  const ss=String(now.getUTCSeconds()).padStart(2,'0');
  el.textContent=`${hh}:${mm}:${ss} UTC`;
}
tickClock();
setInterval(tickClock,1000);

function switchTab(t){
  document.getElementById('loginForm').style.display=t==='login'?'block':'none';
  document.getElementById('registerForm').style.display=t==='register'?'block':'none';
  document.getElementById('tabLogin').classList.toggle('active',t==='login');
  document.getElementById('tabRegister').classList.toggle('active',t==='register');
  document.getElementById('authMsg').textContent='';
}

function setMsg(msg,color){
  const el=document.getElementById('authMsg');
  el.textContent=msg;
  el.style.color=color||'var(--mu)';
}

function showWakeBar(){
  const bar=document.getElementById('wakeBar');
  const fill=document.getElementById('wakeFill');
  bar.style.display='block';
  let pct=0;
  const iv=setInterval(()=>{
    pct=Math.min(pct+2,95);
    fill.style.width=pct+'%';
    if(pct>=95)clearInterval(iv);
  },300);
  return iv;
}

function hideWakeBar(){
  document.getElementById('wakeBar').style.display='none';
  document.getElementById('wakeFill').style.width='100%';
}

// Fetch with timeout
async function fetchWithTimeout(url,options,timeout=TIMEOUT){
  const controller=new AbortController();
  const id=setTimeout(()=>controller.abort(),timeout);
  try{
    const r=await fetch(url,{...options,signal:controller.signal});
    clearTimeout(id);
    return r;
  }catch(e){
    clearTimeout(id);
    throw e;
  }
}

async function handleLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  if(!email||!password){setMsg('Please fill in all fields','var(--rd)');return;}
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='Logging in...';
  setMsg('','var(--mu)');
  const wakeIv=showWakeBar();
  try{
    const r=await fetchWithTimeout(API+'/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    hideWakeBar();clearInterval(wakeIv);
    const d=await r.json();
    if(d.token&&d.user&&d.user.id){
      // Save both formats for compatibility
      localStorage.setItem('ledgr_token',d.token);
      localStorage.setItem('ledgr_user',JSON.stringify(d.user));
      localStorage.setItem('token',d.token);
      localStorage.setItem('user',JSON.stringify(d.user));
      setMsg('Welcome back! Redirecting...','var(--gr)');
      setTimeout(()=>window.location.href='/home',600);
    }else if(d.error==='verify_email'&&d.email){
      btn.disabled=false;btn.textContent='Log In →';
      fetch(API+'/auth/resend-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:d.email})}).catch(()=>{});
      window.VerifyEmail.show({
        email:d.email,
        box:document.querySelector('.box'),
        onSuccess(data){
          localStorage.setItem('ledgr_token',data.token);
          localStorage.setItem('ledgr_user',JSON.stringify(data.user));
          localStorage.setItem('token',data.token);
          localStorage.setItem('user',JSON.stringify(data.user));
          window.location.href='/home';
        }
      });
    }else{
      setMsg(d.error||'Invalid email or password','var(--rd)');
      btn.disabled=false;btn.textContent='Log In →';
    }
  }catch(e){
    hideWakeBar();clearInterval(wakeIv);
    if(e.name==='AbortError'){
      setMsg('Server timeout — try again in a moment','var(--rd)');
    }else{
      setMsg('Connection error — check your internet','var(--rd)');
    }
    btn.disabled=false;btn.textContent='Log In →';
  }
}

async function handleRegister(){
  const email=document.getElementById('regEmail').value.trim();
  const username=document.getElementById('regUsername').value.trim();
  const password=document.getElementById('regPassword').value;
  if(!email||!username||!password){setMsg('Please fill in all fields','var(--rd)');return;}
  if(password.length<6){setMsg('Password min 6 characters','var(--rd)');return;}
  if(username.length<3){setMsg('Username min 3 characters','var(--rd)');return;}
  if(!/^[a-zA-Z0-9_]+$/.test(username)){setMsg('Username: letters, numbers and _ only','var(--rd)');return;}
  const btn=document.getElementById('registerBtn');
  btn.disabled=true;btn.textContent='Creating account...';
  setMsg('','var(--mu)');
  const wakeIv=showWakeBar();
  try{
    const r=await fetchWithTimeout(API+'/auth/register',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,username,password})
    });
    hideWakeBar();clearInterval(wakeIv);
    const d=await r.json();
    if(d.message){
      btn.disabled=false;btn.textContent='Create Account →';
      window.VerifyEmail.show({
        email,
        box:document.querySelector('.box'),
        onSuccess(data){
          localStorage.setItem('ledgr_token',data.token);
          localStorage.setItem('ledgr_user',JSON.stringify(data.user));
          localStorage.setItem('token',data.token);
          localStorage.setItem('user',JSON.stringify(data.user));
          window.location.href='/home';
        }
      });
    }else{
      setMsg(d.error||'Could not create account — try again','var(--rd)');
      btn.disabled=false;btn.textContent='Create Account →';
    }
  }catch(e){
    hideWakeBar();clearInterval(wakeIv);
    if(e.name==='AbortError'){
      setMsg('Server timeout — try again in a moment','var(--rd)');
    }else{
      setMsg('Connection error — check your internet','var(--rd)');
    }
    btn.disabled=false;btn.textContent='Create Account →';
  }
}

// Enter key
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const loginVisible=document.getElementById('loginForm').style.display!=='none';
  if(loginVisible)handleLogin();else handleRegister();
});
</script>
</body>
</html>
