<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/logo/ledgr-icon.png">
<title>LEDGR — Avatar Creator</title>
<meta name="description" content="Build your competitive identity. Your character evolves as you climb.">
<meta property="og:title" content="LEDGR — Avatar Creator">
<meta property="og:image" content="https://getledgr.bet/assets/logo/ledgr-logo.png">
<meta property="og:url" content="https://getledgr.bet/avatar-creator">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>
html{scroll-behavior:smooth}
body{background:#0A0A0A;color:#E6E6E6;font-family:'Syne',sans-serif;margin:0;padding:0;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#7B2CFF05 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}

.ac-wrap{max-width:1180px;margin:0 auto;padding:24px 20px 100px;position:relative;z-index:1}

/* ── HERO ── */
.ac-hero{text-align:center;padding:28px 20px 36px}
.ac-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.3em;color:#7B2CFF;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.ac-eyebrow::before,.ac-eyebrow::after{content:'';flex:0 0 44px;height:1px;background:linear-gradient(90deg,transparent,#7B2CFF55)}
.ac-eyebrow::after{background:linear-gradient(90deg,#7B2CFF55,transparent)}
.ac-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(50px,8vw,88px);line-height:.88;letter-spacing:.04em;margin:0 0 14px}
.ac-title span{color:#7B2CFF}
.ac-sub{font-size:13px;color:#6B6B6B;max-width:380px;margin:0 auto;line-height:1.65}

/* ── LAYOUT ── */
.ac-body{display:grid;grid-template-columns:40% 1fr;gap:24px;align-items:start}
@media(max-width:820px){.ac-body{grid-template-columns:1fr}}

/* ══════════════════════════════════════════════════════════════
   LEFT — STAGE
══════════════════════════════════════════════════════════════ */
.avatar-stage{
  position:sticky;top:76px;height:520px;border-radius:20px;
  border:1px solid rgba(255,255,255,.06);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:22px;cursor:none;user-select:none;
}
/* stage layers */
.s-bg{position:absolute;inset:0;transition:background .55s cubic-bezier(.4,0,.2,1);z-index:0}
.s-grid{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .4s}
.s-particles{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.s-glow{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);width:220px;height:220px;border-radius:50%;filter:blur(60px);opacity:.35;transition:background .5s,opacity .3s;z-index:2}
.s-char-wrap{position:relative;z-index:3;display:flex;align-items:flex-end;justify-content:center;width:100%;flex:1;min-height:0}
.s-char{position:relative;display:inline-block;transform-style:preserve-3d;transition:filter .4s}
.s-floor{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:130px;height:18px;border-radius:50%;z-index:3;filter:blur(10px);opacity:.5;transition:background .4s}
.s-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.06em;position:relative;z-index:4;margin-top:6px}
.s-title{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.22em;color:#6B6B6B;position:relative;z-index:4;margin-top:3px}
.s-controls{position:absolute;top:12px;right:12px;z-index:10;display:flex;gap:6px}
.s-btn{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#6B6B6B;padding:5px 10px;border-radius:8px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;cursor:pointer;transition:all .15s;backdrop-filter:blur(8px)}
.s-btn:hover{border-color:rgba(255,255,255,.25);color:#E6E6E6}
.s-class-badge{position:absolute;top:12px;left:12px;z-index:10;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;padding:4px 10px;border-radius:20px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px)}

/* stage overlay — neon grid */
.avatar-stage.stage-neon-grid .s-grid{opacity:1;background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(123,44,255,.05) 39px,rgba(123,44,255,.05) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(123,44,255,.05) 39px,rgba(123,44,255,.05) 40px)}
/* cyber city */
.avatar-stage.stage-cyber-city .s-grid{opacity:1;background-image:repeating-linear-gradient(180deg,transparent,transparent 59px,rgba(79,195,247,.04) 59px,rgba(79,195,247,.04) 60px),repeating-linear-gradient(90deg,transparent,transparent 19px,rgba(79,195,247,.03) 19px,rgba(79,195,247,.03) 20px)}

/* ── DNA SCAN OVERLAY ── */
.dna-overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;border-radius:inherit;backdrop-filter:blur(4px)}
.dna-overlay.active{display:flex}
.dna-scan-text{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.2em;color:#7B2CFF;text-transform:uppercase;min-height:18px;text-align:center}
.dna-scan-bar{width:200px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;margin:14px 0;overflow:hidden;position:relative}
.dna-scan-fill{height:100%;background:#7B2CFF;width:0;transition:width .1s linear;border-radius:2px;box-shadow:0 0 8px #7B2CFF}
.dna-result{text-align:center;display:none}
.dna-result-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.3em;color:#6B6B6B;margin-bottom:8px}
.dna-result-class{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:.06em;line-height:1}
.dna-result-desc{font-size:12px;color:#6B6B6B;margin-top:6px;max-width:200px}
.dna-close{margin-top:20px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;color:#6B6B6B;cursor:pointer;border:1px solid rgba(255,255,255,.1);padding:6px 16px;border-radius:8px;transition:all .15s;background:transparent}
.dna-close:hover{border-color:rgba(255,255,255,.25);color:#E6E6E6}

/* ══════════════════════════════════════════════════════════════
   RIGHT — PANEL
══════════════════════════════════════════════════════════════ */
.ac-panel{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:18px}

/* DNA SCAN BUTTON */
.dna-scan-btn{width:100%;padding:14px;margin-bottom:18px;background:linear-gradient(135deg,rgba(123,44,255,.15),rgba(123,44,255,.06));border:1px solid rgba(123,44,255,.3);border-radius:12px;color:#b89fff;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.14em;cursor:pointer;transition:all .22s;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.dna-scan-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(123,44,255,.12),transparent);transform:translateX(-100%);transition:transform .4s}
.dna-scan-btn:hover{border-color:rgba(123,44,255,.6);color:#fff;box-shadow:0 0 24px rgba(123,44,255,.25)}
.dna-scan-btn:hover::before{transform:translateX(100%)}
.dna-scan-btn span{font-size:16px}

/* TABS */
.ac-tabs{display:flex;gap:3px;margin-bottom:18px;background:rgba(255,255,255,.03);border-radius:10px;padding:3px}
.ac-tab{flex:1;padding:8px 4px;border:none;background:transparent;color:#6B6B6B;font-family:'Syne',sans-serif;font-size:11px;border-radius:8px;cursor:pointer;transition:all .14s;letter-spacing:.01em}
.ac-tab.active{background:rgba(123,44,255,.18);color:#b89fff;border:1px solid rgba(123,44,255,.28)}

.ac-tab-pane{display:none}
.ac-tab-pane.active{display:block}

/* SECTION LABELS */
.ac-sl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.25em;color:#6B6B6B;text-transform:uppercase;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.ac-sl::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05)}
.ac-sl:first-child{margin-top:0}

/* CLASS CARDS — 2×4 grid */
.class-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.class-grid{grid-template-columns:repeat(2,1fr)}}
.class-card{position:relative;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;cursor:pointer;overflow:hidden;transition:all .2s;text-align:center;padding:10px 6px 10px}
.class-card:hover:not(.locked){transform:translateY(-2px)}
.class-card.selected{box-shadow:0 0 0 2px var(--cc,#7B2CFF),0 0 20px rgba(var(--ccr,123,44,255),.3)}
.class-card.locked{opacity:.38;cursor:not-allowed;filter:grayscale(.6)}
.class-mini{height:70px;position:relative;margin-bottom:8px;display:flex;align-items:flex-end;justify-content:center}
.class-rarity{position:absolute;top:6px;right:6px;font-size:7px;font-family:'DM Mono',monospace;padding:1px 5px;border-radius:8px;letter-spacing:.06em}
.class-lock{position:absolute;top:6px;left:6px;font-size:9px}
.class-name{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.08em;color:#E6E6E6;margin-bottom:2px;line-height:1.2}
.class-card.locked .class-name{color:#444}
.class-req{font-size:7px;color:#444;font-family:'DM Mono',monospace;margin-top:1px}

/* OPTION GRID */
.ac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:7px;margin-bottom:6px}
.ac-opt{position:relative;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;cursor:pointer;overflow:hidden;transition:all .14s;text-align:center;padding:10px 5px 8px}
.ac-opt:hover:not(.locked){border-color:rgba(123,44,255,.35);background:rgba(123,44,255,.07)}
.ac-opt.selected{border-color:#7B2CFF;background:rgba(123,44,255,.15);box-shadow:0 0 12px rgba(123,44,255,.22)}
.ac-opt.locked{opacity:.38;cursor:not-allowed;filter:grayscale(.5)}
.ac-opt-preview{height:52px;display:flex;align-items:center;justify-content:center;margin-bottom:5px}
.ac-opt-label{font-family:'DM Mono',monospace;font-size:8px;color:#6B6B6B;letter-spacing:.04em;line-height:1.25}
.ac-opt.selected .ac-opt-label{color:#b89fff}
.ac-opt-lock{position:absolute;top:3px;right:3px;font-size:9px}
.ac-opt-tier{position:absolute;top:3px;left:3px;font-size:7px;font-family:'DM Mono',monospace;padding:1px 4px;border-radius:6px;letter-spacing:.04em}
.t-COMMON{background:rgba(107,107,107,.18);color:#555;border:1px solid rgba(107,107,107,.18)}
.t-RARE{background:rgba(79,195,247,.1);color:#4FC3F7;border:1px solid rgba(79,195,247,.2)}
.t-EPIC{background:rgba(123,44,255,.1);color:#b89fff;border:1px solid rgba(123,44,255,.2)}
.t-LEGENDARY{background:rgba(255,215,0,.1);color:#FFD700;border:1px solid rgba(255,215,0,.2)}
.t-MYTHIC{background:rgba(255,107,255,.08);color:#FF6BFF;border:1px solid rgba(255,107,255,.18)}

/* SAVE BAR */
.ac-save-bar{display:flex;gap:9px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06)}
.ac-save-btn{flex:1;padding:13px;background:var(--ac,#7B2CFF);color:#0A0A0A;border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.1em;cursor:pointer;transition:all .2s}
.ac-save-btn:hover{filter:brightness(1.2);box-shadow:0 0 22px rgba(123,44,255,.4)}
.ac-reset-btn{padding:13px 18px;background:transparent;color:#6B6B6B;border:1px solid rgba(255,255,255,.08);border-radius:10px;font-family:'Syne',sans-serif;font-size:12px;cursor:pointer;transition:all .14s}
.ac-reset-btn:hover{border-color:rgba(255,255,255,.18);color:#E6E6E6}

/* TOAST */
#acToast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(16px);background:#181818;border:1px solid rgba(123,44,255,.3);color:#E6E6E6;font-family:'DM Mono',monospace;font-size:12px;padding:9px 20px;border-radius:10px;opacity:0;transition:all .22s;pointer-events:none;z-index:9999;white-space:nowrap}
#acToast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════════════════════════════════════
   KEYFRAMES
══════════════════════════════════════════════════════════════ */
@keyframes charIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes charBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
@keyframes auraPulse{0%,100%{opacity:.3}50%{opacity:.55}}
@keyframes floatBg{0%,100%{transform:translateY(0) translateX(0);opacity:.4}33%{transform:translateY(-18px) translateX(8px);opacity:.6}66%{transform:translateY(8px) translateX(-6px);opacity:.35}}
@keyframes stageIn{0%{opacity:0;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
@keyframes dnaFlash{0%{opacity:0}30%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes assembleIn{0%{opacity:0;transform:translateY(20px) scale(.9)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cameraShake{0%,100%{transform:translate(0)}15%{transform:translate(-4px,2px)}30%{transform:translate(4px,-2px)}45%{transform:translate(-3px,1px)}60%{transform:translate(3px,-1px)}75%{transform:translate(-1px,0)}}
@keyframes neonFlicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.4}94%{opacity:1}97%{opacity:.7}98%{opacity:1}}
@keyframes frostForm{0%,100%{box-shadow:0 0 8px rgba(147,210,255,.4)}50%{box-shadow:0 0 20px rgba(147,210,255,.7),inset 0 0 8px rgba(147,210,255,.2)}}
@keyframes firePulse{0%,100%{box-shadow:0 0 12px rgba(255,100,0,.5)}50%{box-shadow:0 0 28px rgba(255,100,0,.8),0 0 60px rgba(255,60,0,.3)}}
@keyframes ascendFloat{0%,100%{filter:drop-shadow(0 0 12px rgba(255,255,200,.5))}50%{filter:drop-shadow(0 0 28px rgba(255,255,200,.85))}}
@keyframes voidPulse{0%,100%{box-shadow:0 0 10px rgba(123,44,255,.4)}50%{box-shadow:0 0 24px rgba(123,44,255,.75),0 0 48px rgba(80,0,200,.2)}}
@keyframes particleSpin{from{transform:rotate(0deg) translateX(28px)}to{transform:rotate(360deg) translateX(28px)}}
@keyframes bladePulse{0%,100%{opacity:.8}50%{opacity:1;box-shadow:0 0 18px var(--ac,#7B2CFF)}}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes visorScan{0%,100%{opacity:.9}50%{opacity:.3}}
@keyframes particleDrift{0%,100%{transform:translate(0,0);opacity:.5}50%{transform:translate(5px,-16px);opacity:.15}}
</style>
</head>
<body>
<div id="app" style="display:none">

<script src="/app-nav.js"></script>
<script>AppNav.init({active:'avatar'});</script>

<div class="ac-wrap">

  <div class="ac-hero">
    <div class="ac-eyebrow">⬡ LEDGR IDENTITY SYSTEM</div>
    <h1 class="ac-title">AVATAR <span>CREATOR</span></h1>
    <p class="ac-sub">Build your competitive identity. Your character evolves as you climb.</p>
  </div>

  <div class="ac-body">

    <!-- ═══ LEFT: STAGE ═══ -->
    <div class="avatar-stage" id="avatarStage">
      <div class="s-bg" id="stageBg"></div>
      <div class="s-grid"></div>
      <div class="s-particles" id="stageParticles"></div>
      <div class="s-glow" id="stageGlow"></div>

      <!-- DNA scan overlay -->
      <div class="dna-overlay" id="dnaOverlay">
        <div class="dna-scan-text" id="dnaScanText">INITIALIZING...</div>
        <div class="dna-scan-bar"><div class="dna-scan-fill" id="dnaScanFill"></div></div>
        <div class="dna-result" id="dnaResult">
          <div class="dna-result-label">IDENTITY DETECTED</div>
          <div class="dna-result-class" id="dnaResultClass"></div>
          <div class="dna-result-desc" id="dnaResultDesc"></div>
          <button class="dna-close" onclick="closeDnaScan()">APPLY → CONTINUE</button>
        </div>
      </div>

      <div class="s-class-badge" id="classBadge">—</div>
      <div class="s-controls">
        <button class="s-btn" onclick="cycleStage()">⬡ STAGE</button>
        <button class="s-btn" id="animToggleBtn" onclick="toggleAnimation()">⏸ PAUSE</button>
      </div>

      <div class="s-char-wrap">
        <div style="position:relative;display:flex;flex-direction:column;align-items:center">
          <div class="s-char" id="stageChar"></div>
          <div class="s-floor" id="stageFloor"></div>
        </div>
      </div>

      <div class="s-name" id="stageName"></div>
      <div class="s-title" id="stageTitle">COMPETITIVE IDENTITY</div>
    </div>

    <!-- ═══ RIGHT: PANEL ═══ -->
    <div class="ac-panel">

      <button class="dna-scan-btn" onclick="startDnaScan()">
        <span>🧬</span> SCAN MY DNA
      </button>

      <div class="ac-tabs">
        <button class="ac-tab active" onclick="switchTab('class',this)">⚔️ CLASS</button>
        <button class="ac-tab" onclick="switchTab('look',this)">👔 LOOK</button>
        <button class="ac-tab" onclick="switchTab('gear',this)">✨ GEAR</button>
        <button class="ac-tab" onclick="switchTab('effects',this)">💥 FX</button>
      </div>

      <!-- CLASS TAB -->
      <div class="ac-tab-pane active" id="tab-class">
        <div class="ac-sl">Identity Class</div>
        <div class="class-grid" id="classGrid"></div>
      </div>

      <!-- LOOK TAB -->
      <div class="ac-tab-pane" id="tab-look">
        <div class="ac-sl">Outfit</div>
        <div class="ac-grid" id="outfitGrid"></div>
      </div>

      <!-- GEAR TAB -->
      <div class="ac-tab-pane" id="tab-gear">
        <div class="ac-sl">Headwear</div>
        <div class="ac-grid" id="headwearGrid"></div>
        <div class="ac-sl">Eyes</div>
        <div class="ac-grid" id="eyesGrid"></div>
        <div class="ac-sl">Weapon / Item</div>
        <div class="ac-grid" id="weaponGrid"></div>
      </div>

      <!-- EFFECTS TAB -->
      <div class="ac-tab-pane" id="tab-effects">
        <div class="ac-sl">Aura</div>
        <div class="ac-grid" id="auraGrid"></div>
        <div class="ac-sl">Particles</div>
        <div class="ac-grid" id="particlesGrid"></div>
        <div class="ac-sl">Stage</div>
        <div class="ac-grid" id="stageOptGrid"></div>
      </div>

      <div class="ac-save-bar">
        <button class="ac-save-btn" onclick="saveAvatarConfig()">SAVE IDENTITY →</button>
        <button class="ac-reset-btn" onclick="resetAvatar()">Reset</button>
      </div>
    </div>
  </div>
</div>

<div id="acToast"></div>
</div>

<script>
const API='https://ledgr-backend-production-c132.up.railway.app';
var user=null;

// ══════════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════════

var IDENTITY_CLASSES=[
  {id:'void-runner',   name:'VOID RUNNER',   rarity:'RARE',      unlock:null,               color:'#7B2CFF',rgb:'123,44,255',  desc:'Moves between realities',

  {id:'frost-sentinel',name:'FROST SENTINEL',rarity:'LEGENDARY', unlock:'Diamond + 50 wins',color:'#93D2FF',rgb:'147,210,255', desc:'Cold as calculated risk',
   c:{head:'#001a2e',torso:'#00121e',arm:'#000d18',leg:'#000810',acc:'#93D2FF',eye:'#FFFFFF'}},

function getClassConfig(){
  return IDENTITY_CLASSES.find(function(c){return c.id===avatarConfig.identityClass;})||IDENTITY_CLASSES[0];
}

function getOutfitColors(){
  var cls=getClassConfig();
  var base=OUTFIT_COLORS[avatarConfig.outfit]||OUTFIT_COLORS['hoodie'];
  // Blend outfit base with class accent
  return {main:cls.c.torso,accent:cls.c.arm,line:cls.c.acc,eye:EYE_COLORS[avatarConfig.eyes]||cls.c.eye};
}

function buildHeadwear(hw,c){
  if(hw==='hood')return '<div style="position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:86px;height:46px;border-radius:50% 50% 0 0;background:'+c.main+';border:1px solid '+c.line+'44;z-index:3"></div>';
  if(hw==='cap') return '<div style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:76px;height:18px;border-radius:8px 8px 0 0;background:'+c.accent+';border:1px solid '+c.line+'55;z-index:3"></div><div style="position:absolute;top:-2px;left:30%;width:40px;height:9px;border-radius:0 0 4px 0;background:'+c.main+';border:1px solid '+c.line+'33;z-index:3"></div>';
  if(hw==='crown')return '<div style="position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:26px;filter:drop-shadow(0 0 8px #FFD700);z-index:3">👑</div>';
  if(hw==='demon-horns')return '<div style="position:absolute;top:-22px;left:28px;width:12px;height:28px;border-radius:50% 50% 0 0;background:#FF3355;transform:rotate(-9deg);box-shadow:0 0 10px #FF3355;z-index:3"></div><div style="position:absolute;top:-22px;right:28px;width:12px;height:28px;border-radius:50% 50% 0 0;background:#FF3355;transform:rotate(9deg);box-shadow:0 0 10px #FF3355;z-index:3"></div>';
  if(hw==='visor')return '<div style="position:absolute;top:26px;left:50%;transform:translateX(-50%);width:64px;height:12px;border-radius:5px;background:'+c.line+';opacity:.9;box-shadow:0 0 18px '+c.line+';animation:visorScan 2s ease-in-out infinite;z-index:3"></div>';
  if(hw==='mask')return '';
  if(hw==='ghost-veil')return '<div style="position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:78px;height:96px;background:radial-gradient(circle,rgba(255,107,255,.06),transparent 70%);border:1px solid rgba(255,107,255,.12);border-radius:50%;z-index:3"></div>';
  return '';
}

function buildWeapon(weapon,c){
  if(weapon==='tablet')return '<div style="position:absolute;bottom:30px;right:-8px;width:24px;height:36px;border-radius:4px;background:'+c.accent+';border:1px solid '+c.line+';box-shadow:0 0 8px '+c.line+'66;z-index:3"><div style="position:absolute;inset:3px;background:'+c.line+'18;border-radius:2px"></div></div>';
  if(weapon==='scope')return '<div style="position:absolute;bottom:52px;right:-16px;width:42px;height:8px;border-radius:4px;background:'+c.line+';box-shadow:0 0 10px '+c.line+';z-index:3"></div><div style="position:absolute;bottom:47px;right:-10px;width:12px;height:18px;border-radius:50%;border:2px solid '+c.line+'99;z-index:3"></div>';
  if(weapon==='blade')return '<div style="position:absolute;bottom:20px;right:-8px;width:9px;height:64px;border-radius:2px 2px 1px 1px;background:linear-gradient(180deg,rgba(255,255,255,.9),'+c.line+');box-shadow:0 0 14px '+c.line+';animation:bladePulse 2s ease-in-out infinite;z-index:3"></div>';
  if(weapon==='orb')return '<div style="position:absolute;bottom:32px;right:-16px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,#fff,'+c.line+');box-shadow:0 0 18px '+c.line+';animation:orbFloat 2.2s ease-in-out infinite;z-index:3"></div>';
  return '';
}

function buildParticlesHtml(type,c){
  if(type==='none')return '';
  var e={sparks:'⚡',embers:'🔥',stars:'✦',skulls:'💀'}[type]||'✦';
  return [0,1,2].map(function(i){
    return '<div style="position:absolute;font-size:10px;opacity:.55;left:'+(8+i*38)+'%;top:'+(15+i*22)+'%;animation:particleDrift '+(3+i)+'s ease-in-out '+(i*.75)+'s infinite;z-index:4">'+e+'</div>';
  }).join('');
}

function buildClassSpecialFx(cls,c){

  }
  return '';

function buildCharacter(mini){
  var cls=getClassConfig();
  var c=getOutfitColors();
  var scale=mini?.42:1;
  var w=Math.round(78*scale),h=Math.round(86*scale);
  var tw=Math.round(92*scale),th=Math.round(130*scale);
  var aw=Math.round(24*scale),ah=Math.round(110*scale);
  var lw=Math.round(36*scale),lh=Math.round(92*scale);
  var nw=Math.round(22*scale),nh=Math.round(12*scale);
  var ey=mini?5:Math.round(22*scale),ex=Math.round(10*scale),ew=Math.round(13*scale),eh=Math.round(8*scale);

  var maskHTML=avatarConfig.headwear==='mask'?'<div style="position:absolute;bottom:0;left:10%;right:10%;height:46%;background:'+c.accent+';border-radius:0 0 40% 40%;border:1px solid '+c.line+'77;z-index:2"></div>':'';
  var eyeGlow=avatarConfig.eyes!=='normal'?'box-shadow:0 0 8px '+c.eye+',0 0 16px '+c.eye+';':'';
  var headwearHTML=mini?'':buildHeadwear(avatarConfig.headwear,c);
  var weaponHTML=mini?'':buildWeapon(avatarConfig.weapon,c);
  var particleHTML=mini?'':buildParticlesHtml(avatarConfig.particles,c.line);
  var fxHTML=mini?'':buildClassSpecialFx(cls,c);

  var auraHTML='';
  if(!mini&&avatarConfig.aura!=='none'&&AURA_COLORS[avatarConfig.aura]){
    auraHTML='<div style="position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,'+AURA_COLORS[avatarConfig.aura]+',transparent 68%);animation:auraPulse 3.5s ease-in-out infinite;z-index:0;pointer-events:none"></div>';
  }

  var totalH=(h+nh+th+lh+8);
  var containerW=tw+aw*2+12;

  // Body animation
  var bodyAnim=mini?'':'animation:'+(
    cls.id==='neon-king'?'neonFlicker 4s infinite,charIdle 4s ease-in-out infinite':
    cls.id==='frost-sentinel'?'frostForm 3s ease-in-out infinite,charIdle 4s ease-in-out infinite':
    cls.id==='dragon-soul'?'firePulse 2s ease-in-out infinite,charIdle 4s ease-in-out infinite':
    cls.id==='the-ascended'?'ascendFloat 3s ease-in-out infinite,charIdle 4s ease-in-out infinite':
    'charIdle 4s ease-in-out infinite'
  )+';';

  return '<div style="position:relative;width:'+containerW+'px;height:'+(totalH+40)+'px;'+(mini?'':'margin:0 auto;')+''+bodyAnim+'">'+
    auraHTML+
    headwearHTML+
    // Head
    '<div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:'+w+'px;height:'+h+'px;border-radius:50% 50% 44% 44%;background:linear-gradient(160deg,'+c.main+','+c.accent+');border:1px solid '+c.line+'55;box-shadow:0 0 '+Math.round(16*scale)+'px '+c.line+'22;z-index:2">'+
      '<div style="position:absolute;top:'+ey+'px;left:'+ex+'px;width:'+ew+'px;height:'+eh+'px;border-radius:50%;background:'+c.eye+';'+eyeGlow+'z-index:2"></div>'+
      '<div style="position:absolute;top:'+ey+'px;right:'+ex+'px;width:'+ew+'px;height:'+eh+'px;border-radius:50%;background:'+c.eye+';'+eyeGlow+'z-index:2"></div>'+
      maskHTML+
    '</div>'+
    // Neck
    '<div style="position:absolute;top:'+h+'px;left:50%;transform:translateX(-50%);width:'+nw+'px;height:'+nh+'px;background:'+c.main+';z-index:1"></div>'+
    // Torso
    '<div style="position:absolute;top:'+(h+nh)+'px;left:50%;transform:translateX(-50%);width:'+tw+'px;height:'+th+'px;border-radius:'+Math.round(8*scale)+'px '+Math.round(8*scale)+'px '+Math.round(4*scale)+'px '+Math.round(4*scale)+'px;background:linear-gradient(170deg,'+c.main+','+c.accent+');border:1px solid '+c.line+'33;z-index:2">'+
      '<div style="position:absolute;top:'+Math.round(14*scale)+'px;left:50%;transform:translateX(-50%);width:'+Math.round(42*scale)+'px;height:'+Math.round(42*scale)+'px;border-radius:'+Math.round(4*scale)+'px;background:'+c.accent+';border:1px solid '+c.line+'44"></div>'+
      '<div style="position:absolute;top:60%;left:50%;transform:translateX(-50%);width:2px;height:35%;background:'+c.line+'33"></div>'+
    '</div>'+
    // Left arm
    '<div style="position:absolute;top:'+(h+nh+4)+'px;left:'+(Math.round(containerW/2-tw/2-aw-2))+'px;width:'+aw+'px;height:'+ah+'px;border-radius:'+Math.round(6*scale)+'px '+Math.round(6*scale)+'px '+Math.round(3*scale)+'px '+Math.round(3*scale)+'px;background:linear-gradient(170deg,'+c.main+','+c.accent+');border:1px solid '+c.line+'22;transform:rotate(5deg);transform-origin:top center;z-index:1"></div>'+
    // Right arm (with weapon)
    '<div style="position:absolute;top:'+(h+nh+4)+'px;right:'+(Math.round(containerW/2-tw/2-aw-2))+'px;width:'+aw+'px;height:'+ah+'px;border-radius:'+Math.round(6*scale)+'px '+Math.round(6*scale)+'px '+Math.round(3*scale)+'px '+Math.round(3*scale)+'px;background:linear-gradient(170deg,'+c.main+','+c.accent+');border:1px solid '+c.line+'22;transform:rotate(-5deg);transform-origin:top center;z-index:1">'+
      weaponHTML+
    '</div>'+
    // Legs
    '<div style="position:absolute;top:'+(h+nh+th)+'px;left:50%;transform:translateX(-50%);display:flex;gap:'+Math.round(6*scale)+'px;z-index:2">'+
      '<div style="width:'+lw+'px;height:'+lh+'px;border-radius:'+Math.round(4*scale)+'px '+Math.round(4*scale)+'px '+Math.round(2*scale)+'px '+Math.round(2*scale)+'px;background:'+c.accent+';border:1px solid '+c.line+'22"></div>'+
      '<div style="width:'+lw+'px;height:'+lh+'px;border-radius:'+Math.round(4*scale)+'px '+Math.round(4*scale)+'px '+Math.round(2*scale)+'px '+Math.round(2*scale)+'px;background:'+c.accent+';border:1px solid '+c.line+'22"></div>'+
    '</div>'+
    fxHTML+
    particleHTML+
  '</div>';
}

function renderStage(){
  var cls=getClassConfig();
  var stage=document.getElementById('avatarStage');
  var bg=document.getElementById('stageBg');
  var glow=document.getElementById('stageGlow');
  var floor=document.getElementById('stageFloor');
  var badge=document.getElementById('classBadge');
  var char=document.getElementById('stageChar');

  // Stage bg
  if(bg)bg.style.background=STAGE_BG[avatarConfig.stage]||STAGE_BG['dark'];

  // Stage class
  stage.className='avatar-stage'+(avatarConfig.stage==='neon-grid'?' stage-neon-grid':avatarConfig.stage==='cyber-city'?' stage-cyber-city':'');

  // Ambient glow
  if(glow){glow.style.background=cls.color;glow.style.opacity='.32';}

  // Floor shadow
  if(floor)floor.style.background=cls.color;

  // Class badge
  var rarityColor={'RARE':'#4FC3F7','EPIC':'#b89fff','LEGENDARY':'#FFD700','MYTHIC':'#FF6BFF'}[cls.rarity]||'#6B6B6B';
  if(badge){badge.textContent=cls.rarity;badge.style.color=rarityColor;badge.style.borderColor=rarityColor+'33';}

  // Character
  if(char)char.innerHTML=buildCharacter(false);

  // Stage particles (bg floating orbs)
  renderStageParticles(cls);

  // Name
  var nm=document.getElementById('stageName');
  if(nm&&user)nm.textContent=user.username.toUpperCase();
}

function renderStageParticles(cls){
  var fp=document.getElementById('stageParticles');
  if(!fp)return;
  fp.innerHTML=[0,1,2,3].map(function(i){
    var size=3+Math.random()*4;
    var delay=i*1.3;
    var dur=6+i*1.8;
    var x=15+Math.random()*70;
    var y=20+Math.random()*60;
    return '<div style="position:absolute;width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+cls.color+';opacity:.25;left:'+x+'%;top:'+y+'%;filter:blur(1px);animation:floatBg '+dur+'s ease-in-out '+delay+'s infinite;pointer-events:none"></div>';
  }).join('');
}

function renderClassGrid(){
  var g=document.getElementById('classGrid');
  if(!g)return;
  g.innerHTML=IDENTITY_CLASSES.map(function(cls){
    var locked=cls.unlock!==null&&cls.unlock!=='????';
    var mythicLocked=cls.unlock==='????';
    var isLocked=locked||mythicLocked;
    var sel=avatarConfig.identityClass===cls.id;
    var rc={'RARE':'#4FC3F7','EPIC':'#b89fff','LEGENDARY':'#FFD700','MYTHIC':'#FF6BFF'}[cls.rarity]||'#6B6B6B';
    var miniChar=buildMiniChar(cls);
    var style=sel?'--cc:'+cls.color+';--ccr:'+cls.rgb+';border-color:'+cls.color+';box-shadow:0 0 0 1px '+cls.color+',0 0 24px rgba('+cls.rgb+',.28);':'';
    var click=isLocked?'':' onclick="selectClass(\''+cls.id+'\')"';
    return '<div class="class-card'+(sel?' selected':'')+(isLocked?' locked':'')+'" id="cc_'+cls.id+'" style="'+style+'"'+click+'>'+
      '<div class="class-rarity" style="color:'+rc+';background:'+rc+'15;border:1px solid '+rc+'30">'+cls.rarity+'</div>'+
      (isLocked?'<div class="class-lock">🔒</div>':'')+
      '<div class="class-mini">'+miniChar+'</div>'+
      '<div class="class-name">'+cls.name+'</div>'+
      (isLocked&&cls.unlock!=='????'?'<div class="class-req">'+cls.unlock+'</div>':'')+(cls.unlock==='????'?'<div class="class-req">???</div>':'')+
    '</div>';
  }).join('');
}

function buildMiniChar(cls){
  var c=cls.c;
  var hw=66,hh=76,tw=82,th=112,aw=18,ah=88,lw=28,lh=72;
  var nt=hw+hh;
  var containerW=tw+aw*2+8;
  return '<div style="position:relative;width:'+containerW+'px;height:'+(nt+th+lh+20)+'px;margin:0 auto">'+
    // Head
    '<div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:'+hw+'px;height:'+hh+'px;border-radius:50% 50% 44% 44%;background:linear-gradient(160deg,'+c.head+','+c.torso+');border:1px solid '+c.acc+'55;box-shadow:0 0 12px '+c.acc+'33">'+
      '<div style="position:absolute;top:22px;left:12px;width:10px;height:7px;border-radius:50%;background:'+c.eye+';box-shadow:0 0 6px '+c.eye+'"></div>'+
      '<div style="position:absolute;top:22px;right:12px;width:10px;height:7px;border-radius:50%;background:'+c.eye+';box-shadow:0 0 6px '+c.eye+'"></div>'+
    '</div>'+
    // Torso
    '<div style="position:absolute;top:'+(hh+10)+'px;left:50%;transform:translateX(-50%);width:'+tw+'px;height:'+th+'px;border-radius:7px 7px 3px 3px;background:linear-gradient(170deg,'+c.torso+','+c.arm+');border:1px solid '+c.acc+'33">'+
      '<div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);width:32px;height:32px;border-radius:3px;background:'+c.arm+';border:1px solid '+c.acc+'44"></div>'+
    '</div>'+
    // Arms
    '<div style="position:absolute;top:'+(hh+14)+'px;left:'+(containerW/2-tw/2-aw-2)+'px;width:'+aw+'px;height:'+ah+'px;border-radius:5px 5px 3px 3px;background:'+c.arm+';border:1px solid '+c.acc+'22;transform:rotate(5deg);transform-origin:top center"></div>'+
    '<div style="position:absolute;top:'+(hh+14)+'px;right:'+(containerW/2-tw/2-aw-2)+'px;width:'+aw+'px;height:'+ah+'px;border-radius:5px 5px 3px 3px;background:'+c.arm+';border:1px solid '+c.acc+'22;transform:rotate(-5deg);transform-origin:top center"></div>'+
    // Legs
    '<div style="position:absolute;top:'+(hh+10+th)+'px;left:50%;transform:translateX(-50%);display:flex;gap:5px">'+
      '<div style="width:'+lw+'px;height:'+lh+'px;border-radius:3px 3px 2px 2px;background:'+c.leg+';border:1px solid '+c.acc+'22"></div>'+
      '<div style="width:'+lw+'px;height:'+lh+'px;border-radius:3px 3px 2px 2px;background:'+c.leg+';border:1px solid '+c.acc+'22"></div>'+
    '</div>'+
    // Glow
    '<div style="position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:70px;height:10px;border-radius:50%;background:'+c.acc+'44;filter:blur(5px)"></div>'+
  '</div>';
}

// ══════════════════════════════════════════════════════════════
// OPTION GRIDS
// ══════════════════════════════════════════════════════════════

function renderOptionGrid(gridId,items,category){
  var g=document.getElementById(gridId);
  if(!g)return;
  g.innerHTML=items.map(function(item){
    var locked=item.unlock&&item.unlock!=='????';
    var mythicLocked=item.unlock==='????';
    var isLocked=locked||mythicLocked;
    var sel=avatarConfig[category]===item.id;
    var click=isLocked?'':' onclick="selectOption(\''+category+'\',\''+item.id+'\')"';
    var preview=buildOptPreview(category,item);
    return '<div class="ac-opt'+(sel?' selected':'')+(isLocked?' locked':'')+'" id="opt_'+category+'_'+item.id+'"'+click+'>'+
      (item.tier&&item.tier!=='COMMON'?'<div class="ac-opt-tier t-'+item.tier+'">'+item.tier+'</div>':'')+
      (isLocked?'<div class="ac-opt-lock">🔒</div>':'')+
      '<div class="ac-opt-preview">'+preview+'</div>'+
      '<div class="ac-opt-label">'+item.name+'</div>'+
    '</div>';
  }).join('');
}

function buildOptPreview(cat,item){
  var cls=getClassConfig();
  var oc=OUTFIT_COLORS[item.id]||OUTFIT_COLORS['hoodie'];
  if(cat==='outfit')return '<div style="width:38px;height:50px;border-radius:4px;background:linear-gradient(170deg,'+oc.main+','+oc.accent+');border:1px solid '+oc.line+'44;display:flex;align-items:center;justify-content:center"><div style="width:15px;height:16px;border-radius:2px;background:'+oc.accent+';border:1px solid '+oc.line+'55"></div></div>';
  if(cat==='headwear'){var em={none:'—',hood:'🪖',cap:'🧢',mask:'😷',visor:'🥽',crown:'👑','demon-horns':'😈','ghost-veil':'👻'};return '<div style="font-size:26px">'+(em[item.id]||'—')+'</div>';}
  if(cat==='eyes'){var ec=EYE_COLORS[item.id]||'#aaa';return '<div style="width:34px;height:20px;border-radius:50%;background:'+ec+';box-shadow:0 0 10px '+ec+'88"></div>';}
  if(cat==='weapon'){var ew={none:'✋',tablet:'📱',scope:'🔭',blade:'⚡',orb:'🔮'};return '<div style="font-size:24px">'+(ew[item.id]||'—')+'</div>';}
  if(cat==='aura'){if(item.id==='none')return '<div style="width:38px;height:38px;border-radius:50%;border:1px dashed rgba(255,255,255,.1)"></div>';var ac=AURA_COLORS[item.id];return '<div style="width:38px;height:38px;border-radius:50%;background:radial-gradient(circle,'+ac+',transparent 70%);animation:auraPulse 3s ease-in-out infinite"></div>';}
  if(cat==='particles'){var ep={none:'—',sparks:'⚡⚡',embers:'🔥🔥',stars:'✦✦✦',skulls:'💀💀'};return '<div style="font-size:13px;letter-spacing:.08em">'+(ep[item.id]||'—')+'</div>';}
  if(cat==='stage'){var sb=STAGE_BG[item.id]||STAGE_BG['dark'];return '<div style="width:46px;height:30px;border-radius:4px;background:'+sb+';border:1px solid rgba(255,255,255,.08)"></div>';}
  return '<div style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.04)"></div>';
}

// ══════════════════════════════════════════════════════════════
// SELECTION
// ══════════════════════════════════════════════════════════════

function selectClass(id){
  avatarConfig.identityClass=id;
  renderClassGrid();
  renderStage();
}

function selectOption(category,value){
  avatarConfig[category]=value;
  // update selection UI
  document.querySelectorAll('[id^="opt_'+category+'_"]').forEach(function(el){
    el.classList.toggle('selected',el.id==='opt_'+category+'_'+value);
  });
  if(category==='stage'){_stageIdx=STAGES.findIndex(function(s){return s.id===value;});if(_stageIdx<0)_stageIdx=0;}
  renderStage();
}

function switchTab(tab,btn){
  document.querySelectorAll('.ac-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.ac-tab-pane').forEach(function(p){p.classList.remove('active');});
  if(btn)btn.classList.add('active');
  var pane=document.getElementById('tab-'+tab);
  if(pane)pane.classList.add('active');
}

function cycleStage(){
  _stageIdx=(_stageIdx+1)%STAGES.length;
  avatarConfig.stage=STAGES[_stageIdx].id;
  document.querySelectorAll('[id^="opt_stage_"]').forEach(function(el){el.classList.toggle('selected',el.id==='opt_stage_'+avatarConfig.stage);});
  renderStage();
  // Flash transition
  var stage=document.getElementById('avatarStage');
  stage.style.animation='stageIn .35s ease-out';
  setTimeout(function(){stage.style.animation='';},350);
}

function toggleAnimation(){
  _animating=!_animating;
  var char=document.getElementById('stageChar');
  var btn=document.getElementById('animToggleBtn');
  if(char){
    var els=char.querySelectorAll('[style*="charIdle"]');
    els.forEach(function(el){el.style.animationPlayState=_animating?'running':'paused';});
    // Also toggle root element
    var root=char.querySelector('div');
    if(root)root.style.animationPlayState=_animating?'running':'paused';
  }
  if(btn)btn.textContent=_animating?'⏸ PAUSE':'▶ PLAY';
}

// ══════════════════════════════════════════════════════════════
// MOUSE PARALLAX
// ══════════════════════════════════════════════════════════════

function initParallax(){
  var stage=document.getElementById('avatarStage');
  var char=document.getElementById('stageChar');
  if(!stage||!char)return;
  stage.addEventListener('mousemove',function(e){
    var rect=stage.getBoundingClientRect();
    _parallaxX=((e.clientX-rect.left)-rect.width/2)/rect.width;
    _parallaxY=((e.clientY-rect.top)-rect.height/2)/rect.height;
  });
  stage.addEventListener('mouseleave',function(){
    _parallaxX=0;_parallaxY=0;
  });
  function raf(){
    var c=document.getElementById('stageChar');
    if(c)c.style.transform='translate('+(_parallaxX*14)+'px,'+(_parallaxY*9)+'px)';
    _rafId=requestAnimationFrame(raf);
  }
  _rafId=requestAnimationFrame(raf);
}

// ══════════════════════════════════════════════════════════════
// DNA SCAN
// ══════════════════════════════════════════════════════════════

function startDnaScan(){
  var overlay=document.getElementById('dnaOverlay');
  var scanText=document.getElementById('dnaScanText');
  var scanFill=document.getElementById('dnaScanFill');
  var result=document.getElementById('dnaResult');
  if(!overlay)return;

  overlay.classList.add('active');
  result.style.display='none';
  scanText.style.display='block';
  scanFill.style.width='0';
  scanFill.style.transition='width .1s linear';

  var steps=[
    {t:'ANALYZING PICKS...',  p:20,  d:600},
    {t:'READING BEHAVIOR...',  p:44,  d:600},
    {t:'DETECTING PATTERNS...',p:68,  d:600},
    {t:'GENERATING IDENTITY...',p:88, d:500},
    {t:'LOCKING IN...',         p:100, d:400},
  ];
  var idx=0;
  function nextStep(){
    if(idx>=steps.length){showDnaResult();return;}
    var s=steps[idx++];
    scanText.textContent=s.t;
    scanFill.style.transition='width '+s.d+'ms linear';
    scanFill.style.width=s.p+'%';
    setTimeout(nextStep,s.d+80);
  }
  nextStep();
}

function showDnaResult(){
  var scanText=document.getElementById('dnaScanText');
  var result=document.getElementById('dnaResult');
  var resultClass=document.getElementById('dnaResultClass');
  var resultDesc=document.getElementById('dnaResultDesc');

  // Try to read archetype from localStorage or backend
  var pc={};
  try{pc=JSON.parse(localStorage.getItem('ledgr_profile_customization')||'{}');}catch(e){}
  var archKey=pc.archetypeKey||pc.archetypeId||null;
  var classId=ARCHETYPE_CLASS_MAP[archKey]||null;

  if(!classId){
    // Try to determine from username profile data
    var profileStr=user?localStorage.getItem('ledgr_profile_'+user.username):null;
    if(profileStr){try{var pd=JSON.parse(profileStr);archKey=pd.archetype;classId=ARCHETYPE_CLASS_MAP[archKey]||null;}catch(e){}}
  }

  var detectedClass=classId?IDENTITY_CLASSES.find(function(c){return c.id===classId;}):null;

  if(scanText)scanText.style.display='none';
  if(result)result.style.display='block';

  if(detectedClass){
    if(resultClass){resultClass.textContent=detectedClass.name;resultClass.style.color=detectedClass.color;resultClass.style.textShadow='0 0 24px '+detectedClass.color;}
    if(resultDesc)resultDesc.textContent=detectedClass.desc;
    // Auto-apply after a beat
    setTimeout(function(){applyDnaClass(detectedClass.id);},600);
  } else {
    if(resultClass){resultClass.textContent='POST MORE PICKS';resultClass.style.color='#6B6B6B';resultClass.style.textShadow='';}
    if(resultDesc)resultDesc.textContent='Your identity emerges from your pick history';
  }
}

function applyDnaClass(classId){
  avatarConfig.identityClass=classId;
  // Auto-apply archetype-linked gear
  var presets={
    'storm-unit':    {headwear:'visor', eyes:'glow-purple',weapon:'scope',  aura:'purple-aura'},
    'shadow-reaper': {headwear:'hood',  eyes:'glow-red',   weapon:'blade',  aura:'void-aura',  particles:'skulls'},
    'royal-hunter':  {headwear:'crown', eyes:'glow-gold',  weapon:'orb',    aura:'gold-aura'},
    'neon-king':     {headwear:'cap',   eyes:'glow-purple',weapon:'tablet', aura:'purple-aura',particles:'sparks'},
    'frost-sentinel':{headwear:'visor', eyes:'normal',     weapon:'blade',  aura:'ice-aura',   particles:'stars'},
    'the-ascended':  {headwear:'crown', eyes:'glow-gold',  weapon:'orb',    aura:'gold-aura',  particles:'stars'},
    'dragon-soul':   {headwear:'demon-horns',eyes:'glow-red',weapon:'blade',aura:'fire-aura',  particles:'embers'},
  };
  if(presets[classId])Object.assign(avatarConfig,presets[classId]);
  renderClassGrid();
  renderStage();
  renderAllGrids();
}

function closeDnaScan(){
  var overlay=document.getElementById('dnaOverlay');
  if(overlay)overlay.classList.remove('active');
}

// ══════════════════════════════════════════════════════════════
// SAVE / LOAD / RESET
// ══════════════════════════════════════════════════════════════

function saveAvatarConfig(){
  localStorage.setItem('ledgr_avatar_config',JSON.stringify(avatarConfig));
  var token=localStorage.getItem('ledgr_token');
  if(token){
    fetch(API+'/profile',{
      method:'PATCH',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({avatarConfig:avatarConfig})
    }).catch(function(){});
  }
  showToast('✓ Identity saved');
}

function loadSavedAvatar(){
  var saved=localStorage.getItem('ledgr_avatar_config');
  if(saved){try{Object.assign(avatarConfig,JSON.parse(saved));}catch(e){}}
}

function resetAvatar(){
  avatarConfig={identityClass:'void-runner',outfit:'hoodie',headwear:'none',eyes:'normal',weapon:'none',aura:'none',particles:'none',stage:'dark'};
  renderClassGrid();
  renderAllGrids();
  renderStage();
  showToast('Identity reset');
}

function renderAllGrids(){
  renderOptionGrid('outfitGrid',OUTFITS,'outfit');
  renderOptionGrid('headwearGrid',HEADWEAR,'headwear');
  renderOptionGrid('eyesGrid',EYES,'eyes');
  renderOptionGrid('weaponGrid',WEAPONS,'weapon');
  renderOptionGrid('auraGrid',AURAS,'aura');
  renderOptionGrid('particlesGrid',PARTICLES,'particles');
  renderOptionGrid('stageOptGrid',STAGES,'stage');
}

function showToast(msg){
  var t=document.getElementById('acToast');
  if(!t)return;
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════

window.onload=function(){
  var ud=localStorage.getItem('ledgr_user')||localStorage.getItem('user');
  var tk=localStorage.getItem('ledgr_token')||localStorage.getItem('token');
  if(!ud||!tk){window.location.href='/login';return;}
  try{user=JSON.parse(ud);}catch(e){window.location.href='/login';return;}
  if(!user||!user.username){window.location.href='/login';return;}

  document.getElementById('app').style.display='block';

  loadSavedAvatar();
  renderClassGrid();
  renderAllGrids();
  renderStage();
  initParallax();

  // Sync from backend
  fetch(API+'/profile/'+user.username,{headers:{Authorization:'Bearer '+tk}})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(data){
      if(!data)return;
      if(data.avatarConfig){Object.assign(avatarConfig,data.avatarConfig);renderClassGrid();renderAllGrids();renderStage();}
    }).catch(function(){});
};
</script>
