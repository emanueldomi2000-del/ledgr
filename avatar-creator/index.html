<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/logo/ledgr-icon.png">
<title>LEDGR — Avatar Forge</title>
<meta name="description" content="Build your competitive identity. Your character evolves as you climb.">
<meta property="og:title" content="LEDGR — Avatar Forge">
<meta property="og:image" content="https://getledgr.bet/assets/logo/ledgr-logo.png">
<meta property="og:url" content="https://getledgr.bet/avatar-creator">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app-tokens.css">
<link rel="stylesheet" href="/app-components.css">
<style>
:root{--ac:#7B2CFF;--tx:#E6E6E6;--mu:#6B6B6B}
html{scroll-behavior:smooth}
body{background:#0A0A0A;color:#E6E6E6;font-family:'Syne',sans-serif;margin:0;padding:0;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#7B2CFF05 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}

.ac-wrap{max-width:1180px;margin:0 auto;padding:24px 20px 100px;position:relative;z-index:1}

/* ── TOP STRIP ── */
.ac-topstrip{display:flex;align-items:center;gap:12px;padding:16px 0 24px;flex-wrap:wrap}
.ac-ts-eyebrow{font-size:9px;letter-spacing:0.25em;color:var(--ac);font-family:'DM Mono',monospace}
.ac-ts-divider{color:rgba(255,255,255,0.15)}
.ac-ts-title{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--tx);letter-spacing:0.05em}
.ac-ts-sub{font-size:11px;color:var(--mu);font-family:'Syne',sans-serif}

/* ── LAYOUT ── */
.ac-body{display:grid;grid-template-columns:40% 1fr;gap:24px;align-items:start}
@media(max-width:820px){.ac-body{grid-template-columns:1fr}}

/* ══════════════════════════════════════════════════════════════
   LEFT COLUMN WRAPPER (sticky container)
══════════════════════════════════════════════════════════════ */
.ac-stage-col{position:sticky;top:80px;}

/* FIX 4: IDENTITY LEVEL BAR */
.identity-level-bar{display:flex;align-items:center;gap:16px;padding:12px 16px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;margin-bottom:12px}
.ilb-level{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--ac);line-height:1;min-width:32px;text-align:center}
.ilb-info{flex:1}
.ilb-label{font-size:8px;letter-spacing:0.25em;color:var(--mu);font-family:'DM Mono',monospace;margin-bottom:6px}
.ilb-xp-track{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.ilb-xp-fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,var(--ac),#00E5A0);transition:width 1s ease}
.ilb-xp-label{font-size:9px;color:var(--mu);font-family:'DM Mono',monospace;margin-top:4px}

/* ══════════════════════════════════════════════════════════════
   FORGE STAGE
══════════════════════════════════════════════════════════════ */
.forge-stage{
  height:520px;border-radius:20px;
  background:linear-gradient(180deg,#08081a 0%,#050510 100%);
  border:1px solid rgba(123,44,255,0.15);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  overflow:hidden;padding:16px;box-sizing:border-box;
  box-shadow:0 0 40px rgba(0,0,0,0.6),inset 0 0 60px rgba(0,0,0,0.4);
}
.fs-glow{
  position:absolute;top:10%;left:50%;transform:translateX(-50%);
  width:200px;height:200px;border-radius:50%;opacity:0.3;pointer-events:none;
  animation:glowBreathe 4s ease-in-out infinite;transition:background 0.5s ease;
}
.fs-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(123,44,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(123,44,255,0.03) 1px,transparent 1px);
  background-size:30px 30px;pointer-events:none;
}
.fs-particles{position:absolute;inset:0;pointer-events:none;z-index:1}
.fs-char-wrap{
  position:relative;z-index:2;display:flex;flex-direction:column;
  align-items:center;margin-top:20px;
}
.fs-char{animation:charIdle 4s ease-in-out infinite;transform-origin:bottom center}
.fs-floor-shadow{
  width:80px;height:10px;border-radius:50%;
  background:rgba(123,44,255,0.2);filter:blur(8px);margin-top:4px;
  animation:shadowBreath 4s ease-in-out infinite;
}
.fs-plate{
  text-align:center;position:relative;z-index:3;
  padding:8px 16px;background:rgba(0,0,0,0.4);
  border:1px solid rgba(255,255,255,0.06);border-radius:10px;
  width:90%;box-sizing:border-box;
}
.fs-plate-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--tx);letter-spacing:0.05em}
.fs-plate-class{font-size:9px;letter-spacing:0.2em;color:var(--ac);font-family:'DM Mono',monospace}
.fs-plate-rank{font-size:10px;color:var(--mu);font-family:'Syne',sans-serif;margin-top:2px}
.fs-top{
  position:absolute;top:12px;left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:center;z-index:4;
}
.fs-rarity-badge{font-size:8px;letter-spacing:0.15em;font-family:'DM Mono',monospace;padding:3px 10px;border-radius:20px}
.fs-controls{display:flex;gap:6px}
.fs-controls button{
  font-size:9px;letter-spacing:0.1em;font-family:'DM Mono',monospace;padding:4px 10px;
  border-radius:6px;cursor:pointer;background:rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.1);color:var(--mu);transition:all 0.15s;
}
.fs-controls button:hover{border-color:var(--ac);color:var(--ac)}

/* ══════════════════════════════════════════════════════════════
   RIGHT — PANEL
══════════════════════════════════════════════════════════════ */
.ac-panel{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:18px}

.dna-scan-btn{width:100%;padding:14px;margin-bottom:18px;background:linear-gradient(135deg,rgba(123,44,255,.15),rgba(123,44,255,.06));border:1px solid rgba(123,44,255,.3);border-radius:12px;color:#b89fff;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.14em;cursor:pointer;transition:all .22s;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.dna-scan-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(123,44,255,.12),transparent);transform:translateX(-100%);transition:transform .4s}
.dna-scan-btn:hover{border-color:rgba(123,44,255,.6);color:#fff;box-shadow:0 0 24px rgba(123,44,255,.25)}
.dna-scan-btn:hover::before{transform:translateX(100%)}
.dna-scan-btn span{font-size:16px}

.ac-tabs{display:flex;gap:3px;margin-bottom:18px;background:rgba(255,255,255,.03);border-radius:10px;padding:3px}
.ac-tab{flex:1;padding:8px 4px;border:none;background:transparent;color:#6B6B6B;font-family:'Syne',sans-serif;font-size:11px;border-radius:8px;cursor:pointer;transition:all .14s;letter-spacing:.01em}
.ac-tab.active{background:rgba(123,44,255,.18);color:#b89fff;border:1px solid rgba(123,44,255,.28)}
.ac-tab-pane{display:none}
.ac-tab-pane.active{display:block}

.ac-sl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.25em;color:#6B6B6B;text-transform:uppercase;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.ac-sl::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05)}
.ac-sl:first-child{margin-top:0}

/* CLASS CARDS */
.ac-class-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.ac-class-grid{grid-template-columns:repeat(2,1fr)}}
.ac-class-card{
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);
  border-radius:12px;padding:12px 8px;cursor:pointer;text-align:center;
  transition:all 0.2s ease;position:relative;overflow:hidden;
}
.ac-class-card:hover:not(.locked){border-color:rgba(255,255,255,0.15);transform:translateY(-2px)}
.ac-class-card.selected{border-color:var(--ac);background:rgba(123,44,255,0.08);box-shadow:0 0 16px rgba(123,44,255,0.2)}
.ac-class-card.locked{opacity:0.4;cursor:not-allowed;filter:grayscale(0.5)}
.acc-tier{font-size:7px;letter-spacing:0.2em;font-family:'DM Mono',monospace;margin-bottom:6px}
.acc-preview{margin:6px auto;height:80px;display:flex;align-items:center;justify-content:center}
.acc-name{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--tx);letter-spacing:0.05em;margin-top:4px}
.acc-desc{font-size:9px;color:var(--mu);font-family:'Syne',sans-serif;margin-top:3px;line-height:1.3}
.acc-lock{font-size:8px;color:var(--mu);font-family:'DM Mono',monospace;margin-top:4px}

/* FIX 2: OPTION GRID — bigger, more visual */
.ac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:7px;margin-bottom:6px}
.ac-opt{position:relative;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;cursor:pointer;overflow:hidden;transition:all .14s;text-align:center;padding:10px 5px 20px;min-height:90px;box-sizing:border-box}
.ac-opt:hover:not(.locked){border-color:rgba(123,44,255,.35);background:rgba(123,44,255,.07);transform:translateY(-3px) scale(1.03);box-shadow:0 8px 20px rgba(0,0,0,0.4),0 0 16px rgba(123,44,255,0.2)}
.ac-opt:hover:not(.locked)::after{content:'EQUIP';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:0.2em;color:var(--ac);font-family:'DM Mono',monospace;pointer-events:none;white-space:nowrap}
.ac-opt.selected{border-color:#7B2CFF;background:rgba(123,44,255,.15);box-shadow:0 0 12px rgba(123,44,255,.22)}
.ac-opt.locked{opacity:.38;cursor:not-allowed;filter:grayscale(.5)}
.ac-opt-preview{height:64px;display:flex;align-items:center;justify-content:center;margin-bottom:5px}
.ac-opt-label{font-family:'Bebas Neue',sans-serif;font-size:12px;color:#6B6B6B;letter-spacing:.08em;line-height:1.25}
.ac-opt.selected .ac-opt-label{color:#b89fff}
.ac-opt-lock{position:absolute;top:3px;right:3px;font-size:9px}
.ac-opt-tier{position:absolute;top:3px;left:3px;font-size:7px;font-family:'DM Mono',monospace;padding:1px 4px;border-radius:6px;letter-spacing:.04em}
.t-COMMON{background:rgba(107,107,107,.18);color:#555;border:1px solid rgba(107,107,107,.18)}
.t-RARE{background:rgba(79,195,247,.1);color:#4FC3F7;border:1px solid rgba(79,195,247,.2)}
.t-EPIC{background:rgba(123,44,255,.1);color:#b89fff;border:1px solid rgba(123,44,255,.2)}
.t-LEGENDARY{background:rgba(255,215,0,.1);color:#FFD700;border:1px solid rgba(255,215,0,.2)}
.t-MYTHIC{background:rgba(255,107,255,.08);color:#FF6BFF;border:1px solid rgba(255,107,255,.18)}

/* SAVE BAR */
.ac-save-bar{display:flex;gap:9px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06)}
.ac-save-btn{flex:1;padding:13px;background:var(--ac,#7B2CFF);color:#0A0A0A;border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.1em;cursor:pointer;transition:all .2s}
.ac-save-btn:hover{filter:brightness(1.2);box-shadow:0 0 22px rgba(123,44,255,.4)}
.ac-reset-btn{padding:13px 18px;background:transparent;color:#6B6B6B;border:1px solid rgba(255,255,255,.08);border-radius:10px;font-family:'Syne',sans-serif;font-size:12px;cursor:pointer;transition:all .14s}
.ac-reset-btn:hover{border-color:rgba(255,255,255,.18);color:#E6E6E6}

#acToast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(16px);background:#181818;border:1px solid rgba(123,44,255,.3);color:#E6E6E6;font-family:'DM Mono',monospace;font-size:12px;padding:9px 20px;border-radius:10px;opacity:0;transition:all .22s;pointer-events:none;z-index:9999;white-space:nowrap}
#acToast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════════════════════════════════════
   KEYFRAMES
══════════════════════════════════════════════════════════════ */
@keyframes glowBreathe{0%,100%{transform:translateX(-50%) scale(1);opacity:0.2}50%{transform:translateX(-50%) scale(1.2);opacity:0.4}}
@keyframes charIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shadowBreath{0%,100%{width:80px;opacity:0.3}50%{width:60px;opacity:0.15}}
@keyframes charGlow{0%,100%{opacity:0.1}50%{opacity:0.2}}
@keyframes bladePulse{0%,100%{opacity:0.9}50%{opacity:1;filter:brightness(1.3)}}
@keyframes orbPulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.1)}}
@keyframes visorScan{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes auraBreath{0%,100%{transform:scale(1);opacity:0.15}50%{transform:scale(1.1);opacity:0.3}}
@keyframes auraPulse{0%,100%{opacity:.3}50%{opacity:.55}}
@keyframes floatBg{0%,100%{transform:translateY(0) translateX(0);opacity:.4}33%{transform:translateY(-18px) translateX(8px);opacity:.6}66%{transform:translateY(8px) translateX(-6px);opacity:.35}}
@keyframes stageIn{0%{opacity:0;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
@keyframes particleDrift{0%,100%{transform:translate(0,0);opacity:.5}50%{transform:translate(5px,-16px);opacity:.15}}
</style>
</head>
<body>
<div id="app" style="display:none">

<script src="/app-nav.js"></script>
<script>AppNav.init({active:'avatar'});</script>

<div class="ac-wrap">

  <div class="ac-topstrip">
    <span class="ac-ts-eyebrow">⬡ LEDGR IDENTITY SYSTEM</span>
    <span class="ac-ts-divider">·</span>
    <span class="ac-ts-title">AVATAR FORGE</span>
    <span class="ac-ts-sub">Build your competitive identity</span>
  </div>

  <div class="ac-body">

    <!-- LEFT: level bar + forge stage (sticky wrapper) -->
    <div class="ac-stage-col">

      <!-- FIX 4: IDENTITY LEVEL BAR -->
      <div class="identity-level-bar" id="identityLevelBar">
        <div class="ilb-level" id="ilbLevel">1</div>
        <div class="ilb-info">
          <div class="ilb-label">IDENTITY LEVEL</div>
          <div class="ilb-xp-track"><div class="ilb-xp-fill" id="ilbXpFill"></div></div>
          <div class="ilb-xp-label" id="ilbXpLabel">0 / 3 picks to next level</div>
        </div>
      </div>

      <!-- FORGE STAGE -->
      <div class="forge-stage" id="forgeStage">
        <div class="fs-glow" id="fsGlow"></div>
        <div class="fs-grid"></div>
        <div class="fs-particles" id="fsParticles"></div>

        <div class="fs-char-wrap">
          <div class="fs-char" id="fsChar"></div>
          <div class="fs-floor-shadow" id="fsFloorShadow"></div>
        </div>

        <div class="fs-plate">
          <div class="fs-plate-name" id="fsPlateName"></div>
          <div class="fs-plate-class" id="fsPlateClass"></div>
          <div class="fs-plate-rank" id="fsPlateRank">COMPETITIVE IDENTITY</div>
        </div>

        <div class="fs-top">
          <div class="fs-rarity-badge" id="fsRarity"></div>
          <div class="fs-controls">
            <button onclick="cycleStage()">◉ STAGE</button>
            <button onclick="toggleAnimate()" id="animBtn">⏸ PAUSE</button>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="ac-panel">

      <button class="dna-scan-btn" id="scanDnaBtn">
        <span>🧬</span> SCAN MY DNA
      </button>

      <div class="ac-tabs">
        <button class="ac-tab active" onclick="switchTab('class',this)">⚔️ CLASS</button>
        <button class="ac-tab" onclick="switchTab('look',this)">👔 LOOK</button>
        <button class="ac-tab" onclick="switchTab('gear',this)">✨ GEAR</button>
        <button class="ac-tab" onclick="switchTab('effects',this)">💥 FX</button>
      </div>

      <div class="ac-tab-pane active" id="tab-class">
        <div class="ac-sl">Identity Class</div>
        <div class="ac-class-grid" id="classGrid"></div>
      </div>

      <div class="ac-tab-pane" id="tab-look">
        <div class="ac-sl">Outfit</div>
        <div class="ac-grid" id="outfitGrid"></div>
      </div>

      <div class="ac-tab-pane" id="tab-gear">
        <div class="ac-sl">Headwear</div>
        <div class="ac-grid" id="headwearGrid"></div>
        <div class="ac-sl">Eyes</div>
        <div class="ac-grid" id="eyesGrid"></div>
        <div class="ac-sl">Weapon / Item</div>
        <div class="ac-grid" id="weaponGrid"></div>
      </div>

      <div class="ac-tab-pane" id="tab-effects">
        <div class="ac-sl">Aura</div>
        <div class="ac-grid" id="auraGrid"></div>
        <div class="ac-sl">Particles</div>
        <div class="ac-grid" id="particlesGrid"></div>
        <div class="ac-sl">Stage</div>
        <div class="ac-grid" id="stageOptGrid"></div>
      </div>

      <div class="ac-save-bar">
        <button class="ac-save-btn" onclick="saveAvatarConfig()">SAVE IDENTITY →</button>
        <button class="ac-reset-btn" onclick="resetAvatar()">Reset</button>
      </div>
    </div>
  </div>
</div>

<div id="acToast"></div>
</div>

<script>
const API='https://ledgr-backend-production-c132.up.railway.app';
var user=null;

// ══════════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════════

var CLASSES=[
  {id:'void-runner',  name:'Void Runner',  tier:'RARE',      unlock:null,

  {id:'iron-grinder', name:'Iron Grinder', tier:'RARE',      unlock:'Silver division',

];

var ARCHETYPE_CLASS_MAP={
  'value_hunter':'iron-grinder','contrarian':'void-runner','momentum_rider':'cyber-sharp',

// FIX 5: module-level presets so DNA scan step 4 can reference them
var DNA_PRESETS={
  'void-runner':   {headwear:'hood',       eyes:'glow-purple',weapon:'none',  aura:'purple-aura'},
  'iron-grinder':  {headwear:'cap',        eyes:'glow-gold',  weapon:'tablet',aura:'gold-aura'},

  'cyber-sharp':   {headwear:'visor',      eyes:'glow-purple',weapon:'scope', aura:'purple-aura'},

  'crown-bearer':  {headwear:'crown',      eyes:'glow-gold',  weapon:'orb',   aura:'gold-aura',  particles:'stars'},
  'ghost-walker':  {headwear:'ghost-veil', eyes:'ghost-eyes', weapon:'orb',   aura:'void-aura',  particles:'sparks'},
  'void-emperor':  {headwear:'hood',       eyes:'ghost-eyes', weapon:'orb',   aura:'void-aura',  particles:'stars'},
};

var OUTFITS=[
  {id:'hoodie',      name:'Hoodie',   tier:'COMMON',   unlock:null},
  {id:'tshirt',      name:'Tee',      tier:'COMMON',   unlock:null},
  {id:'tracksuit',   name:'Tracksuit',tier:'RARE',     unlock:'Silver division'},
  {id:'bomber',      name:'Bomber',   tier:'RARE',     unlock:'Win 25 picks'},
  {id:'tactical',    name:'Tactical', tier:'EPIC',     unlock:'Diamond division'},
  {id:'cyber-suit',  name:'Cyber',    tier:'EPIC',     unlock:'Platinum division'},
  {id:'armor',       name:'Armor',    tier:'LEGENDARY',unlock:'Elite division'},

function renderStage(){
  var cls=getClassConfig();
  var stage=document.getElementById('forgeStage');
  if(stage)stage.style.background=STAGE_BG[avatarConfig.stage]||STAGE_BG['dark'];

  var glow=document.getElementById('fsGlow');
  if(glow)glow.style.background='radial-gradient(circle,'+cls.colors.line+',transparent)';

  var floor=document.getElementById('fsFloorShadow');
  if(floor)floor.style.background='radial-gradient(ellipse,'+cls.colors.line+'44,transparent)';

  var char=document.getElementById('fsChar');
  if(char)char.innerHTML=buildCharacterCSS(avatarConfig);

  var nm=document.getElementById('fsPlateName');
  if(nm&&user)nm.textContent=user.username.toUpperCase();

  var pc=document.getElementById('fsPlateClass');
  if(pc)pc.textContent=cls.name.toUpperCase()+' · '+cls.tier;

  var rarity=document.getElementById('fsRarity');
  var rc=getTierColor(cls.tier);
  if(rarity){
    rarity.textContent=cls.tier;
    rarity.style.color=rc;
    rarity.style.background=rc+'20';
    rarity.style.border='1px solid '+rc+'44';
  }

  renderStageParticles(cls);
}

function renderStageParticles(cls){
  var fp=document.getElementById('fsParticles');
  if(!fp)return;
  fp.innerHTML=[0,1,2,3].map(function(i){
    var size=3+Math.random()*4;
    var x=15+Math.random()*70;
    var y=20+Math.random()*60;
    return '<div style="position:absolute;width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+cls.colors.line+';opacity:.25;left:'+x+'%;top:'+y+'%;filter:blur(1px);animation:floatBg '+(6+i*1.8)+'s ease-in-out '+(i*1.3)+'s infinite;pointer-events:none"></div>';
  }).join('');
}

}

function renderClassGrid(){
  var g=document.getElementById('classGrid');
  if(!g)return;
  g.innerHTML=CLASSES.map(function(cls){
    var isUnlocked=cls.unlock===null;
    var isSelected=avatarConfig.identityClass===cls.id;
    return renderClassCard(cls,isUnlocked,isSelected);
  }).join('');
}

// ══════════════════════════════════════════════════════════════
// OPTION GRIDS
// ══════════════════════════════════════════════════════════════

function renderOptionGrid(gridId,items,category){
  var g=document.getElementById(gridId);
  if(!g)return;
  g.innerHTML=items.map(function(item){
    var isLocked=item.unlock!==null;
    var sel=avatarConfig[category]===item.id;
    var click=isLocked?'':' onclick="selectOption(\''+category+'\',\''+item.id+'\')"';
    var preview=buildOptPreview(category,item);
    return '<div class="ac-opt'+(sel?' selected':'')+(isLocked?' locked':'')+'" id="opt_'+category+'_'+item.id+'"'+click+'>'+
      (item.tier&&item.tier!=='COMMON'?'<div class="ac-opt-tier t-'+item.tier+'">'+item.tier+'</div>':'')+
      (isLocked?'<div class="ac-opt-lock">🔒</div>':'')+
      '<div class="ac-opt-preview">'+preview+'</div>'+
      '<div class="ac-opt-label">'+item.name+'</div>'+
    '</div>';
  }).join('');
}

function buildOptPreview(cat,item){
  var oc=OUTFIT_COLORS[item.id]||OUTFIT_COLORS['hoodie'];
  if(cat==='outfit')return '<div style="width:38px;height:50px;border-radius:4px;background:linear-gradient(170deg,'+oc.main+','+oc.accent+');border:1px solid '+oc.line+'44;display:flex;align-items:center;justify-content:center"><div style="width:15px;height:16px;border-radius:2px;background:'+oc.accent+';border:1px solid '+oc.line+'55"></div></div>';
  if(cat==='headwear'){var em={none:'—',hood:'🪖',cap:'🧢',mask:'😷',visor:'🥽',crown:'👑','demon-horns':'😈','ghost-veil':'👻'};return '<div style="font-size:32px">'+(em[item.id]||'—')+'</div>';}
  if(cat==='eyes'){var ec=EYE_COLORS[item.id]||'#aaa';return '<div style="width:34px;height:20px;border-radius:50%;background:'+ec+';box-shadow:0 0 10px '+ec+'88"></div>';}
  if(cat==='weapon'){var ew={none:'✋',tablet:'📱',scope:'🔭',blade:'⚡',orb:'🔮'};return '<div style="font-size:32px">'+(ew[item.id]||'—')+'</div>';}
  if(cat==='aura'){if(item.id==='none')return '<div style="width:38px;height:38px;border-radius:50%;border:1px dashed rgba(255,255,255,.1)"></div>';var ac=AURA_COLORS[item.id];return '<div style="width:38px;height:38px;border-radius:50%;background:radial-gradient(circle,'+ac+',transparent 70%);animation:auraPulse 3s ease-in-out infinite"></div>';}
  if(cat==='particles'){var ep={none:'—',sparks:'⚡⚡',embers:'🔥🔥',stars:'✦✦✦',skulls:'💀💀'};return '<div style="font-size:13px;letter-spacing:.08em">'+(ep[item.id]||'—')+'</div>';}
  if(cat==='stage'){var sb=STAGE_BG[item.id]||STAGE_BG['dark'];return '<div style="width:46px;height:30px;border-radius:4px;background:'+sb+';border:1px solid rgba(255,255,255,.08)"></div>';}
  return '<div style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.04)"></div>';
}

// ══════════════════════════════════════════════════════════════
// SELECTION + NAVIGATION
// ══════════════════════════════════════════════════════════════

function selectClass(id){
  avatarConfig.identityClass=id;
  renderClassGrid();
  renderStage();
}

// FIX 3: equip flash + particle burst feedback
function equipFlash(color){
  var flash=document.createElement('div');
  flash.style.cssText='position:fixed;inset:0;background:'+color+';opacity:0.08;pointer-events:none;z-index:8888;transition:opacity 0.35s;';
  document.body.appendChild(flash);
  requestAnimationFrame(function(){
    flash.style.opacity='0';
    setTimeout(function(){flash.remove();},380);
  });
}

function equipParticles(color){
  var stage=document.getElementById('forgeStage');
  if(!stage)return;
  for(var i=0;i<8;i++){
    (function(){
      var p=document.createElement('div');
      var x=30+Math.random()*40;
      var y=20+Math.random()*60;
      var tx=(Math.random()-0.5)*60;
      var ty=-(20+Math.random()*40);
      p.style.cssText='position:absolute;left:'+x+'%;top:'+y+'%;width:4px;height:4px;border-radius:50%;background:'+color+';pointer-events:none;z-index:10;box-shadow:0 0 6px '+color+';transition:transform 0.6s ease-out,opacity 0.6s ease-out;';
      stage.appendChild(p);
      requestAnimationFrame(function(){
        p.style.transform='translate('+tx+'px,'+ty+'px)';
        p.style.opacity='0';
        setTimeout(function(){p.remove();},650);
      });
    })();
  }
}

function selectOption(category,value){
  avatarConfig[category]=value;
  document.querySelectorAll('[id^="opt_'+category+'_"]').forEach(function(el){
    el.classList.toggle('selected',el.id==='opt_'+category+'_'+value);
  });
  if(category==='stage'){
    _stageIdx=STAGES.findIndex(function(s){return s.id===value;});
    if(_stageIdx<0)_stageIdx=0;
  }
  var cls=getClassConfig();
  equipFlash(cls.colors.line);
  equipParticles(cls.colors.line);
  renderStage();
}

function switchTab(tab,btn){
  document.querySelectorAll('.ac-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.ac-tab-pane').forEach(function(p){p.classList.remove('active');});
  if(btn)btn.classList.add('active');
  var pane=document.getElementById('tab-'+tab);
  if(pane)pane.classList.add('active');
}

function cycleStage(){
  _stageIdx=(_stageIdx+1)%STAGES.length;
  avatarConfig.stage=STAGES[_stageIdx].id;
  document.querySelectorAll('[id^="opt_stage_"]').forEach(function(el){
    el.classList.toggle('selected',el.id==='opt_stage_'+avatarConfig.stage);
  });
  renderStage();
  var stage=document.getElementById('forgeStage');
  if(stage){stage.style.animation='stageIn .35s ease-out';setTimeout(function(){stage.style.animation='';},350);}
}

function toggleAnimate(){
  _animating=!_animating;
  var charEl=document.getElementById('fsChar');
  var btn=document.getElementById('animBtn');
  if(charEl){
    charEl.style.animationPlayState=_animating?'running':'paused';
    charEl.querySelectorAll('[style*="animation"]').forEach(function(el){
      el.style.animationPlayState=_animating?'running':'paused';
    });
  }
  if(btn)btn.textContent=_animating?'⏸ PAUSE':'▶ PLAY';
}

// ══════════════════════════════════════════════════════════════
// MOUSE PARALLAX
// ══════════════════════════════════════════════════════════════

function initParallax(){
  var stage=document.getElementById('forgeStage');
  if(!stage)return;
  stage.addEventListener('mousemove',function(e){
    var rect=stage.getBoundingClientRect();
    _parallaxX=((e.clientX-rect.left)-rect.width/2)/rect.width;
    _parallaxY=((e.clientY-rect.top)-rect.height/2)/rect.height;
  });
  stage.addEventListener('mouseleave',function(){_parallaxX=0;_parallaxY=0;});
  function raf(){
    var c=document.getElementById('fsChar');
    if(c)c.style.transform='translate('+(_parallaxX*14)+'px,'+(_parallaxY*9)+'px)';
    _rafId=requestAnimationFrame(raf);
  }
  _rafId=requestAnimationFrame(raf);
}

// ══════════════════════════════════════════════════════════════
// DNA APPLY
// ══════════════════════════════════════════════════════════════

function applyDnaClass(classId){
  avatarConfig.identityClass=classId;
  if(DNA_PRESETS[classId])Object.assign(avatarConfig,DNA_PRESETS[classId]);
  renderClassGrid();
  renderStage();
  renderAllGrids();
}

// ══════════════════════════════════════════════════════════════
// DNA SCAN — FIX 5: 4-step sequence with character assembly
// ══════════════════════════════════════════════════════════════

document.getElementById('scanDnaBtn').addEventListener('click',function(){
  var pc={};try{pc=JSON.parse(localStorage.getItem('ledgr_profile_customization')||'{}');}catch(e){}
  var archKey=pc.archetypeKey||pc.archetypeId||null;
  if(!archKey&&user){
    var pStr=localStorage.getItem('ledgr_profile_'+user.username);
    if(pStr){try{var pd=JSON.parse(pStr);archKey=pd.archetype;}catch(e){}}
  }
  var detectedClassId=ARCHETYPE_CLASS_MAP[archKey]||null;

  var overlay=document.createElement('div');
  overlay.style.cssText=
    'position:fixed;inset:0;background:#000;z-index:9999;'+
    'display:flex;flex-direction:column;align-items:center;'+
    'justify-content:center;font-family:DM Mono,monospace;';

  var arch=localStorage.getItem('ledgr_archetype')||'The Sniper';
  var ud={};try{ud=JSON.parse(localStorage.getItem('ledgr_user')||'{}');}catch(e){}

  overlay.innerHTML=
    '<div id="scanStep1" style="text-align:center;opacity:0;transition:opacity 0.4s;">'+
      '<div style="font-size:11px;letter-spacing:0.3em;color:#7B2CFF;margin-bottom:20px;">ANALYZING PICK HISTORY</div>'+
      '<div style="width:240px;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden;margin:0 auto;">'+
        '<div id="scanBar" style="height:100%;width:0%;background:linear-gradient(90deg,#7B2CFF,#00E5A0);transition:width 1.8s ease;border-radius:2px;"></div>'+
      '</div>'+
      '<div style="margin-top:12px;font-size:10px;color:#6B6B6B;">Reading behavioral patterns...</div>'+
    '</div>'+
    '<div id="scanStep2" style="text-align:center;opacity:0;position:absolute;transition:opacity 0.4s;">'+
      '<div style="font-size:13px;letter-spacing:0.3em;color:#00E5A0;margin-bottom:8px;">IDENTITY DETECTED</div>'+
    '</div>'+
    '<div id="scanStep3" style="text-align:center;opacity:0;position:absolute;transition:opacity 0.4s;">'+
      '<div style="font-size:10px;letter-spacing:0.25em;color:#6B6B6B;margin-bottom:8px;">YOUR COMPETITIVE IDENTITY IS</div>'+
      '<div id="scanResult" style="font-family:Bebas Neue,sans-serif;font-size:64px;color:#7B2CFF;letter-spacing:0.05em;text-shadow:0 0 40px rgba(123,44,255,0.6);">'+arch.toUpperCase()+'</div>'+
      '<div id="scanSub" style="font-size:12px;color:#6B6B6B;font-family:Syne,sans-serif;margin-top:8px;">Identity confirmed from '+(ud.picks||'4')+' verified picks</div>'+
    '</div>'+
    '<div id="scanStep4" style="text-align:center;opacity:0;position:absolute;transition:opacity 0.4s;">'+
      '<div style="font-size:10px;letter-spacing:0.25em;color:#6B6B6B;margin-bottom:16px;">ASSEMBLING YOUR IDENTITY</div>'+
      '<div id="scanCharBuild" style="display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 24px rgba(123,44,255,0.5));"></div>'+
      '<div style="margin-top:20px;font-size:10px;color:#6B6B6B;letter-spacing:0.2em;">TAP TO APPLY</div>'+
    '</div>';

  document.body.appendChild(overlay);

  setTimeout(function(){
    var s1=document.getElementById('scanStep1');
    if(s1)s1.style.opacity='1';
    setTimeout(function(){var bar=document.getElementById('scanBar');if(bar)bar.style.width='100%';},100);
  },100);

  setTimeout(function(){
    var s1=document.getElementById('scanStep1');
    if(s1)s1.style.opacity='0';
    setTimeout(function(){var s2=document.getElementById('scanStep2');if(s2)s2.style.opacity='1';},300);
  },2200);

  setTimeout(function(){
    var s2=document.getElementById('scanStep2');
    if(s2)s2.style.opacity='0';
    setTimeout(function(){var s3=document.getElementById('scanStep3');if(s3)s3.style.opacity='1';},300);
  },3500);

  // FIX 5: step 4 — character assembly preview after step 3
  setTimeout(function(){
    var s3=document.getElementById('scanStep3');
    if(s3)s3.style.opacity='0';
    setTimeout(function(){
      var charBuild=document.getElementById('scanCharBuild');
      if(charBuild){
        var previewCfg=Object.assign({},avatarConfig);
        if(detectedClassId){
          Object.assign(previewCfg,DNA_PRESETS[detectedClassId]||{});
          previewCfg.identityClass=detectedClassId;
        }
        charBuild.innerHTML=buildCharacterCSS(previewCfg);
      }
      var s4=document.getElementById('scanStep4');
      if(s4)s4.style.opacity='1';
    },300);
  },5000);

  overlay.addEventListener('click',function(){
    overlay.style.transition='opacity 0.4s';
    overlay.style.opacity='0';
    setTimeout(function(){overlay.remove();},400);
    if(detectedClassId)applyDnaClass(detectedClassId);
  });
});

// ══════════════════════════════════════════════════════════════
// SAVE / LOAD / RESET
// ══════════════════════════════════════════════════════════════

function saveAvatarConfig(){
  localStorage.setItem('ledgr_avatar_config',JSON.stringify(avatarConfig));
  var token=localStorage.getItem('ledgr_token');
  if(token){
    fetch(API+'/profile',{
      method:'PATCH',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({avatarConfig:avatarConfig})
    }).catch(function(){});
  }
  showToast('✓ Identity saved');
}

function loadSavedAvatar(){
  var saved=localStorage.getItem('ledgr_avatar_config');
  if(saved){try{Object.assign(avatarConfig,JSON.parse(saved));}catch(e){}}
}

function resetAvatar(){
  avatarConfig={identityClass:'void-runner',outfit:'hoodie',headwear:'none',eyes:'normal',weapon:'none',aura:'none',particles:'none',stage:'dark'};
  renderClassGrid();
  renderAllGrids();
  renderStage();
  showToast('Identity reset');
}

function renderAllGrids(){
  renderOptionGrid('outfitGrid',OUTFITS,'outfit');
  renderOptionGrid('headwearGrid',HEADWEAR,'headwear');
  renderOptionGrid('eyesGrid',EYES,'eyes');
  renderOptionGrid('weaponGrid',WEAPONS,'weapon');
  renderOptionGrid('auraGrid',AURAS,'aura');
  renderOptionGrid('particlesGrid',PARTICLES,'particles');
  renderOptionGrid('stageOptGrid',STAGES,'stage');
}

function showToast(msg){
  var t=document.getElementById('acToast');
  if(!t)return;
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}

// FIX 4: IDENTITY LEVEL BAR
function renderLevelBar(){
  var picks=(user&&user.picks)||0;
  var level=Math.floor(picks/3)+1;
  var xpPct=(picks%3)*33;
  var lvlEl=document.getElementById('ilbLevel');
  var fillEl=document.getElementById('ilbXpFill');
  var lblEl=document.getElementById('ilbXpLabel');
  if(lvlEl)lvlEl.textContent=level;
  if(lblEl)lblEl.textContent=(picks%3)+' / 3 picks to level '+(level+1);
  if(fillEl)setTimeout(function(){fillEl.style.width=xpPct+'%';},100);
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════

window.onload=function(){
  var ud=localStorage.getItem('ledgr_user')||localStorage.getItem('user');
  var tk=localStorage.getItem('ledgr_token')||localStorage.getItem('token');
  if(!ud||!tk){window.location.href='/login';return;}
  try{user=JSON.parse(ud);}catch(e){window.location.href='/login';return;}
  if(!user||!user.username){window.location.href='/login';return;}

  document.getElementById('app').style.display='block';

  loadSavedAvatar();
  renderClassGrid();
  renderAllGrids();
  renderStage();
  renderLevelBar();
  initParallax();

  fetch(API+'/profile/'+user.username,{headers:{Authorization:'Bearer '+tk}})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(data){
      if(!data)return;
      if(data.avatarConfig){Object.assign(avatarConfig,data.avatarConfig);renderClassGrid();renderAllGrids();renderStage();}
    }).catch(function(){});
};
</script>
